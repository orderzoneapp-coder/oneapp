<!DOCTYPE html>
<html lang="ko" translate="no" data-nexus-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>상품 기초정보 관리</title>
  <link rel="icon" type="image/png" href="/nexus/assets/nexus-favicon.png">
  <script src="/nexus/common/nexus-theme-init.js?v=1.0.0"></script>
  <link rel="stylesheet" href="/nexus/common/oneapp-design-tokens.css?v=1.2.0">
  <link rel="stylesheet" href="/nexus/common/nexus-app-ui.css?v=2.0.0">
  <link rel="stylesheet" href="/nexus/common/oneapp-layout.css?v=1.2.0">
  <link rel="stylesheet" href="/nexus/common/oneapp-components.css?v=1.2.0">
  <link rel="stylesheet" href="Item_manager.css?v=2.2.0">
    <script src="/nexus/common/nexus-auth-config.js?v=2.0.1"></script>
    <script src="/nexus/common/nexus-auth.js?v=2.1.0"></script>
    <script src="/nexus/common/apps-config.js?v=1.4.0"></script>
<script src="/nexus/common/nexus-top.js?v=1.8.0"></script>
  <script src="/nexus/common/nexus-ui-contract.js?v=2.0.0"></script>
  <style>:root{--nexus-top-height:44px}nexus-top{display:block;min-height:var(--nexus-top-height)}.nexus-top-fallback{height:var(--nexus-top-height);padding:0 14px;display:flex;align-items:center;gap:12px;background:#0b1021;color:#fff;font:12px Pretendard,"Noto Sans KR",sans-serif}.nexus-top-fallback strong{letter-spacing:.08em}.nexus-top-fallback span{color:#cbd5e1}.nexus-top-fallback button{margin-left:auto;border:1px solid #64748b;border-radius:6px;padding:5px 9px;background:transparent;color:#fff;cursor:pointer}</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="coreEngine.js"></script>
  <script src="masterAddUpdate.js"></script>
</head>
<body>
  <div id="nexus-common-header" data-app-id="master">
    <nexus-top app-id="item-manager"><div class="nexus-top-fallback" role="status"><strong>NEXUS</strong><span>NEXUS 메뉴를 불러오지 못했습니다.</span><button type="button" onclick="window.location.reload()">재시도</button></div></nexus-top>
  </div>

  <div id="app" class="oneapp-shell" data-nexus-ui-app="item-manager" aria-busy="true">
    <header class="oneapp-app-header">
      <div class="oneapp-app-header-inner oneapp-app-header-content">
        <div class="oneapp-app-identity">
          <a class="oneapp-title oneapp-title-link" href="Master.html?view=products&mode=list">기초등록</a>
          <nav class="oneapp-inline-tabs" aria-label="기초등록 대상">
            <a class="oneapp-tab" href="Master.html?view=products&mode=list" aria-current="page">상품</a>
            <a class="oneapp-tab" href="Master.html?view=customers&mode=list">거래처</a>
          </nav>
        </div>
        <div class="oneapp-actions">
          <div class="menu-anchor">
            <button id="excel-menu-button" type="button" class="oneapp-button" aria-haspopup="menu" aria-expanded="false">
              <span aria-hidden="true">▦</span>
              <span class="oneapp-button-label-mobile">일괄 관리</span>
            </button>
            <div id="excel-menu" class="oneapp-popover" role="menu" hidden>
              <button type="button" class="oneapp-popover-item" data-excel-action="download">현재 조회 상품 내려받기<small>현재 표에 보이는 기초정보만 내려받습니다.</small></button>
              <button type="button" class="oneapp-popover-item" data-excel-action="batch">상품 기초정보 일괄 등록·수정<small>가격 운영 열은 Master에서 적용하지 않습니다.</small></button>
              <button type="button" class="oneapp-popover-item" data-excel-action="template">기초정보 양식 내려받기<small>상품 기초정보 전용 열만 포함합니다.</small></button>
            </div>
          </div>
          <div class="menu-anchor">
            <button id="sync-menu-button" type="button" class="oneapp-button oneapp-icon-button sync-button" aria-label="저장 및 클라우드 상태" aria-haspopup="dialog" aria-expanded="false">
              <span id="sync-dot" class="sync-dot" aria-hidden="true"></span>
              <span aria-hidden="true">ⓘ</span>
            </button>
            <div id="sync-menu" class="oneapp-popover sync-popover" role="dialog" aria-label="저장 및 동기화 상태" hidden>
              <strong>저장 및 동기화</strong>
              <p id="sync-message">상품 DB를 확인하고 있습니다.</p>
              <div class="sync-actions">
                <button id="cloud-pull-button" type="button" class="oneapp-button">클라우드 새로고침</button>
                <button id="cloud-push-button" type="button" class="oneapp-button">클라우드에 반영</button>
              </div>
            </div>
          </div>
          <button id="header-save-button" type="button" class="oneapp-button oneapp-button-primary" title="변경사항이 있을 때 저장할 수 있습니다." disabled>
            <span aria-hidden="true">✓</span>
            <span>저장</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="oneapp-subtabs" aria-label="상품 하위 기능">
      <div class="oneapp-content oneapp-tab-row">
        <strong class="oneapp-subtab-parent">상품</strong>
        <a class="oneapp-tab" href="Master.html?view=products&mode=list">조회</a>
        <a class="oneapp-tab" href="Master.html?view=products&mode=batch">일괄관리</a>
        <a class="oneapp-tab" href="Item_manager.html" aria-current="page">등록·수정</a>
      </div>
    </nav>
    <main class="oneapp-main">
      <section class="query-section" aria-label="상품 조회 조건">
        <div class="oneapp-content query-toolbar">
          <div class="query-field query-field-search">
            <label class="oneapp-label" for="search-filter">상품명·코드 검색</label>
            <div class="search-wrap">
              <span aria-hidden="true">⌕</span>
              <input id="search-filter" class="oneapp-field" type="search" autocomplete="off" placeholder="상품코드, 상품명, 규격 통합검색">
            </div>
          </div>
          <div class="query-field">
            <label class="oneapp-label" for="category-filter">카테고리</label>
            <select id="category-filter" class="oneapp-field">
              <option value="">카테고리 선택</option>
            </select>
          </div>
          <div class="query-field">
            <label class="oneapp-label" for="group-filter">그룹</label>
            <select id="group-filter" class="oneapp-field">
              <option value="">그룹 선택</option>
            </select>
          </div>
          <div class="query-field query-field-status">
            <label class="oneapp-label" for="status-filter">사용 상태</label>
            <select id="status-filter" class="oneapp-field">
              <option value="all">전체</option>
              <option value="active">사용</option>
              <option value="stopped">사용 중지</option>
            </select>
          </div>
          <button id="load-button" type="button" class="oneapp-button query-load-button">불러오기</button>
        </div>
      </section>

      <section class="workspace-section">
        <div class="oneapp-content workspace-content">
          <div class="summary-toolbar">
            <div id="summary-counts" class="summary-counts" aria-live="polite">전체 0건 · 선택 0건 · 수정 0건</div>
            <div class="summary-actions">
              <button id="delete-selected-button" type="button" class="oneapp-button oneapp-button-danger" disabled>선택 삭제</button>
              <button id="add-product-button" type="button" class="oneapp-button">
                <span aria-hidden="true">＋</span>
                새 상품 추가
              </button>
            </div>
          </div>

          <div id="grid-empty" class="grid-empty">
            <strong>카테고리 또는 그룹을 선택해 상품을 불러오세요.</strong>
            <span>조회 조건은 다음 방문에도 그대로 유지됩니다.</span>
          </div>

          <div id="grid-region" class="grid-region" hidden>
            <div id="table-scroll" class="table-scroll" tabindex="-1">
              <table id="product-grid" class="product-grid" aria-label="상품 기초정보 편집표">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div id="batch-toolbar" class="batch-toolbar" hidden>
            <strong id="batch-selection-count">0개 상품 선택</strong>
            <select id="batch-field" class="oneapp-field" aria-label="일괄 수정 항목"></select>
            <div id="batch-value-wrap"></div>
            <select id="batch-mode" class="oneapp-field" aria-label="일괄 적용 방식">
              <option value="all">선택 상품 전체에 적용</option>
              <option value="blank">빈 값에만 적용</option>
            </select>
            <button id="batch-apply-button" type="button" class="oneapp-button">선택 상품에 적용</button>
          </div>

          <div id="save-bar" class="save-bar">
            <div>
              <strong>선택 상품 일괄 수정</strong>
              <span id="save-state-copy">변경된 내용이 없습니다.</span>
            </div>
            <div class="oneapp-actions">
              <button id="discard-button" type="button" class="oneapp-button" disabled>변경 취소</button>
              <button id="footer-save-button" type="button" class="oneapp-button" title="변경사항이 있을 때 저장할 수 있습니다." disabled>변경사항 저장</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="dialog-backdrop" class="oneapp-modal-backdrop" hidden>
    <section class="oneapp-modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="oneapp-modal-body">
        <h2 id="dialog-title" class="oneapp-modal-title"></h2>
        <p id="dialog-copy" class="oneapp-modal-copy"></p>
      </div>
      <div id="dialog-actions" class="oneapp-modal-actions"></div>
    </section>
  </div>

  <div id="toast" class="oneapp-toast" role="status" aria-live="polite" hidden></div>
  <script src="Item_manager.js?v=2.2.0"></script>
</body>
</html>
