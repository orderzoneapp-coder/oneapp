<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>ONEAPP orderops</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="../orderFulfillmentEngine.js"></script>
  <script src="../orderFulfillmentWorkbook.js"></script>
  <style>
    :root {
      color-scheme: light;
      --navy-950: #07101f;
      --navy-900: #0b162a;
      --navy-800: #153b55;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --white: #ffffff;
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --teal-100: #ccfbf1;
      --blue-700: #1d4ed8;
      --amber-700: #b45309;
      --red-700: #b91c1c;
      --red-100: #fee2e2;
      --green-700: #15803d;
      --green-100: #dcfce7;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--white); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--slate-900);
      background: var(--white);
      font-size: 13px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    .hidden { display: none !important; }

    /* =========================================================
       Global header
       ========================================================= */
    .global-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 max(16px, calc((100% - 1480px) / 2));
      background: var(--white);
      border-bottom: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
    }
    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }
    .brand-mark {
      color: #2563eb;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .brand-divider { display: none; }
    .brand-stack { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-suite {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--slate-900);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .brand-badge {
      padding: 2px 7px;
      border: 1px solid var(--slate-200);
      border-radius: 11px;
      color: var(--slate-500);
      background: var(--slate-50);
      font-size: 9px;
      font-weight: 800;
    }
    .brand-product {
      color: var(--slate-500);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .header-actions { display: flex; align-items: center; gap: 7px; }
    .header-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid var(--slate-300);
      border-radius: 5px;
      color: var(--slate-700);
      background: var(--white);
      box-shadow: var(--shadow-sm);
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }
    .header-link:hover {
      border-color: var(--blue-700);
      color: var(--blue-700);
      background: #eff6ff;
    }
    .order-input-link {
      border-color: #93c5fd;
      color: #1d4ed8;
      background: #eff6ff;
    }

    .page-shell {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 28px;
    }
    .panel { background: var(--white); }

    /* The rest of this file is unchanged from main except for the two script paths above. */
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    document.getElementById('app').innerHTML = '<div style="padding:24px;font-family:Pretendard,Arial,sans-serif">OrderOps 로딩 중...</div>';
  </script>
</body>
</html>
