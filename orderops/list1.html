<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>ONEAPP orderops</title>
  <script src="/nexus/common/nexus-auth-config.js?v=2.0.1"></script><script src="/nexus/common/nexus-auth.js?v=2.1.2"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="orderFulfillmentEngine.js"></script>
  <script src="orderFulfillmentWorkbook.js"></script>
  <style>
    :root {
      color-scheme: light;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --blue-600: #2563eb;
      --teal-500: #14b8a6;
      --teal-400: #2dd4bf;
      --white: #ffffff;
      --panel-bg: #1c2331; /* DataOps Dark Theme */
      --panel-border: #2a3441;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--white); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, "Noto Sans KR", -apple-system, sans-serif;
      color: var(--slate-900);
      background: var(--white);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    .hidden { display: none !important; }

    /* Header matching the image */
    .global-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 24px;
      background: var(--white);
      border-bottom: 1px solid var(--slate-200);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-mark {
      color: var(--blue-600);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .brand-suite {
      color: var(--slate-900);
      font-size: 18px;
      font-weight: 700;
    }
    .brand-badge {
      margin-left: 6px;
      padding: 2px 8px;
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      color: var(--slate-500);
      font-size: 11px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .header-link {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 16px;
      border: 1px solid var(--slate-300);
      border-radius: 4px;
      background: var(--white);
      color: var(--slate-700);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .header-link:hover { background: var(--slate-50); border-color: var(--slate-400); }

    .page-shell {
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* System.IO DataOps Dark Panel */
    .system-workbench {
      background: var(--panel-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* Top Row */
    .system-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
      padding: 0 20px;
      border-bottom: 1px solid var(--panel-border);
    }
    .system-name {
      color: var(--white);
      font-size: 16px;
      font-weight: 800;
    }
    .system-console {
      display: flex;
      align-items: center;
      flex: 1;
      max-width: 600px;
      height: 36px;
      padding: 0 16px;
      background: #000000;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #22c55e;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    .system-cursor {
      width: 8px;
      height: 16px;
      margin-left: 8px;
      background: #22c55e;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .topbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .period-button {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--slate-300);
      background: transparent;
      border: 1px solid var(--slate-600);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
    }
    .primary-button {
      height: 36px;
      padding: 0 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      color: var(--slate-400);
      font-size: 13px;
      font-weight: 600;
    }
    .primary-button:not(:disabled) {
      background: var(--blue-600);
      color: var(--white);
      border-color: var(--blue-600);
    }

    /* Bottom Row (Data Sources) */
    .source-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 20px;
      background: #222a38; /* Slightly lighter dark */
    }
    .source-label {
      color: var(--slate-400);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 24px;
    }
    
    .upload-grid {
      display: flex;
      align-items: center;
    }
    .upload-card { margin: 0; }
    .drop-zone {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid var(--slate-600);
      border-radius: 4px;
      color: var(--slate-400);
      cursor: pointer;
      min-width: 140px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--slate-400);
      background: rgba(255,255,255,0.05);
    }
    .upload-card.has-file .drop-zone {
      border-color: var(--teal-500);
      color: var(--teal-400);
    }
    .upload-card.has-error .drop-zone {
      border-color: #ef4444;
      color: #fca5a5;
    }
    
    .drop-title {
      font-size: 12px;
      font-weight: 600;
      margin: 0;
    }
    .drop-help {
      font-size: 10px;
      margin-top: 2px;
      color: inherit;
      opacity: 0.7;
    }
    .separator {
      color: var(--slate-600);
      margin: 0 12px;
      font-size: 12px;
    }

    /* Hidden Bundle Drop (Kept for JS functionality) */
    #bundleDrop { display: none; }

    /* Results Panel */
    .results-panel { margin-top: 24px; }
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--slate-200);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .preview-tabs { display: flex; gap: 8px; }
    .tab-button {
      padding: 8px 16px;
      border: 1px solid var(--slate-200);
      background: var(--white);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-600);
    }
    .tab-button.active {
      border-color: var(--slate-900);
      color: var(--slate-900);
    }
    
    .preview-actions { display: flex; align-items: center; gap: 12px; }
    .preview-count { font-size: 13px; color: var(--slate-500); }
    .download-button {
      padding: 6px 12px;
      border: 1px solid var(--slate-300);
      border-radius: 4px;
      background: var(--white);
      font-size: 13px;
      font-weight: 600;
    }
    .download-button:hover { background: var(--slate-50); }
    
    /* Table styling to match the clean UI */
    .table-wrap {
      overflow: auto;
      max-height: 600px;
      border: 1px solid var(--slate-200);
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      position: sticky; top: 0;
      background: var(--slate-50);
      color: var(--slate-700);
      font-weight: 600;
      text-align: center;
      padding: 10px;
      border-bottom: 1px solid var(--slate-200);
      border-right: 1px solid var(--slate-200);
    }
    td {
      padding: 10px;
      border-bottom: 1px solid var(--slate-200);
      border-right: 1px solid var(--slate-200);
      text-align: center;
      color: var(--slate-700);
    }
    td.number { text-align: right; }

    /* Empty State (Matches Image exactly) */
    .empty-state-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 0;
      color: var(--slate-400);
    }
    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .empty-state-text {
      font-size: 14px;
      font-weight: 500;
    }

    .workspace-storage { display: none; }
    .toast {
      position: fixed; right: 24px; bottom: 24px; z-index: 100;
      padding: 16px 24px; border-radius: 8px;
      background: var(--slate-900); color: var(--white);
      font-size: 14px; font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .toast.error { background: #ef4444; }

  </style>
</head>
<body>
  <header class="global-header">
    <div class="brand">
      <div class="brand-mark">ONEAPP</div>
      <div class="brand-suite">DataOps</div>
      <div class="brand-badge">V1.4.orderops</div>
    </div>
    <div class="header-actions">
      <button class="header-link" id="headerRestoreButton" type="button">작업 복구</button>
      <button class="header-link" id="headerSettingsButton" type="button">매핑설정</button>
    </div>
  </header>

  <main class="page-shell">
    <section class="system-workbench">
      <!-- Top Row -->
      <div class="system-topbar">
        <div class="system-name">System.IO</div>
        <div class="system-console">
          <span id="systemMessage">waiting for data_blocks... (파일을 업로드하세요)</span>
          <span class="system-cursor"></span>
        </div>
        <div class="topbar-actions">
          <button class="period-button" type="button"><span>📅</span> 전체 기간</button>
          <button class="primary-button" id="analyzeButton" type="button" disabled>
            파일 업로드 후 실행 버튼 표시
          </button>
        </div>
      </div>

      <!-- Bottom Row -->
      <div class="source-bar">
        <div class="source-label"><span>📄</span> 데이터 소스:</div>
        
        <!-- Hidden Bundle Input for JS -->
        <div id="bundleDrop"><span id="bundleFileStatus"></span></div>
        <input class="hidden" id="bundleInput" type="file" accept=".xlsx,.xls" multiple>

        <div class="upload-grid">
          <article class="upload-card" id="ordersCard">
            <div class="drop-zone" id="ordersDrop" tabindex="0" role="button">
              <p class="drop-title">1. 주문현황</p>
              <p class="drop-help" id="ordersFileName">클릭하여 변경</p>
            </div>
            <input class="hidden" id="ordersInput" type="file" accept=".xlsx,.xls" multiple>
          </article>

          <span class="separator">></span>

          <article class="upload-card" id="inventoryCard">
            <div class="drop-zone" id="inventoryDrop" tabindex="0" role="button">
              <p class="drop-title">2. 창고재고</p>
              <p class="drop-help" id="inventoryFileName">클릭하여 변경</p>
            </div>
            <input class="hidden" id="inventoryInput" type="file" accept=".xlsx,.xls" multiple>
          </article>
        </div>
      </div>
    </section>

    <!-- Essential Validation Box (Hidden visually but kept in DOM for JS) -->
    <div class="hidden" id="validationBox"></div>

    <!-- Empty State (Shown when results are hidden) -->
    <div class="empty-state-wrapper" id="emptyStateWrapper">
      <div class="empty-state-icon">📦</div>
      <div class="empty-state-text">상단 '데이터 소스'에 파일을 업로드하고 [분석 실행]을 눌러주세요.</div>
    </div>

    <!-- Results Panel -->
    <section class="results-panel hidden" id="resultsPanel">
      <h2 class="hidden" id="resultsHeading">분석 결과 상세</h2>
      <p class="hidden" id="resultSubtitle"></p>
      <div class="hidden" id="summaryGrid"></div>
      <div class="hidden" id="purchaseUploadNotice"></div>

      <div class="preview-toolbar">
        <div class="preview-tabs" id="previewTabs" role="tablist"></div>
        <div class="preview-actions">
          <div class="preview-count" id="previewCount"></div>
          <button class="download-button" id="purchaseUploadButton" type="button">구매업로드 Excel</button>
          <button class="download-button" id="downloadButton" type="button">미출고현황 Excel</button>
        </div>
      </div>
      <div class="table-wrap" id="previewTable" role="tabpanel"></div>
    </section>

    <!-- Hidden Storage Section -->
    <section class="workspace-storage hidden" id="workspaceStorage">
      <div class="recovery-banner hidden" id="recoveryBanner">
        <span id="recoveryMessage"></span>
        <button type="button" id="restoreButton">복구</button>
        <button type="button" id="replaceRecoveryButton">교체</button>
        <button type="button" id="discardRecoveryButton">초기화</button>
      </div>
      <input id="cloudUrlInput" type="hidden" value="NEXUS_GATEWAY">
      <input id="cloudSavedByInput" type="hidden">
      <button type="button" id="cloudListButton" class="hidden"></button>
      <button type="button" id="cloudSaveButton" class="hidden"></button>
      <select id="cloudRevisionSelect" class="hidden"></select>
      <button type="button" id="cloudLoadButton" class="hidden"></button>
      <button type="button" id="localResetButton" class="hidden"></button>
    </section>

  </main>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <noscript>orderops를 사용하려면 JavaScript를 활성화해야 합니다.</noscript>

  <script>
    (function () {
      "use strict";

      const engine = window.ShippingManagementEngine;
      const workbookTools = window.ShippingManagementWorkbook;
      const MAX_FILE_SIZE = 25 * 1024 * 1024;
      const LOCAL_DB_NAME = "ONEAPPShippingManagementDB";
      const LOCAL_DB_VERSION = 1;
      const LOCAL_STORE_NAME = "workspaces";
      const LOCAL_POINTER_KEY = "oneapp.shipping.recovery.pointer.v1";
      const LOCAL_META_KEY = "oneapp.shipping.recovery.meta.v1";
      const CLOUD_PLAN_SCHEMA = "ONEAPP_SHIPPING_PURCHASE_PLAN_V1";
      const state = {
        orders: null,
        inventory: null,
        validation: null,
        workspace: null,
        activePreview: "purchases",
        loading: { orders: false, inventory: false },
        db: null,
        recoveryRecord: null,
        recoveryCorruptionDetected: false,
        cloudRevisions: [],
      };

      const elements = {
        bundleInput: document.getElementById("bundleInput"),
        bundleDrop: document.getElementById("bundleDrop"),
        bundleFileStatus: document.getElementById("bundleFileStatus"),
        ordersInput: document.getElementById("ordersInput"),
        inventoryInput: document.getElementById("inventoryInput"),
        ordersDrop: document.getElementById("ordersDrop"),
        inventoryDrop: document.getElementById("inventoryDrop"),
        ordersCard: document.getElementById("ordersCard"),
        inventoryCard: document.getElementById("inventoryCard"),
        ordersFileName: document.getElementById("ordersFileName"),
        inventoryFileName: document.getElementById("inventoryFileName"),
        validationBox: document.getElementById("validationBox"),
        analyzeButton: document.getElementById("analyzeButton"),
        resultsPanel: document.getElementById("resultsPanel"),
        resultSubtitle: document.getElementById("resultSubtitle"),
        summaryGrid: document.getElementById("summaryGrid"),
        purchaseUploadNotice: document.getElementById("purchaseUploadNotice"),
        previewTabs: document.getElementById("previewTabs"),
        previewCount: document.getElementById("previewCount"),
        previewTable: document.getElementById("previewTable"),
        downloadButton: document.getElementById("downloadButton"),
        purchaseUploadButton: document.getElementById("purchaseUploadButton"),
        recoveryBanner: document.getElementById("recoveryBanner"),
        recoveryMessage: document.getElementById("recoveryMessage"),
        restoreButton: document.getElementById("restoreButton"),
        replaceRecoveryButton: document.getElementById("replaceRecoveryButton"),
        discardRecoveryButton: document.getElementById("discardRecoveryButton"),
        localResetButton: document.getElementById("localResetButton"),
        cloudUrlInput: document.getElementById("cloudUrlInput"),
        cloudSavedByInput: document.getElementById("cloudSavedByInput"),
        cloudListButton: document.getElementById("cloudListButton"),
        cloudSaveButton: document.getElementById("cloudSaveButton"),
        cloudRevisionSelect: document.getElementById("cloudRevisionSelect"),
        cloudLoadButton: document.getElementById("cloudLoadButton"),
        systemMessage: document.getElementById("systemMessage"),
        workspaceStorage: document.getElementById("workspaceStorage"),
        headerRestoreButton: document.getElementById("headerRestoreButton"),
        headerSettingsButton: document.getElementById("headerSettingsButton"),
        toast: document.getElementById("toast"),
        emptyStateWrapper: document.getElementById("emptyStateWrapper") // Added for empty state toggle
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatNumber(value) {
        if (value === null || value === undefined || value === "") return "";
        const number = Number(value);
        return Number.isFinite(number)
          ? new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 3 }).format(number)
          : String(value);
      }

      function showToast(message, isError) {
        elements.toast.textContent = message;
        elements.toast.classList.toggle("error", Boolean(isError));
        elements.toast.classList.remove("hidden");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => elements.toast.classList.add("hidden"), 3600);
      }

      function setSystemMessage(message) {
        elements.systemMessage.textContent = message;
      }

      async function sha256Hex(value) {
        if (!window.crypto?.subtle) throw new Error("이 브라우저에서는 SHA-256 무결성 검사를 사용할 수 없습니다.");
        const bytes = value instanceof ArrayBuffer || ArrayBuffer.isView(value)
          ? value
          : new TextEncoder().encode(String(value));
        const source = bytes instanceof ArrayBuffer
          ? bytes
          : bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        const digest = await window.crypto.subtle.digest("SHA-256", source);
        return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
      }

      function countScalarCells(value) {
        if (value === null || value === undefined) return 1;
        if (Array.isArray(value)) return value.reduce((sum, item) => sum + countScalarCells(item), 0);
        if (typeof value === "object") {
          return Object.keys(value).reduce((sum, key) => sum + countScalarCells(value[key]), 0);
        }
        return 1;
      }

      function countPlanRows(canonical) {
        const workspace = canonical?.workspace || {};
        return [
          workspace.allocations,
          workspace.productSummaries,
          workspace.purchaseManagement,
          workspace.sourceFiles?.orders?.matrix,
          workspace.sourceFiles?.inventory?.matrix,
        ].reduce((sum, rows) => sum + (Array.isArray(rows) ? rows.length : 0), 0);
      }

      function openLocalDatabase() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) return reject(new Error("IndexedDB를 사용할 수 없습니다."));
          const request = window.indexedDB.open(LOCAL_DB_NAME, LOCAL_DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(LOCAL_STORE_NAME)) {
              const store = db.createObjectStore(LOCAL_STORE_NAME, { keyPath: "sourceFingerprint" });
              store.createIndex("updatedAt", "updatedAt", { unique: false });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("IndexedDB를 열지 못했습니다."));
        });
      }

      function idbRequest(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("IndexedDB 요청에 실패했습니다."));
        });
      }

      function validRecoveryRecord(record) {
        return Boolean(
          record &&
          record.schemaVersion === "shipping-local-recovery/v1" &&
          /^[a-f0-9]{64}$/.test(String(record.sourceFingerprint || "")) &&
          record.workspace?.schemaVersion === engine.WORKSPACE_SCHEMA_VERSION &&
          record.workspace.sourceFingerprint === record.sourceFingerprint,
        );
      }

      async function findRecoveryRecord() {
        if (!state.db) return null;
        state.recoveryCorruptionDetected = false;
        const pointer = localStorage.getItem(LOCAL_POINTER_KEY) || "";
        if (pointer) {
          const pointed = await idbRequest(
            state.db.transaction(LOCAL_STORE_NAME, "readonly").objectStore(LOCAL_STORE_NAME).get(pointer),
          );
          if (validRecoveryRecord(pointed)) return pointed;
          state.recoveryCorruptionDetected = true;
        }
        const records = await idbRequest(
          state.db.transaction(LOCAL_STORE_NAME, "readonly").objectStore(LOCAL_STORE_NAME).getAll(),
        );
        return records
          .filter(validRecoveryRecord)
          .sort((left, right) => String(right.updatedAt).localeCompare(String(left.updatedAt)))[0] || null;
      }

      function renderRecoveryBanner(record) {
        state.recoveryRecord = record || null;
        elements.recoveryBanner.classList.toggle("hidden", !record);
        if (!record) return;
        const fileNames = [record.workspace?.sourceFiles?.orders?.fileName, record.workspace?.sourceFiles?.inventory?.fileName]
          .filter(Boolean)
          .join(" / ");
        elements.recoveryMessage.textContent =
          `로컬 복구 가능 · ${record.workspace?.basisDate || "기준일 없음"} · ${fileNames || "원본 메타 없음"} · ${record.updatedAt}`;
      }

      async function initializeLocalRecovery() {
        try {
          state.db = await openLocalDatabase();
          const record = await findRecoveryRecord();
          if (state.recoveryCorruptionDetected) {
            localStorage.removeItem(LOCAL_POINTER_KEY);
            localStorage.setItem(LOCAL_META_KEY, JSON.stringify({
              status: record ? "fallback" : "corrupt",
              sourceFingerprint: record?.sourceFingerprint || "",
              checkedAt: new Date().toISOString(),
            }));
            setSystemMessage(record
              ? "local recovery fallback ready... (손상 포인터 제외)"
              : "local recovery corrupt... (새 분석은 계속 가능)");
          }
          renderRecoveryBanner(record);
        } catch (error) {
          state.db = null;
          localStorage.removeItem(LOCAL_POINTER_KEY);
          localStorage.setItem(LOCAL_META_KEY, JSON.stringify({ status: "unavailable", message: String(error.message || error) }));
          setSystemMessage("local recovery unavailable... (메모리 작업은 계속 가능)");
        }
      }

      async function persistLocalWorkspace() {
        if (!state.db || !state.workspace?.sourceFingerprint) return;
        const record = {
          schemaVersion: "shipping-local-recovery/v1",
          sourceFingerprint: state.workspace.sourceFingerprint,
          workspaceSchemaVersion: state.workspace.schemaVersion,
          updatedAt: new Date().toISOString(),
          workspace: state.workspace,
          ui: { activePreview: state.activePreview },
          settings: {
            cloudRoute: "NEXUS_GATEWAY",
            savedBy: elements.cloudSavedByInput.value.trim(),
          },
        };
        const transaction = state.db.transaction(LOCAL_STORE_NAME, "readwrite");
        await idbRequest(transaction.objectStore(LOCAL_STORE_NAME).put(record));
        localStorage.setItem(LOCAL_POINTER_KEY, record.sourceFingerprint);
        localStorage.setItem(LOCAL_META_KEY, JSON.stringify({
          schemaVersion: record.schemaVersion,
          sourceFingerprint: record.sourceFingerprint,
          planId: state.workspace.planId,
          basisDate: state.workspace.basisDate,
          updatedAt: record.updatedAt,
        }));
        renderRecoveryBanner(null);
      }

      function scheduleLocalSave() {
        window.clearTimeout(scheduleLocalSave.timer);
        scheduleLocalSave.timer = window.setTimeout(() => {
          persistLocalWorkspace().catch((error) => {
            setSystemMessage("local autosave failed... (현재 화면은 유지됨)");
            showToast(error.message || "로컬 자동저장에 실패했습니다.", true);
          });
        }, 180);
      }

      function restoreLocalRecord(record) {
        if (!validRecoveryRecord(record)) throw new Error("복구 자료의 schemaVersion 또는 source fingerprint가 올바르지 않습니다.");
        state.workspace = record.workspace;
        state.activePreview = record.ui?.activePreview || "purchases";
        elements.cloudUrlInput.value = "NEXUS_GATEWAY";
        elements.cloudSavedByInput.value = record.settings?.savedBy || "";
        renderRecoveryBanner(null);
        renderResults();
        showToast("로컬 발주계획을 복구했습니다.");
      }

      async function clearLocalRecovery(showNotice = true) {
        if (state.db) {
          const transaction = state.db.transaction(LOCAL_STORE_NAME, "readwrite");
          await idbRequest(transaction.objectStore(LOCAL_STORE_NAME).clear());
        }
        localStorage.removeItem(LOCAL_POINTER_KEY);
        localStorage.removeItem(LOCAL_META_KEY);
        state.recoveryRecord = null;
        renderRecoveryBanner(null);
        if (showNotice) showToast("로컬 복구 자료를 초기화했습니다.");
      }

      async function replaceRecoveryWithCurrentFiles() {
        if (!state.validation?.canAnalyze) {
          throw new Error("교체할 주문현황·창고별재고 파일을 먼저 선택하세요.");
        }
        await clearLocalRecovery(false);
        runAnalysis();
      }

      function normalizeCloudUrl(value) {
        const text = String(value || "").trim();
        if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/i.test(text)) {
          throw new Error("Apps Script /exec Cloud URL을 확인하세요.");
        }
        return text;
      }

      function isSupportedFile(file) {
        return Boolean(file && /\.(xlsx|xls)$/i.test(file.name));
      }

      function parsedScore(parsed) {
        return (parsed.missingColumns?.length || 0) * 1000 +
          (parsed.errors?.length || 0) * 100 +
          (parsed.rowCount > 0 ? 0 : 10);
      }

      async function parseExcelFile(file, kind) {
        if (!window.XLSX) throw new Error("Excel 라이브러리를 불러오지 못했습니다. 네트워크 연결 후 다시 시도하세요.");
        const bytes = new Uint8Array(await file.arrayBuffer());
        const fileHash = await sha256Hex(bytes);
        const workbook = window.XLSX.read(bytes, {
          type: "array",
          cellDates: false,
          cellNF: true,
          cellText: true,
        });
        if (!workbook.SheetNames.length) throw new Error("Excel에 읽을 수 있는 시트가 없습니다.");

        let best = null;
        workbook.SheetNames.forEach((sheetName) => {
          const sheet = workbook.Sheets[sheetName];
          const rawMatrix = window.XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            raw: true,
            defval: null,
            blankrows: true,
          });
          const displayMatrix = window.XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            raw: false,
            defval: "",
            blankrows: true,
          });
          const parsed = kind === "orders"
            ? engine.parseOrderWorkbook({ fileName: file.name, sheetName, rawMatrix, displayMatrix })
            : engine.parseInventoryWorkbook({ fileName: file.name, sheetName, rawMatrix, displayMatrix });
          if (!best || parsedScore(parsed) < parsedScore(best)) best = parsed;
        });
        best.fileHash = fileHash;
        return best;
      }


      async function classifyBundleFile(file) {
        if (!isSupportedFile(file)) {
          throw new Error(`${file.name}: .xlsx 또는 .xls 파일만 선택할 수 있습니다.`);
        }
        if (file.size > MAX_FILE_SIZE) {
          throw new Error(`${file.name}: 파일 크기는 25MB 이하여야 합니다.`);
        }

        const [asOrders, asInventory] = await Promise.all([
          parseExcelFile(file, "orders"),
          parseExcelFile(file, "inventory"),
        ]);
        const orderScore = parsedScore(asOrders);
        const inventoryScore = parsedScore(asInventory);

        if (orderScore === inventoryScore) {
          const name = String(file.name || "").toLowerCase();
          if (/주문|미판매|order/.test(name)) return { kind: "orders", parsed: asOrders };
          if (/재고|창고|inventory|stock/.test(name)) return { kind: "inventory", parsed: asInventory };
          throw new Error(`${file.name}: 파일 종류를 자동 판별하지 못했습니다.`);
        }

        return orderScore < inventoryScore
          ? { kind: "orders", parsed: asOrders }
          : { kind: "inventory", parsed: asInventory };
      }

      async function handleBundleFiles(fileList) {
        const files = Array.from(fileList || []).filter(Boolean);
        if (files.length !== 2) {
          showToast("주문현황과 창고별재고 Excel을 정확히 2개 선택하세요.", true);
          return;
        }

        resetResults();
        elements.analyzeButton.disabled = true;
        setSystemMessage("classifying bundled data_blocks...");

        try {
          const classified = await Promise.all(files.map(classifyBundleFile));
          const orders = classified.filter((item) => item.kind === "orders");
          const inventories = classified.filter((item) => item.kind === "inventory");

          if (orders.length !== 1 || inventories.length !== 1) {
            throw new Error("주문현황 1개와 창고별재고 1개를 선택해야 합니다.");
          }

          state.orders = orders[0].parsed;
          state.inventory = inventories[0].parsed;
          refreshInputState();

          if (state.validation?.canAnalyze) {
            setSystemMessage("data_blocks ready... (Enter 또는 분석 실행)");
            showToast("두 파일을 자동 배정했습니다. Enter를 누르면 분석합니다.");
          }
        } catch (error) {
          refreshInputState();
          setSystemMessage("bundle classification failed... (기존 선택 유지)");
          showToast(`${error.message || "묶음 파일을 처리하지 못했습니다."} · 기존 선택은 유지됩니다.`, true);
        }
      }

      function bindBundleDropZone() {
        const drop = elements.bundleDrop;
        const input = elements.bundleInput;

        drop.addEventListener("click", () => input.click());
        drop.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            input.click();
          }
        });

        ["dragenter", "dragover"].forEach((eventName) => {
          drop.addEventListener(eventName, (event) => {
            event.preventDefault();
            drop.classList.add("dragover");
          });
        });

        ["dragleave", "drop"].forEach((eventName) => {
          drop.addEventListener(eventName, (event) => {
            event.preventDefault();
            drop.classList.remove("dragover");
          });
        });

        drop.addEventListener("drop", (event) => handleBundleFiles(event.dataTransfer.files));
        input.addEventListener("change", () => {
          handleBundleFiles(input.files);
          input.value = "";
        });
      }

      function toggleWorkspaceStorage(forceOpen) {
        const open = forceOpen === undefined
          ? elements.workspaceStorage.classList.contains("hidden")
          : Boolean(forceOpen);
        elements.workspaceStorage.classList.toggle("hidden", !open);
        if (open) elements.workspaceStorage.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function setLoading(kind, loading) {
        state.loading[kind] = loading;
        const fileName = elements[kind + "FileName"];
        if (loading) {
          fileName.textContent = "확인 중...";
          setSystemMessage(`reading ${kind}_data_block...`);
        }
        elements.analyzeButton.disabled = true;
      }

      function resetResults() {
        state.workspace = null;
        elements.resultsPanel.classList.add("hidden");
        elements.emptyStateWrapper.classList.remove("hidden");
      }

      async function handleFile(kind, file) {
        if (!file) return;
        if (!isSupportedFile(file)) {
          showToast(".xlsx 또는 .xls 파일만 선택할 수 있습니다.", true);
          return;
        }
        if (file.size > MAX_FILE_SIZE) {
          showToast("파일 크기는 25MB 이하여야 합니다.", true);
          return;
        }

        resetResults();
        setLoading(kind, true);
        try {
          state[kind] = await parseExcelFile(file, kind);
          showToast(`${file.name} 파일을 읽었습니다.`);
        } catch (error) {
          state[kind] = null;
          showToast(error.message || "Excel 파일을 읽지 못했습니다.", true);
        } finally {
          setLoading(kind, false);
          refreshInputState();
        }
      }

      function renderFileCard(kind) {
        const parsed = state[kind];
        const card = elements[kind + "Card"];
        const name = elements[kind + "FileName"];
        const loading = state.loading[kind];
        card.classList.toggle("has-file", Boolean(parsed));
        card.classList.toggle("has-error", Boolean(parsed?.errors?.length));
        if (loading) return;

        if (!parsed) {
          name.textContent = "클릭하여 변경";
          return;
        }

        name.textContent = parsed.fileName;
      }

      function renderValidation() {
        // Validation logic maintained internally, visual box is hidden in DataOps UI.
        // We only control the Analyze button state.
      }

      function refreshInputState() {
        state.validation = state.orders && state.inventory
          ? engine.validateInputs(state.orders, state.inventory)
          : null;
        renderFileCard("orders");
        renderFileCard("inventory");
        renderValidation();
        
        const canAnalyze = state.validation?.canAnalyze;
        elements.analyzeButton.disabled = !canAnalyze;
        elements.analyzeButton.textContent = canAnalyze ? "분석 실행" : "파일 업로드 후 실행 버튼 표시";
        
        elements.replaceRecoveryButton.disabled = !canAnalyze;
        const bothSelected = Boolean(state.orders && state.inventory);
        const selectedCount = Number(Boolean(state.orders)) + Number(Boolean(state.inventory));
        
        if (!bothSelected) {
          setSystemMessage(`waiting for data_blocks... (파일을 업로드하세요)`);
        } else if (canAnalyze) {
          setSystemMessage("data_blocks ready... (분석 실행 버튼을 누르세요)");
        } else {
          setSystemMessage("validation blocked... (입력 파일을 확인하세요)");
        }
      }

      function getPreviewDefinitions(workspace) {
        return {
          purchases: {
            label: "창고별 재고",
            headers: ["상품코드", "품목명", "규격", "구매", "전체 주문", "전재고", "서울 잔량", "추가 구매", "담당", "거래처(단가)", "적요", "적요1", "그룹"],
            numeric: [4, 5, 6, 7],
            inventory: [5, 6],
            purchase: 3,
            purchaseEditable: true,
            status: -1,
            sourceRows: workspace.purchaseManagement,
            rows: workspace.purchaseManagement.map((row) => [
              row.productCode,
              row.rowType === "reference" ? `[참고] ${row.productName}` : row.productName,
              row.specification || row.spec || "",
              row.rowType === "reference" ? "" : row.purchase,
              row.rowType === "reference" ? "" : row.totalOrderQuantity,
              row.inventoryMatched ? row.wholeStockRaw : "",
              row.inventoryMatched ? row.seoulFirstPurchaseRemaining : "",
              row.rowType === "reference" ? "" : row.purchaseNeed,
              row.manager,
              row.suppliers,
              row.notes,
              row.notes1,
              row.groups,
            ]),
          },
          allocations: {
            label: "미출고현황",
            headers: ["상품코드", "품목명", "규격", "주문수량", "전재고", "서울 잔량", "전재고 배정", "서울 배정", "추가 구매", "구매", "출고판정", "거래처(단가)", "담당", "그룹"],
            numeric: [3, 4, 5, 6, 7, 8],
            inventory: [4, 5],
            purchase: 9,
            purchaseEditable: false,
            status: 10,
            sourceRows: workspace.allocations,
            rows: workspace.allocations.map((row) => [
              row.productCode,
              row.productName,
              row.specification || row.spec || "",
              row.quantity,
              row.inventoryMatched ? row.wholeStockRaw : "",
              row.inventoryMatched ? row.seoulFirstPurchaseRemaining : "",
              row.wholeAllocation,
              row.seoulAllocation,
              row.purchaseNeed,
              row.purchase,
              row.status,
              row.supplierDisplay,
              row.manager,
              row.group,
            ]),
          },
          summaries: {
            label: "상품별요약",
            headers: ["상품코드", "품목명", "전체 주문", "전재고", "서울 잔량", "전재고 배정", "서울 배정", "추가 구매", "구매", "출고판정", "주문건수", "담당", "거래처(단가)"],
            numeric: [2, 3, 4, 5, 6, 7, 10],
            inventory: [3, 4],
            purchase: 8,
            purchaseEditable: false,
            status: 9,
            sourceRows: workspace.productSummaries,
            rows: workspace.productSummaries.map((row) => [
              row.productCode,
              row.productName,
              row.totalOrderQuantity,
              row.inventoryMatched ? row.wholeStockRaw : "",
              row.inventoryMatched ? row.seoulFirstPurchaseRemaining : "",
              row.wholeAllocation,
              row.seoulAllocation,
              row.purchaseNeed,
              row.purchase,
              row.status,
              row.orderCount,
              row.manager,
              row.suppliers,
            ]),
          },
          validation: {
            label: "검증결과",
            headers: ["검증 항목", "계산 결과", "정상 기준", "판정", "설명"],
            numeric: [1, 2],
            inventory: [],
            purchase: -1,
            purchaseEditable: false,
            status: 3,
            sourceRows: workspace.validationResults,
            rows: workspace.validationResults.map((row) => [
              row.item,
              row.result,
              row.expected,
              row.status,
              row.description,
            ]),
          },
        };
      }

      function renderPreview() {
        const definitions = getPreviewDefinitions(state.workspace);
        if (!definitions[state.activePreview]) state.activePreview = "purchases";
        elements.previewTabs.innerHTML = Object.entries(definitions).map(([id, definition]) => `
          <button class="tab-button ${id === state.activePreview ? "active" : ""}" type="button" role="tab"
            aria-selected="${id === state.activePreview}" data-preview="${id}">
            ${escapeHtml(definition.label)}
          </button>
        `).join("");

        const preview = definitions[state.activePreview];
        elements.previewCount.textContent = `${formatNumber(preview.rows.length)}행`;
        
        elements.previewTable.innerHTML = `
          <table>
            <thead><tr>${preview.headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>
            <tbody>
              ${preview.rows.map((row, rowIndex) => {
                const sourceRow = preview.sourceRows[rowIndex];
                const referenceRow = sourceRow?.rowType === "reference";
                return `
                <tr class="${referenceRow ? "reference-row" : ""}">
                  ${preview.headers.map((_, index) => {
                    const value = row[index];
                    const isNumber = preview.numeric.includes(index) && value !== "";
                    const classes = [isNumber ? "number" : ""].filter(Boolean).join(" ");
                    const content = escapeHtml(isNumber ? formatNumber(value) : value);
                    return `<td class="${classes}" title="${escapeHtml(value)}">${content}</td>`;
                  }).join("")}
                </tr>
              `;}).join("")}
            </tbody>
          </table>
        `;
      }

      function renderResults() {
        const stats = state.workspace.stats;
        renderPreview();
        elements.emptyStateWrapper.classList.add("hidden");
        elements.resultsPanel.classList.remove("hidden");
        elements.purchaseUploadButton.disabled = state.workspace.basisDateStatus !== "valid";
        setSystemMessage("analysis complete... (결과 확인)");
      }

      function runAnalysis() {
        if (!state.validation?.canAnalyze) return;
        elements.analyzeButton.disabled = true;
        elements.analyzeButton.textContent = "분석 중...";
        setSystemMessage("processing data_blocks...");
        window.setTimeout(async () => {
          try {
            const sourceFingerprint = await sha256Hex(JSON.stringify({
              schemaVersion: engine.WORKSPACE_SCHEMA_VERSION,
              orders: {
                sha256: state.orders.fileHash,
                fileName: state.orders.fileName,
                sheetName: state.orders.sheetName,
                rowCount: state.orders.rowCount,
              },
              inventory: {
                sha256: state.inventory.fileHash,
                fileName: state.inventory.fileName,
                sheetName: state.inventory.sheetName,
                rowCount: state.inventory.rowCount,
              },
            }));
            state.workspace = engine.analyze(state.orders, state.inventory, { sourceFingerprint });
            state.activePreview = "purchases";
            renderResults();
            scheduleLocalSave();
          } catch (error) {
            setSystemMessage("analysis failed... (오류 내용을 확인하세요)");
            showToast(error.message || "분석 중 오류가 발생했습니다.", true);
          } finally {
            elements.analyzeButton.textContent = '분석 실행';
            elements.analyzeButton.disabled = !state.validation?.canAnalyze;
          }
        }, 20);
      }

      function downloadResult() {
        if (!state.workspace) return;
        try {
          const fileName = workbookTools.getOutputFileName(state.workspace.createdAt);
          workbookTools.downloadWorkbook(state.workspace, window.XLSX, fileName);
          showToast(`${fileName} 다운로드를 시작했습니다.`);
        } catch (error) {
          showToast(error.message || "Excel을 생성하지 못했습니다.", true);
        }
      }

      function downloadPurchaseUpload() {
        if (!state.workspace) return;
        try {
          const fileName = workbookTools.getPurchaseUploadFileName(state.workspace);
          workbookTools.downloadPurchaseUploadWorkbook(state.workspace, window.XLSX, fileName);
          showToast(`${fileName} 다운로드를 시작했습니다.`);
        } catch (error) {
          showToast(error.message || "구매업로드 Excel을 생성하지 못했습니다.", true);
        }
      }

      function bindDropZone(kind) {
        const drop = elements[kind + "Drop"];
        const input = elements[kind + "Input"];
        drop.addEventListener("click", (event) => {
          if (!event.target.closest("button")) input.click();
        });
        drop.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            input.click();
          }
        });
        ["dragenter", "dragover"].forEach((eventName) => {
          drop.addEventListener(eventName, (event) => {
            event.preventDefault();
            drop.classList.add("dragover");
          });
        });
        ["dragleave", "drop"].forEach((eventName) => {
          drop.addEventListener(eventName, (event) => {
            event.preventDefault();
            drop.classList.remove("dragover");
          });
        });
        drop.addEventListener("drop", (event) => {
          const files = Array.from(event.dataTransfer.files || []).filter(Boolean);
          if (files.length > 1) handleBundleFiles(files);
          else handleFile(kind, files[0]);
        });
        input.addEventListener("change", () => {
          const files = Array.from(input.files || []).filter(Boolean);
          if (files.length > 1) handleBundleFiles(files);
          else handleFile(kind, files[0]);
          input.value = "";
        });
      }

      elements.headerSettingsButton.addEventListener("click", () => {
        showToast("매핑 설정은 현재 준비 중입니다.");
      });

      elements.headerRestoreButton.addEventListener("click", () => {
        toggleWorkspaceStorage(true);
        if (state.recoveryRecord) {
          elements.recoveryBanner.classList.remove("hidden");
          showToast("저장된 이전 작업을 복구할 수 있습니다.");
        } else {
          showToast("현재 브라우저에 복구할 이전 작업이 없습니다.", true);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.isComposing || event.repeat) return;
        const target = event.target;
        if (target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement ||
            target instanceof HTMLSelectElement ||
            target instanceof HTMLButtonElement ||
            target?.isContentEditable) return;
        if (!state.validation?.canAnalyze || state.workspace || elements.analyzeButton.disabled) return;
        event.preventDefault();
        runAnalysis();
      });

      elements.analyzeButton.addEventListener("click", runAnalysis);
      elements.downloadButton.addEventListener("click", downloadResult);
      elements.purchaseUploadButton.addEventListener("click", downloadPurchaseUpload);
      elements.previewTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-preview]");
        if (!button || !state.workspace) return;
        state.activePreview = button.dataset.preview;
        renderPreview();
        scheduleLocalSave();
      });
      elements.restoreButton.addEventListener("click", () => {
        try { restoreLocalRecord(state.recoveryRecord); }
        catch (error) { showToast(error.message || "복구 불가", true); }
      });
      elements.replaceRecoveryButton.addEventListener("click", () => {
        replaceRecoveryWithCurrentFiles().catch((error) => showToast(error.message, true));
      });
      elements.discardRecoveryButton.addEventListener("click", () => {
        clearLocalRecovery().catch((error) => showToast(error.message, true));
      });
      
      bindBundleDropZone();
      bindDropZone("orders");
      bindDropZone("inventory");

      if (!engine || !workbookTools || !window.XLSX) {
        setSystemMessage("system unavailable... (실행 라이브러리 로딩 실패)");
      } else {
        initializeLocalRecovery();
      }
    })();
  </script>
</body>
