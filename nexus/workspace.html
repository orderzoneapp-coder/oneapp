<!doctype html>
<html lang="ko" data-nexus-ui-app="master-lookup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS 통합업무</title>
  <link rel="icon" type="image/svg+xml" href="/nexus/assets/nexus-favicon.svg">
  <script src="common/nexus-ui-theme-init.js?v=1.2.0" data-nexus-app-id="master-lookup"></script>
  <link rel="stylesheet" href="common/nexus-ui.css?v=1.4.0">
  <link rel="stylesheet" href="workspace.css?v=1.0.0">
  <script defer src="common/nexus-ui.js?v=1.7.0"></script>
  <script defer src="workspace.js?v=1.1.0"></script>
</head>
<body class="nexus-workspace">
  <main class="nexus-workspace__main" aria-label="NEXUS 통합 업무영역">
    <iframe
      id="nexusWorkspaceFrame"
      class="nexus-workspace__frame"
      title="현재 업무 앱"
      referrerpolicy="same-origin"
    ></iframe>

    <div id="nexusWorkspaceLoading" class="nexus-workspace__loading" role="status" aria-live="polite">
      <span class="nexus-workspace__spinner" aria-hidden="true"></span>
      <span id="nexusWorkspaceLoadingText">업무 앱을 준비하고 있습니다.</span>
    </div>

    <section id="nexusWorkspaceError" class="nexus-workspace__error" hidden aria-labelledby="nexusWorkspaceErrorTitle">
      <div class="nexus-workspace__error-card">
        <p class="nexus-workspace__eyebrow">NEXUS 앱 연결</p>
        <h1 id="nexusWorkspaceErrorTitle">업무 앱을 열 수 없습니다.</h1>
        <p id="nexusWorkspaceErrorMessage">주소를 확인한 뒤 다시 시도해 주세요.</p>
        <div class="nexus-workspace__error-actions">
          <button id="nexusWorkspaceRetry" type="button">다시 시도</button>
          <a id="nexusWorkspaceStandalone" href="../Master.html" target="_blank" rel="noopener">독립 앱으로 열기</a>
          <a href="./">NEXUS 홈</a>
        </div>
      </div>
    </section>

    <p id="nexusWorkspaceNotice" class="nexus-workspace__notice" hidden role="alert"></p>
  </main>
  <noscript>통합 업무화면을 사용하려면 JavaScript가 필요합니다. 각 업무 앱의 직접 주소는 계속 사용할 수 있습니다.</noscript>
</body>
</html>
