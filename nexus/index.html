<!doctype html>
<html lang="ko" data-nexus-color-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B1021">
  <title>NEXUS</title>
  <link rel="icon" type="image/png" href="./assets/nexus-favicon.png">
  <script src="./common/nexus-theme-init.js?v=1.0.0"></script>
  <style>
    :root { --nexus-top-height: 44px; --nexus-content-gutter: 24px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body, .empty-canvas { background: #f5f6f8; }
    nexus-top { display: block; min-height: var(--nexus-top-height); }
    .nexus-top-fallback { height: var(--nexus-top-height); padding: 0 14px; display: flex; align-items: center; gap: 12px; color: #fff; background: #0b1021; font: 12px Pretendard, "Noto Sans KR", sans-serif; }
    .nexus-top-fallback strong { letter-spacing: .08em; }
    .nexus-top-fallback span { color: #cbd5e1; }
    .nexus-top-fallback button { margin-left: auto; padding: 5px 9px; border: 1px solid #64748b; border-radius: 6px; color: #fff; background: transparent; cursor: pointer; }
    .empty-canvas { min-height: calc(100vh - var(--nexus-top-height)); }
    :root[data-nexus-color-mode="dark"] body,
    :root[data-nexus-color-mode="dark"] .empty-canvas { background: #111827; }
  </style>
  <script src="./common/apps-config.js?v=1.4.0"></script>
  <script src="./common/nexus-top.js?v=1.5.0"></script>
</head>
<body>
  <nexus-top><div class="nexus-top-fallback" role="status"><strong>NEXUS</strong><span>NEXUS 메뉴를 불러오지 못했습니다.</span><button type="button" onclick="window.location.reload()">재시도</button></div></nexus-top>
  <main class="empty-canvas" aria-label="빈 NEXUS 홈"></main>
</body>
</html>
