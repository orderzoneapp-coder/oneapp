<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1021">
  <title>NEXUS</title>
  <link rel="icon" type="image/png" href="./assets/nexus-favicon.png">
  <link rel="apple-touch-icon" href="./assets/nexus-favicon.png">
  <link rel="stylesheet" href="./nexus-header.css?v=20260821-2">
</head>
<body>
  <header class="nexus-header" aria-label="NEXUS 공통 헤더">
    <a class="brand" href="https://oneapp.orderz.co.kr/nexus.html" aria-label="NEXUS 홈">
      <img class="brand-logo" src="./assets/brand/oneapp-nexus-dark.svg" alt="ONEAPP NEXUS">
    </a>

    <nav class="app-nav" aria-label="앱 내비게이션">
      <div class="app-nav-track" role="tablist" aria-label="NEXUS 앱"></div>
    </nav>

    <div class="header-actions">
      <button class="header-action" type="button" data-panel="apps" aria-haspopup="dialog" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        <span>전체 앱</span>
      </button>
      <button class="header-action" type="button" data-panel="settings" aria-haspopup="dialog" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.1 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L14.7 3h-4l-.4 3a7.7 7.7 0 0 0-1.7 1L6.2 6l-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1l.4 3.1h4l.4-3.1a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2.1-1.5ZM12.7 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
        <span>설정</span>
      </button>
    </div>
  </header>

  <div class="panel apps-panel" data-panel-content="apps" role="dialog" aria-label="전체 앱" hidden>
    <div class="panel-heading">
      <div><span class="eyebrow">ONEAPP</span><h2>전체 앱</h2></div>
      <button class="panel-close" type="button" aria-label="전체 앱 닫기" data-close-panel>×</button>
    </div>
    <div class="app-grid"></div>
  </div>

  <aside class="panel settings-panel" data-panel-content="settings" role="dialog" aria-modal="true" aria-label="NEXUS 설정" hidden>
    <div class="panel-heading">
      <div><span class="eyebrow">NEXUS</span><h2>설정</h2></div>
      <button class="panel-close" type="button" aria-label="설정 닫기" data-close-panel>×</button>
    </div>
    <div class="settings-content">
      <section>
        <h3>화면</h3>
        <label class="setting-row">
          <span><strong>간결한 헤더</strong><small>메뉴 간격을 좁게 표시합니다.</small></span>
          <input type="checkbox" role="switch" aria-label="간결한 헤더">
        </label>
      </section>
      <section>
        <h3>접근성</h3>
        <label class="setting-row">
          <span><strong>모션 줄이기</strong><small>패널 전환 효과를 최소화합니다.</small></span>
          <input type="checkbox" role="switch" aria-label="모션 줄이기">
        </label>
      </section>
      <p class="settings-note">설정은 시안 확인용이며 새로고침하면 초기화됩니다.</p>
    </div>
  </aside>
  <div class="backdrop" hidden></div>

  <main class="empty-canvas" aria-label="빈 NEXUS 홈"></main>
  <script src="./nexus-header.js"></script>
</body>
</html>
