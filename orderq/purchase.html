<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>ONEAPP ORDER Q · 구매 작업대</title>
  <script src="/nexus/common/nexus-auth-config.js?v=1.0.0"></script><script src="/nexus/common/nexus-auth.js?v=1.0.0"></script>
  <link rel="stylesheet" href="./orderq.css?v=0.11.0">
  <link rel="stylesheet" href="./purchase.css?v=0.8.0">
</head>
<body class="purchase-page">
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>ONEAPP</strong>
        <span class="logo-frame" aria-hidden="true"><img src="../assets/order-q-logo.png" alt=""></span>
        <span class="badge">vNext 0.8.0</span>
        <span>구매 작업대</span>
      </div>
      <div class="top-actions">
        <a class="btn dark" href="./">주문현황</a>
        <a class="btn dark" href="./dispatch.html">출고 작업대</a>
        <a class="btn dark" href="./products.html">간편상품</a>
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
      </div>
    </header>

    <main class="purchase-shell">
      <section class="purchase-notice">
        <strong>구매는 출고와 별도로 확정합니다.</strong>
        구매안을 작성하는 동안 재고는 변하지 않습니다. 실제 입고 내용을 확인하고 관리자가 구매확정해야 재고가 증가합니다.
      </section>
      <div id="message" class="purchase-message" role="status"></div>
      <div class="purchase-toolbar">
        <label>상태
          <select id="statusFilter"><option value="">전체</option><option value="DRAFT">검토 중</option><option value="CONFIRMED">입고 완료</option><option value="REVERSED">구매 취소</option></select>
        </label>
        <label>검색 <input id="searchFilter" type="search" placeholder="구매ID·부족근거·공급처·상품"></label>
        <button class="pq-btn primary" id="newDraftBtn" type="button">+ 새 구매안</button>
        <span id="summaryText">불러오는 중…</span>
      </div>

      <div class="purchase-layout">
        <aside class="purchase-list-panel">
          <div class="panel-heading"><h2>구매 작업</h2></div>
          <div id="purchaseList" class="purchase-list"></div>
        </aside>
        <section class="purchase-detail-panel" id="purchaseDetail">
          <div class="empty-state">왼쪽에서 구매안을 선택하거나 새 구매안을 만드세요.</div>
        </section>
      </div>
    </main>
  </div>
  <datalist id="purchaseProductOptions"></datalist>
  <script type="module" src="./workflow-guide.js?v=0.11.0"></script>
  <script type="module" src="./purchase-ui.js?v=0.13.0"></script>
</body>
</html>
