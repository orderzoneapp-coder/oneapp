<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>전표 조회 - NEXUS</title>
  <link rel="icon" type="image/svg+xml" href="/nexus/assets/nexus-favicon.svg">
  <script src="../nexus/common/nexus-ui-theme-init.js?v=1.1.0" data-nexus-app-id="orderq-vnext"></script>
  <link rel="stylesheet" href="../nexus/common/nexus-ui.css?v=1.3.4">
  <link rel="stylesheet" href="../nexus/common/nexus-ui-app-themes.css?v=1.3.8">
  <link rel="stylesheet" href="./orderq.css?v=0.7.1">
  <link rel="stylesheet" href="./voucher-query.css?v=0.1.0">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><strong>ONEAPP</strong><span>전표 조회</span></div>
      <div class="top-actions"><a class="btn dark" href="../smartinput/">스마트입력</a><a class="btn dark" href="./">주문현황</a></div>
    </header>
    <main class="panel voucher-query">
      <div class="toolbar">
        <label>전표 <select id="modeInput"><option value="order">주문서</option><option value="purchase">구매전표</option><option value="sale">판매전표</option></select></label>
        <label>전표일자 <input id="dateInput" type="date"></label>
        <button class="btn" id="reloadButton" type="button">다시 조회</button>
        <span class="spacer"></span><span class="status" id="queryStatus" role="status">조회 준비</span>
      </div>
      <div class="voucher-query__list" id="voucherList"></div>
    </main>
  </div>
  <script type="module" src="./voucher-query.js?v=0.1.0"></script>
  <script defer src="../nexus/common/nexus-ui.js?v=1.4.1"></script>
</body>
</html>
