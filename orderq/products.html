<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>ONEAPP ORDER Q · 간편상품</title>
  <link rel="stylesheet" href="./orderq.css?v=0.8.0">
  <link rel="stylesheet" href="./products.css?v=0.8.0-m7">
</head>
<body class="product-page">
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>ONEAPP</strong>
        <span class="logo-frame" aria-hidden="true"><img src="../assets/order-q-logo.png" alt=""></span>
        <span class="badge">vNext 0.8.0</span>
        <span>간편상품 연결</span>
      </div>
      <div class="top-actions">
        <a class="btn dark" href="./">주문현황</a>
        <a class="btn dark" href="./dispatch.html">출고 작업대</a>
        <a class="btn dark" href="./purchase.html">구매 작업대</a>
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
      </div>
    </header>

    <main class="product-shell">
      <section class="product-notice">
        <strong>M7 간편등록</strong>
        정식 상품이 없어도 임시상품으로 업무를 계속할 수 있습니다. 마스터 연결·해제는 이후 거래의 검색 기준만 바꾸며, 이미 저장된 주문·출고·구매 상품은 덮어쓰지 않습니다.
      </section>
      <div id="message" class="product-message" role="status"></div>

      <section class="quick-create" aria-labelledby="createHeading">
        <div>
          <h2 id="createHeading">간편상품 등록</h2>
          <p>상품명만 필수입니다. 임시 ID는 TMP- 접두사로 발급됩니다.</p>
        </div>
        <form id="createForm" class="quick-create-form">
          <label>상품명<input id="quickItemName" required autocomplete="off"></label>
          <label>임시 코드<input id="quickItemCode" autocomplete="off"></label>
          <label>규격<input id="quickSpecification" autocomplete="off"></label>
          <label>단위<input id="quickUnit" autocomplete="off"></label>
          <label>입수<input id="quickBoxQuantity" type="number" min="0" step="any"></label>
          <label class="wide">등록 메모<input id="quickMemo" autocomplete="off"></label>
          <button class="product-btn primary" id="createBtn" type="submit">임시상품 등록</button>
        </form>
      </section>

      <div class="product-layout">
        <aside class="product-list-panel">
          <div class="panel-heading">
            <h2>임시상품</h2>
            <span id="summaryText">0건</span>
          </div>
          <div id="quickProductList" class="product-list"></div>
        </aside>
        <section class="product-detail-panel" id="quickProductDetail">
          <div class="empty-state">임시상품을 등록하거나 왼쪽 목록에서 선택하세요.</div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="./products-ui.js?v=0.8.0-m7"></script>
  <script type="module" src="./customer-picker-bootstrap.js?v=0.12.0"></script>
</body>
</html>
