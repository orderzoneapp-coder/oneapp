<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="google" content="notranslate">
  <title>ONEAPP ORDER Q · 판매 조회</title>
  <script src="/nexus/common/nexus-auth-config.js?v=2.0.1"></script><script src="/nexus/common/nexus-auth.js?v=2.1.2"></script>
  <link rel="stylesheet" href="./orderq.css?v=0.11.0"><link rel="stylesheet" href="./purchase.css?v=0.8.0">
</head>
<body class="purchase-page"><div class="shell">
  <header class="topbar"><div class="brand"><strong>ONEAPP</strong><span class="logo-frame"><img src="../assets/order-q-logo.png" alt=""></span><span>판매 조회</span></div>
    <div class="top-actions"><a class="btn dark" href="./">주문현황</a><a class="btn dark" href="./purchase.html">구매 조회</a><button class="btn" id="refreshBtn" type="button">새로고침</button></div></header>
  <main class="purchase-shell"><section class="purchase-notice"><strong>공식·기존 판매전표를 구분해 표시합니다.</strong> 기존 전표는 조회만 가능하며 공식 전표만 VOUCHER_CORE 명령으로 수정·취소합니다.</section>
    <div id="message" class="purchase-message" role="status"></div>
    <div class="purchase-toolbar"><label>상태 <select id="statusFilter"><option value="">전체</option><option value="CONFIRMED">확정</option><option value="REVERSED">취소</option></select></label><label>검색 <input id="searchFilter" type="search" placeholder="판매ID·거래처·상품"></label><span id="summaryText"></span></div>
    <div class="purchase-layout"><aside class="purchase-list-panel"><div class="panel-heading"><h2>판매전표</h2></div><div id="saleList" class="purchase-list"></div></aside><section class="purchase-detail-panel" id="saleDetail"><div class="empty-state">판매전표를 선택하세요.</div></section></div>
  </main>
</div><script type="module" src="./sale-ui.js?v=0.1.0"></script></body></html>
