<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>거래처 Master | ONEAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./customer-master.css?v=0.12.1">
</head>
<body class="customer-master-page">
  <header class="cm-topbar">
    <a class="cm-brand" href="../index.html"><strong>ONEAPP</strong><span>ORDER Q</span></a>
    <nav class="cm-nav" aria-label="주요 메뉴">
      <a href="./products.html">상품</a>
      <a href="./customers.html" aria-current="page">거래처</a>
      <a href="./parser.html">ORDER IN</a>
      <a href="./input.html">직접입력</a>
      <a href="./collector.html">Collector</a>
    </nav>
  </header>
  <main class="cm-main">
    <section class="cm-hero">
      <div>
        <div class="cm-kicker">Find · Create · Continue</div>
        <h1>거래처 Master</h1>
        <p>거래처는 빠르게 찾고, 없으면 이름만으로 바로 등록합니다. 상세정보와 중복 정리는 업무가 끝난 뒤 보완할 수 있습니다.</p>
      </div>
      <div class="cm-actions">
        <button class="cm-button" id="openImportButton" type="button">Excel 업로드</button>
        <button class="cm-button primary" id="newCustomerButton" type="button">+ 거래처 등록</button>
      </div>
    </section>
    <section class="cm-dashboard" aria-label="거래처 요약">
      <article class="cm-stat"><small>전체 거래처</small><strong id="totalCount">0</strong></article>
      <article class="cm-stat"><small>사용중</small><strong id="activeCount">0</strong></article>
      <article class="cm-stat"><small>정보 보완</small><strong id="unverifiedCount">0</strong></article>
      <article class="cm-stat"><small>중복 확인</small><strong id="duplicateCount">0</strong></article>
    </section>
    <section class="cm-panel">
      <div class="cm-toolbar">
        <input class="cm-search" id="customerSearch" type="search" placeholder="거래처명, 코드, 전화, 주소 검색">
        <select class="cm-filter" id="customerFilter" aria-label="거래처 상태 필터">
          <option value="ALL">전체</option>
          <option value="ACTIVE">사용중</option>
          <option value="INACTIVE">거래중단</option>
          <option value="UNVERIFIED">정보 보완</option>
          <option value="DUPLICATE_CANDIDATE">중복 확인</option>
        </select>
      </div>
      <div class="cm-list-head"><span>코드</span><span>거래처명</span><span>연락처 / 주소</span><span>그룹</span><span>상태</span></div>
      <div class="cm-viewport" id="customerViewport"><div class="cm-spacer" id="customerSpacer"></div></div>
      <div class="cm-empty" id="customerEmpty" hidden>조건에 맞는 거래처가 없습니다.</div>
    </section>
    <section class="cm-panel cm-import" id="importWorkbench" hidden>
      <div class="cm-actions"><button class="cm-button" id="closeImportButton">닫기</button></div>
      <label class="cm-drop">거래처 Excel 파일을 선택하세요<input id="customerExcelFile" type="file" accept=".xlsx,.xls" hidden></label>
      <div class="cm-import-summary" id="importSummary"></div>
      <div class="cm-review-list" id="importReview"></div>
      <div class="cm-actions"><button class="cm-button dark" id="applyImportButton" disabled>Master 적용</button></div>
    </section>
  </main>
  <dialog class="cm-modal" id="customerEditor">
    <form method="dialog" class="cm-form" id="customerForm">
      <header><div><small>Customer Editor</small><h2 id="editorTitle">거래처 등록</h2></div><button value="cancel" aria-label="닫기">×</button></header>
      <input type="hidden" name="customerId">
      <input type="hidden" name="revision">
      <div class="cm-form-grid">
        <label>거래처명 *<input name="customerName" required></label>
        <label>거래처코드<input name="customerCode"></label>
        <label>대표자<input name="representativeName"></label>
        <label>사업자번호<input name="businessNumber"></label>
        <label>전화<input name="phone"></label>
        <label>핸드폰<input name="mobile"></label>
        <label>담당자<input name="contactName"></label>
        <label>담당자 연락처<input name="contactPhone"></label>
        <label>그룹<input name="groupName"></label>
        <label>단가그룹<input name="priceGroup"></label>
        <label>상태<select name="status"><option value="ACTIVE">사용중</option><option value="INACTIVE">거래중단</option></select></label>
        <label>주소<input name="address"></label>
      </div>
      <div class="cm-form-actions"><button class="cm-button" value="cancel">취소</button><button class="cm-button primary" id="saveCustomerButton" type="submit">저장</button></div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="./customer-master-ui.js?v=0.12.1"></script>
</body>
</html>
