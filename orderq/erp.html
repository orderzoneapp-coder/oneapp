<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>ONEAPP ORDER Q · ERP 자료</title>
  <script src="/nexus/common/nexus-auth-config.js?v=2.0.1"></script><script src="/nexus/common/nexus-auth.js?v=2.1.1"></script>
  <link rel="stylesheet" href="./orderq.css?v=0.11.0">
  <link rel="stylesheet" href="./erp.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><strong>ONEAPP</strong><span class="logo-frame"><img src="../assets/order-q-logo.png" alt=""></span><span class="badge">vNext 0.8.0</span><span>ERP 자료</span></div>
      <div class="top-actions"><a class="btn dark" href="./cloud.html">중앙 연결</a><a class="btn dark" href="./dispatch.html">출고관리</a><a class="btn dark" href="./purchase.html">구매관리</a><a class="btn dark" href="./reconciliation.html">차이 확인</a></div>
    </header>
    <main class="erp-shell">
      <section class="erp-card">
        <h1>ERP 입력자료 만들기</h1>
        <p>출고·구매가 확정되어 <b>ERP 자료 준비</b>가 끝난 건만 파일로 만듭니다. ERP로 자동 전송하거나 전표를 자동 생성하지 않습니다.</p>
        <div id="summary" class="erp-summary"></div>
        <button id="exportBtn" class="btn primary" type="button">ERP 입력파일 만들기</button>
      </section>
      <section class="erp-card">
        <h2>ERP 처리결과 확인</h2>
        <p>ERP에서 받은 파일은 정확히 같은 거래만 연결합니다. 비슷하거나 여러 후보가 있으면 자동 연결하지 않고 관리자 확인 대상으로 남깁니다.</p>
        <input id="importFile" type="file" accept=".xlsx,.xls">
        <button id="reconcileBtn" class="btn" type="button">선택 파일 확인</button>
      </section>
      <div id="message" class="message"></div>
      <section class="erp-card"><h2>확인 결과</h2><div id="results" class="erp-results">ERP 결과 파일을 선택하세요.</div></section>
    </main>
  </div>
  <script type="module" src="./workflow-guide.js?v=0.11.0"></script>
  <script type="module" src="./erp-ui.js?v=0.11.0"></script>
</body>
</html>
