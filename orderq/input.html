<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>ONEAPP ORDER Q vNext · 수기 주문</title>
  <link rel="stylesheet" href="./orderq.css">
</head>
<body class="manual-order-page">
  <div class="shell">
    <header class="topbar manual-topbar">
      <div class="brand">
        <strong>ONEAPP</strong>
        <span class="logo-frame" aria-hidden="true"><img src="../assets/order-q-logo.png" alt=""></span>
        <span class="badge">vNext 0.4.8</span>
        <span id="pageMode">수기 주문</span>
      </div>
      <div class="top-system" aria-live="polite">
        <div class="top-system-line">
          <strong>System.IO</strong>
          <span id="orderMeta" title="시스템이 관리하는 주문 ID·Revision·상태입니다.">신규 주문 · 저장 전</span>
        </div>
        <span class="top-system-help">품목코드 입력 후 마스터 매칭 결과를 표시합니다.</span>
        <div id="message" class="message"></div>
      </div>
      <div class="top-actions">
        <a class="btn dark" href="./collector.html">이력수집</a>
        <a class="btn dark" href="./cloud.html">클라우드</a>
        <a class="btn dark" href="./parser.html">SmartParser</a>
        <a class="btn dark" href="./index.html">주문현황</a>
        <button class="btn primary" id="saveTopBtn" type="button">저장</button>
      </div>
    </header>
    <main class="panel">
      <section class="form-grid">
        <div class="field">
          <label for="orderDate">일자</label>
          <div class="date-control">
            <input class="control" id="orderDate" type="text" inputmode="numeric" maxlength="10" placeholder="YYYY-MM-DD" autocomplete="off">
            <button class="date-picker-button" id="orderDatePickerButton" type="button" aria-label="달력에서 일자 선택">▣</button>
            <input class="native-date-picker" id="orderDatePicker" type="date" tabindex="-1" aria-hidden="true">
          </div>
        </div>
        <div class="field">
          <label for="customerName">거래처명</label>
          <input class="control" id="customerName" type="text" placeholder="거래처명" autocomplete="off">
        </div>
        <div class="field">
          <label for="warehouse">출하창고</label>
          <input class="control" id="warehouse" type="text" placeholder="출하창고">
        </div>
        <div class="field">
          <label for="transactionType">거래유형</label>
          <select class="control" id="transactionType">
            <option value="기타">기타</option>
            <option value="카드">카드</option>
            <option value="현금">현금</option>
            <option value="현금영수증">현금영수증</option>
            <option value="사내사용">사내사용</option>
          </select>
        </div>
        <div class="field wide">
          <label for="orderMessage">전표 메모 <span class="field-help">주문건 전체 전달사항</span></label>
          <input class="control" id="orderMessage" type="text" placeholder="이 주문 전체에 전달할 내용">
        </div>
      </section>

      <div class="toolbar">
        <button class="btn" id="removeRowsBtn" type="button">선택행 삭제</button>
        <div class="toolbar-menu">
          <button class="btn" id="columnMenuBtn" type="button" aria-expanded="false" aria-controls="columnMenu">열 추가</button>
          <div class="toolbar-popover column-menu" id="columnMenu" hidden>
            <strong>표시할 열</strong>
            <label><input type="checkbox" data-column-toggle="boxQuantity" checked> 박스당수량</label>
            <label><input type="checkbox" data-column-toggle="unit" checked> 단위</label>
            <label><input type="checkbox" data-column-toggle="vat"> 부가세</label>
            <small>박스당수량은 1박스 입수, 단위는 마스터 기준 처리 단위입니다. 부가세는 합계의 10%로 제안되며 직접 수정할 수 있습니다.</small>
          </div>
        </div>
        <div class="toolbar-menu">
          <button class="btn" id="sortRowsBtn" type="button" aria-expanded="false" aria-controls="sortRowsMenu">정렬</button>
          <div class="toolbar-popover sort-menu" id="sortRowsMenu" hidden>
            <button type="button" data-sort="input">입력순</button>
            <button type="button" data-sort="code">코드순</button>
            <button type="button" data-sort="name">품명 가나다순</button>
            <button type="button" data-sort="unit">단위순</button>
          </div>
        </div>
        <span class="spacer"></span>
        <span class="status" id="masterStatus">상품 마스터 불러오는 중…</span>
      </div>

      <div class="table-wrap">
        <table id="orderTable">
          <colgroup>
            <col class="col-select">
            <col class="col-code">
            <col class="col-name">
            <col class="col-specification">
            <col class="col-box-quantity" data-column="boxQuantity">
            <col class="col-unit" data-column="unit">
            <col class="col-quantity">
            <col class="col-price">
            <col class="col-total">
            <col class="col-vat" data-column="vat" hidden>
            <col class="col-memo">
            <col class="col-match">
          </colgroup>
          <thead>
            <tr class="table-groups">
              <th rowspan="2">선택</th>
              <th class="group-product" id="productGroupHeader" colspan="5">상품 정보</th>
              <th class="group-order" id="orderGroupHeader" colspan="3">주문 입력</th>
              <th class="group-check" colspan="2">확인</th>
            </tr>
            <tr>
              <th>품목코드</th>
              <th>품목명</th>
              <th>규격</th>
              <th data-column="boxQuantity" title="한 박스에 들어있는 기본 수량">박스당수량</th>
              <th data-column="unit" title="상품 마스터 기준 재고·출고 처리 단위">단위</th>
              <th>수량</th>
              <th class="price-header" title="헤더 드롭다운 또는 단가 셀의 ▲▼로 전체 단가 기준을 전환합니다.">
                <select id="priceTypeSelect" aria-label="단가 종류">
                  <option value="salePrice" selected>판매가</option>
                  <option value="outPrice">출고가</option>
                  <option value="wholesaleA">도매A</option>
                  <option value="wholesaleB">도매B</option>
                  <option value="listingPrice">상장가</option>
                  <option value="marketPrice">시중가</option>
                  <option value="promoPrice">행사가</option>
                  <option value="MANUAL" disabled>직접입력</option>
                  <option value="MIXED" disabled>혼합단가</option>
                </select>
              </th>
              <th>합계</th>
              <th data-column="vat" title="합계의 10% 제안값이며 직접 수정할 수 있습니다." hidden>부가세</th>
              <th>상품별 메모(적요)</th>
              <th title="공통 상품 마스터의 productId 연결 상태">마스터 매칭</th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
      <div class="summary">
        <span id="totalRows">상품 0건</span>
        <span id="matchedRows">매칭완료 0건</span>
        <span id="failedRows">매칭실패 0건</span>
        <span class="summary-spacer"></span>
        <span id="supplyTotal">합계 0원</span>
        <span id="vatTotal" hidden>부가세 0원</span>
      </div>
      <div class="bottom">
        <span class="spacer"></span>
        <button class="btn danger" id="cancelOrderBtn" type="button" hidden>주문 취소</button>
        <button class="btn primary" id="saveBottomBtn" type="button">저장</button>
      </div>
    </main>
  </div>
  <div id="productSuggestions" class="product-suggestions" role="listbox" hidden></div>

  <script type="module">
    import {
      createOrder, updateOrder, cancelOrder, getOrder, subscribeOrderChanges,
      OrderRevisionConflictError, MATCH_STATUS
    } from './order-intake-engine.js';
    import {
      syncBeforeOrderMutation, syncAfterLocalMutation, getSyncState,
      CloudOrderConflictError
    } from './orderq-sync-engine.js';
    import { loadProductCatalog, searchProductCatalog } from './product-master-search.js';
    import {
      calculateLineTotal, calculateVatAmount, compareManualRows, cycleManualPriceOption, numberOrNull
    } from './manual-order-grid.js';

    const params = new URLSearchParams(location.search);
    const editingOrderId = params.get('orderId');
    let loadedRevision = null;
    let loadedCustomerId = null;
    let productCatalog = [];
    let activeSearchInput = null;
    let activeSuggestionIndex = 0;
    let searchTimer = null;
    let rowInputSequence = 0;
    let vatColumnVisible = false;
    const MANUAL_DEFAULTS_KEY = 'oneapp.orderq.manual-defaults.v1';
    const MANUAL_DEFAULTS_SCHEMA = 'orderq-manual-defaults/v1';

    const itemRows = document.getElementById('itemRows');
    const message = document.getElementById('message');
    const priceTypeSelect = document.getElementById('priceTypeSelect');
    const pageMode = document.getElementById('pageMode');
    const orderMeta = document.getElementById('orderMeta');
    const cancelButton = document.getElementById('cancelOrderBtn');
    const suggestions = document.getElementById('productSuggestions');
    const masterStatus = document.getElementById('masterStatus');
    const orderDateInput = document.getElementById('orderDate');
    const orderDatePicker = document.getElementById('orderDatePicker');
    const customerNameInput = document.getElementById('customerName');
    const warehouseInput = document.getElementById('warehouse');
    const transactionTypeInput = document.getElementById('transactionType');
    const columnMenuButton = document.getElementById('columnMenuBtn');
    const columnMenu = document.getElementById('columnMenu');
    const sortRowsButton = document.getElementById('sortRowsBtn');
    const sortRowsMenu = document.getElementById('sortRowsMenu');

    function loadManualDefaults() {
      try {
        const value = JSON.parse(localStorage.getItem(MANUAL_DEFAULTS_KEY) || 'null');
        if (!value || value.schemaVersion !== MANUAL_DEFAULTS_SCHEMA) return { warehouse: '', transactionType: '기타' };
        return {
          warehouse: String(value.warehouse || '').trim().slice(0, 80),
          transactionType: String(value.transactionType || '기타').trim()
        };
      } catch (_) {
        return { warehouse: '', transactionType: '기타' };
      }
    }

    const manualDefaults = loadManualDefaults();

    function saveManualDefaults() {
      manualDefaults.warehouse = warehouseInput.value.trim().slice(0, 80);
      manualDefaults.transactionType = transactionTypeInput.value;
      try {
        localStorage.setItem(MANUAL_DEFAULTS_KEY, JSON.stringify({
          schemaVersion: MANUAL_DEFAULTS_SCHEMA,
          warehouse: manualDefaults.warehouse,
          transactionType: manualDefaults.transactionType
        }));
      } catch (_) {}
    }

    function showMessage(text, type = 'info') {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function todayLocal() {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function isValidOrderDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
    }

    function rowTemplate(item = {}) {
      const tr = document.createElement('tr');
      if (item.orderItemId) tr.dataset.orderItemId = item.orderItemId;
      tr.dataset.productId = String(item.productId || '').startsWith('CODE:') ? '' : (item.productId || '');
      tr.dataset.matchSource = tr.dataset.productId ? (item.matchSource || 'SAVED_MASTER') : 'MANUAL_UNMATCHED';
      tr.dataset.rawText = item.rawText || item.itemName || '';
      tr.dataset.inputSequence = String(++rowInputSequence);
      tr.dataset.priceOptions = JSON.stringify(Array.isArray(item.priceOptions) ? item.priceOptions : []);
      tr.dataset.priceType = String(item.priceType || '');
      tr.innerHTML = `
        <td class="center"><input type="checkbox" data-role="select"></td>
        <td><input data-field="itemCode" value="" placeholder="코드 검색" autocomplete="off"></td>
        <td><input data-field="itemName" value="" placeholder="품명" autocomplete="off"></td>
        <td><input data-field="specification" value=""></td>
        <td data-column="boxQuantity"><input class="num" data-field="boxQuantity" type="number" step="any" value=""></td>
        <td data-column="unit"><input data-field="finalUnit" value=""></td>
        <td><input class="num" data-field="quantity" type="number" step="any" value=""></td>
        <td class="price-cell"><div class="price-picker">
          <input class="num" data-field="price" type="number" step="any" value="" aria-label="단가">
          <span class="price-stepper">
            <button type="button" data-price-step="1" aria-label="다음 단가" title="다음 단가">▲</button>
            <button type="button" data-price-step="-1" aria-label="이전 단가" title="이전 단가">▼</button>
          </span>
        </div></td>
        <td><input class="num amount-input" data-field="supplyAmount" type="number" step="any" value="" aria-label="합계"></td>
        <td data-column="vat" hidden><input class="num amount-input" data-field="vatAmount" type="number" step="any" value="" aria-label="부가세"></td>
        <td><input data-field="memo" value="" placeholder="이 상품의 적요"></td>
        <td class="center"><span data-role="matchStatus" class="row-status" hidden></span></td>`;
      const set = (field, value) => { const el = tr.querySelector(`[data-field="${field}"]`); if (el) el.value = value ?? ''; };
      set('itemCode', item.itemCode);
      set('itemName', item.itemName);
      set('specification', item.specification);
      set('boxQuantity', item.boxQuantity);
      set('quantity', item.finalQuantity ?? item.rawQuantity ?? item.quantity);
      set('finalUnit', item.finalUnit || item.rawUnit);
      set('price', item.price);
      const automaticTotal = calculateLineTotal(
        item.finalQuantity ?? item.rawQuantity ?? item.quantity,
        item.price
      );
      const savedTotal = numberOrNull(item.supplyAmount);
      const displayedTotal = savedTotal ?? automaticTotal;
      set('supplyAmount', displayedTotal);
      if (savedTotal !== null && (automaticTotal === null || Math.abs(savedTotal - automaticTotal) > 1e-9)) {
        tr.dataset.totalManual = 'true';
      }
      const automaticVat = calculateVatAmount(displayedTotal);
      const savedVat = numberOrNull(item.vatAmount);
      set('vatAmount', savedVat);
      if (savedVat !== null && (automaticVat === null || Math.abs(savedVat - automaticVat) > 1e-9)) {
        tr.dataset.vatManual = 'true';
      }
      set('memo', item.memo);
      refreshRowStatus(tr);
      return tr;
    }

    function refreshRowStatus(tr) {
      const badge = tr.querySelector('[data-role="matchStatus"]');
      const matched = Boolean(tr.dataset.productId);
      const hasProductInput = matched || ['itemCode', 'itemName'].some(field => {
        return Boolean(tr.querySelector(`[data-field="${field}"]`)?.value.trim());
      });
      badge.hidden = !hasProductInput;
      if (!hasProductInput) {
        badge.textContent = '';
        badge.className = 'row-status';
        refreshSummary();
        return;
      }
      badge.textContent = matched ? '매칭완료' : '매칭실패';
      badge.className = `row-status ${matched ? 'matched' : 'failed'}`;
      refreshSummary();
    }

    function getRowPriceOptions(row) {
      try {
        const options = JSON.parse(row?.dataset.priceOptions || '[]');
        return Array.isArray(options) ? options : [];
      } catch (_) {
        return [];
      }
    }

    function setRowPriceOptions(row, options = []) {
      if (!row) return;
      const normalized = options.map(option => {
        const value = numberOrNull(option?.value);
        return value === null || !option?.key ? null : {
          key: String(option.key),
          label: String(option.label || option.key),
          value
        };
      }).filter(Boolean);
      row.dataset.priceOptions = JSON.stringify(normalized);
      const price = numberOrNull(row.querySelector('[data-field="price"]')?.value);
      if (!row.dataset.priceType && price !== null) {
        row.dataset.priceType = normalized.find(option => option.value === price)?.key || 'MANUAL';
      }
    }

    function applyRowPriceOption(row, option) {
      if (!row || !option) return;
      row.querySelector('[data-field="price"]').value = option.value;
      row.dataset.priceType = option.key;
      refreshRowAmounts(row);
    }

    function activeMasterPriceKey() {
      return ['salePrice', 'outPrice', 'wholesaleA', 'wholesaleB', 'listingPrice', 'marketPrice', 'promoPrice']
        .includes(priceTypeSelect.value) ? priceTypeSelect.value : 'salePrice';
    }

    function updatePriceTypeHeaderFromRows() {
      const types = [...itemRows.querySelectorAll('tr')].filter(row => {
        return Boolean(row.dataset.productId
          || row.querySelector('[data-field="itemCode"]')?.value.trim()
          || row.querySelector('[data-field="price"]')?.value.trim());
      }).map(row => row.dataset.priceType || (row.querySelector('[data-field="price"]')?.value.trim() ? 'MANUAL' : ''))
        .filter(Boolean);
      if (!types.length) priceTypeSelect.value = 'salePrice';
      else if (types.every(type => type === types[0])) priceTypeSelect.value = types[0];
      else priceTypeSelect.value = 'MIXED';
    }

    function applyPriceTypeToRows(priceType) {
      [...itemRows.querySelectorAll('tr')].forEach(row => {
        const options = getRowPriceOptions(row);
        if (!options.length) return;
        const option = options.find(candidate => candidate.key === priceType);
        if (option) applyRowPriceOption(row, option);
        else {
          row.querySelector('[data-field="price"]').value = '';
          row.dataset.priceType = priceType;
          refreshRowAmounts(row);
        }
      });
      priceTypeSelect.value = priceType;
    }

    function cycleRowPrice(row, direction) {
      const selectedType = priceTypeSelect.value;
      const currentType = ['salePrice', 'outPrice', 'wholesaleA', 'wholesaleB', 'listingPrice', 'marketPrice', 'promoPrice']
        .includes(selectedType) ? selectedType : row?.dataset.priceType;
      const option = cycleManualPriceOption(getRowPriceOptions(row), currentType, direction);
      if (!option) return false;
      applyPriceTypeToRows(option.key);
      return true;
    }

    function refreshRowAmounts(row) {
      if (!row) return;
      const totalInput = row.querySelector('[data-field="supplyAmount"]');
      const vatInput = row.querySelector('[data-field="vatAmount"]');
      if (row.dataset.totalManual !== 'true') {
        totalInput.value = calculateLineTotal(
          row.querySelector('[data-field="quantity"]').value,
          row.querySelector('[data-field="price"]').value
        ) ?? '';
      }
      if (vatColumnVisible && row.dataset.vatManual !== 'true') {
        vatInput.value = calculateVatAmount(totalInput.value) ?? '';
      }
      refreshSummary();
    }

    function addRow(item = {}) {
      const row = rowTemplate(item);
      itemRows.appendChild(row);
      applyColumnVisibilityToRow(row);
      refreshSummary();
      return row;
    }

    function rowHasInput(row) {
      return [...row.querySelectorAll('[data-field]')].some(el => String(el.value || '').trim());
    }

    function refreshSummary() {
      const rows = [...itemRows.querySelectorAll('tr')].filter(rowHasInput);
      const attemptedRows = rows.filter(row => Boolean(row.dataset.productId)
        || ['itemCode', 'itemName'].some(field => row.querySelector(`[data-field="${field}"]`)?.value.trim()));
      const matched = attemptedRows.filter(row => Boolean(row.dataset.productId)).length;
      const supplyTotal = rows.reduce((sum, row) => sum + (numberOrNull(row.querySelector('[data-field="supplyAmount"]')?.value) || 0), 0);
      const vatTotal = rows.reduce((sum, row) => sum + (numberOrNull(row.querySelector('[data-field="vatAmount"]')?.value) || 0), 0);
      document.getElementById('totalRows').textContent = `상품 ${rows.length}건`;
      document.getElementById('matchedRows').textContent = `매칭완료 ${matched}건`;
      document.getElementById('failedRows').textContent = `매칭실패 ${attemptedRows.length - matched}건`;
      document.getElementById('supplyTotal').textContent = `합계 ${supplyTotal.toLocaleString('ko-KR')}원`;
      document.getElementById('vatTotal').textContent = `부가세 ${vatTotal.toLocaleString('ko-KR')}원`;
    }

    function readItems() {
      return [...itemRows.querySelectorAll('tr')].map((row, index) => {
        const get = field => row.querySelector(`[data-field="${field}"]`)?.value ?? '';
        const quantity = get('quantity');
        const price = get('price');
        const finalUnit = get('finalUnit');
        return {
          orderItemId: row.dataset.orderItemId || undefined,
          productId: row.dataset.productId || null,
          lineNo: index + 1,
          itemCode: get('itemCode'),
          itemName: get('itemName'),
          specification: get('specification'),
          quantity,
          rawQuantity: quantity,
          finalQuantity: quantity,
          rawUnit: finalUnit,
          finalUnit,
          boxQuantity: get('boxQuantity'),
          price,
          priceType: row.dataset.priceType || (price !== '' ? 'MANUAL' : ''),
          supplyAmount: get('supplyAmount'),
          vatAmount: get('vatAmount'),
          memo: get('memo'),
          rawText: row.dataset.rawText || get('itemName'),
          matchSource: row.dataset.matchSource || 'MANUAL_UNMATCHED',
          matchStatus: row.dataset.productId ? MATCH_STATUS.MATCHED : MATCH_STATUS.MATCH_FAILED
        };
      }).filter(item => item.itemCode || item.itemName || item.quantity || item.finalUnit || item.memo || item.supplyAmount !== '');
    }

    function readPayload() {
      return {
        orderDate: document.getElementById('orderDate').value,
        customerId: loadedCustomerId,
        customerName: document.getElementById('customerName').value,
        warehouse: document.getElementById('warehouse').value,
        transactionType: document.getElementById('transactionType').value,
        orderMessage: document.getElementById('orderMessage').value,
        sourceType: 'MANUAL',
        items: readItems()
      };
    }

    function closeSuggestions() {
      suggestions.hidden = true;
      suggestions.innerHTML = '';
      suggestions._products = [];
      activeSearchInput = null;
      activeSuggestionIndex = 0;
    }

    function positionSuggestions(input) {
      const rect = input.getBoundingClientRect();
      const width = Math.min(620, Math.max(280, window.innerWidth - 24));
      suggestions.style.width = `${width}px`;
      suggestions.style.left = `${Math.max(12, Math.min(rect.left, window.innerWidth - width - 12))}px`;
      suggestions.style.top = `${Math.min(window.innerHeight - 240, rect.bottom + 4)}px`;
    }

    function markActiveSuggestion() {
      [...suggestions.querySelectorAll('[data-suggestion-index]')].forEach((button, index) => {
        button.classList.toggle('active', index === activeSuggestionIndex);
        button.setAttribute('aria-selected', index === activeSuggestionIndex ? 'true' : 'false');
      });
    }

    function showSuggestions(input) {
      const query = input.value.trim();
      if (!query || !productCatalog.length) {
        closeSuggestions();
        return;
      }
      const products = searchProductCatalog(query, productCatalog, 8);
      suggestions.innerHTML = '';
      suggestions._products = products;
      activeSearchInput = input;
      activeSuggestionIndex = 0;
      if (!products.length) {
        const empty = document.createElement('div');
        empty.className = 'product-suggestion-empty';
        empty.textContent = '검색 결과 없음 · 직접 입력하면 미매칭으로 저장됩니다.';
        suggestions.appendChild(empty);
      } else {
        products.forEach((product, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'product-suggestion';
          button.dataset.suggestionIndex = String(index);
          button.setAttribute('role', 'option');
          const title = document.createElement('strong');
          title.textContent = `${product.itemCode || '코드없음'} · ${product.itemName || '품명없음'}`;
          const detail = document.createElement('span');
          const aliases = [product.secondaryName, product.searchInfo].filter(Boolean).join(' · ');
          const outPrice = product.outPrice == null ? '' : `출고가 ${Number(product.outPrice).toLocaleString('ko-KR')}`;
          const boxQuantity = product.boxQuantity == null ? '' : `박스당 ${Number(product.boxQuantity).toLocaleString('ko-KR')}`;
          detail.textContent = [product.specification, boxQuantity, product.finalUnit, outPrice, aliases].filter(Boolean).join(' · ') || '추가정보 없음';
          const source = document.createElement('em');
          source.textContent = product.source === 'COMMON_MASTER' ? '공통 마스터' : 'ORDER Q 이력';
          button.append(title, detail, source);
          suggestions.appendChild(button);
        });
        markActiveSuggestion();
      }
      positionSuggestions(input);
      suggestions.hidden = false;
    }

    function focusQuantity(row) {
      const quantity = row.querySelector('[data-field="quantity"]');
      quantity?.focus();
      quantity?.select();
    }

    function applyProduct(input, product) {
      const row = input.closest('tr');
      if (!row || !product) return;
      const originalText = row.querySelector('[data-field="itemName"]').value.trim() || input.value.trim();
      row.dataset.productId = product.productId;
      row.dataset.matchSource = product.source === 'COMMON_MASTER' ? 'MANUAL_COMMON_MASTER' : 'MANUAL_ORDERQ_MASTER';
      row.dataset.rawText = originalText || product.itemName;
      row.querySelector('[data-field="itemCode"]').value = product.itemCode || '';
      row.querySelector('[data-field="itemName"]').value = product.itemName || '';
      row.querySelector('[data-field="specification"]').value = product.specification || '';
      row.querySelector('[data-field="boxQuantity"]').value = product.boxQuantity ?? '';
      row.querySelector('[data-field="finalUnit"]').value = product.finalUnit || '';
      setRowPriceOptions(row, product.priceOptions || []);
      const selectedPriceType = activeMasterPriceKey();
      const defaultPrice = product.priceOptions?.find(option => option.key === selectedPriceType);
      if (defaultPrice) {
        row.querySelector('[data-field="price"]').value = defaultPrice.value;
        row.dataset.priceType = defaultPrice.key;
      } else {
        row.querySelector('[data-field="price"]').value = '';
        row.dataset.priceType = selectedPriceType;
      }
      updatePriceTypeHeaderFromRows();
      closeSuggestions();
      refreshRowStatus(row);
      refreshRowAmounts(row);
      focusQuantity(row);
    }

    function clearProductMatch(row, sourceInput) {
      if (!row) return;
      row.dataset.productId = '';
      row.dataset.matchSource = 'MANUAL_UNMATCHED';
      if (sourceInput?.dataset.field === 'itemName') row.dataset.rawText = sourceInput.value.trim();
      if (sourceInput?.dataset.field === 'itemCode') {
        row.dataset.priceOptions = '[]';
        row.dataset.priceType = row.querySelector('[data-field="price"]').value.trim() ? 'MANUAL' : '';
        updatePriceTypeHeaderFromRows();
      }
      refreshRowStatus(row);
    }

    function hydrateRowPriceOptions() {
      [...itemRows.querySelectorAll('tr')].forEach(row => {
        const productId = row.dataset.productId;
        const itemCode = row.querySelector('[data-field="itemCode"]')?.value.trim();
        const product = productCatalog.find(candidate => (productId && candidate.productId === productId)
          || (itemCode && candidate.itemCode === itemCode));
        if (product) setRowPriceOptions(row, product.priceOptions || []);
      });
      updatePriceTypeHeaderFromRows();
    }

    function isColumnVisible(column) {
      return Boolean(columnMenu.querySelector(`[data-column-toggle="${column}"]`)?.checked);
    }

    function applyColumnVisibilityToRow(row) {
      ['boxQuantity', 'unit', 'vat'].forEach(column => {
        row.querySelectorAll(`[data-column="${column}"]`).forEach(cell => { cell.hidden = !isColumnVisible(column); });
      });
    }

    function updateColumnVisibility() {
      ['boxQuantity', 'unit', 'vat'].forEach(column => {
        const visible = isColumnVisible(column);
        document.querySelectorAll(`#orderTable [data-column="${column}"]`).forEach(element => { element.hidden = !visible; });
      });
      vatColumnVisible = isColumnVisible('vat');
      document.getElementById('productGroupHeader').colSpan = 3
        + Number(isColumnVisible('boxQuantity'))
        + Number(isColumnVisible('unit'));
      document.getElementById('orderGroupHeader').colSpan = 3 + Number(vatColumnVisible);
      document.getElementById('vatTotal').hidden = !vatColumnVisible;
      if (vatColumnVisible) [...itemRows.querySelectorAll('tr')].forEach(refreshRowAmounts);
      else refreshSummary();
    }

    function closeToolbarMenus(except = null) {
      [[columnMenuButton, columnMenu], [sortRowsButton, sortRowsMenu]].forEach(([button, menu]) => {
        if (menu === except) return;
        menu.hidden = true;
        button.setAttribute('aria-expanded', 'false');
      });
    }

    function toggleToolbarMenu(button, menu) {
      const opening = menu.hidden;
      closeToolbarMenus(opening ? menu : null);
      menu.hidden = !opening;
      button.setAttribute('aria-expanded', opening ? 'true' : 'false');
    }

    function focusRowField(row, field) {
      const input = row?.querySelector(`[data-field="${field}"]`);
      input?.focus();
      input?.select();
    }

    function focusFirstItemCode() {
      const row = itemRows.querySelector('tr') || addRow();
      focusRowField(row, 'itemCode');
    }

    function advanceFromMemo(row) {
      const nextRow = row.nextElementSibling || addRow();
      focusRowField(nextRow, 'itemCode');
    }

    function rowSortValue(row) {
      const value = field => row.querySelector(`[data-field="${field}"]`)?.value || '';
      return {
        row,
        empty: !rowHasInput(row),
        itemCode: value('itemCode'),
        itemName: value('itemName'),
        finalUnit: value('finalUnit'),
        inputSequence: Number(row.dataset.inputSequence || 0)
      };
    }

    function sortRows(sortKey, label) {
      const rows = [...itemRows.querySelectorAll('tr')].map(rowSortValue);
      rows.sort((left, right) => compareManualRows(left, right, sortKey));
      rows.forEach(({ row }) => itemRows.appendChild(row));
      sortRowsButton.textContent = `정렬 · ${label}`;
      closeToolbarMenus();
      refreshSummary();
    }

    async function initializeProductCatalog() {
      const result = await loadProductCatalog();
      productCatalog = result.products;
      if (result.commonCount) {
        masterStatus.textContent = `공통 상품 마스터 ${result.commonCount.toLocaleString()}건 · 입력 후 후보 선택`;
      } else if (result.orderQCount) {
        masterStatus.textContent = `공통 마스터 없음 · ORDER Q 이력 ${result.orderQCount.toLocaleString()}건 검색`;
      } else {
        masterStatus.textContent = '상품 마스터 없음 · 직접입력은 미매칭으로 저장';
      }
      if (result.errors.length) masterStatus.title = result.errors.join('\n');
    }

    async function loadEditingOrder() {
      if (!editingOrderId) {
        orderDateInput.value = todayLocal();
        warehouseInput.value = manualDefaults.warehouse;
        if ([...transactionTypeInput.options].some(option => option.value === manualDefaults.transactionType)) {
          transactionTypeInput.value = manualDefaults.transactionType;
        }
        addRow();
        return;
      }
      const data = await getOrder(editingOrderId);
      if (!data) {
        showMessage('주문을 찾을 수 없습니다.', 'error');
        return;
      }
      const { order, items } = data;
      loadedRevision = order.revision;
      loadedCustomerId = order.customerId;
      pageMode.textContent = '주문서 수정';
      orderMeta.textContent = `${order.orderId} · Revision ${order.revision} · ${order.status}`;
      orderDateInput.value = order.orderDate || todayLocal();
      customerNameInput.value = order.customerName || '';
      warehouseInput.value = order.warehouse || '';
      transactionTypeInput.value = order.transactionType || '기타';
      document.getElementById('orderMessage').value = order.orderMessage || '';
      itemRows.innerHTML = '';
      items.forEach(addRow);
      addRow();
      cancelButton.hidden = order.status === 'CANCELLED';
      if (order.status === 'CANCELLED') {
        showMessage('취소된 주문입니다. 이 주문은 수정 저장할 수 없습니다.', 'warn');
        document.getElementById('saveTopBtn').disabled = true;
        document.getElementById('saveBottomBtn').disabled = true;
      }
    }

    async function cloudPreflight() {
      if (!editingOrderId || loadedRevision == null) return;
      const state = await getSyncState();
      const unresolved = state.conflicts.find(row => row.entityType === 'ORDER' && row.entityId === editingOrderId);
      if (unresolved) throw new CloudOrderConflictError(editingOrderId, loadedRevision, unresolved.serverRevision, unresolved.remotePayload || null);
      await syncBeforeOrderMutation(editingOrderId, loadedRevision);
    }

    function showConflict(error) {
      const latest = error.serverRevision || error.latestOrder?.revision || '?';
      showMessage('이 주문은 다른 곳에서 이미 수정되었습니다. 현재 입력내용은 유지됩니다. [클라우드]에서 최신본을 적용한 후 주문서를 다시 열어 입력·저장하세요.', 'warn');
      orderMeta.textContent = `${editingOrderId} · 현재 화면 r${loadedRevision} / 최신 r${latest}`;
    }

    async function save() {
      const payload = readPayload();
      if (!isValidOrderDate(payload.orderDate)) {
        return showMessage('주문일자를 YYYY-MM-DD 형식으로 입력하세요.', 'error');
      }
      if (!payload.customerName.trim()) return showMessage('거래처를 입력하세요.', 'error');
      if (!payload.items.length) return showMessage('주문상품을 1개 이상 입력하세요.', 'error');
      saveManualDefaults();
      try {
        if (editingOrderId) {
          await cloudPreflight();
          const result = await updateOrder(editingOrderId, loadedRevision, payload);
          loadedRevision = result.order.revision;
          loadedCustomerId = result.order.customerId;
          orderMeta.textContent = `${result.order.orderId} · Revision ${result.order.revision} · ${result.order.status}`;
          try {
            const sync = await syncAfterLocalMutation(result.order.orderId);
            showMessage(sync.online ? `저장 및 클라우드 동기화 완료 · Revision ${result.order.revision}` : `로컬 저장 완료 · Revision ${result.order.revision} · 클라우드 동기화 대기`, sync.online ? 'info' : 'warn');
          } catch (syncError) {
            if (syncError instanceof CloudOrderConflictError || syncError.code === 'ORDER_CLOUD_REVISION_CONFLICT') return showConflict(syncError);
            showMessage(`로컬 저장 완료 · Revision ${result.order.revision} · 클라우드 동기화 실패: ${syncError.message || syncError}`, 'warn');
          }
        } else {
          const result = await createOrder(payload);
          try { await syncAfterLocalMutation(result.order.orderId); } catch (_) {}
          location.replace(`./input.html?orderId=${encodeURIComponent(result.order.orderId)}`);
        }
      } catch (error) {
        if (error instanceof OrderRevisionConflictError || error.code === 'ORDER_REVISION_CONFLICT' || error instanceof CloudOrderConflictError || error.code === 'ORDER_CLOUD_REVISION_CONFLICT') {
          showConflict(error);
          return;
        }
        showMessage(error.message || String(error), 'error');
      }
    }

    itemRows.addEventListener('input', event => {
      const row = event.target.closest('tr');
      if (row && (event.target.dataset.field === 'itemCode' || event.target.dataset.field === 'itemName')) {
        clearProductMatch(row, event.target);
        if (event.target.dataset.field === 'itemCode') {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => showSuggestions(event.target), 100);
        }
      }
      else if (row && event.target.dataset.field === 'quantity') {
        refreshRowAmounts(row);
      }
      else if (row && event.target.dataset.field === 'price') {
        row.dataset.priceType = event.target.value.trim() ? 'MANUAL' : '';
        updatePriceTypeHeaderFromRows();
        refreshRowAmounts(row);
      }
      else if (row && event.target.dataset.field === 'supplyAmount') {
        row.dataset.totalManual = event.target.value.trim() ? 'true' : '';
        refreshRowAmounts(row);
      }
      else if (row && event.target.dataset.field === 'vatAmount') {
        row.dataset.vatManual = event.target.value.trim() ? 'true' : '';
        refreshRowAmounts(row);
      }
      else refreshSummary();
    });
    itemRows.addEventListener('focusin', event => {
      if (event.target.matches('[data-field="itemCode"]') && event.target.value.trim()) showSuggestions(event.target);
    });
    itemRows.addEventListener('keydown', event => {
      if (event.isComposing) return;
      const row = event.target.closest('tr');
      const field = event.target.dataset.field;
      if (field === 'itemCode') {
        const products = suggestions._products || [];
        const suggestionsActive = !suggestions.hidden && activeSearchInput === event.target;
        if (suggestionsActive && event.key === 'ArrowDown' && products.length) {
          event.preventDefault();
          activeSuggestionIndex = (activeSuggestionIndex + 1) % products.length;
          markActiveSuggestion();
          return;
        }
        if (suggestionsActive && event.key === 'ArrowUp' && products.length) {
          event.preventDefault();
          activeSuggestionIndex = (activeSuggestionIndex - 1 + products.length) % products.length;
          markActiveSuggestion();
          return;
        }
        if (event.key === 'Escape') {
          closeSuggestions();
          return;
        }
        if (event.key === 'Enter') {
          event.preventDefault();
          clearTimeout(searchTimer);
          const enterProducts = suggestionsActive
            ? products
            : searchProductCatalog(event.target.value.trim(), productCatalog, 8);
          if (enterProducts.length) applyProduct(event.target, enterProducts[suggestionsActive ? activeSuggestionIndex : 0]);
          else {
            closeSuggestions();
            focusRowField(row, 'quantity');
          }
          return;
        }
      }
      if (field === 'price' && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
        event.preventDefault();
        cycleRowPrice(row, event.key === 'ArrowUp' ? 1 : -1);
        return;
      }
      if (event.key !== 'Enter') return;
      if (field === 'quantity') {
        event.preventDefault();
        focusRowField(row, 'price');
      } else if (field === 'price') {
        event.preventDefault();
        focusRowField(row, 'memo');
      } else if (field === 'memo') {
        event.preventDefault();
        advanceFromMemo(row);
      }
    });
    suggestions.addEventListener('pointerdown', event => {
      const button = event.target.closest('[data-suggestion-index]');
      if (!button || !activeSearchInput) return;
      event.preventDefault();
      applyProduct(activeSearchInput, suggestions._products?.[Number(button.dataset.suggestionIndex)]);
    });
    itemRows.addEventListener('click', event => {
      const button = event.target.closest('[data-price-step]');
      if (!button) return;
      event.preventDefault();
      const row = button.closest('tr');
      cycleRowPrice(row, Number(button.dataset.priceStep));
      focusRowField(row, 'price');
    });
    priceTypeSelect.addEventListener('change', () => applyPriceTypeToRows(priceTypeSelect.value));
    document.addEventListener('pointerdown', event => {
      if (!suggestions.hidden && !suggestions.contains(event.target) && event.target !== activeSearchInput) closeSuggestions();
      if (!event.target.closest('.toolbar-menu')) closeToolbarMenus();
    });
    window.addEventListener('resize', () => { if (!suggestions.hidden && activeSearchInput) positionSuggestions(activeSearchInput); });
    window.addEventListener('scroll', () => { if (!suggestions.hidden && activeSearchInput) positionSuggestions(activeSearchInput); }, true);
    document.getElementById('removeRowsBtn').addEventListener('click', () => {
      [...itemRows.querySelectorAll('tr')].filter(row => row.querySelector('[data-role="select"]').checked).forEach(row => row.remove());
      if (!itemRows.children.length) addRow();
      updatePriceTypeHeaderFromRows();
      refreshSummary();
    });
    columnMenuButton.addEventListener('click', () => toggleToolbarMenu(columnMenuButton, columnMenu));
    columnMenu.addEventListener('change', event => {
      if (!event.target.matches('[data-column-toggle]')) return;
      updateColumnVisibility();
    });
    sortRowsButton.addEventListener('click', () => toggleToolbarMenu(sortRowsButton, sortRowsMenu));
    sortRowsMenu.addEventListener('click', event => {
      const button = event.target.closest('[data-sort]');
      if (!button) return;
      sortRows(button.dataset.sort, button.textContent.trim());
    });
    document.getElementById('saveTopBtn').addEventListener('click', save);
    document.getElementById('saveBottomBtn').addEventListener('click', save);
    cancelButton.addEventListener('click', async () => {
      if (!editingOrderId || loadedRevision == null) return;
      if (!confirm('이 주문을 취소하시겠습니까? 주문 이력은 삭제하지 않고 취소 상태로 보존합니다.')) return;
      try {
        await cloudPreflight();
        const result = await cancelOrder(editingOrderId, loadedRevision);
        loadedRevision = result.order.revision;
        orderMeta.textContent = `${result.order.orderId} · Revision ${result.order.revision} · CANCELLED`;
        try { await syncAfterLocalMutation(result.order.orderId); } catch (syncError) {
          if (syncError instanceof CloudOrderConflictError || syncError.code === 'ORDER_CLOUD_REVISION_CONFLICT') return showConflict(syncError);
        }
        showMessage('주문이 취소되었습니다. 이력은 보존되며 클라우드 동기화 대상에 반영됩니다.', 'warn');
        cancelButton.hidden = true;
        document.getElementById('saveTopBtn').disabled = true;
        document.getElementById('saveBottomBtn').disabled = true;
      } catch (error) {
        if (error instanceof OrderRevisionConflictError || error.code === 'ORDER_REVISION_CONFLICT' || error instanceof CloudOrderConflictError || error.code === 'ORDER_CLOUD_REVISION_CONFLICT') showConflict(error);
        else showMessage(error.message || String(error), 'error');
      }
    });

    customerNameInput.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing) return;
      event.preventDefault();
      if (warehouseInput.value.trim() && transactionTypeInput.value) focusFirstItemCode();
      else {
        warehouseInput.focus();
        warehouseInput.select();
      }
    });
    warehouseInput.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing) return;
      event.preventDefault();
      if (transactionTypeInput.value) focusFirstItemCode();
      else transactionTypeInput.focus();
    });
    transactionTypeInput.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing) return;
      event.preventDefault();
      focusFirstItemCode();
    });
    warehouseInput.addEventListener('change', saveManualDefaults);
    transactionTypeInput.addEventListener('change', saveManualDefaults);
    const selectDateDay = () => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(orderDateInput.value)) return;
      window.setTimeout(() => orderDateInput.setSelectionRange(8, 10), 0);
    };
    orderDateInput.addEventListener('focus', selectDateDay);
    orderDateInput.addEventListener('click', selectDateDay);
    document.getElementById('orderDatePickerButton').addEventListener('click', () => {
      if (isValidOrderDate(orderDateInput.value)) orderDatePicker.value = orderDateInput.value;
      if (typeof orderDatePicker.showPicker === 'function') orderDatePicker.showPicker();
      else orderDatePicker.click();
    });
    orderDatePicker.addEventListener('change', () => {
      if (!orderDatePicker.value) return;
      orderDateInput.value = orderDatePicker.value;
      orderDateInput.focus();
      selectDateDay();
    });

    subscribeOrderChanges(change => {
      if (!editingOrderId || change.orderId !== editingOrderId) return;
      if (change.revision > (loadedRevision || 0)) {
        showMessage(`다른 화면에서 이 주문이 Revision ${change.revision}으로 변경되었습니다. 현재 입력내용은 유지되지만 저장 시 최신본 확인이 필요합니다.`, 'warn');
      }
    });

    Promise.all([initializeProductCatalog(), loadEditingOrder()])
      .then(() => {
        hydrateRowPriceOptions();
        updateColumnVisibility();
        if (!editingOrderId) window.setTimeout(() => customerNameInput.focus(), 0);
      })
      .catch(error => showMessage(error.message || String(error), 'error'));
  </script>
</body>
</html>
