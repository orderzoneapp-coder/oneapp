<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>ONEAPP ORDER Q · 출고 작업대</title>
  <link rel="stylesheet" href="./orderq.css?v=0.8.0">
  <link rel="stylesheet" href="./dispatch.css?v=0.8.0">
</head>
<body class="dispatch-page">
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>ONEAPP</strong>
        <span class="logo-frame" aria-hidden="true"><img src="../assets/order-q-logo.png" alt=""></span>
        <span class="badge">vNext 0.8.0</span>
        <span>출고 작업대</span>
      </div>
      <div class="top-actions">
        <a class="btn dark" href="./">주문현황</a>
        <a class="btn dark" href="./operations.html">출고 운영</a>
        <a class="btn dark" href="./purchase.html">구매 작업대</a>
        <a class="btn dark" href="./products.html">간편상품</a>
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
      </div>
    </header>

    <main class="dispatch-shell">
      <section class="dispatch-notice">
        <strong>M6 로컬 출고·구매 분리</strong>
        DRAFT와 RELEASED는 판매·재고수불·주문이행에 영향이 없습니다. 출고확정과 구매확정은 서로 독립되며 여러 PC 운영은 M9 이후 사용합니다.
      </section>
      <div id="message" class="dispatch-message" role="status"></div>
      <div class="dispatch-toolbar">
        <div class="mode-switch" role="group" aria-label="작업 모드">
          <button type="button" data-mode="ADMIN">관리자 판단</button>
          <button type="button" data-mode="WORKER">작업자 목록</button>
        </div>
        <label>상태
          <select id="statusFilter"><option value="">전체</option><option value="DRAFT">DRAFT</option><option value="RELEASED">RELEASED</option><option value="READY_TO_CONFIRM">READY_TO_CONFIRM</option><option value="CONFIRMED">CONFIRMED</option></select>
        </label>
        <label>검색 <input id="searchFilter" type="search" placeholder="출고번호·고객·상품"></label>
        <button class="dq-btn primary" type="button" data-action="confirm-batch">확정대기 일괄확정</button>
        <span class="dispatch-summary" id="summaryText">불러오는 중…</span>
      </div>

      <div id="adminMode" class="dispatch-layout">
        <aside class="dispatch-list-panel">
          <div class="panel-heading"><h2>출고 판단</h2><span id="proposalCount"></span></div>
          <div id="proposalList" class="proposal-list"></div>
          <div id="dispatchList" class="dispatch-list"></div>
        </aside>
        <section class="dispatch-detail-panel" id="dispatchDetail">
          <div class="empty-state">왼쪽에서 출고 판단을 선택하세요.</div>
        </section>
      </div>

      <div id="workerMode" class="worker-layout" hidden>
        <section class="worker-panel">
          <div class="panel-heading"><h2>창고·상품 합산 피킹</h2><span>행을 펼치면 원 출고행을 추적할 수 있습니다.</span></div>
          <div id="aggregatePickList"></div>
        </section>
        <section class="worker-panel">
          <div class="panel-heading"><h2>주문별 작업 결과</h2><span>입력값은 작업사실이며 확정수량이 아닙니다.</span></div>
          <div id="orderPickList"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="./dispatch-ui.js?v=0.9.0"></script>
</body>
</html>
