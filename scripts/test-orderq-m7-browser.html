<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>ORDER Q M7 Browser Test</title>
<body>
  <h1>ORDER Q M7 Browser Test</h1>
  <pre id="result">RUNNING</pre>
  <script type="module">
    import {
      DB_NAME, STORE, closeOrderQDb, openOrderQDb, requestToPromise, transactionDone
    } from '../orderq/orderq-db.js?v=0.8.0';
    import { loadProductCatalog } from '../orderq/product-master-search.js?v=0.8.0';
    import { getSyncState } from '../orderq/orderq-sync-engine.js?v=0.8.0';
    import {
      linkQuickProductToMaster, loadQuickProduct, unlinkQuickProductFromMaster
    } from '../orderq/quick-product-repository.js?v=0.8.0-m7';

    const output = document.querySelector('#result');
    const consoleWarnings = [];
    const consoleErrors = [];
    const originalWarn = console.warn.bind(console);
    const originalError = console.error.bind(console);
    console.warn = (...args) => { consoleWarnings.push(args.map(String).join(' ')); originalWarn(...args); };
    console.error = (...args) => { consoleErrors.push(args.map(String).join(' ')); originalError(...args); };
    window.addEventListener('error', event => consoleErrors.push(event.error?.stack || event.message || 'window error'));
    window.addEventListener('unhandledrejection', event => consoleErrors.push(event.reason?.stack || String(event.reason)));

    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    const waitUntil = async (predicate, message, attempts = 80) => {
      for (let index = 0; index < attempts; index += 1) {
        if (await predicate()) return;
        await delay(100);
      }
      throw new Error(message);
    };
    const deleteDatabase = () => new Promise((resolve, reject) => {
      const request = indexedDB.deleteDatabase(DB_NAME);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('test database delete blocked'));
    });
    const readAll = async storeName => {
      const db = await openOrderQDb();
      const tx = db.transaction(storeName, 'readonly');
      const rows = await requestToPromise(tx.objectStore(storeName).getAll());
      await transactionDone(tx);
      return rows;
    };
    const factSnapshot = async temporaryProductId => {
      const facts = {};
      for (const storeName of [STORE.ORDER_ITEMS, STORE.DISPATCH_LINES, STORE.PURCHASE_LINES]) {
        facts[storeName] = (await readAll(storeName)).filter(row =>
          row.productId === temporaryProductId
          || row.requestedProductId === temporaryProductId
          || row.actualProductId === temporaryProductId);
      }
      return JSON.stringify(facts);
    };

    async function seedMaster() {
      const db = await openOrderQDb();
      const tx = db.transaction(STORE.PRODUCTS, 'readwrite');
      tx.objectStore(STORE.PRODUCTS).put({
        productId: 'PRD-100', itemCode: '100', itemName: '정식 배추', normalizedName: '정식 배추',
        specification: '10kg', finalUnit: 'BOX', source: 'ORDERQ_MASTER', status: 'ACTIVE', active: true,
        productIdentityType: 'MASTER_REFERENCE', registrationStatus: 'MASTER', revision: 1
      });
      await transactionDone(tx);
    }

    async function seedHistoricalFacts(temporaryProductId) {
      const db = await openOrderQDb();
      const tx = db.transaction([STORE.ORDER_ITEMS, STORE.DISPATCH_LINES, STORE.PURCHASE_LINES], 'readwrite');
      tx.objectStore(STORE.ORDER_ITEMS).put({
        orderItemId: 'OI-M7', orderId: 'O-M7', productId: temporaryProductId,
        itemCode: 'TMP-CODE', itemName: '현장 배추', finalQuantity: 4, finalUnit: 'BOX', matchStatus: 'MATCHED'
      });
      tx.objectStore(STORE.DISPATCH_LINES).put({
        dispatchLineId: 'DL-M7', dispatchId: 'D-M7', orderItemId: 'OI-M7',
        requestedProductId: temporaryProductId, actualProductId: temporaryProductId,
        requestedProductName: '현장 배추', actualProductName: '현장 배추', status: 'DRAFT'
      });
      tx.objectStore(STORE.PURCHASE_LINES).put({
        purchaseLineId: 'PL-M7', purchaseDocumentId: 'PD-M7', productId: temporaryProductId,
        productCode: 'TMP-CODE', productName: '현장 배추', quantity: 4, unit: 'BOX', status: 'DRAFT'
      });
      await transactionDone(tx);
    }

    async function loadFrame() {
      const frame = document.createElement('iframe');
      frame.style.width = '1380px';
      frame.style.height = '780px';
      document.body.append(frame);
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error('M7 products UI iframe load failed'));
        frame.src = `../orderq/products.html?m7-browser=${Date.now()}`;
      });
      await waitUntil(() => frame.contentDocument.querySelector('#createForm'), 'M7 products UI did not render');
      return frame;
    }

    async function run() {
      closeOrderQDb();
      await deleteDatabase();
      await openOrderQDb();
      localStorage.clear();
      await seedMaster();

      const frame = await loadFrame();
      const document = frame.contentDocument;
      document.querySelector('#quickItemName').value = '현장 배추';
      document.querySelector('#quickItemCode').value = 'TMP-CODE';
      document.querySelector('#quickSpecification').value = '8kg';
      document.querySelector('#quickUnit').value = 'BOX';
      document.querySelector('#quickBoxQuantity').value = '0';
      document.querySelector('#quickMemo').value = '출고 전 임시 등록';
      document.querySelector('#createForm').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      await waitUntil(() => document.querySelector('[data-testid="quick-product-detail"]'), 'quick product UI did not create a product');

      const temporary = (await readAll(STORE.PRODUCTS)).find(product => product.productIdentityType === 'TEMPORARY');
      assert(temporary && temporary.productId.startsWith('TMP-'), 'temporary product did not receive TMP- identity');
      assert(temporary.productId !== 'PRD-100', 'temporary identity collided with formal product identity');
      assert(temporary.registrationStatus === 'UNLINKED' && temporary.boxQuantity === 0, 'temporary product did not preserve unlinked state or numeric zero');
      assert(document.querySelector('[data-testid="quick-product-detail"]').dataset.productId === temporary.productId, 'UI did not focus the created temporary product');

      await seedHistoricalFacts(temporary.productId);
      const beforeFacts = await factSnapshot(temporary.productId);
      const beforeCatalog = await loadProductCatalog();
      assert(beforeCatalog.products.some(product => product.productId === temporary.productId), 'unlinked temporary product was not searchable');

      let capabilityError = '';
      try {
        await linkQuickProductToMaster({
          quickProductId: temporary.productId, expectedRevision: temporary.revision,
          masterProduct: { productId: 'PRD-100', itemCode: '100', itemName: '정식 배추' }, reason: '권한 테스트'
        }, { actorId: 'CLERK', capabilities: [] });
      } catch (error) { capabilityError = error.message; }
      assert(capabilityError.includes('CAPABILITY_REQUIRED:MASTER_LINK'), 'master link bypassed capability boundary');

      const masterQuery = document.querySelector('#masterQuery');
      masterQuery.value = '100';
      masterQuery.dispatchEvent(new Event('input', { bubbles: true }));
      await waitUntil(() => document.querySelector('[data-master-id="PRD-100"]'), 'formal master search result did not render');
      document.querySelector('[data-master-id="PRD-100"]').click();
      document.querySelector('#linkReason').value = '관리자 상품 확인';
      document.querySelector('[data-action="link"]').click();
      await waitUntil(() => document.querySelector('[data-testid="quick-product-detail"] .product-status')?.textContent.trim() === 'LINKED', 'UI master link did not complete');

      const linked = await loadQuickProduct(temporary.productId);
      assert(linked.product.masterProductId === 'PRD-100' && linked.product.linkedBy === 'ADMIN', 'link actor/master evidence is incorrect');
      assert(linked.events.length === 2 && linked.events[1].reason === '관리자 상품 확인' && linked.events[1].createdAt, 'append-only link history is incomplete');
      assert(await factSnapshot(temporary.productId) === beforeFacts, 'master link rewrote an existing order/dispatch/purchase fact');
      const linkedCatalog = await loadProductCatalog();
      assert(!linkedCatalog.products.some(product => product.productId === temporary.productId), 'linked temporary product remained selectable');
      assert(linkedCatalog.products.some(product => product.productId === 'PRD-100'), 'formal master disappeared after link');

      let alreadyLinkedError = '';
      try {
        await linkQuickProductToMaster({
          quickProductId: temporary.productId, expectedRevision: linked.product.revision,
          masterProduct: { productId: 'PRD-100', itemCode: '100', itemName: '정식 배추' }, reason: '중복 연결'
        }, 'ADMIN');
      } catch (error) { alreadyLinkedError = error.message; }
      assert(alreadyLinkedError.includes('ALREADY_LINKED'), 'linked temporary product accepted another link without explicit unlink');

      let staleError = '';
      try {
        await linkQuickProductToMaster({
          quickProductId: temporary.productId, expectedRevision: temporary.revision,
          masterProduct: { productId: 'PRD-100', itemCode: '100', itemName: '정식 배추' }, reason: 'stale retry'
        }, 'ADMIN');
      } catch (error) { staleError = error.message; }
      assert(staleError.includes('REVISION_CONFLICT'), 'stale master link revision was accepted');
      assert((await loadQuickProduct(temporary.productId)).events.length === 2, 'stale command appended history');

      document.querySelector('#unlinkReason').value = '마스터 재확인 필요';
      document.querySelector('[data-action="unlink"]').click();
      await waitUntil(() => document.querySelector('[data-testid="quick-product-detail"] .product-status')?.textContent.trim() === 'UNLINKED', 'UI master unlink did not complete');

      const unlinked = await loadQuickProduct(temporary.productId);
      assert(unlinked.product.masterProductId === '' && unlinked.product.unlinkedBy === 'ADMIN', 'unlink evidence is incorrect');
      assert(unlinked.events.length === 3, 'link/unlink history was overwritten instead of appended');
      assert(unlinked.events.map(event => event.eventType).join('|') === 'QUICK_PRODUCT_CREATED|QUICK_PRODUCT_MASTER_LINKED|QUICK_PRODUCT_MASTER_UNLINKED', 'history sequence is incorrect');
      assert(unlinked.events.every(event => event.actorId && event.createdAt && event.reason), 'history actor/time/reason evidence is incomplete');
      assert(await factSnapshot(temporary.productId) === beforeFacts, 'master unlink rewrote an existing order/dispatch/purchase fact');
      const unlinkedCatalog = await loadProductCatalog();
      assert(unlinkedCatalog.products.some(product => product.productId === temporary.productId), 'unlinked temporary product did not return to search');

      const syncRows = await readAll(STORE.SYNC_QUEUE);
      const syncState = await getSyncState();
      assert(syncRows.length === 6 && syncRows.every(row => row.localOnly === true && row.status === 'LOCAL_ONLY'), 'M7 wrote a cloud-sendable sync row');
      assert(syncState.pending === 0 && syncState.conflicts.length === 0, 'M7 local rows entered Cloud pending/conflict state');
      assert((await readAll(STORE.MAPPING_EVENTS)).length === 3, 'mapping history row count is incorrect');
      assert((await readAll(STORE.PRODUCTS)).some(product => product.productId === 'PRD-100'), 'formal product record was overwritten');
      assert(consoleWarnings.length === 0 && consoleErrors.length === 0, `console messages: ${[...consoleWarnings, ...consoleErrors].join(' | ')}`);

      const result = {
        status: 'PASS', temporaryProductId: temporary.productId, formalProductId: 'PRD-100',
        events: unlinked.events.map(event => ({ type: event.eventType, actor: event.actorId, reason: event.reason })),
        existingFactsUnchanged: true, linkedTemporaryHiddenFromSelection: true,
        localOnlyRows: syncRows.length, pending: syncState.pending, consoleWarnings, consoleErrors
      };
      window.__ORDERQ_M7_RESULT__ = result;
      output.textContent = JSON.stringify(result, null, 2);
    }

    run().catch(error => {
      const result = { status: 'FAIL', message: error.message, stack: error.stack, consoleWarnings, consoleErrors };
      window.__ORDERQ_M7_RESULT__ = result;
      output.textContent = JSON.stringify(result, null, 2);
      console.error(error);
    });
  </script>
</body>
</html>
