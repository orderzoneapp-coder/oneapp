<!doctype html><html><meta charset="utf-8"><title>ORDER Q M9 isolated client</title><body><pre id="result">BOOTING</pre><script type="module">
  const params = new URLSearchParams(location.search);
  const clientId = params.get('client') || 'X';
  const databaseName = params.get('orderqTestDb') || `oneapp-orderq-m9-gateway-${clientId}`;
  localStorage.setItem('oneapp_cloud_sync_url_v1', 'https://orderq-m9.test/central');
  localStorage.setItem('oneapp.orderq.device-id.v1', `M9-DEVICE-${clientId}`);
  window.fetch = async (_url, options = {}) => {
    const body = JSON.parse(String(options.body || '{}'));
    const response = await parent.m9CentralMockRequest(body);
    return new Response(JSON.stringify(response), { status:200, headers:{ 'Content-Type':'application/json' } });
  };

  const { STORE, openOrderQDb, requestToPromise, transactionDone } = await import('../orderq/orderq-db.js?v=0.9.0');
  const { runCentralOfficialCommand, pullCentralOfficialState } = await import('../orderq/central-command-gateway.js?v=0.9.0');

  const clone = value => JSON.parse(JSON.stringify(value));
  async function writeRows(rowsByStore, clear = false) {
    const db = await openOrderQDb();
    if (clear) {
      const clearStores = [...db.objectStoreNames];
      const clearTx = db.transaction(clearStores, 'readwrite');
      clearStores.forEach(name => clearTx.objectStore(name).clear());
      await transactionDone(clearTx);
      for (const [storeName, rows] of Object.entries(rowsByStore)) {
        try { await writeRows({ [storeName]:rows }); }
        catch (error) { throw new Error(`SEED_STORE_FAILED:${storeName}:${error.message}`); }
      }
      return;
    }
    const stores = Object.keys(rowsByStore);
    const tx = db.transaction(stores, 'readwrite');
    let failedWrite = '';
    Object.entries(rowsByStore).forEach(([storeName, rows]) => rows.forEach(row => {
      const request = tx.objectStore(storeName).put(clone(row));
      request.onerror = () => { failedWrite = `${storeName}:${request.error?.name || 'UNKNOWN'}:${request.error?.message || ''}`; };
    }));
    try { await transactionDone(tx); }
    catch (error) { throw new Error(`WRITE_ROWS_FAILED:${failedWrite || stores.join(',')}:${error.message}`); }
  }

  function aggregateFixture(dispatchId, suffix, quantity) {
    return {
      decision:{ dispatchId, status:'DRAFT', revision:1, customerId:'GW-C', businessDate:'2026-08-15', localOnly:true },
      line:{ dispatchLineId:`GW-DL-${suffix}`, dispatchId, orderId:'GW-O', orderItemId:`GW-OI-${suffix}`, actualProductId:'GW-P', plannedActualQuantity:quantity, plannedBaseQuantity:quantity, plannedRecognizedOrderQuantity:quantity, localOnly:true },
      allocation:{ allocationId:`GW-DA-${suffix}`, dispatchId, dispatchLineId:`GW-DL-${suffix}`, warehouseId:'GW-W', plannedBaseQuantity:quantity, localOnly:true }
    };
  }

  function aggregateParts(dispatchId) {
    if (dispatchId === 'GW-D3') return [{ suffix:'3A', quantity:5 }, { suffix:'3B', quantity:5 }];
    if (dispatchId === 'GW-D2') return [{ suffix:'2', quantity:2 }];
    if (dispatchId === 'GW-D4') return [{ suffix:'4', quantity:4 }];
    return [{ suffix:'1', quantity:6 }];
  }

  async function seed() {
    const first = aggregateFixture('GW-D1', '1', 6);
    const second = aggregateFixture('GW-D2', '2', 2);
    const thirdParts = aggregateParts('GW-D3').map(part => aggregateFixture('GW-D3', part.suffix, part.quantity));
    const fourth = aggregateFixture('GW-D4', '4', 4);
    await writeRows({
      [STORE.ORDERS]:[{ orderId:'GW-O', revision:1, localOnly:true }],
      [STORE.ORDER_ITEMS]:[
        { orderItemId:'GW-OI-1', orderId:'GW-O', productId:'GW-P', finalQuantity:6, revision:1, localOnly:true },
        { orderItemId:'GW-OI-2', orderId:'GW-O', productId:'GW-P', finalQuantity:2, revision:1, localOnly:true },
        ...thirdParts.map(part => ({ orderItemId:part.line.orderItemId, orderId:'GW-O', productId:'GW-P', finalQuantity:part.line.plannedRecognizedOrderQuantity, revision:1, localOnly:true })),
        { orderItemId:'GW-OI-4', orderId:'GW-O', productId:'GW-P', finalQuantity:4, revision:1, localOnly:true }
      ],
      [STORE.PRODUCTS]:[{ productId:'GW-P', revision:1, localOnly:true }],
      [STORE.WAREHOUSES]:[{ warehouseId:'GW-W', revision:1, status:'ACTIVE', localOnly:true }],
      [STORE.INVENTORY_SNAPSHOTS]:[{ inventorySnapshotId:'GW-IS', importBatchId:'GW-IB', basisDate:'2026-08-15', snapshotLastSequence:0, status:'ACTIVE', localOnly:true }],
      [STORE.INVENTORY_LINES]:[{ inventoryLineId:'GW-IL', inventorySnapshotId:'GW-IS', productId:'GW-P', warehouseId:'GW-W', inventoryQuantity:20, status:'ACTIVE', localOnly:true }],
      [STORE.DISPATCH_DECISIONS]:[first.decision, second.decision, thirdParts[0].decision, fourth.decision],
      [STORE.DISPATCH_LINES]:[first.line, second.line, ...thirdParts.map(part => part.line), fourth.line],
      [STORE.DISPATCH_STOCK_ALLOCATIONS]:[first.allocation, second.allocation, ...thirdParts.map(part => part.allocation), fourth.allocation]
    }, true);
    return dump();
  }

  async function gatewayRelease(input) {
    const parts = aggregateParts(input.dispatchId);
    return runCentralOfficialCommand({
      commandType:'RELEASE_DISPATCH', aggregateId:input.dispatchId, expectedRevision:1,
      idempotencyKey:input.idempotencyKey
    }, async () => {
      await writeRows({
        [STORE.DISPATCH_DECISIONS]:[{ dispatchId:input.dispatchId, status:'RELEASED', revision:2, customerId:'GW-C', businessDate:'2026-08-15', localOnly:true }],
        [STORE.INVENTORY_RESERVATIONS]:parts.map(({ suffix, quantity }) => ({ reservationId:`GW-IR-${suffix}`, dispatchId:input.dispatchId, allocationId:`GW-DA-${suffix}`, productId:'GW-P', warehouseId:'GW-W', reservedBaseQuantity:quantity, status:'ACTIVE', revision:2, localOnly:true }))
      });
      return { localCommand:'RELEASE', dispatchId:input.dispatchId };
    });
  }

  async function gatewayUpdate(input) {
    const parts = aggregateParts(input.dispatchId);
    return runCentralOfficialCommand({ commandType:'UPDATE_DISPATCH', aggregateId:input.dispatchId, expectedRevision:2, idempotencyKey:input.idempotencyKey }, async () => {
      await writeRows({
        [STORE.DISPATCH_DECISIONS]:[{ dispatchId:input.dispatchId, status:'READY_TO_CONFIRM', revision:3, customerId:'GW-C', businessDate:'2026-08-15', localOnly:true }],
        [STORE.DISPATCH_LINES]:parts.map(({ suffix, quantity }) => ({ dispatchLineId:`GW-DL-${suffix}`, dispatchId:input.dispatchId, orderId:'GW-O', orderItemId:`GW-OI-${suffix}`, actualProductId:'GW-P', actualQuantity:quantity, actualBaseQuantity:quantity, recognizedOrderQuantity:quantity, status:'ACTUAL_RECORDED', revision:3, localOnly:true })),
        [STORE.DISPATCH_STOCK_ALLOCATIONS]:parts.map(({ suffix, quantity }) => ({ allocationId:`GW-DA-${suffix}`, dispatchId:input.dispatchId, dispatchLineId:`GW-DL-${suffix}`, warehouseId:'GW-W', reservationId:`GW-IR-${suffix}`, actualBaseQuantity:quantity, status:'ACTUAL_RECORDED', revision:3, localOnly:true }))
      });
      return { localCommand:'UPDATE', dispatchId:input.dispatchId };
    });
  }

  async function gatewayConfirm(input) {
    const allParts = aggregateParts(input.dispatchId);
    const parts = input.partial ? allParts.slice(0, 1) : allParts;
    return runCentralOfficialCommand({ commandType:'CONFIRM_DISPATCH', aggregateId:input.dispatchId, expectedRevision:3, idempotencyKey:input.idempotencyKey }, async () => {
      const documentSuffix = input.dispatchId.replace('GW-D', '');
      const salesDocumentId = `GW-SD-${documentSuffix}`;
      await writeRows({
        [STORE.DISPATCH_DECISIONS]:[{ dispatchId:input.dispatchId, status:'CONFIRMED', revision:4, salesDocumentId, localOnly:true }],
        [STORE.DISPATCH_LINES]:parts.map(({ suffix, quantity }) => ({ dispatchLineId:`GW-DL-${suffix}`, dispatchId:input.dispatchId, orderId:'GW-O', orderItemId:`GW-OI-${suffix}`, actualProductId:'GW-P', actualQuantity:quantity, actualBaseQuantity:quantity, recognizedOrderQuantity:quantity, status:'CONFIRMED', revision:4, localOnly:true })),
        [STORE.DISPATCH_STOCK_ALLOCATIONS]:parts.map(({ suffix, quantity }) => ({ allocationId:`GW-DA-${suffix}`, dispatchId:input.dispatchId, dispatchLineId:`GW-DL-${suffix}`, warehouseId:'GW-W', reservationId:`GW-IR-${suffix}`, actualBaseQuantity:quantity, movementId:`GW-IM-${suffix}`, status:'CONFIRMED', revision:4, localOnly:true })),
        [STORE.SALES_DOCUMENTS]:[{ salesDocumentId, dispatchId:input.dispatchId, status:'CONFIRMED', erpPostingStatus:'READY', supplyAmountWon:0, vatAmountWon:0, totalAmountWon:0, revision:4, localOnly:true }],
        [STORE.SALES_LINES]:parts.map(({ suffix, quantity }) => ({ salesLineId:`GW-SL-${suffix}`, salesDocumentId, dispatchLineId:`GW-DL-${suffix}`, orderItemId:`GW-OI-${suffix}`, productId:'GW-P', warehouseId:'GW-W', actualQuantity:quantity, actualBaseQuantity:quantity, recognizedOrderQuantity:quantity, supplyAmountWon:0, vatAmountWon:0, totalAmountWon:0, revision:4, localOnly:true })),
        [STORE.INVENTORY_MOVEMENTS]:parts.map(({ suffix, quantity }, index) => ({ movementId:`GW-IM-${suffix}`, dispatchId:input.dispatchId, dispatchLineId:`GW-DL-${suffix}`, sourceLineId:`GW-DA-${suffix}`, productId:'GW-P', warehouseId:'GW-W', movementType:'SALE_ISSUE', signedBaseQuantity:-quantity, ledgerSequence:990 + (Number(documentSuffix) * 10) + index, revision:4, localOnly:true })),
        [STORE.ORDER_EVENTS]:parts.map(({ suffix, quantity }) => ({ eventId:`GW-OE-${suffix}`, orderId:'GW-O', eventType:'SALES_TRANSFER_ALLOCATED', detail:{ orderItemId:`GW-OI-${suffix}`, salesLineId:`GW-SL-${suffix}`, transferredQty:quantity }, revision:4, localOnly:true })),
        [STORE.INVENTORY_RESERVATIONS]:parts.map(({ suffix, quantity }) => ({ reservationId:`GW-IR-${suffix}`, dispatchId:input.dispatchId, allocationId:`GW-DA-${suffix}`, productId:'GW-P', warehouseId:'GW-W', reservedBaseQuantity:quantity, consumedBaseQuantity:quantity, status:'CONSUMED', revision:4, localOnly:true }))
      });
      return { localCommand:'CONFIRM', dispatchId:input.dispatchId };
    });
  }

  async function dump() {
    const db = await openOrderQDb();
    const stores = [STORE.DISPATCH_DECISIONS, STORE.DISPATCH_LINES, STORE.DISPATCH_STOCK_ALLOCATIONS, STORE.INVENTORY_RESERVATIONS, STORE.SALES_DOCUMENTS, STORE.SALES_LINES, STORE.INVENTORY_MOVEMENTS, STORE.ORDER_EVENTS, STORE.META];
    const tx = db.transaction(stores, 'readonly');
    const result = {};
    for (const storeName of stores) result[storeName] = await requestToPromise(tx.objectStore(storeName).getAll());
    await transactionDone(tx);
    Object.values(result).forEach(rows => rows.sort((left, right) => JSON.stringify(left).localeCompare(JSON.stringify(right))));
    return { clientId, databaseName, stores:result };
  }

  async function offlineAttempt() {
    const before = JSON.stringify(await dump());
    const saved = localStorage.getItem('oneapp_cloud_sync_url_v1');
    localStorage.removeItem('oneapp_cloud_sync_url_v1');
    let error = ''; let operationRan = false;
    try {
      await runCentralOfficialCommand({ commandType:'CONFIRM_DISPATCH', aggregateId:'GW-OFFLINE', expectedRevision:1, idempotencyKey:'GW-OFFLINE' }, async () => { operationRan = true; });
    } catch (caught) { error = caught.message; }
    if (saved !== null) localStorage.setItem('oneapp_cloud_sync_url_v1', saved);
    return { error, operationRan, unchanged:JSON.stringify(await dump()) === before };
  }

  const actions = { seed, dump, pull:pullCentralOfficialState, release:gatewayRelease, update:gatewayUpdate, confirm:gatewayConfirm, partialConfirm:message => gatewayConfirm({ ...message, partial:true }), offline:offlineAttempt };
  window.addEventListener('message', async event => {
    const message = event.data || {};
    if (message.type !== 'M9_CLIENT_REQUEST') return;
    try {
      const handler = actions[message.action] || dump;
      const value = await handler(message);
      event.source.postMessage({ type:'M9_CLIENT_RESPONSE', requestId:message.requestId, ok:true, value }, '*');
    } catch (error) {
      event.source.postMessage({ type:'M9_CLIENT_RESPONSE', requestId:message.requestId, ok:false, error:`${message.action}:${error.message || String(error)}` }, '*');
    }
  });
  document.querySelector('#result').textContent=`READY ${databaseName}`;
  parent.postMessage({ type:'M9_CLIENT_READY', clientId, databaseName }, '*');
</script></body></html>
