<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>NEXUS workspace fixture</title>
  <script src="/nexus/common/nexus-ui-theme-init.js?v=1.2.0"></script>
  <script defer src="/nexus/common/nexus-ui.js?v=1.7.0"></script>
</head>
<body>
  <main id="fixtureApp">fixture</main>
  <script>
    (() => {
      'use strict';
      const schemaVersion = 'nexus-workspace-message/v1';
      const pathToApp = {
        '/Master.html': 'master-lookup',
        '/customer-master/index.html': 'customer-master',
        '/smartinput/index.html': 'smart-input',
        '/SmartParser.html': 'smart-parser',
        '/MerchOps.html': 'merchops',
        '/orderops/list.html': 'orderops',
        '/DataOps.html': 'dataops',
      };
      const appId = pathToApp[location.pathname] || '';
      const bootCount = Number(sessionStorage.getItem('nexusWorkspaceFixtureBootCount') || 0) + 1;
      sessionStorage.setItem('nexusWorkspaceFixtureBootCount', String(bootCount));
      let transitionId = '';
      window.fixtureState = { appId, bootCount, hostReadyCount: 0, leaveResult: 'READY', leaveDelay: 0, printCount: 0, themeCount: 0 };

      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        const data = event.data;
        if (!data || data.schemaVersion !== schemaVersion || data.appId !== appId) return;
        if (data.type === 'NEXUS_WORKSPACE_HOST_READY_V1') {
          transitionId = data.transitionId;
          window.fixtureState.hostReadyCount += 1;
        }
      });

      window.addEventListener('nexus-ui:theme-change', () => { window.fixtureState.themeCount += 1; });

      const connect = () => {
        const bridge = window.ONEAPP_NEXUS_WORKSPACE_CHILD;
        if (!bridge?.registerAdapter) return false;
        bridge.registerAdapter({
          beforeLeave: () => new Promise((resolve) => setTimeout(() => {
            const result = window.fixtureState.leaveResult;
            resolve({ result, message: result === 'READY' ? '' : 'fixture blocked the transition' });
          }, window.fixtureState.leaveDelay)),
          print: () => { window.fixtureState.printCount += 1; },
        });
        const readyTimer = setInterval(() => {
          if (!bridge.connected) return;
          clearInterval(readyTimer);
          document.documentElement.dataset.fixtureReady = 'true';
        }, 10);
        return true;
      };
      if (!connect()) window.addEventListener('nexus-ui:ready', connect, { once: true });

      window.fixtureRouteChanged = (route, overrideTransitionId = transitionId) => parent.postMessage({
        schemaVersion,
        type: 'NEXUS_WORKSPACE_ROUTE_CHANGED_V1',
        transitionId: overrideTransitionId,
        appId,
        route,
      }, location.origin);
    })();
  </script>
</body>
</html>
