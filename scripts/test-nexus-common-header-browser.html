<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS common header browser fixture</title>
  <script src="/nexus/common/nexus-theme-init.js"></script>
  <script src="/nexus/common/apps-config.js"></script>
  <script src="/nexus/common/nexus-top.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--nexus-text, #172033); background: var(--nexus-page-bg, #f4f7fb); font: 14px system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 24px auto; display: grid; gap: 12px; }
    .state-panel { padding: 18px; display: grid; gap: 12px; border: 1px solid var(--nexus-border, #dbe3ec); border-radius: 12px; background: var(--nexus-panel-bg, #fff); }
    input { height: 40px; padding: 0 10px; border: 1px solid var(--nexus-border, #dbe3ec); border-radius: 8px; color: inherit; background: var(--nexus-input-bg, #fff); }
    .scroll-box { height: 72px; overflow: auto; border: 1px solid var(--nexus-border, #dbe3ec); }
    .scroll-content { height: 240px; padding: 8px; }
  </style>
  <link rel="stylesheet" href="/nexus/common/oneapp-design-tokens.css">
</head>
<body>
  <nexus-top app-id="orderq"><div role="status">NEXUS 메뉴 준비 중</div></nexus-top>
  <main>
    <h1>공통헤더 검증 fixture</h1>
    <section class="state-panel">
      <label>검색 <input id="search" value="상태 보존 검색어"></label>
      <label><input id="selected" type="checkbox" checked> 선택 상태</label>
      <div id="scroll" class="scroll-box"><div class="scroll-content">스크롤 상태 보존</div></div>
    </section>
  </main>
  <script>
    document.getElementById('scroll').scrollTop = 64;
  </script>
</body>
</html>
