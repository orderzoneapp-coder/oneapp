<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>ORDER Q M6 Browser Test</title>
<body>
  <h1>ORDER Q M6 Browser Test</h1>
  <pre id="result">RUNNING</pre>
  <script type="module">
    import { DB_NAME, STORE, closeOrderQDb, openOrderQDb, requestToPromise, transactionDone } from '../orderq/orderq-db.js?v=0.8.0';
    import { CAPABILITY } from '../orderq/orderq-v7-contracts.js?v=0.8.0';
    import { getInventoryShadowProjection } from '../orderq/inventory-ledger-repository.js?v=0.8.0';
    import {
      PURCHASE_CONFIRMATION_STEP,
      buildPurchaseConfirmationKey,
      buildPurchaseReversalKey
    } from '../orderq/purchase-decision.js?v=0.8.0';
    import {
      confirmPurchase,
      createPurchaseDraftFromShortage,
      loadPurchaseAggregate,
      reconcilePurchaseExternal,
      reversePurchase,
      savePurchaseDraft
    } from '../orderq/purchase-decision-repository.js?v=0.8.0';

    const output = document.querySelector('#result');
    const consoleWarnings = [];
    const consoleErrors = [];
    const originalWarn = console.warn.bind(console);
    const originalError = console.error.bind(console);
    console.warn = (...args) => { consoleWarnings.push(args.map(String).join(' ')); originalWarn(...args); };
    console.error = (...args) => { consoleErrors.push(args.map(String).join(' ')); originalError(...args); };
    window.addEventListener('error', event => consoleErrors.push(event.error?.stack || event.message || 'window error'));
    window.addEventListener('unhandledrejection', event => consoleErrors.push(event.reason?.stack || String(event.reason)));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    const waitUntil = async (predicate, message, attempts = 60) => {
      for (let index = 0; index < attempts; index += 1) {
        if (await predicate()) return;
        await delay(100);
      }
      throw new Error(message);
    };
    const deleteDatabase = () => new Promise((resolve, reject) => {
      const request = indexedDB.deleteDatabase(DB_NAME);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('test database delete blocked'));
    });
    const readAll = async storeName => {
      const db = await openOrderQDb();
      const tx = db.transaction(storeName, 'readonly');
      const rows = await requestToPromise(tx.objectStore(storeName).getAll());
      await transactionDone(tx);
      return rows;
    };
    const counts = async () => Object.fromEntries(await Promise.all([
      STORE.PURCHASE_DOCUMENTS, STORE.PURCHASE_LINES, STORE.INVENTORY_MOVEMENTS,
      STORE.SALES_DOCUMENTS, STORE.SALES_LINES, STORE.ORDER_EVENTS,
      STORE.DISPATCH_RECONCILIATIONS, STORE.SYNC_QUEUE
    ].map(async name => [name, (await readAll(name)).length])));

    async function seed() {
      const db = await openOrderQDb();
      const stores = [
        STORE.PRODUCTS, STORE.WAREHOUSES, STORE.ORDERS, STORE.ORDER_ITEMS,
        STORE.DISPATCH_DECISIONS, STORE.DISPATCH_LINES,
        STORE.INVENTORY_SNAPSHOTS, STORE.INVENTORY_LINES, STORE.INVENTORY_MOVEMENTS, STORE.META
      ];
      const tx = db.transaction(stores, 'readwrite');
      tx.objectStore(STORE.PRODUCTS).put({ productId: 'P-1', itemCode: 'P001', itemName: '구매상품', normalizedName: '구매상품', status: 'ACTIVE' });
      tx.objectStore(STORE.WAREHOUSES).put({ warehouseId: 'W-1', warehouseCode: '10', warehouseName: '입고재고구분', normalizedName: '입고재고구분', countsInOnHand: true, countsInAvailable: true, status: 'ACTIVE' });
      tx.objectStore(STORE.ORDERS).put({ orderId: 'O-1', orderNo: 'O-1', customerId: 'C-1', customerName: '고객', orderDate: '2026-08-15', orderStatus: 'ORDER', adminStatus: 'CHECKED', opsStatus: 'ACTIVE', revision: 1 });
      tx.objectStore(STORE.ORDER_ITEMS).put({ orderItemId: 'OI-1', orderId: 'O-1', productId: 'P-1', itemCode: 'P001', itemName: '구매상품', finalQuantity: 10, finalUnit: 'BOX', price: 1000, matchStatus: 'MATCHED' });
      tx.objectStore(STORE.DISPATCH_DECISIONS).put({ dispatchId: 'D-SHORT', dispatchNo: 'D-SHORT', status: 'DRAFT', revision: 1, sourceOrderIds: ['O-1'], createdAt: '2026-08-15T00:00:00.000Z', updatedAt: '2026-08-15T00:00:00.000Z' });
      tx.objectStore(STORE.DISPATCH_LINES).put({
        dispatchLineId: 'DL-SHORT', dispatchId: 'D-SHORT', orderId: 'O-1', orderItemId: 'OI-1',
        requestedProductId: 'P-1', actualProductId: 'P-1', plannedActualQuantity: 10,
        plannedBaseQuantity: 5, plannedRecognizedOrderQuantity: 10,
        workerExceptionCode: 'QUANTITY_SHORT', workerExceptionMemo: '재고 부족', status: 'DRAFT'
      });
      tx.objectStore(STORE.INVENTORY_SNAPSHOTS).put({ inventorySnapshotId: 'IS-1', importBatchId: 'B-1', basisDate: '2026-08-12', warehouseId: 'W-1', snapshotLastSequence: 5, status: 'ACTIVE', createdAt: '2026-08-12T00:00:00.000Z' });
      tx.objectStore(STORE.INVENTORY_LINES).put({ inventoryLineId: 'IL-1', inventorySnapshotId: 'IS-1', importBatchId: 'B-1', productId: 'P-1', productCode: 'P001', warehouseId: 'W-1', inventoryQuantity: 2, status: 'ACTIVE' });
      tx.objectStore(STORE.INVENTORY_MOVEMENTS).put({
        movementId: 'IM-BASE-5', ledgerSequence: 5, productId: 'P-1', productCode: 'P001', warehouseId: 'W-1',
        signedBaseQuantity: 2, baseUnit: 'KG', movementType: 'PURCHASE_RECEIPT',
        sourceDocumentType: 'LEGACY_BASE', sourceDocumentId: 'BASE', sourceLineId: 'BASE',
        occurredAt: '2026-08-11T09:00:00+09:00', postedAt: '2026-08-12T00:00:00.000Z', idempotencyKey: 'BASE-5'
      });
      tx.objectStore(STORE.META).put({ key: 'inventoryLedgerSequence', value: 5, updatedAt: '2026-08-12T00:00:00.000Z', updatedBy: 'ADMIN' });
      await transactionDone(tx);
    }

    async function run() {
      closeOrderQDb();
      await deleteDatabase();
      await openOrderQDb();
      localStorage.clear();
      await seed();

      const baseline = await counts();
      let draft = await createPurchaseDraftFromShortage({
        sourceShortageKey: 'SHORT:D-SHORT:DL-SHORT:5', sourceShortageQuantity: 5,
        sourceDispatchId: 'D-SHORT', sourceDispatchLineId: 'DL-SHORT', sourceOrderItemId: 'OI-1',
        productId: 'P-1', productCode: 'P001', productName: '구매상품',
        warehouseId: 'W-1', warehouseCode: '10', warehouseName: '입고재고구분',
        shortageQuantity: 10, quantity: 10, unit: 'BOX', baseQuantity: 5, baseUnit: 'KG', unitCostWon: 100,
        supplierId: 'S-1', supplierName: '공급처', businessDate: '2026-08-15',
        actualTransactionAt: '2026-08-10T09:00:00+09:00', backdateReason: '누락 구매 소급입력'
      }, 'ADMIN');
      const purchaseDocumentId = draft.document.purchaseDocumentId;
      const purchaseLineId = draft.lines[0].purchaseLineId;
      draft = await savePurchaseDraft({
        document: {
          ...draft.document,
          idempotencyKey: 'FAKE-CONFIRM', confirmationRequestFingerprint: 'FAKE', reversalOf: 'PD-REAL',
          confirmedAt: '2026-08-15T00:00:00.000Z', confirmedBy: 'FAKE', postedAt: '2026-08-15T00:00:00.000Z',
          erpDocumentNo: 'FAKE-ERP', erpReconciliationId: 'FAKE-RECONCILIATION', history: [{ eventType: 'FAKE' }]
        },
        lines: [{
          ...draft.lines[0],
          movementId: 'IM-FAKE', reversalOf: 'PL-REAL', confirmedAt: '2026-08-15T00:00:00.000Z',
          confirmedBy: 'FAKE', reversedAt: '2026-08-15T00:00:00.000Z', reversedBy: 'FAKE',
          reversalRequestFingerprint: 'FAKE', externalReconciliationId: 'FAKE'
        }],
        expectedRevision: draft.document.revision
      }, 'ADMIN');
      const storedDraft = await loadPurchaseAggregate(purchaseDocumentId);
      for (const field of ['idempotencyKey', 'confirmationRequestFingerprint', 'reversalOf', 'confirmedAt', 'confirmedBy', 'postedAt', 'erpDocumentNo', 'erpReconciliationId']) {
        assert(!Object.hasOwn(storedDraft.document, field), `purchase DRAFT document retained system field ${field}`);
      }
      assert(storedDraft.document.history.every(event => event.eventType === 'PURCHASE_DRAFT_SAVED'),
        'purchase DRAFT retained injected history evidence');
      for (const field of ['movementId', 'reversalOf', 'confirmedAt', 'confirmedBy', 'reversedAt', 'reversedBy', 'reversalRequestFingerprint', 'externalReconciliationId']) {
        assert(!Object.hasOwn(storedDraft.lines[0], field), `purchase DRAFT line retained system field ${field}`);
      }
      const afterDraft = await counts();
      assert(afterDraft.inventoryMovements === baseline.inventoryMovements, 'purchase DRAFT changed inventory');
      assert(afterDraft.salesDocuments === 0 && afterDraft.salesLines === 0 && afterDraft.orderEvents === 0, 'purchase DRAFT changed sales/order fulfillment');
      assert(draft.document.sourceShortageKey === 'SHORT:D-SHORT:DL-SHORT:5' && draft.lines[0].sourceDispatchLineId === 'DL-SHORT', 'shortage evidence was not preserved');

      const frame = document.createElement('iframe');
      frame.style.width = '1300px';
      frame.style.height = '700px';
      document.body.append(frame);
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error('M6 purchase UI iframe load failed'));
        frame.src = `../orderq/purchase.html?focus=${encodeURIComponent(purchaseDocumentId)}&m6-browser=${Date.now()}`;
      });
      await waitUntil(() => frame.contentDocument.querySelector(`[data-select="${purchaseDocumentId}"]`), 'purchase DRAFT did not render in workbench');
      frame.contentDocument.querySelector(`[data-select="${purchaseDocumentId}"]`).click();
      await waitUntil(() => frame.contentDocument.querySelector('[data-action="confirm"]'), 'purchase DRAFT confirmation action did not render');
      assert(frame.contentDocument.querySelector('#sourceShortageKey').value === 'SHORT:D-SHORT:DL-SHORT:5'
        && frame.contentDocument.querySelector('.line-dispatch-line').value === 'DL-SHORT',
      'purchase workbench did not show shortage evidence');
      assert(frame.contentDocument.body.textContent.includes('출고확정과 구매확정은 독립'), 'purchase workbench did not show independent confirmation boundary');
      frame.remove();

      let duplicateShortage = '';
      try {
        await createPurchaseDraftFromShortage({
          sourceShortageKey: 'SHORT:D-SHORT:DL-SHORT:5', sourceShortageQuantity: 5,
          sourceDispatchLineId: 'DL-SHORT', sourceOrderItemId: 'OI-1', productId: 'P-1', warehouseId: 'W-1',
          shortageQuantity: 5, quantity: 5, baseQuantity: 5, supplierName: '다른 공급처', businessDate: '2026-08-15'
        }, 'ADMIN');
      } catch (error) { duplicateShortage = error.message; }
      assert(duplicateShortage.includes('SHORTAGE_ALREADY_LINKED'), 'same shortage created a second active purchase DRAFT');

      const confirmCommand = {
        purchaseDocumentId,
        expectedRevision: draft.document.revision,
        idempotencyKey: buildPurchaseConfirmationKey(purchaseDocumentId, draft.document.revision)
      };
      let backdateCapability = '';
      try { await confirmPurchase(confirmCommand, { actorId: 'BUYER', capabilities: [CAPABILITY.PURCHASE_CONFIRM] }); }
      catch (error) { backdateCapability = error.message; }
      assert(backdateCapability.includes('CAPABILITY_REQUIRED:BACKDATE_POST'), 'backdated purchase bypassed capability boundary');
      assert(JSON.stringify(await counts()) === JSON.stringify(afterDraft), 'rejected backdated purchase changed a store');

      let confirmFailure = '';
      try { await confirmPurchase(confirmCommand, 'ADMIN', { failureAt: PURCHASE_CONFIRMATION_STEP.MOVEMENTS_WRITTEN }); }
      catch (error) { confirmFailure = error.message; }
      assert(confirmFailure.includes('PURCHASE_FAILURE_INJECTED:MOVEMENTS_WRITTEN'), 'purchase confirmation failure was not injected');
      assert(JSON.stringify(await counts()) === JSON.stringify(afterDraft), 'failed purchase confirmation partially committed');
      assert((await loadPurchaseAggregate(purchaseDocumentId)).document.status === 'DRAFT', 'failed confirmation changed purchase DRAFT status');

      const confirmed = await confirmPurchase(confirmCommand, 'ADMIN');
      assert(confirmed.document.status === 'CONFIRMED' && confirmed.document.erpPostingStatus === 'READY', 'purchase did not confirm at ERP READY boundary');
      assert(confirmed.movements.length === 1 && confirmed.movements[0].movementType === 'PURCHASE_RECEIPT'
        && confirmed.movements[0].signedBaseQuantity === 5 && confirmed.movements[0].warehouseId === 'W-1',
      'purchase receipt movement is incorrect');
      assert(confirmed.movements[0].ledgerSequence === 6 && confirmed.movements[0].occurredAt === '2026-08-10T09:00:00+09:00',
        'backdated purchase did not receive the latest ledger sequence while preserving actual time');
      assert(confirmed.lines[0].movementId === confirmed.movements[0].movementId
        && !Object.hasOwn(confirmed.lines[0], 'reversalOf')
        && confirmed.lines[0].confirmedBy === 'ADMIN',
      'purchase confirmation retained injected evidence instead of generated facts');
      const afterConfirmCounts = await counts();
      assert(afterConfirmCounts.salesDocuments === 0 && afterConfirmCounts.salesLines === 0 && afterConfirmCounts.orderEvents === 0,
        'confirmPurchase changed dispatch sales/order fulfillment');
      const projectionAfterConfirm = await getInventoryShadowProjection();
      const inventoryAfterConfirm = projectionAfterConfirm.rows.find(row => row.productId === 'P-1' && row.warehouseId === 'W-1');
      assert(inventoryAfterConfirm.onHandQuantity === 7, 'backdated purchase was not included after the snapshot watermark');

      const confirmRetry = await confirmPurchase(confirmCommand, 'ADMIN');
      assert(confirmRetry.duplicate === true && JSON.stringify(await counts()) === JSON.stringify(afterConfirmCounts), 'purchase confirmation retry duplicated facts');
      let confirmConflict = '';
      try { await confirmPurchase({ ...confirmCommand, expectedRevision: confirmCommand.expectedRevision + 1 }, 'ADMIN'); }
      catch (error) { confirmConflict = error.message; }
      assert(confirmConflict.includes('IDEMPOTENCY_CONFLICT'), 'same purchase confirmation key accepted different content');

      const exactImport = {
        idempotencyKey: 'ERP-PURCHASE-IMPORT:1', originSystem: 'ORDER_Q', originTransactionId: purchaseDocumentId,
        externalDocumentNo: 0, importBatchId: 'ERP-BATCH-1', sourceFingerprint: '0',
        lines: [{
          originPurchaseLineId: purchaseLineId, externalLineNo: 0, sourceLineFingerprint: '0',
          productId: 'P-1', warehouseId: 'W-1', quantity: 10, baseQuantity: 5, unitCostWon: 100
        }]
      };
      const beforeReconcile = await counts();
      const reconciled = await reconcilePurchaseExternal(exactImport, 'ADMIN');
      assert(reconciled.matched === true && reconciled.reconciliation.status === 'MATCHED', 'exact ERP purchase did not match existing ORDER Q purchase');
      const afterReconcile = await counts();
      assert(afterReconcile.purchaseDocuments === beforeReconcile.purchaseDocuments
        && afterReconcile.purchaseLines === beforeReconcile.purchaseLines
        && afterReconcile.inventoryMovements === beforeReconcile.inventoryMovements,
      'exact ERP reimport created a new purchase or movement');
      const reconciledAggregate = await loadPurchaseAggregate(purchaseDocumentId);
      assert(reconciledAggregate.document.externalDocumentNo === '0'
        && reconciledAggregate.document.erpDocumentNo === '0'
        && reconciledAggregate.document.externalReconciliationStatus === 'MATCHED'
        && reconciledAggregate.document.erpPostingStatus === 'READY'
        && reconciledAggregate.lines[0].externalLineNo === '0'
        && reconciledAggregate.lines[0].sourceLineFingerprint === '0',
      'external ERP identity or M9 posting boundary was not preserved');
      const reconcileRetry = await reconcilePurchaseExternal(exactImport, 'ADMIN');
      assert(reconcileRetry.duplicate === true && JSON.stringify(await counts()) === JSON.stringify(afterReconcile), 'ERP reconciliation retry duplicated rows');
      let reconcileConflict = '';
      try { await reconcilePurchaseExternal({ ...exactImport, lines: [{ ...exactImport.lines[0], quantity: 9 }] }, 'ADMIN'); }
      catch (error) { reconcileConflict = error.message; }
      assert(reconcileConflict.includes('IDEMPOTENCY_CONFLICT'), 'ERP reconciliation key accepted changed content');
      const review = await reconcilePurchaseExternal({
        ...exactImport, idempotencyKey: 'ERP-PURCHASE-IMPORT:REVIEW',
        lines: [{ ...exactImport.lines[0], quantity: 9 }]
      }, 'ADMIN');
      assert(review.matched === false && review.reconciliation.status === 'REVIEW_REQUIRED', 'similar ERP row was auto-matched instead of left for review');
      assert((await counts()).inventoryMovements === afterReconcile.inventoryMovements, 'review-only ERP row changed inventory');

      const dbWithForeignLine = await openOrderQDb();
      const foreignLineTx = dbWithForeignLine.transaction(STORE.PURCHASE_LINES, 'readwrite');
      foreignLineTx.objectStore(STORE.PURCHASE_LINES).put({
        purchaseLineId: 'PL-FOREIGN-FAKE', purchaseDocumentId: 'PD-FOREIGN', status: 'CONFIRMED',
        productId: 'P-1', warehouseId: 'W-1', quantity: 9, baseQuantity: 4, amountWon: 900,
        reversalOf: purchaseLineId, movementId: 'IM-FAKE'
      });
      await transactionDone(foreignLineTx);

      const originalBeforeReverse = await loadPurchaseAggregate(purchaseDocumentId);
      const originalRevision = originalBeforeReverse.document.revision;
      const partialReverseCommand = {
        purchaseDocumentId, expectedRevision: originalRevision,
        idempotencyKey: buildPurchaseReversalKey(purchaseDocumentId, originalRevision, 'PART-1'),
        reason: '부분 구매취소 4 BOX',
        lines: [{ purchaseLineId, quantity: 4 }]
      };
      const beforeReverseFailure = await counts();
      let reverseFailure = '';
      try { await reversePurchase(partialReverseCommand, 'ADMIN', { failureAt: PURCHASE_CONFIRMATION_STEP.MOVEMENTS_WRITTEN }); }
      catch (error) { reverseFailure = error.message; }
      assert(reverseFailure.includes('PURCHASE_FAILURE_INJECTED:MOVEMENTS_WRITTEN')
        && JSON.stringify(await counts()) === JSON.stringify(beforeReverseFailure),
      'purchase reversal failure did not roll back atomically');
      const partialReverse = await reversePurchase(partialReverseCommand, 'ADMIN');
      assert(partialReverse.lines[0].quantity === -4 && partialReverse.lines[0].baseQuantity === -2
        && partialReverse.lines[0].amountWon === -400 && partialReverse.movements[0].signedBaseQuantity === -2,
      'partial purchase reversal quantity/base/amount/movement is incorrect');
      const originalAfterPartial = await loadPurchaseAggregate(purchaseDocumentId);
      assert(originalAfterPartial.document.status === 'CONFIRMED'
        && originalAfterPartial.lines[0].quantity === 10
        && originalAfterPartial.lines[0].baseQuantity === 5,
      'partial purchase reversal overwrote original confirmed facts');
      const partialCounts = await counts();
      const partialRetry = await reversePurchase(partialReverseCommand, 'ADMIN');
      assert(partialRetry.duplicate === true && JSON.stringify(await counts()) === JSON.stringify(partialCounts), 'purchase reversal retry duplicated rows');
      let reverseConflict = '';
      try { await reversePurchase({ ...partialReverseCommand, reason: '변경 사유' }, 'ADMIN'); }
      catch (error) { reverseConflict = error.message; }
      assert(reverseConflict.includes('IDEMPOTENCY_CONFLICT'), 'purchase reversal key accepted changed content');
      let overReverse = '';
      try {
        await reversePurchase({
          purchaseDocumentId, expectedRevision: originalRevision,
          idempotencyKey: buildPurchaseReversalKey(purchaseDocumentId, originalRevision, 'OVER'),
          reason: '초과취소 차단', lines: [{ purchaseLineId, quantity: 7 }]
        }, 'ADMIN');
      } catch (error) { overReverse = error.message; }
      assert(overReverse.includes('EXCEEDS_ORIGINAL'), 'cumulative purchase reversal exceeded original quantity');
      const remainingReverse = await reversePurchase({
        purchaseDocumentId, expectedRevision: originalRevision,
        idempotencyKey: buildPurchaseReversalKey(purchaseDocumentId, originalRevision, 'REMAINING'),
        reason: '구매 잔량 전체취소'
      }, 'ADMIN');
      assert(remainingReverse.lines[0].quantity === -6 && remainingReverse.lines[0].baseQuantity === -3
        && remainingReverse.lines[0].amountWon === -600 && remainingReverse.movements[0].signedBaseQuantity === -3,
      'remaining full purchase reversal did not consume exact balances');
      const allPurchaseLines = await readAll(STORE.PURCHASE_LINES);
      const reversalLines = allPurchaseLines.filter(row => row.reversalOf === purchaseLineId && row.status === 'REVERSED');
      assert(reversalLines.reduce((sum, row) => sum + row.quantity, 0) === -10
        && reversalLines.reduce((sum, row) => sum + row.baseQuantity, 0) === -5
        && reversalLines.reduce((sum, row) => sum + row.amountWon, 0) === -1000,
      'cumulative purchase reversal did not exactly offset original facts');
      const projectionAfterReverse = await getInventoryShadowProjection();
      const inventoryAfterReverse = projectionAfterReverse.rows.find(row => row.productId === 'P-1' && row.warehouseId === 'W-1');
      assert(inventoryAfterReverse.onHandQuantity === 2, 'purchase reversal did not restore operating inventory');

      const allOutbox = await readAll(STORE.SYNC_QUEUE);
      assert(allOutbox.every(row => row.status === 'LOCAL_ONLY' && row.localOnly === true), 'M6 escaped the pre-M9 local-only boundary');
      assert(allOutbox.some(row => row.entityType === 'PURCHASE_DOCUMENT')
        && allOutbox.some(row => row.entityType === 'PURCHASE_LINE')
        && allOutbox.some(row => row.entityType === 'INVENTORY_MOVEMENT')
        && allOutbox.some(row => row.entityType === 'DISPATCH_RECONCILIATION'),
      'M6 local outbox is missing purchase evidence');
      assert(consoleWarnings.length === 0 && consoleErrors.length === 0, `browser console issues: ${[...consoleWarnings, ...consoleErrors].join(' / ')}`);

      return {
        ok: true,
        databaseVersion: (await openOrderQDb()).version,
        draft: {
          purchaseDocumentId, shortageKey: draft.document.sourceShortageKey, inventoryUnchanged: true,
          injectedSystemEvidenceRemoved: true, duplicateShortage
        },
        confirmation: {
          status: confirmed.document.status, erpPostingStatus: confirmed.document.erpPostingStatus,
          movement: confirmed.movements[0].signedBaseQuantity, ledgerSequence: confirmed.movements[0].ledgerSequence,
          occurredAt: confirmed.movements[0].occurredAt, projection: inventoryAfterConfirm.onHandQuantity,
          retryDuplicate: confirmRetry.duplicate, conflict: confirmConflict, capability: backdateCapability
        },
        reconciliation: {
          matched: reconciled.matched, externalDocumentNo: reconciledAggregate.document.externalDocumentNo,
          retryDuplicate: reconcileRetry.duplicate, conflict: reconcileConflict, reviewStatus: review.reconciliation.status,
          movementsUnchanged: true
        },
        reversal: {
          partial: [-4, -2, -400], remaining: [-6, -3, -600], cumulative: [-10, -5, -1000],
          inventoryRestored: inventoryAfterReverse.onHandQuantity, retryDuplicate: partialRetry.duplicate,
          conflict: reverseConflict, overBlocked: overReverse, foreignConfirmedEvidenceIgnored: true
        },
        rollback: { confirmation: confirmFailure, reversal: reverseFailure },
        dispatchIndependent: { salesDocuments: 0, salesLines: 0, orderEvents: 0 },
        outboxLocalOnly: allOutbox.length,
        console: { warnings: consoleWarnings.length, errors: consoleErrors.length }
      };
    }

    run().then(result => {
      output.textContent = `PASS\n${JSON.stringify(result, null, 2)}`;
      document.title = 'PASS ORDER Q M6 Browser Test';
    }).catch(error => {
      console.error(error);
      output.textContent = `FAIL\n${error.stack || error.message || error}`;
      document.title = 'FAIL ORDER Q M6 Browser Test';
    });
  </script>
</body>
</html>
