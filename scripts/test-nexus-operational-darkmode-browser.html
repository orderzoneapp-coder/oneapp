<!DOCTYPE html>
<html lang="ko" data-nexus-app="orderq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS operational dark-mode computed-style fixture</title>
  <script src="/nexus/common/nexus-theme-init.js"></script>
  <link rel="stylesheet" href="/nexus/common/oneapp-design-tokens.css">
  <style>
    * { box-sizing: border-box; }
    html[data-nexus-app="orderq"] { --white: #fff; --slate-50: #f8fafc; --slate-200: #e2e8f0; --slate-900: #0f172a; }
    html[data-nexus-app="orderq"] body { background: var(--white); color: var(--slate-900); }
    html[data-nexus-app="dataops"] body { background: #f8fafc; color: #0f172a; }
    html[data-nexus-app="merchops"] body { background: #f1f5f9; color: #0f172a; }
    body { margin: 0; min-height: 100vh; padding: 24px; font: 14px system-ui, sans-serif; }
    .fixture-shell { display: grid; gap: 16px; max-width: 940px; margin: auto; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button, select, input { min-height: 36px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px; background: var(--white, #fff); color: var(--slate-900, #0f172a); }
    .panel, .bg-white { padding: 16px; border: 1px solid var(--slate-200, #e2e8f0); border-radius: 10px; background: var(--white, #fff); }
    .results-panel { overflow: hidden; border: 1px solid #cbd5e1; background: var(--white, #fff); }
    table { width: 100%; border-collapse: collapse; background: var(--white, #fff); }
    th { background: var(--slate-50, #f1f5f9); }
    th, td { padding: 10px; border: 1px solid #e2e8f0; }
    .modal-host { min-height: 82px; }
    .scroll-box { height: 70px; overflow: auto; border: 1px solid #cbd5e1; }
    .scroll-content { height: 220px; padding: 8px; }
    #results { white-space: pre-wrap; font: 12px ui-monospace, monospace; }
    #results[data-result="pass"] { color: #047857; }
    #results[data-result="fail"] { color: #b91c1c; }
  </style>
  <link rel="stylesheet" href="/nexus/common/nexus-operational-theme.css?v=1.0.0">
</head>
<body>
  <main class="fixture-shell">
    <h1>NEXUS operational dark-mode computed-style fixture</h1>
    <div class="controls">
      <button id="light" type="button">Light</button>
      <button id="dark" type="button">Dark</button>
      <select id="app" aria-label="Application">
        <option value="orderq">ORDER Q</option>
        <option value="dataops">DataOps</option>
        <option value="merchops">MerchOps</option>
      </select>
    </div>
    <section id="panel" class="panel bg-white">
      <label>검색 <input id="search" value="상태 보존 검색어"></label>
      <label>필터 <select id="filter"><option>전체</option><option selected>오류</option></select></label>
      <label><input id="selected" type="checkbox" checked> 선택 상태</label>
    </section>
    <section class="results-panel bg-white">
      <table id="table" class="bg-white">
        <thead><tr><th>품목</th><th>상태</th></tr></thead>
        <tbody><tr><td>동적 행 기준</td><td>정상</td></tr></tbody>
      </table>
    </section>
    <div id="scroll" class="scroll-box bg-white"><div class="scroll-content">스크롤 상태 보존</div></div>
    <div id="modal-host" class="modal-host"></div>
    <output id="results" aria-live="polite">검사 대기</output>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const controller = window.ONEAPP_NEXUS_THEME_INIT;
      const elements = {
        panel: document.getElementById('panel'),
        table: document.getElementById('table'),
        input: document.getElementById('search'),
      };
      const rgb = (name) => getComputedStyle(elements[name]).backgroundColor;
      const bodyRgb = () => getComputedStyle(document.body).backgroundColor;
      const state = () => ({
        search: elements.input.value,
        filter: document.getElementById('filter').selectedIndex,
        selected: document.getElementById('selected').checked,
        scrollTop: document.getElementById('scroll').scrollTop,
      });
      const same = (left, right) => JSON.stringify(left) === JSON.stringify(right);
      const setMode = (mode) => controller.apply(mode, { emit: true, source: 'computed-style-fixture' });
      const setApp = (app) => { root.dataset.nexusApp = app; document.getElementById('app').value = app; };
      const expectedLightBody = { orderq: 'rgb(255, 255, 255)', dataops: 'rgb(248, 250, 252)', merchops: 'rgb(241, 245, 249)' };
      const run = () => {
        const failures = [];
        const evidence = [];
        document.getElementById('scroll').scrollTop = 64;
        const initialState = state();
        for (const app of ['orderq', 'dataops', 'merchops']) {
          setApp(app);
          setMode('light');
          const lightBefore = { body: bodyRgb(), panel: rgb('panel'), table: rgb('table'), input: rgb('input') };
          if (lightBefore.body !== expectedLightBody[app]) failures.push(`${app}: unexpected Light body ${lightBefore.body}`);
          setMode('dark');
          const modal = document.createElement('div');
          modal.id = 'dynamic-modal';
          modal.className = 'panel bg-white';
          modal.innerHTML = '<strong>동적 모달</strong><p>테마 전환 뒤 생성</p>';
          document.getElementById('modal-host').replaceChildren(modal);
          const dark = {
            body: bodyRgb(), panel: rgb('panel'), table: rgb('table'), input: rgb('input'),
            modal: getComputedStyle(modal).backgroundColor,
          };
          for (const [part, value] of Object.entries(dark)) {
            if (value === 'rgb(255, 255, 255)' || value === 'rgb(248, 250, 252)' || value === 'rgb(241, 245, 249)') {
              failures.push(`${app}: ${part} remained light (${value})`);
            }
          }
          if (dark.body !== 'rgb(21, 24, 29)') failures.push(`${app}: dark body ${dark.body}`);
          setMode('light');
          const lightAfter = { body: bodyRgb(), panel: rgb('panel'), table: rgb('table'), input: rgb('input') };
          if (!same(lightBefore, lightAfter)) failures.push(`${app}: Light did not restore exactly`);
          if (!same(initialState, state())) failures.push(`${app}: interaction state changed`);
          evidence.push({ app, lightBefore, dark, lightAfter });
        }
        setApp('orderq');
        setMode('light');
        const result = { pass: failures.length === 0, contract: 'Light → Dark → Light', failures, evidence, state: state() };
        window.NEXUS_DARKMODE_FIXTURE_RESULT = Object.freeze(result);
        const output = document.getElementById('results');
        output.dataset.result = result.pass ? 'pass' : 'fail';
        output.textContent = `${result.pass ? 'PASS' : 'FAIL'} — Light → Dark → Light\n${JSON.stringify(result, null, 2)}`;
      };
      document.getElementById('light').addEventListener('click', () => setMode('light'));
      document.getElementById('dark').addEventListener('click', () => setMode('dark'));
      document.getElementById('app').addEventListener('change', (event) => setApp(event.target.value));
      requestAnimationFrame(run);
    })();
  </script>
</body>
</html>
