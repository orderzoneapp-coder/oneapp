<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>ORDER Q M8 Browser Test</title>
<body>
  <h1>ORDER Q M8 Browser Test</h1>
  <pre id="result">RUNNING</pre>
  <script type="module">
    import { DB_NAME, STORE, closeOrderQDb, openOrderQDb, requestToPromise, transactionDone } from '../orderq/orderq-db.js?v=0.8.0';
    import { buildDispatchConfirmationKey } from '../orderq/dispatch-confirmation.js?v=0.8.0';
    import { confirmDispatch, recordDispatchActual } from '../orderq/dispatch-confirmation-repository.js?v=0.8.0';
    import { approveSubstitution } from '../orderq/dispatch-exception-repository.js?v=0.8.0';
    import { loadDispatchAggregate, releaseDispatch, saveDispatchDraft } from '../orderq/dispatch-workbench-repository.js?v=0.8.0';
    import { effectiveTransferredQuantity } from '../orderq/order-fulfillment-lifecycle.js?v=0.8.0';
    import { DISPATCH_ADJUSTMENT_STEP } from '../orderq/dispatch-reconciliation.js?v=0.8.0';
    import {
      adjustDispatchAfterShipment,
      completeDispatchReconciliation,
      createDispatchReconciliationIssue
    } from '../orderq/dispatch-reconciliation-repository.js?v=0.8.0';

    const output = document.querySelector('#result');
    const consoleWarnings = [];
    const consoleErrors = [];
    const originalWarn = console.warn.bind(console);
    const originalError = console.error.bind(console);
    console.warn = (...args) => { consoleWarnings.push(args.map(String).join(' ')); originalWarn(...args); };
    console.error = (...args) => { consoleErrors.push(args.map(String).join(' ')); originalError(...args); };
    window.addEventListener('error', event => consoleErrors.push(event.error?.stack || event.message || 'window error'));
    window.addEventListener('unhandledrejection', event => consoleErrors.push(event.reason?.stack || String(event.reason)));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    const deleteDatabase = () => new Promise((resolve, reject) => {
      const request = indexedDB.deleteDatabase(DB_NAME);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('test database delete blocked'));
    });
    const readAll = async storeName => {
      const db = await openOrderQDb();
      const tx = db.transaction(storeName, 'readonly');
      const rows = await requestToPromise(tx.objectStore(storeName).getAll());
      await transactionDone(tx);
      return rows;
    };
    const readOne = async (storeName, key) => {
      const db = await openOrderQDb();
      const tx = db.transaction(storeName, 'readonly');
      const row = await requestToPromise(tx.objectStore(storeName).get(key));
      await transactionDone(tx);
      return row;
    };
    const write = async (storeName, row) => {
      const db = await openOrderQDb();
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(row);
      await transactionDone(tx);
    };
    const waitUntil = async (predicate, message, attempts = 100) => {
      for (let index = 0; index < attempts; index++) {
        if (await predicate()) return;
        await delay(100);
      }
      throw new Error(message);
    };
    const structured = value => JSON.stringify(value);

    async function seed() {
      const db = await openOrderQDb();
      const stores = [
        STORE.CUSTOMERS, STORE.PRODUCTS, STORE.WAREHOUSES, STORE.ORDERS, STORE.ORDER_ITEMS,
        STORE.INVENTORY_SNAPSHOTS, STORE.INVENTORY_LINES, STORE.UNIT_MAPPINGS
      ];
      const tx = db.transaction(stores, 'readwrite');
      tx.objectStore(STORE.CUSTOMERS).put({ customerId:'C-M8', customerName:'M8 고객', normalizedName:'m8고객', status:'ACTIVE' });
      tx.objectStore(STORE.PRODUCTS).put({ productId:'P-A', itemCode:'A', itemName:'요청상품 A', normalizedName:'요청상품a', salePrice:1000, status:'ACTIVE' });
      tx.objectStore(STORE.PRODUCTS).put({ productId:'P-B', itemCode:'B', itemName:'대체상품 B', normalizedName:'대체상품b', salePrice:1200, status:'ACTIVE' });
      tx.objectStore(STORE.WAREHOUSES).put({ warehouseId:'W-1', warehouseCode:'01', warehouseName:'운영창고', normalizedName:'운영창고', countsInOnHand:true, countsInAvailable:true, status:'ACTIVE' });
      tx.objectStore(STORE.UNIT_MAPPINGS).put({ mappingId:'CR-M8', conversionRuleId:'CR-M8', conversionRuleVersion:'v1', actualToBaseFactor:0.5, actualToRecognizedFactor:5, status:'ACTIVE' });
      tx.objectStore(STORE.INVENTORY_SNAPSHOTS).put({ inventorySnapshotId:'IS-M8', importBatchId:'B-M8', basisDate:'2026-08-15', warehouseId:'W-1', snapshotLastSequence:0, status:'ACTIVE', createdAt:'2026-08-15T00:00:00.000Z' });
      tx.objectStore(STORE.INVENTORY_LINES).put({ inventoryLineId:'IL-A', inventorySnapshotId:'IS-M8', importBatchId:'B-M8', productId:'P-A', productCode:'A', warehouseId:'W-1', inventoryQuantity:100, status:'ACTIVE' });
      tx.objectStore(STORE.INVENTORY_LINES).put({ inventoryLineId:'IL-B', inventorySnapshotId:'IS-M8', importBatchId:'B-M8', productId:'P-B', productCode:'B', warehouseId:'W-1', inventoryQuantity:100, status:'ACTIVE' });
      for (const [orderId, itemId, quantity] of [
        ['O-N','OI-N',10], ['O-M','OI-M',10], ['O-C','OI-C',10], ['O-P','OI-P',10], ['O-UI','OI-UI',5]
      ]) {
        tx.objectStore(STORE.ORDERS).put({ orderId, orderNo:orderId, customerId:'C-M8', customerName:'M8 고객', orderDate:'2026-08-15', orderStatus:'ORDER', adminStatus:'CHECKED', opsStatus:'ACTIVE', revision:1 });
        tx.objectStore(STORE.ORDER_ITEMS).put({ orderItemId:itemId, orderId, productId:'P-A', itemCode:'A', itemName:'요청상품 A', finalQuantity:quantity, finalUnit:'EA', price:1000, vatAmount:Math.round(quantity * 100), matchStatus:'MATCHED' });
      }
      await transactionDone(tx);
    }

    async function createConfirmed({ dispatchId, orderId, orderItemId, actualQuantity, baseQuantity = actualQuantity, recognizedQuantity = actualQuantity, substitute = false, conversion = false }) {
      const dispatchLineId = `DL-${dispatchId}`;
      const allocationId = `DA-${dispatchId}`;
      const conversionRuleSnapshot = conversion ? {
        conversionRuleId:'CR-M8', conversionRuleVersion:'v1', actualToBaseFactor:0.5, actualToRecognizedFactor:5,
        requestedUnit:'EA', actualUnit:'PACK', baseUnit:'KG', description:'대체 환산'
      } : null;
      const draft = await saveDispatchDraft({
        decision:{ dispatchId, customerId:'C-M8', customerName:'M8 고객', businessDate:'2026-08-15' },
        lines:[{
          dispatchLineId, orderId, orderItemId,
          requestedProductId:'P-A', requestedProductCode:'A', requestedProductName:'요청상품 A',
          actualProductId:substitute ? 'P-B' : 'P-A', actualProductCode:substitute ? 'B' : 'A', actualProductName:substitute ? '대체상품 B' : '요청상품 A',
          fulfillmentType:substitute ? 'SUBSTITUTE' : 'NORMAL',
          plannedActualQuantity:actualQuantity, plannedBaseQuantity:baseQuantity, plannedRecognizedOrderQuantity:recognizedQuantity,
          actualUnit:conversion ? 'PACK' : 'EA', baseUnit:conversion ? 'KG' : 'EA',
          conversionType:conversion ? 'CUT' : 'NONE', conversionRuleId:conversion ? 'CR-M8' : '', conversionRuleVersion:conversion ? 'v1' : '',
          conversionRuleSnapshot, measurementRequired:false, priceSource:'ORDER_AGREED', customerNoticeRequired:false
        }],
        allocations:[{ allocationId, dispatchLineId, warehouseId:'W-1', plannedBaseQuantity:baseQuantity }],
        expectedRevision:0
      }, 'ADMIN');
      const released = await releaseDispatch(dispatchId, draft.decision.revision, 'ADMIN');
      let ready = await recordDispatchActual({
        dispatchId, expectedRevision:released.decision.revision,
        lines:[{ dispatchLineId, actualQuantity, recognizedOrderQuantity:recognizedQuantity, allocations:[{ allocationId, actualBaseQuantity:baseQuantity }] }]
      }, 'ADMIN');
      if (substitute) {
        ready = await approveSubstitution({ dispatchId, dispatchLineId, expectedRevision:ready.decision.revision, reasonCode:'M8_CORRECTION', reasonNote:'M8 대체 출고 승인' }, 'ADMIN');
      }
      const confirmed = await confirmDispatch({
        dispatchId, expectedRevision:ready.decision.revision,
        idempotencyKey:buildDispatchConfirmationKey(dispatchId, ready.decision.revision)
      }, 'ADMIN');
      return { ...confirmed, dispatchLineId, allocationId };
    }

    async function sourceSnapshot(dispatchId) {
      const decision = await readOne(STORE.DISPATCH_DECISIONS, dispatchId);
      const salesDocument = await readOne(STORE.SALES_DOCUMENTS, decision.salesDocumentId);
      const lines = (await readAll(STORE.DISPATCH_LINES)).filter(row => row.dispatchId === dispatchId);
      const allocations = (await readAll(STORE.DISPATCH_STOCK_ALLOCATIONS)).filter(row => row.dispatchId === dispatchId);
      const salesLines = (await readAll(STORE.SALES_LINES)).filter(row => row.salesDocumentId === decision.salesDocumentId);
      const movements = (await readAll(STORE.INVENTORY_MOVEMENTS)).filter(row => row.dispatchId === dispatchId);
      const eventIds = new Set(decision.fulfillmentEventIds || []);
      const events = (await readAll(STORE.ORDER_EVENTS)).filter(row => eventIds.has(row.eventId));
      return structured({ decision, salesDocument, lines, allocations, salesLines, movements, events });
    }

    async function databaseEvidence() {
      const stores = [
        STORE.DISPATCH_DECISIONS, STORE.DISPATCH_LINES, STORE.DISPATCH_STOCK_ALLOCATIONS,
        STORE.SALES_DOCUMENTS, STORE.SALES_LINES, STORE.INVENTORY_MOVEMENTS,
        STORE.ORDER_EVENTS, STORE.DISPATCH_RECONCILIATIONS, STORE.SYNC_QUEUE, STORE.META
      ];
      const result = {};
      for (const store of stores) result[store] = await readAll(store);
      return structured(result);
    }

    async function issueFor(confirmed, { actualQuantity, baseQuantity, recognizedQuantity }, suffix, expectedRevision = confirmed.decision.revision) {
      const aggregate = await loadDispatchAggregate(confirmed.decision.dispatchId);
      return createDispatchReconciliationIssue({
        dispatchId:confirmed.decision.dispatchId,
        expectedRevision,
        idempotencyKey:`M8-ISSUE:${suffix}`,
        reasonCode:'ACTUAL_SHIPMENT_MISMATCH',
        reasonNote:`${suffix} 현장 확인 차이`,
        lines:aggregate.lines.map(line => ({
          dispatchLineId:line.dispatchLineId,
          actualQuantity, actualBaseQuantity:baseQuantity, recognizedOrderQuantity:recognizedQuantity,
          allocations:aggregate.allocations.filter(row => row.dispatchLineId === line.dispatchLineId).map(row => ({ allocationId:row.allocationId, actualBaseQuantity:baseQuantity }))
        }))
      }, 'ADMIN');
    }

    async function confirmCorrection(adjusted, { actualQuantity, baseQuantity, recognizedQuantity, substitute = false }) {
      const aggregate = await loadDispatchAggregate(adjusted.correctionDecision.dispatchId);
      const released = await releaseDispatch(aggregate.decision.dispatchId, aggregate.decision.revision, 'ADMIN');
      let ready = await recordDispatchActual({
        dispatchId:released.decision.dispatchId,
        expectedRevision:released.decision.revision,
        lines:released.lines.map(line => ({
          dispatchLineId:line.dispatchLineId, actualQuantity, recognizedOrderQuantity:recognizedQuantity,
          allocations:released.allocations.filter(row => row.dispatchLineId === line.dispatchLineId).map(row => ({ allocationId:row.allocationId, actualBaseQuantity:baseQuantity }))
        }))
      }, 'ADMIN');
      if (substitute) {
        ready = await approveSubstitution({
          dispatchId:ready.decision.dispatchId, dispatchLineId:ready.lines[0].dispatchLineId,
          expectedRevision:ready.decision.revision, reasonCode:'M8_RECONFIRM', reasonNote:'정정 대체출고 재승인'
        }, 'ADMIN');
      }
      return confirmDispatch({
        dispatchId:ready.decision.dispatchId,
        expectedRevision:ready.decision.revision,
        idempotencyKey:buildDispatchConfirmationKey(ready.decision.dispatchId, ready.decision.revision)
      }, 'ADMIN');
    }

    async function changeCorrectionDraftQuantity(adjusted, { actualQuantity, baseQuantity, recognizedQuantity }) {
      const aggregate = await loadDispatchAggregate(adjusted.correctionDecision.dispatchId);
      return saveDispatchDraft({
        decision:aggregate.decision,
        lines:aggregate.lines.map(line => ({
          ...line,
          plannedActualQuantity:actualQuantity,
          plannedBaseQuantity:baseQuantity,
          plannedRecognizedOrderQuantity:recognizedQuantity
        })),
        allocations:aggregate.allocations.map(allocation => ({ ...allocation, plannedBaseQuantity:baseQuantity })),
        expectedRevision:aggregate.decision.revision
      }, 'ADMIN');
    }

    async function run() {
      closeOrderQDb();
      await deleteDatabase();
      await openOrderQDb();
      localStorage.clear();
      await seed();

      const normal = await createConfirmed({ dispatchId:'D-N', orderId:'O-N', orderItemId:'OI-N', actualQuantity:8 });
      await write(STORE.DISPATCH_LINES, {
        ...(await readOne(STORE.DISPATCH_LINES, normal.dispatchLineId)),
        workerReportedQuantity:99,
        workerReportedProductId:'P-B',
        workerExceptionCode:'OLD_RESULT',
        workerExceptionMemo:'과거 작업실적',
        workerReportedAt:'2026-08-15T08:00:00.000Z',
        workerReportedBy:'OLD_WORKER'
      });
      await write(STORE.DISPATCH_STOCK_ALLOCATIONS, {
        ...(await readOne(STORE.DISPATCH_STOCK_ALLOCATIONS, normal.allocationId)),
        actualRecordedAt:'2026-08-15T08:00:00.000Z',
        actualRecordedBy:'OLD_WORKER'
      });
      const normalOriginal = await sourceSnapshot('D-N');
      let staleIssue = '';
      try { await issueFor(normal, { actualQuantity:6, baseQuantity:6, recognizedQuantity:6 }, 'STALE', normal.decision.revision - 1); }
      catch (error) { staleIssue = error.message; }
      assert(staleIssue.includes('REVISION_CONFLICT'), 'stale source revision created a reconciliation issue');
      const normalIssue = await issueFor(normal, { actualQuantity:6, baseQuantity:6, recognizedQuantity:6 }, 'NORMAL');
      assert(normalIssue.reconciliation.originalValue.actualQuantity === 8
        && normalIssue.reconciliation.actualValue.actualQuantity === 6
        && normalIssue.reconciliation.differenceQuantity.actualQuantity === -2,
      'normal reconciliation did not preserve expected/actual/difference raw values');
      const beforeIssueRetry = await databaseEvidence();
      const normalIssueRetry = await issueFor(normal, { actualQuantity:6, baseQuantity:6, recognizedQuantity:6 }, 'NORMAL');
      assert(normalIssueRetry.duplicate === true && await databaseEvidence() === beforeIssueRetry,
        'reconciliation issue retry duplicated rows or changed ledger sequence');
      let issueConflict = '';
      try { await issueFor(normal, { actualQuantity:5, baseQuantity:5, recognizedQuantity:5 }, 'NORMAL'); }
      catch (error) { issueConflict = error.message; }
      assert(issueConflict.includes('IDEMPOTENCY_CONFLICT'), 'reconciliation issue content conflict was accepted');

      const beforeFailure = await databaseEvidence();
      let failureMessage = '';
      const normalAdjustCommand = {
        reconciliationId:normalIssue.reconciliation.reconciliationId,
        expectedRevision:normalIssue.reconciliation.revision,
        idempotencyKey:'M8-ADJUST:NORMAL', reason:'현장 출고 6개로 정정'
      };
      try {
        await adjustDispatchAfterShipment(normalAdjustCommand, 'ADMIN', { failureAt:DISPATCH_ADJUSTMENT_STEP.CORRECTION_DRAFT_WRITTEN });
      } catch (error) { failureMessage = error.message; }
      assert(failureMessage.includes('CORRECTION_DRAFT_WRITTEN'), 'M8 failure injection did not run');
      assert(await databaseEvidence() === beforeFailure, 'M8 failed adjustment partially committed facts or sequence');

      const adjustedNormal = await adjustDispatchAfterShipment(normalAdjustCommand, 'ADMIN');
      assert(adjustedNormal.reconciliation.status === 'CORRECTION_DRAFT_CREATED'
        && adjustedNormal.correctionDecision.status === 'DRAFT', 'adjustment did not create correction DRAFT');
      assert(adjustedNormal.correctionLines.every(line => line.workerReportedQuantity === null
          && !line.workerReportedProductId && !line.workerExceptionCode && !line.workerExceptionMemo
          && !line.workerReportedAt && !line.workerReportedBy && !line.actualRecordedAt && !line.actualRecordedBy)
        && adjustedNormal.correctionAllocations.every(allocation => !allocation.actualRecordedAt
          && !allocation.actualRecordedBy && !allocation.movementId && !allocation.reservationId),
      'correction DRAFT inherited prior worker, actual, reservation or movement evidence');
      assert(await sourceSnapshot('D-N') === normalOriginal, 'normal correction overwrote original confirmed facts');
      const afterAdjustEvidence = await databaseEvidence();
      const adjustRetry = await adjustDispatchAfterShipment(normalAdjustCommand, 'ADMIN');
      assert(adjustRetry.duplicate === true && await databaseEvidence() === afterAdjustEvidence, 'adjustment retry duplicated rows or ledger sequence');
      let adjustConflict = '';
      try { await adjustDispatchAfterShipment({ ...normalAdjustCommand, reason:'다른 사유' }, 'ADMIN'); }
      catch (error) { adjustConflict = error.message; }
      assert(adjustConflict.includes('IDEMPOTENCY_CONFLICT'), 'adjustment content conflict was accepted');

      const mismatch = await createConfirmed({ dispatchId:'D-M', orderId:'O-M', orderItemId:'OI-M', actualQuantity:8 });
      const mismatchIssue = await issueFor(mismatch, { actualQuantity:6, baseQuantity:6, recognizedQuantity:6 }, 'MISMATCH');
      const adjustedMismatch = await adjustDispatchAfterShipment({
        reconciliationId:mismatchIssue.reconciliation.reconciliationId,
        expectedRevision:mismatchIssue.reconciliation.revision,
        idempotencyKey:'M8-ADJUST:MISMATCH', reason:'완료값 불일치 차단 검증'
      }, 'ADMIN');
      await changeCorrectionDraftQuantity(adjustedMismatch, { actualQuantity:5, baseQuantity:5, recognizedQuantity:5 });
      await confirmCorrection(adjustedMismatch, { actualQuantity:5, baseQuantity:5, recognizedQuantity:5 });
      const beforeMismatchCompletion = await databaseEvidence();
      let completionMismatch = '';
      try {
        await completeDispatchReconciliation({
          reconciliationId:adjustedMismatch.reconciliation.reconciliationId,
          expectedRevision:adjustedMismatch.reconciliation.revision,
          idempotencyKey:'M8-COMPLETE:MISMATCH'
        }, 'ADMIN');
      } catch (error) { completionMismatch = error.message; }
      const mismatchAfter = await readOne(STORE.DISPATCH_RECONCILIATIONS, adjustedMismatch.reconciliation.reconciliationId);
      assert(completionMismatch.includes('COMPLETION_MISMATCH')
        && mismatchAfter.status === 'CORRECTION_DRAFT_CREATED'
        && await databaseEvidence() === beforeMismatchCompletion,
      '5/5/5 correction incorrectly completed a 6/6/6 reconciliation or changed database evidence');

      const correctedNormal = await confirmCorrection(adjustedNormal, { actualQuantity:6, baseQuantity:6, recognizedQuantity:6 });
      const normalCompleteCommand = {
        reconciliationId:adjustedNormal.reconciliation.reconciliationId,
        expectedRevision:adjustedNormal.reconciliation.revision,
        idempotencyKey:'M8-COMPLETE:NORMAL'
      };
      const completedNormal = await completeDispatchReconciliation(normalCompleteCommand, 'ADMIN');
      assert(completedNormal.reconciliation.status === 'CORRECTED'
        && completedNormal.reconciliation.correctionSalesDocumentId === correctedNormal.salesDocument.salesDocumentId,
      'corrected sale was not linked back to reconciliation');
      const afterNormalComplete = await databaseEvidence();
      const completeRetry = await completeDispatchReconciliation(normalCompleteCommand, 'ADMIN');
      assert(completeRetry.duplicate === true && await databaseEvidence() === afterNormalComplete,
        'completion retry duplicated rows or changed ledger sequence');
      let completeRevisionConflict = '';
      try { await completeDispatchReconciliation({ ...normalCompleteCommand, expectedRevision:normalCompleteCommand.expectedRevision + 1 }, 'ADMIN'); }
      catch (error) { completeRevisionConflict = error.message; }
      let completeResultConflict = '';
      try { await completeDispatchReconciliation({ ...normalCompleteCommand, correctionConfirmationFingerprint:'DIFFERENT' }, 'ADMIN'); }
      catch (error) { completeResultConflict = error.message; }
      assert(completeRevisionConflict.includes('IDEMPOTENCY_CONFLICT')
        && completeResultConflict.includes('IDEMPOTENCY_CONFLICT'),
      'completion key accepted a changed revision or confirmed-result fingerprint');
      const allNormalSales = (await readAll(STORE.SALES_LINES)).filter(row => row.orderItemId === 'OI-N');
      const normalMovementIds = new Set([
        ...normal.movements.map(row => row.movementId),
        ...correctedNormal.movements.map(row => row.movementId)
      ]);
      const allMovements = await readAll(STORE.INVENTORY_MOVEMENTS);
      allMovements.filter(row => normal.movements.some(source => row.reversalOf === source.movementId)).forEach(row => normalMovementIds.add(row.movementId));
      const normalMovementTotal = allMovements.filter(row => normalMovementIds.has(row.movementId)).reduce((total, row) => total + row.signedBaseQuantity, 0);
      const normalEvents = (await readAll(STORE.ORDER_EVENTS)).filter(row => row.orderId === 'O-N');
      const normalTransferred = effectiveTransferredQuantity('OI-N', normalEvents);
      assert(allNormalSales.reduce((total, row) => total + row.actualQuantity, 0) === 6
        && normalMovementTotal === -6 && normalTransferred === 6 && 10 - normalTransferred === 4,
      'normal correction did not align sale, movement, fulfillment and remaining quantity');

      const converted = await createConfirmed({
        dispatchId:'D-C', orderId:'O-C', orderItemId:'OI-C',
        actualQuantity:2, baseQuantity:1, recognizedQuantity:10, substitute:true, conversion:true
      });
      const convertedOriginal = await sourceSnapshot('D-C');
      const convertedIssue = await issueFor(converted, { actualQuantity:1, baseQuantity:0.5, recognizedQuantity:5 }, 'CONVERTED');
      const adjustedConverted = await adjustDispatchAfterShipment({
        reconciliationId:convertedIssue.reconciliation.reconciliationId,
        expectedRevision:convertedIssue.reconciliation.revision,
        idempotencyKey:'M8-ADJUST:CONVERTED', reason:'대체 소분 실제량 정정'
      }, 'ADMIN');
      assert(adjustedConverted.reversalSalesDocument
        && adjustedConverted.correctionLines[0].plannedActualQuantity === 1
        && adjustedConverted.correctionLines[0].plannedBaseQuantity === 0.5
        && adjustedConverted.correctionLines[0].plannedRecognizedOrderQuantity === 5
        && adjustedConverted.correctionLines[0].conversionRuleVersion === 'v1',
      'converted correction collapsed axes or changed conversion snapshot');
      assert(await sourceSnapshot('D-C') === convertedOriginal, 'converted correction overwrote original confirmed facts');
      const convertedReversalLines = (await readAll(STORE.SALES_LINES)).filter(row => row.reversalOf === converted.salesLines[0].salesLineId);
      assert(convertedReversalLines[0].actualQuantity === -2
        && convertedReversalLines[0].actualBaseQuantity === -1
        && convertedReversalLines[0].recognizedOrderQuantity === -10,
      'converted correction reversal mixed quantity axes');
      const correctedConverted = await confirmCorrection(adjustedConverted, { actualQuantity:1, baseQuantity:0.5, recognizedQuantity:5, substitute:true });
      let foreignCompleteConflict = '';
      try {
        await completeDispatchReconciliation({
          reconciliationId:adjustedConverted.reconciliation.reconciliationId,
          expectedRevision:adjustedConverted.reconciliation.revision,
          idempotencyKey:'M8-COMPLETE:NORMAL'
        }, 'ADMIN');
      } catch (error) { foreignCompleteConflict = error.message; }
      assert(foreignCompleteConflict.includes('IDEMPOTENCY_CONFLICT'), 'completion key was reused by another reconciliation issue');
      const completedConverted = await completeDispatchReconciliation({
        reconciliationId:adjustedConverted.reconciliation.reconciliationId,
        expectedRevision:adjustedConverted.reconciliation.revision,
        idempotencyKey:'M8-COMPLETE:CONVERTED'
      }, 'ADMIN');
      const convertedSales = (await readAll(STORE.SALES_LINES)).filter(row => row.orderItemId === 'OI-C');
      const convertedEvents = (await readAll(STORE.ORDER_EVENTS)).filter(row => row.orderId === 'O-C');
      assert(convertedSales.reduce((total, row) => total + row.actualQuantity, 0) === 1
        && convertedSales.reduce((total, row) => total + row.actualBaseQuantity, 0) === 0.5
        && effectiveTransferredQuantity('OI-C', convertedEvents) === 5
        && correctedConverted.salesLines[0].conversionRuleVersion === 'v1'
        && completedConverted.reconciliation.status === 'CORRECTED',
      'converted re-confirmation did not align separate quantity axes');

      const posted = await createConfirmed({ dispatchId:'D-P', orderId:'O-P', orderItemId:'OI-P', actualQuantity:5 });
      const postedDocument = { ...posted.salesDocument, erpPostingStatus:'POSTED', erpDocumentNo:'ERP-S-20260815-77', erpPostedAt:'2026-08-15T12:00:00.000Z', erpPostedBy:'ADMIN' };
      await write(STORE.SALES_DOCUMENTS, postedDocument);
      const postedOriginal = await sourceSnapshot('D-P');
      const postedIssue = await issueFor(posted, { actualQuantity:4, baseQuantity:4, recognizedQuantity:4 }, 'POSTED');
      const adjustedPosted = await adjustDispatchAfterShipment({
        reconciliationId:postedIssue.reconciliation.reconciliationId,
        expectedRevision:postedIssue.reconciliation.revision,
        idempotencyKey:'M8-ADJUST:POSTED', reason:'ERP 반영 후 현장차이 정정'
      }, 'ADMIN');
      assert(await sourceSnapshot('D-P') === postedOriginal, 'POSTED correction overwrote original ERP-linked facts');
      assert(adjustedPosted.reversalSalesDocument.erpPostingStatus === 'CORRECTION_REQUIRED'
        && adjustedPosted.reversalSalesDocument.originalErpDocumentNo === 'ERP-S-20260815-77'
        && adjustedPosted.reversalSalesDocument.erpDocumentNo === ''
        && adjustedPosted.reconciliation.erpPostingStatus === 'CORRECTION_REQUIRED'
        && adjustedPosted.reconciliation.originalErpDocumentNo === 'ERP-S-20260815-77'
        && adjustedPosted.reconciliation.erpAutoCancelRequested === false
        && adjustedPosted.reconciliation.erpAutoRetransmitRequested === false,
      'POSTED correction did not preserve ERP boundary evidence');

      const uiConfirmed = await createConfirmed({ dispatchId:'D-UI', orderId:'O-UI', orderItemId:'OI-UI', actualQuantity:2 });
      const uiOriginal = await sourceSnapshot('D-UI');
      const frame = document.createElement('iframe');
      frame.style.width = '1400px'; frame.style.height = '850px';
      document.body.append(frame);
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error('DataOps iframe load failed'));
        frame.src = `../DataOps.html?m8-browser=${Date.now()}`;
      });
      await waitUntil(() => frame.contentDocument.querySelector('#orderq-reconciliation-open'), 'DataOps ORDER Q reconciliation entry did not render');
      frame.contentDocument.querySelector('#orderq-reconciliation-open').click();
      const reconciliationFrame = frame.contentDocument.querySelector('#orderq-reconciliation-frame');
      await waitUntil(() => reconciliationFrame.contentDocument?.querySelector('[data-action="select-candidate"][data-id="D-UI"]'), 'DataOps reconciliation candidate did not render');
      const reconciliationDocument = reconciliationFrame.contentDocument;
      reconciliationDocument.querySelector('[data-action="select-candidate"][data-id="D-UI"]').click();
      await waitUntil(() => reconciliationDocument.querySelector('[data-action="create-issue"]'), 'DataOps reconciliation detail did not render');
      assert([...reconciliationDocument.querySelectorAll('.fact-table input[readonly]')].length >= 4, 'confirmed DataOps facts were not read-only');
      reconciliationDocument.querySelector('.verified-actual').value = '1';
      reconciliationDocument.querySelector('.verified-base').value = '1';
      reconciliationDocument.querySelector('.verified-recognized').value = '1';
      reconciliationDocument.querySelector('.verified-allocation-base').value = '1';
      reconciliationDocument.querySelector('#reasonNote').value = 'DataOps 화면 실제 출고 1개 확인';
      reconciliationDocument.querySelector('[data-action="create-issue"]').click();
      await waitUntil(() => reconciliationDocument.querySelector('[data-action="create-correction"]'), 'DataOps issue creation/status transition did not render');
      reconciliationDocument.querySelector('[data-action="create-correction"]').click();
      await waitUntil(() => reconciliationDocument.body.textContent.includes('수정 DRAFT:'), 'DataOps correction DRAFT transition did not render');
      assert(await sourceSnapshot('D-UI') === uiOriginal, 'DataOps UI overwrote confirmed source facts');
      frame.remove();

      const outbox = await readAll(STORE.SYNC_QUEUE);
      const pending = outbox.filter(row => row.status === 'PENDING' && !row.localOnly);
      assert(outbox.every(row => row.status === 'LOCAL_ONLY' && row.localOnly === true) && pending.length === 0,
        'M8 escaped LOCAL_ONLY pre-M9 boundary');
      assert(consoleWarnings.length === 0 && consoleErrors.length === 0,
        `browser console issues: ${[...consoleWarnings, ...consoleErrors].join(' / ')}`);

      return {
        ok:true,
        databaseVersion:(await openOrderQDb()).version,
        normal:{ sales:6, movement:normalMovementTotal, transferred:normalTransferred, remaining:4, status:completedNormal.reconciliation.status },
        converted:{ actual:1, base:0.5, recognized:5, version:correctedConverted.salesLines[0].conversionRuleVersion },
        rollback:{ failureMessage, atomic:beforeFailure === beforeFailure },
        mismatch:{ rejected:completionMismatch, atomic:true, issueStatus:mismatchAfter.status },
        sanitization:{ workerEvidenceRemoved:true, allocationActualEvidenceRemoved:true },
        idempotency:{
          issueDuplicate:normalIssueRetry.duplicate, issueConflict,
          adjustDuplicate:adjustRetry.duplicate, adjustConflict, staleIssue,
          completionDuplicate:completeRetry.duplicate,
          completeRevisionConflict, completeResultConflict, foreignCompleteConflict
        },
        erp:{ status:adjustedPosted.reconciliation.erpPostingStatus, originalDocumentNo:adjustedPosted.reconciliation.originalErpDocumentNo, autoCancel:false },
        dataOpsUi:{ readOnly:true, correctionDraft:true, originalImmutable:true },
        outbox:{ localOnly:outbox.length, pending:pending.length },
        console:{ warnings:consoleWarnings.length, errors:consoleErrors.length }
      };
    }

    run().then(result => {
      output.textContent = `PASS\n${JSON.stringify(result, null, 2)}`;
      document.title = 'PASS ORDER Q M8 Browser Test';
    }).catch(error => {
      console.error(error);
      output.textContent = `FAIL\n${error.stack || error.message || error}`;
      document.title = 'FAIL ORDER Q M8 Browser Test';
    });
  </script>
</body>
</html>
