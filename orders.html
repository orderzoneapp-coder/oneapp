<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>ONEAPP orders</title>
  <script>
    (function () {
      "use strict";
      const sourceUrl = "ORDEROPS_list.html";

      fetch(sourceUrl, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then((source) => {
          document.open();
          document.write(source);
          document.close();
        })
        .catch((error) => {
          document.body.innerHTML = `
            <main style="max-width:720px;margin:80px auto;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a">
              <h1 style="font-size:22px">orders를 불러오지 못했습니다.</h1>
              <p style="line-height:1.6;color:#475569">ORDEROPS_list.html 파일과 GitHub Pages 배포 상태를 확인하세요.</p>
              <pre style="padding:12px;background:#f1f5f9;border-radius:8px;white-space:pre-wrap">${String(error.message || error)}</pre>
              <p><a href="ORDEROPS_list.html" style="color:#1d4ed8;font-weight:700">기존 주소로 직접 열기</a></p>
            </main>`;
        });
    })();
  </script>
</head>
<body>
  <noscript>
    <p>JavaScript를 활성화하거나 <a href="ORDEROPS_list.html">기존 주소</a>로 이동하세요.</p>
  </noscript>
</body>
</html>
