<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="nexus/common/nexus-ui-theme-init.js?v=1.3.0" data-nexus-app-id="master-lookup"></script>
    <link rel="stylesheet" href="nexus/common/nexus-ui.css?v=1.4.1">
    <link rel="stylesheet" href="nexus/common/nexus-ui-app-themes.css?v=1.3.11">
    <link rel="stylesheet" href="nexus/common/nexus-workbench-layout-v2.css?v=1.0.0">
    <link rel="stylesheet" href="nexus/common/nexus-table-ux.css?v=1.1.0">
    <script defer src="nexus/common/nexus-ui.js?v=1.8.0"></script>
    <script defer src="nexus/common/nexus-workbench-layout-v2.js?v=1.2.0"></script>
    <script defer src="nexus/common/nexus-table-ux.js?v=1.1.0"></script>
    <meta name="google" content="notranslate">
    <title>상품관리 - NEXUS</title>
    <link rel="icon" type="image/svg+xml" href="/nexus/assets/nexus-favicon.svg">
    <!-- 사전 생성된 상품관리 스타일과 실행 코드 -->
    <link rel="stylesheet" href="./master/master.css?v=1.0.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="coreEngine.js"></script>
    <script src="masterAddUpdate.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; background-color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-out; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    </style>
</head>
<body class="overflow-hidden text-slate-800">
    <div id="root"></div>

    <!-- White screen guard: shows startup/runtime errors instead of blank screen -->
    <div id="boot-error" style="display:none;position:fixed;inset:0;z-index:99999;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:32px;box-sizing:border-box;overflow:auto;">
        <div style="max-width:920px;margin:40px auto;background:white;border:1px solid #fecaca;border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,.12);overflow:hidden;">
            <div style="background:#991b1b;color:white;padding:18px 22px;font-weight:900;font-size:18px;">ONEAPP 초기화 오류</div>
            <div style="padding:22px;">
                <div id="boot-error-title" style="font-weight:900;font-size:18px;margin-bottom:10px;color:#991b1b;">화면을 불러오지 못했습니다.</div>
                <pre id="boot-error-detail" style="white-space:pre-wrap;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:14px;font-size:12px;line-height:1.6;color:#7f1d1d;overflow:auto;"></pre>
                <div style="margin-top:14px;font-size:12px;line-height:1.7;color:#475569;">개발자도구 Console 오류, CDN 차단 여부, 파일 경로, localStorage/IndexedDB 권한을 확인하십시오.</div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            function showBootError(title, detail) {
                var box = document.getElementById('boot-error');
                var titleEl = document.getElementById('boot-error-title');
                var detailEl = document.getElementById('boot-error-detail');
                if (!box || !titleEl || !detailEl) return;
                titleEl.textContent = title || '초기화 오류';
                detailEl.textContent = detail || '원인 정보 없음';
                box.style.display = 'block';
            }
            window.__showBootError = showBootError;
            window.__loadProductChangeRequestAdapter = function () {
                return import('./reference-data/product-change-request-adapter.js');
            };
            window.addEventListener('error', function (e) {
                showBootError('스크립트 실행 오류', (e.message || 'Unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
            });
            window.addEventListener('unhandledrejection', function (e) {
                var reason = e.reason;
                showBootError('비동기 처리 오류', reason && reason.stack ? reason.stack : String(reason || 'Unknown rejection'));
            });
            window.addEventListener('load', function () {
                setTimeout(function () {
                    var missing = [];
                    if (!window.React) missing.push('React');
                    if (!window.ReactDOM) missing.push('ReactDOM');
                    if (!window.XLSX) missing.push('XLSX');
                    if (missing.length) {
                        showBootError('필수 라이브러리 로드 실패', '누락 라이브러리: ' + missing.join(', '));
                        return;
                    }
                    var root = document.getElementById('root');
                    if (root && root.children.length === 0) {
                        showBootError('React 앱 렌더링 실패', '필수 라이브러리는 로드됐지만 #root가 비어 있습니다. 사전 변환된 앱 코드 또는 ReactDOM 실행 오류를 확인해야 합니다.');
                    }
                }, 2500);
            });
        })();
    </script>


    <script src="./master/master-app.js?v=1.0.0"></script>
</body>
</html>
