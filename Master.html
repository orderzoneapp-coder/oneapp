<!DOCTYPE html>
<html lang="ko" translate="no" data-nexus-app-id="master" data-nexus-ready-strategy="app">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>기초등록</title>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var rawView = params.get('view');
            var rawMode = params.get('mode');
            var view = rawView === 'customers' ? 'customers' : 'products';
            var mode = rawMode === 'batch' ? 'edit' : (rawMode === 'edit' || rawMode === 'mapping' ? rawMode : 'list');
            if (rawView !== view || rawMode !== mode) {
                var url = new URL(window.location.href);
                url.searchParams.set('view', view);
                url.searchParams.set('mode', mode);
                window.history.replaceState({ view: view, mode: mode }, '', url.pathname + url.search + url.hash);
            }
        })();
    </script>
    <script src="/nexus/common/nexus-theme-init.js?v=1.0.0"></script>
    <link rel="stylesheet" href="/nexus/common/oneapp-design-tokens.css?v=1.2.0">
    <link rel="stylesheet" href="/nexus/common/nexus-app-ui.css?v=2.0.0">
    <link rel="stylesheet" href="/nexus/common/nexus-master-theme.css?v=1.0.0">
    <link rel="stylesheet" href="/nexus/foundation/foundation-metadata.css?v=1.0.0">
    <link rel="stylesheet" href="/nexus/master/master-app.css?v=20260828.1">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; background-color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-out; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }

        .master-app-header-bar {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) auto;
            padding-inline: 16px !important;
        }
        .master-target-tabs { justify-self: start; }
        .master-work-tools { gap: 12px; }
        .master-work-left,
        .master-work-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .master-work-right { margin-left: auto; justify-content: flex-end; }
        .master-work-search { width: clamp(240px, 31vw, 420px); flex: 0 1 420px; }
        .master-subnav-link {
            position: relative;
            height: 36px;
            display: inline-flex;
            align-items: center;
            padding: 0 10px;
            border: 0;
            background: transparent;
            color: var(--oneapp-muted);
            font-size: 12px;
            font-weight: 800;
        }
        .master-subnav-link[aria-current="page"] { color: var(--oneapp-master-accent); }
        .master-subnav-link[aria-current="page"]::after {
            content: "";
            position: absolute;
            right: 8px;
            bottom: 0;
            left: 8px;
            height: 2px;
            background: var(--oneapp-master-accent);
        }
        .master-data-workspace { min-width: 840px; height: 100%; min-height: 100%; }
        .master-data-scroll { overflow: hidden; }
        @media (max-width: 760px) {
            .master-app-header-bar { grid-template-columns: minmax(0, 1fr) auto; padding-inline: 12px !important; }
            .master-app-header-actions .master-header-count { display: none; }
            .master-work-left,
            .master-work-right { width: 100%; }
            .master-work-right { flex-wrap: wrap; }
            .master-work-search { order: 10; width: 100%; max-width: none; flex-basis: 100%; }
            .master-data-scroll { overflow-x: auto; overflow-y: hidden; }
        }
    </style>

    <style>:root{--nexus-top-height:44px}nexus-top{display:block;min-height:var(--nexus-top-height)}.nexus-top-fallback{height:var(--nexus-top-height);padding:0 14px;display:flex;align-items:center;gap:12px;background:#0b1021;color:#fff;font:12px Pretendard,"Noto Sans KR",sans-serif}.nexus-top-fallback strong{letter-spacing:.08em}.nexus-top-fallback span{color:#cbd5e1}.nexus-top-fallback button{margin-left:auto;border:1px solid #64748b;border-radius:6px;padding:5px 9px;background:transparent;color:#fff;cursor:pointer}body>#root>.h-screen{height:calc(100vh - var(--nexus-top-height))!important}</style>
  <link rel="icon" type="image/png" href="/nexus/assets/nexus-favicon.png">

<body class="overflow-hidden text-slate-800">
    <nexus-top app-id="master"><div class="nexus-top-fallback" role="status"><strong>NEXUS</strong><span>NEXUS 메뉴를 불러오지 못했습니다.</span><button type="button" onclick="window.location.reload()">재시도</button></div></nexus-top>
    <div id="root"></div>

    <!-- White screen guard: shows startup/runtime errors instead of blank screen -->
    <div id="boot-error" style="display:none;position:fixed;inset:0;z-index:99999;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:32px;box-sizing:border-box;overflow:auto;">
        <div style="max-width:920px;margin:40px auto;background:white;border:1px solid #fecaca;border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,.12);overflow:hidden;">
            <div style="background:#991b1b;color:white;padding:18px 22px;font-weight:900;font-size:18px;">ONEAPP 초기화 오류</div>
            <div style="padding:22px;">
                <div id="boot-error-title" style="font-weight:900;font-size:18px;margin-bottom:10px;color:#991b1b;">화면을 불러오지 못했습니다.</div>
                <pre id="boot-error-detail" style="white-space:pre-wrap;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:14px;font-size:12px;line-height:1.6;color:#7f1d1d;overflow:auto;"></pre>
                <div style="margin-top:14px;font-size:12px;line-height:1.7;color:#475569;">개발자도구 Console 오류, CDN 차단 여부, 파일 경로, localStorage/IndexedDB 권한을 확인하십시오.</div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            function showBootError(title, detail) {
                var box = document.getElementById('boot-error');
                var titleEl = document.getElementById('boot-error-title');
                var detailEl = document.getElementById('boot-error-detail');
                if (!box || !titleEl || !detailEl) return;
                titleEl.textContent = title || '초기화 오류';
                detailEl.textContent = detail || '원인 정보 없음';
                box.style.display = 'block';
            }
            window.__showBootError = showBootError;
            window.addEventListener('error', function (e) {
                showBootError('스크립트 실행 오류', (e.message || 'Unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
            });
            window.addEventListener('unhandledrejection', function (e) {
                var reason = e.reason;
                showBootError('비동기 처리 오류', reason && reason.stack ? reason.stack : String(reason || 'Unknown rejection'));
            });
            window.addEventListener('load', function () {
                setTimeout(function () {
                    var missing = [];
                    if (!window.React) missing.push('React');
                    if (!window.ReactDOM) missing.push('ReactDOM');
                    if (!window.ONEAPP?.STORAGE) missing.push('ONEAPP Core');
                    if (missing.length) {
                        showBootError('필수 라이브러리 로드 실패', '누락 라이브러리: ' + missing.join(', '));
                        return;
                    }
                    var root = document.getElementById('root');
                    if (root && root.children.length === 0) {
                        showBootError('React 앱 렌더링 실패', '필수 라이브러리는 로드됐지만 #root가 비어 있습니다. 정적 앱 자산 또는 ReactDOM 실행 오류를 확인해야 합니다.');
                    }
                }, 2500);
            });
        })();
    </script>
</body>
