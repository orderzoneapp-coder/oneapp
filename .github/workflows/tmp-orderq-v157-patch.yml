name: Temporary ORDER Q v1.57 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.pull_request.title, 'ORDER Q v1.57') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Normalize temporary patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          patch_path = Path('scripts/tmp-orderq-v157-patch.py')
          patch_text = patch_path.read_text(encoding='utf-8')
          old = '    text = exact(text, anchor, replacement, "public sort/manager interaction test contracts")'
          new = '''    if text.count(anchor) != 2:\n        raise RuntimeError(f"public sort/manager interaction test contracts: expected 2 exact matches, got {text.count(anchor)}")\n    text = text.replace(anchor, replacement)'''
          if old not in patch_text:
              raise SystemExit('temporary main helper target not found')
          patch_text = patch_text.replace(old, new, 1)

          old_sort = '''        ["manager", "group", "customer"].forEach((role) => appendSetting(selectedByRole.get(role)));\n        selected.forEach((setting) => {'''
          new_sort = '''        ["manager", "group", "customer"].forEach((role) => appendSetting(selectedByRole.get(role)));\n        if (selectedByRole.has("group") && !selectedByRole.has("customer")) {\n          const customerColumn = columnsByRole.get("customer");\n          if (customerColumn) appendSetting({ columnKey: customerColumn.key, direction: "asc" });\n        }\n        selected.forEach((setting) => {'''
          if old_sort not in patch_text:
              raise SystemExit('temporary layered-sort target not found')
          patch_text = patch_text.replace(old_sort, new_sort, 1)
          patch_path.write_text(patch_text, encoding='utf-8')
          PY

      - name: Apply focused ORDER Q patch
        run: |
          python scripts/tmp-orderq-v157-patch.py
          python scripts/tmp-orderq-v157-postfix.py

      - name: Run focused shipping management regression
        run: node scripts/test-shipping-management.mjs

      - name: Run repository contract validation
        run: node scripts/validate-repository.mjs

      - name: Test client-side storage safety
        run: node scripts/test-client-safety.mjs

      - name: Check diff whitespace
        run: git diff --check

      - name: Remove temporary helpers and push final PR sources
        run: |
          rm -f .github/workflows/tmp-orderq-v157-patch.yml
          rm -f scripts/tmp-orderq-v157-patch.py
          rm -f scripts/tmp-orderq-v157-postfix.py
          rm -f scripts/tmp-orderq-v157-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "ORDER Q v1.57 누적정렬·정보집계·담당자변경 반영 [patched-v1.57]"
          git push origin HEAD:${{ github.head_ref }}
