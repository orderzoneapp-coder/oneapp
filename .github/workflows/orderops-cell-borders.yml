name: ORDER Q cell borders

on:
  pull_request:
    paths:
      - 'orderops/excel-preparation.css'
      - 'orderops/list.html'
      - 'orderops_list.html'
      - 'scripts/test-orderops-cell-borders-browser.mjs'
      - 'scripts/test-orderops-excel-preparation-browser.mjs'
      - '.github/workflows/orderops-cell-borders.yml'
  push:
    branches: [main]
    paths:
      - 'orderops/excel-preparation.css'
      - 'orderops/list.html'
      - 'orderops_list.html'
      - 'scripts/test-orderops-cell-borders-browser.mjs'
      - 'scripts/test-orderops-excel-preparation-browser.mjs'
      - '.github/workflows/orderops-cell-borders.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-grid:
    name: Verify ORDER Q screen and F9 cell borders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Korean font for PDF evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Capture base CSS with the same actual-app fixture
        if: github.event_name == 'pull_request'
        env:
          ORDEROPS_GRID_BASELINE: '1'
          ORDEROPS_GRID_BASELINE_REF: '${{ github.event.pull_request.base.sha }}'
          ORDEROPS_PREPARATION_EVIDENCE_DIR: '${{ runner.temp }}/orderops-grid-evidence/before'
        run: node scripts/test-orderops-cell-borders-browser.mjs
      - name: Verify fixed grid and run existing full browser regression
        env:
          ORDEROPS_PREPARATION_EVIDENCE_DIR: '${{ runner.temp }}/orderops-grid-evidence/after'
        run: node scripts/test-orderops-cell-borders-browser.mjs
      - name: Upload PDF, screenshots and measured borders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderops-cell-borders
          path: '${{ runner.temp }}/orderops-grid-evidence'
          if-no-files-found: error
          retention-days: 7
