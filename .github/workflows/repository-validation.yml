name: ONEAPP repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate manifest, files, and contracts
        run: node scripts/validate-repository.mjs

      - name: Test SmartInput independent recovery
        run: node scripts/test-smartinput-independent-recovery.mjs

      - name: Test SmartInput clipboard and parsers
        run: |
          node scripts/test-smartinput-grid-clipboard.mjs
          node scripts/test-smartinput-structured-sheet-parser.mjs
          node scripts/test-smartinput-multivoucher-stage1.mjs
          node scripts/test-smartinput-ocr.mjs

      - name: Test SmartInput browser isolation and persistence
        run: node scripts/test-smartinput-browser-e2e.mjs

      - name: Test client-side import and storage safety
        run: node scripts/test-client-safety.mjs

      - name: Test NEXUS common UI recovery contracts
        run: node scripts/test-nexus-common-ui-recovery.mjs

      - name: Test NEXUS basic login and home contracts
        run: node scripts/test-nexus-basic-login-home.mjs

      - name: Test NEXUS company profile contracts
        run: node scripts/test-nexus-company-profile.mjs

      - name: Test Master and Item Manager app-header separation
        run: node scripts/test-master-itemmanager-app-header.mjs

      - name: Test ORDER Q vNext cloud sync contracts
        run: node scripts/test-orderq-vnext-cloud-contract.mjs

      - name: Test ORDER Q order-document workflow
        run: node scripts/test-orderq-order-workflow.mjs

      - name: Test ORDER Q sales-transfer lifecycle and operations aggregation
        run: node scripts/test-orderq-fulfillment-lifecycle.mjs

      - name: Test ORDER Q manual product master search
        run: node scripts/test-orderq-manual-master-search.mjs

      - name: Test ORDER Q SmartParser contracts
        run: node scripts/test-orderq-smartparser.mjs

      - name: Test ORDER Q history collection and fulfillment stabilization
        run: node scripts/test-orderq-history-collector.mjs

      - name: Test ORDER Q cloud transaction atomicity
        run: node scripts/test-orderq-cloud-atomicity.mjs

      - name: Test DataOps zero and negative stock preservation
        run: node scripts/test-dataops-zero-stock-contract.mjs

      - name: Test DataOps operational integrity contracts
        run: node scripts/test-dataops-operational-integrity.mjs

      - name: Test DataOps manual substitution actual-error quantity
        run: node scripts/test-dataops-manual-substitution-actual-error.mjs

      - name: Test DataOps evidence report and F9 preflight
        run: node scripts/test-dataops-evidence-report-preflight.mjs

      - name: Test DataOps sales and Lot policy regressions
        run: node scripts/test-dataops-sales-lot-policy.mjs

      - name: Test DataOps code-primary product-name merge
        run: node scripts/test-dataops-code-primary-name-merge.mjs

      - name: Generate and reopen DataOps stock-count XLSX dates
        run: node scripts/test-dataops-stock-count-date.mjs

      - name: Generate and reopen DataOps administrator-merged whole-stock XLSX
        run: node scripts/test-dataops-whole-stock-admin-merge.mjs

      - name: Generate and reopen DataOps sales-upload XLSX columns
        run: node scripts/test-dataops-sales-upload-columns.mjs

      - name: Test DataOps substitution preview read-only behavior
        run: node scripts/test-dataops-substitution-preview-readonly.mjs

      - name: Test DataOps stock print readability
        run: node scripts/test-dataops-stock-print-readable.mjs

      - name: Test MerchOps sale availability pipeline
        run: node scripts/test-merchops-sale-pipeline.mjs

      - name: Test MerchOps master-theme filters and fixed toolbar layout
        run: node scripts/test-merchops-master-theme-filter-layout.mjs

      - name: Test MerchOps common Excel routing and subordinate registration tools
        run: node scripts/test-merchops-common-excel-routing.mjs

      - name: Test MerchOps column resize performance contract
        run: node scripts/test-merchops-column-resize-performance.mjs

      - name: Test MerchOps promotion catalog comparison policy
        run: node scripts/test-merchops-promo-catalog-compare.mjs

      - name: Generate and reopen real MerchOps promotion catalog comparison XLSX
        run: node scripts/test-merchops-promo-catalog-compare-xlsx-e2e.mjs

      - name: Generate and reopen a real MerchOps F8 XLSX workbook
        run: node scripts/test-merchops-f8-xlsx-e2e.mjs

      - name: Test MerchOps storage atomicity and concurrent saves
        run: node scripts/test-merchops-storage-atomicity.mjs

      - name: Test shared master writers, CAS rollback, and mixed locks
        run: node scripts/test-merchops-shared-storage.mjs

      - name: Test Master add/update review and rollback workflow
        run: node scripts/test-master-add-update.mjs

      - name: Read a real Master XLSX and verify approval persistence
        run: node scripts/test-master-add-update-xlsx-e2e.mjs

      - name: Test Master consolidation and ItemMaster compatibility contracts
        run: node scripts/test-itemmaster-standalone.mjs

      - name: Test Master registration, edit, legacy safety, and reload persistence
        run: node scripts/test-itemmaster-browser-e2e.mjs

      - name: Test MerchOps rule placement and SmartParser direct information apply
        run: node scripts/test-merchops-direct-info.mjs

      - name: Test MerchOps Excel codes, bulk edit, and price filters
        run: node scripts/test-merchops-spot-price.mjs

      - name: Test OrderOps allocation and workbook contracts
        run: node scripts/test-shipping-management.mjs

      - name: Test OrderOps purchase-plan cloud failure safety
        run: node scripts/test-shipping-purchase-plan-cloud.mjs

      - name: Test CustomerMaster source-link and import contracts
        run: node scripts/test-customer-master-independent.mjs

      - name: Test CustomerMaster browser workflow and legacy XLS
        run: node scripts/test-customer-master-browser-e2e.mjs
