name: Apply verified SmartInput save race fix
on:
  push:
    branches: [codex/smartinput-stage2-save-races-20260913]
    paths: [.github/workflows/smartinput-save-races-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'orderzoneapp-coder/oneapp' && github.ref == 'refs/heads/codex/smartinput-stage2-save-races-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/smartinput-stage2-save-races-20260913
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Confirm baseline failures against real source
        shell: bash
        run: |
          set +e
          node scripts/test-smartinput-save-races.mjs > /tmp/smartinput-save-before.txt 2>&1
          result=$?
          set -e
          cat /tmp/smartinput-save-before.txt
          test "$result" -ne 0
          grep -F 'FAIL: flush waits for the successor commit' /tmp/smartinput-save-before.txt
          grep -F 'FAIL: old ACK never reports an unqueued edit as saved' /tmp/smartinput-save-before.txt
      - name: Apply guarded narrow patch and remove one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'smartinput/draft-save-coordinator.js': 'f4a67d8b3ff1bf6e55d361f3eaca961abda1f448',
              'smartinput/smartinput.js': '4a41b820e0283c8935770cc024552df824503029',
              'scripts/test-smartinput-settings-ux.mjs': 'e2514604846b950dba8bf18b5b2890de9baaabfc',
              'scripts/test-smartinput-appheader-workspace.mjs': 'c7f5fd15e033a5a0180c8b23e6b82a353082dbbb',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == sha, f'Source changed: {name}: {actual}'
          def replace_once(name, before, after):
              path = Path(name)
              text = path.read_text()
              assert text.count(before) == 1, f'Expected unique patch context: {name}'
              path.write_text(text.replace(before, after))
          replace_once('smartinput/draft-save-coordinator.js',
              "      const state = stateFor(docKey);\n      if (state.inFlight) await state.inFlight.catch(() => undefined);\n      if (state.pending) await pump(docKey, state);\n      if (state.durableVersion < state.nextVersion) throw new Error('SMARTINPUT_AUTOSAVE_FLUSH_INCOMPLETE');\n      return { docKey, durableVersion: state.durableVersion };",
              "      const state = stateFor(docKey);\n      // Capture the leave boundary; edits queued later keep their own save tickets.\n      const targetVersion = state.nextVersion;\n      if (state.inFlight) await state.inFlight.catch(() => undefined);\n      while (state.durableVersion < targetVersion) {\n        // Completing one write can synchronously start its successor and clear pending.\n        if (state.inFlight) await state.inFlight;\n        else if (state.pending) await pump(docKey, state);\n        else throw new Error('SMARTINPUT_AUTOSAVE_FLUSH_INCOMPLETE');\n      }\n      return { docKey, durableVersion: state.durableVersion };")
          replace_once('smartinput/smartinput.js',
              "    setSaveState('자동저장됨', 'saved');\n    return result;",
              "    if (!state.draftDirty) setSaveState('자동저장됨', 'saved');\n    return result;")
          replace_once('smartinput/smartinput.js',
              "./draft-save-coordinator.js?v=0.1.0", "./draft-save-coordinator.js?v=0.1.1")
          replace_once('smartinput/index.html', 'smartinput.js?v=0.11.58', 'smartinput.js?v=0.11.59')
          for name in ['scripts/test-smartinput-settings-ux.mjs', 'scripts/test-smartinput-appheader-workspace.mjs']:
              replace_once(name, r'smartinput\.js\?v=0\.11\.58', r'smartinput\.js\?v=0\.11\.59')
          for path in Path('scripts').glob('test-smartinput-*.mjs'):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if '0.11.58' in line or r'0\.11\.58' in line:
                      print(f'REMAINING VERSION REFERENCE {path}:{number}: {line}')
          path = Path('scripts/test-smartinput-draft-save-coordinator.mjs')
          text = path.read_text()
          assert 'test-smartinput-save-races.mjs' not in text
          path.write_text(text + "\n// Run delayed-commit and stale-ACK regressions in the existing required CI entry.\nawait import('./test-smartinput-save-races.mjs');\n")
          Path('.github/workflows/smartinput-save-races-apply.yml').unlink()
          PY
          git diff --check
          git diff --stat
          git diff -- smartinput/draft-save-coordinator.js smartinput/smartinput.js smartinput/index.html scripts/test-smartinput-settings-ux.mjs scripts/test-smartinput-appheader-workspace.mjs scripts/test-smartinput-draft-save-coordinator.mjs
      - name: Run direct save and affected entry-point checks
        run: |
          node --check smartinput/smartinput.js
          node --check smartinput/draft-save-coordinator.js
          node scripts/test-smartinput-draft-save-coordinator.mjs
          node scripts/test-smartinput-settings-ux.mjs
          node scripts/test-smartinput-appheader-workspace.mjs
          node scripts/test-smartinput-independent-recovery.mjs
      - name: Run existing browser save and restore regression
        run: node scripts/test-smartinput-browser-e2e.mjs
      - name: Commit only verified changes to the isolated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smartinput/draft-save-coordinator.js smartinput/smartinput.js smartinput/index.html scripts/test-smartinput-settings-ux.mjs scripts/test-smartinput-appheader-workspace.mjs scripts/test-smartinput-draft-save-coordinator.mjs .github/workflows/smartinput-save-races-apply.yml
          git diff --cached --check
          git commit -m 'fix: wait for SmartInput durable saves and preserve newer save state'
          git push origin HEAD:refs/heads/codex/smartinput-stage2-save-races-20260913
          git rev-parse HEAD
          git status --short
