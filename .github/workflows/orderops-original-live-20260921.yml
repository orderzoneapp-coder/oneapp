name: Verify deployed original OrderOps 20260921

on:
  push:
    branches: [verify/orderops-original-live-20260921]
    paths: [.github/workflows/orderops-original-live-20260921.yml]

permissions:
  contents: read

jobs:
  live:
    name: Verify deployed original bytes and Chromium workflow
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9e40d378e51d380133c3d61fb111595e0e8f1937
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check approved original contract
        run: node scripts/test-orderops-original-recovery.mjs
      - name: Verify deployed HTML and pinned modules by GET only
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          origin = 'https://oneapp.orderz.co.kr'
          files = ['orderops_list.html', 'orderops/stable/20260917/orderFulfillmentEngine.js', 'orderops/stable/20260917/orderFulfillmentWorkbook.js']
          report = {'origin': origin, 'expected_commit': '9e40d378e51d380133c3d61fb111595e0e8f1937', 'method': 'Unauthenticated GET only; exact bytes against checked-out deployment', 'assets': []}
          for name in files:
              expected = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for attempt in range(6):
                  request = urllib.request.Request(origin + '/' + name, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status, data = response.status, response.read()
                  actual = hashlib.sha256(data).hexdigest()
                  if status == 200 and actual == expected:
                      break
                  if attempt < 5:
                      time.sleep(3)
              report['assets'].append({'path': name, 'http_status': status, 'expected_sha256': expected, 'actual_sha256': actual, 'match': actual == expected})
              assert status == 200 and actual == expected, 'Deployed source mismatch: ' + name
              print('PASS deployed exact bytes:', name, actual)
          out = Path('/tmp/orderops-original-browser')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'deployed-assets.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PY
      - name: Install pinned driver and Korean evidence font
        run: |
          python -m pip install playwright==1.57.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise actual deployed original in isolated Chromium
        env:
          ORDEROPS_LIVE_ORIGIN: https://oneapp.orderz.co.kr
          PYTHONUNBUFFERED: '1'
        run: python scripts/test-orderops-original-recovery-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-original-orderops-evidence
          path: /tmp/orderops-original-browser
          retention-days: 7
          if-no-files-found: error
