name: ORDER Q heading contrast

on:
  pull_request:
    paths:
      - 'orderops/excel-preparation.css'
      - 'orderops/list.html'
      - 'orderops_list.html'
      - 'scripts/test-orderops-heading-contrast-browser.mjs'
      - 'scripts/test-orderops-print-grid-browser.mjs'
      - 'scripts/test-orderops-excel-preparation-browser.mjs'
      - 'scripts/test-orderops-original-recovery.mjs'
      - '.github/workflows/orderops-heading-contrast.yml'
  push:
    branches: [main]
    paths:
      - 'orderops/excel-preparation.css'
      - 'orderops/list.html'
      - 'orderops_list.html'
      - 'scripts/test-orderops-heading-contrast-browser.mjs'
      - 'scripts/test-orderops-print-grid-browser.mjs'
      - 'scripts/test-orderops-excel-preparation-browser.mjs'
      - 'scripts/test-orderops-original-recovery.mjs'
      - '.github/workflows/orderops-heading-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heading-contrast:
    name: Verify retained modern ORDER Q heading contrast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Korean font for readable evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Check retained modern heading colors and full browser regression
        env:
          # This suite requires the modern preparation controller. Run its
          # unchanged assertions against historical modern HTML/current modules.
          # The restored production root has its own Original OrderOps CI.
          ORDEROPS_PREPARATION_EVIDENCE_DIR: '${{ runner.temp }}/orderops-heading-evidence'
        run: node scripts/test-orderops-original-recovery.mjs --modern test-orderops-heading-contrast-browser.mjs
      - name: Upload screenshots and measured colors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderops-heading-contrast
          path: '${{ runner.temp }}/orderops-heading-evidence'
          if-no-files-found: error
          retention-days: 7
  print-grid:
    name: Verify retained modern ORDER Q paginated print grid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Korean font for readable print evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify retained modern Excel to F9 PDFs, cell borders, colors and data preservation
        env:
          ORDEROPS_PRINT_GRID_BASELINE: '0ff3af7461a335b3201a0752492c78bd88dee1e0'
          ORDEROPS_PREPARATION_EVIDENCE_DIR: '${{ runner.temp }}/orderops-print-grid-evidence'
        run: node scripts/test-orderops-original-recovery.mjs --modern test-orderops-print-grid-browser.mjs
      - name: Upload print PDFs and measured cell borders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderops-print-grid
          path: '${{ runner.temp }}/orderops-print-grid-evidence'
          if-no-files-found: error
          retention-days: 7
