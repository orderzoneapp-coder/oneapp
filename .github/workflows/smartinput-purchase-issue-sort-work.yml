name: SmartInput purchase issue sort work
on:
  push:
    branches: ['fix/smartinput-purchase-issue-sort-20260923']
    paths: ['.github/workflows/smartinput-purchase-issue-sort-work.yml']
permissions:
  contents: write
jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/smartinput-purchase-issue-sort-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify baseline and affected contracts
        run: |
          test "$(git rev-parse origin/main)" = a80467f45cf5e1ff59c740254d58febb3a955f39
          git diff --exit-code origin/main -- smartinput scripts
          find smartinput scripts -name AGENTS.md -print
          git grep -n 'purchase-sales-output.js' -- '*.js' '*.mjs'
          git grep -n -E '확인요청|CHECK_HEADERS|CHECK_WIDTHS' -- scripts/test-smartinput-purchase-sales-output.mjs
          node -e "const m=require('./app-manifest.json');console.log(JSON.stringify(m.apps?.find(a=>a.id==='smart-input'),null,2))"
          node scripts/test-smartinput-purchase-sales-output.mjs
          cp smartinput/purchase-sales-output.js smartinput/.purchase-sales-output.baseline.mjs
      - name: Add issue column and sort confirmation rows only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              assert s.count(old)==count, (path,old,s.count(old))
              p.write_text(s.replace(old,new))
          path='smartinput/purchase-sales-output.js'
          replace(path,"const CHECK_HEADERS = Object.freeze(['그룹',", "const CHECK_HEADERS = Object.freeze(['이슈', '그룹',")
          replace(path,'const CHECK_WIDTHS = Object.freeze([14, 16, 14, 34, 10, 42]);','const CHECK_WIDTHS = Object.freeze([12, 14, 16, 14, 34, 10, 42]);')
          replace(path,"reason: fatalReasons.join(', '), level: '업로드불가'", "reason: fatalReasons.join(', '), reasons: [...fatalReasons], level: '업로드불가'")
          replace(path,"reason: reasons.join(', '), groupName: resolved.groupName", "reason: reasons.join(', '), reasons: [...reasons], groupName: resolved.groupName")
          helper='''// Classify existing diagnostics only; never change price selection or validation policy.
          function purchaseCheckIssue(reason = '') {
            if (reason.includes('역마진')) return '역마진';
            if (reason.includes('도매A과대의심')) return '도매A';
            if (reason.includes('수량')) return '수량';
            if (reason.includes('입고가 없음')) return '입고가';
            if (reason.includes('단가그룹')) return '단가그룹';
            if (reason.includes('판매단가')) return '판매단가';
            if (reason.includes('거래처명 없음')) return '거래처';
            if (reason.includes('품목코드 없음')) return '품목코드';
            if (reason.includes('품명 없음')) return '품명';
            return '기타';
          }

          function purchaseIssueRows(entry, fatal = false) {
            // Keep structured reasons: splitting a comma-delimited string would corrupt prices.
            const reasons = entry.reasons?.length ? entry.reasons : [entry.reason || '확인필요'];
            const byIssue = new Map();
            reasons.forEach(reason => {
              const issue = purchaseCheckIssue(reason);
              byIssue.set(issue, [...(byIssue.get(issue) || []), reason]);
            });
            return [...byIssue].map(([issue, details]) => ({
              '이슈': issue,
              '그룹': entry.customer || '', '거래처': entry.spec || entry.outputCustomer || '',
              '품목코드': entry.code || '', '품명': entry.name || '', '수량': entry.qty || 0,
              '확인사항': `${fatal ? '업로드불가: ' : ''}${details.join(', ')}`
            }));
          }

          function sortPurchaseIssueRows(rows) {
            const compare = new Intl.Collator('ko-KR', { numeric: true, sensitivity: 'base' }).compare;
            return rows.sort((left, right) => compare(left['이슈'], right['이슈'])
              || compare(left['품목코드'], right['품목코드'])
              || compare(left['그룹'], right['그룹'])
              || compare(left['거래처'], right['거래처']));
          }

          '''
          replace(path,'export function buildPurchaseSalesUploadData(',helper+'export function buildPurchaseSalesUploadData(')
          p=Path(path); s=p.read_text(); start=s.index('  const checkRows = ['); end=s.index('  const settingRows = ',start)
          s=s[:start]+'''  const checkRows = sortPurchaseIssueRows([
              ...fatalErrors.flatMap(error => purchaseIssueRows(error, true)),
              ...warnings.flatMap(warning => purchaseIssueRows(warning))
            ]);
            if (!checkRows.length) checkRows.push({ '이슈': '', '그룹': '', '거래처': '', '품목코드': '', '품명': '', '수량': '', '확인사항': '확인필요 항목 없음' });
          '''+s[end:]
          p.write_text(s)
          replace(path,"./stage5-compute-runner.js?v=0.1.1", "./stage5-compute-runner.js?v=0.1.3")
          replace('smartinput/stage5-compute-runner.js','./stage5-compute-worker.js?v=0.1.2','./stage5-compute-worker.js?v=0.1.3')
          replace('smartinput/stage5-compute-worker.js','./purchase-sales-output.js?v=0.1.2','./purchase-sales-output.js?v=0.1.3')
          replace('smartinput/smartinput.js',"assetVersion: '0.1.2', specifier: './purchase-sales-output.js?v=0.1.2'", "assetVersion: '0.1.3', specifier: './purchase-sales-output.js?v=0.1.3'")
          replace('smartinput/index.html','smartinput.js?v=0.15.2','smartinput.js?v=0.15.3',2)
          replace('scripts/test-smartinput-purchase-sales-output.mjs',"const checkText = output.matrices['확인요청'].slice(1).map(values => values[5]).join('\\n');", "const checkText = output.matrices['확인요청'].slice(1).map(values => values[6]).join('\\n');")
          PY
      - name: Add issue-sort and workbook regression coverage
        run: |
          cat >> scripts/test-smartinput-purchase-sales-output.mjs <<'JS'

          // Confirmation presentation only: all transaction matrices and price policies stay intact.
          assert.deepEqual(PURCHASE_SALES_UPLOAD_HEADERS.check, ['이슈','그룹','거래처','품목코드','품명','수량','확인사항']);
          const issueFixtures = [
            row('5온산','5온산','104560112',2,{입고가:20000,식자재:3000}),
            row('3우리','마산99번','104550112',2,{입고가:1000,도매A:4000}),
            row('1마산','마산75번','104014110',0,{입고가:1000,청과:2000}),
            row('4연산','4연산','104560112',3,{입고가:20000,식자재:3000}),
            row('1마산','마산99번','104550112',2,{입고가:1000,도매A:4000}),
            row('3우리','중앙170','103044110',1,{입고가:75000,도매A:51000}),
            row('2중앙','중앙170','103044110',1,{입고가:75000,도매A:51000}),
            row('3우리','내부입고가없음','000123',1,{입고가:0}),
            row('미등록','혼합이슈','MIXED',1,{'품목명(규격)':''}),
            row('4연산','복합필수값','', '잘못된수량',{식자재:6000})
          ];
          const beforeIssues = structuredClone(issueFixtures);
          const issueOutput = buildPurchaseSalesUploadData(issueFixtures);
          const issueRows = issueOutput.matrices['확인요청'].slice(1);
          const compareIssue = new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'}).compare;
          const issueComparator = (a,b) => compareIssue(a[0],b[0]) || compareIssue(a[3],b[3]) || compareIssue(a[1],b[1]) || compareIssue(a[2],b[2]);
          assert.deepEqual(issueRows, [...issueRows].sort(issueComparator));
          assert.deepEqual(issueFixtures,beforeIssues,'Sorting diagnostics must not mutate source records.');
          assert.deepEqual(issueRows.filter(r=>r[0]==='도매A').map(r=>[r[1],r[3],r[5]]),[
            ['1마산','104550112',2],['3우리','104550112',2]
          ]);
          assert.deepEqual(issueRows.filter(r=>r[0]==='역마진').map(r=>[r[3],r[1],r[5]]),[
            ['103044110','2중앙',1],['103044110','3우리',1],['104560112','4연산',3],['104560112','5온산',2]
          ]);
          assert.equal(issueRows.some(r=>r[0]==='입고가' && r[3]==='000123'),true,'Leading-zero product codes must stay text.');
          assert.deepEqual(issueRows.filter(r=>r[3]==='MIXED').map(r=>r[0]),['단가그룹','품명'],'Different issues in one source row must remain separately discoverable.');
          assert.equal(issueRows.filter(r=>r[2]==='복합필수값').every(r=>r[6].startsWith('업로드불가: ')),true);
          assert.equal(issueRows.filter(r=>r[0]==='도매A').every(r=>r[6].includes('1,000') && r[6].includes('4,000')),true,'Do not split number thousands separators.');
          const duplicateIssues = buildPurchaseSalesUploadData([issueFixtures[0],issueFixtures[0]]).matrices['확인요청'];
          assert.equal(duplicateIssues.length,3,'Identical transaction rows must not be merged or dropped.');
          const noIssues = buildPurchaseSalesUploadData([row('4연산','정상','NORMAL',1,{식자재:6000})]).matrices['확인요청'];
          assert.deepEqual(noIssues[1],['','','','','','','확인필요 항목 없음']);
          const confirmationReopened = XLSX.utils.sheet_to_json(reopened.Sheets['확인요청'],{header:1,raw:true,defval:'',blankrows:false});
          assert.deepEqual(JSON.parse(JSON.stringify(confirmationReopened)),output.matrices['확인요청'],'The emitted XLSX must retain the sorted issue matrix.');
          console.log('PASS: issue/product/group/customer order, multi-issue rows, duplicate preservation, zero/negative quantities, unchanged reasons, and XLSX round trip');
          JS
          cat >> scripts/test-smartinput-stage5-compute.mjs <<'JS'

          const purchaseIssueRows = Array.from({length:600},(_,index)=>({
            거래처:index%2?'4연산':'1마산', 거래처명:`검증거래처${index%7}`,
            코드:`ITEM-${index}`, 품명:`검증상품${index}`, 수량: index%3?2:0,
            입고가:index%2?20000:1000, 도매A:index%2?3000:4000
          }));
          const purchaseIssueMetrics=[];
          const purchaseIssueOutput=await runStage5Compute({
            feature:'purchase-sales-report',phase:'PURCHASE_SALES_BUILD',
            payload:{rows:purchaseIssueRows},rowCount:purchaseIssueRows.length,
            direct:()=>buildPurchaseSalesUploadData(purchaseIssueRows),
            workerFactory:()=>new InlineModuleWorker(),onMetric:m=>purchaseIssueMetrics.push(m)
          });
          assert.equal(purchaseIssueMetrics.at(-1).path,'worker');
          assert.deepEqual(purchaseIssueOutput,buildPurchaseSalesUploadData(purchaseIssueRows));
          assert.equal(purchaseIssueOutput.matrices['확인요청'][0][0],'이슈');
          assert.equal(purchaseIssueOutput.matrices['판매입력'].length,601);
          console.log('PASS: 600 purchase issue rows retain Worker/direct parity');
          JS
          node scripts/test-smartinput-purchase-sales-output.mjs
          node scripts/test-smartinput-stage5-compute.mjs
          node scripts/test-smartinput-stage5-feature-loading.mjs
          node scripts/test-smartinput-estimate-f8.mjs
          node scripts/test-smartinput-stage3-f8-baseline.mjs
          node scripts/test-smartinput-f8-upload-contract.mjs
          node scripts/test-smartinput-input-boundary.mjs
          node scripts/validate-repository.mjs
      - name: Differential baseline verification of all non-confirmation output
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { buildPurchaseSalesUploadData as before } from './smartinput/.purchase-sales-output.baseline.mjs';
          import { buildPurchaseSalesUploadData as after } from './smartinput/purchase-sales-output.js';
          const groups=['1마산','2중앙','3우리','4연산','5온산','9부산','미등록'];
          const rows=Array.from({length:700},(_,i)=>({거래처:groups[i%7],거래처명:`거래처${i%11}`,코드:i%23?`000${i}`:'',품명:`품목${i}`,수량:i%13?i%5-2:'오류',입고가:i%3?75000:0,도매A:i%2?51000:400000,식자재:i%3?3000:0,청과:i%4?0:90000,'출고(외노)':80000,상장가:84000}));
          const input=structuredClone(rows); const options={now:new Date('2026-09-23T12:00:00Z')};
          const a=before(rows,options); const b=after(rows,options);
          assert.deepEqual(rows,input);
          assert.deepEqual(b.stats,a.stats);
          assert.deepEqual(b.sheetNames,a.sheetNames);
          assert.equal(b.fileName,a.fileName);
          for(const name of a.sheetNames.filter(n=>n!=='확인요청')){
            assert.deepEqual(b.matrices[name],a.matrices[name],name);
            assert.deepEqual(b.widths[name],a.widths[name],`${name} widths`);
          }
          console.log('PASS: 700 mixed records; all SIX other sheets, price/fee results, source rows and warning/fatal statistics exactly match unchanged baseline');
          JS
          rm smartinput/.purchase-sales-output.baseline.mjs
          git diff --check
      - name: Commit only approved source and regression files
        run: |
          python3 - <<'PY'
          import subprocess
          expected={'smartinput/purchase-sales-output.js','smartinput/stage5-compute-runner.js','smartinput/stage5-compute-worker.js','smartinput/smartinput.js','smartinput/index.html','scripts/test-smartinput-purchase-sales-output.mjs','scripts/test-smartinput-stage5-compute.mjs'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PY
          git add smartinput/purchase-sales-output.js smartinput/stage5-compute-runner.js smartinput/stage5-compute-worker.js smartinput/smartinput.js smartinput/index.html scripts/test-smartinput-purchase-sales-output.mjs scripts/test-smartinput-stage5-compute.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(smartinput): sort purchase confirmation output by issue and product'
          git push origin HEAD:fix/smartinput-purchase-issue-sort-20260923
          git rev-parse HEAD
