name: MerchOps F8 isolated work
on:
  push:
    branches: [fix/merchops-f8-market-erp11-20260913]
    paths: [.github/workflows/merchops-f8-work.yml]
permissions:
  contents: write
concurrency:
  group: merchops-f8-isolated-fix
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact guarded source and test changes
        run: |
          set -euo pipefail
          python .github/merchops-f8-apply-once.py
          python .github/merchops-f8-test-patch.py
          test "$(git hash-object MerchOps.html)" = d4b30aa49e67a5cb056ab99cacc9af615f8f43ce
          test "$(git hash-object coreEngine.js)" = cd81e50956778a2c02c767341af1134c98e50faa
          git diff --check
          git diff --name-only > /tmp/merchops-f8-files.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {'MerchOps.html', 'coreEngine.js', 'scripts/test-merchops-common-excel-routing.mjs', 'scripts/test-merchops-f8-xlsx-e2e.mjs', 'scripts/test-merchops-master-reference-isolation.mjs', 'scripts/test-merchops-master-theme-filter-layout.mjs', 'scripts/test-merchops-promo-catalog-compare.mjs', 'scripts/test-merchops-shared-storage.mjs', 'scripts/test-oneapp-parser-wh-20260802-01.mjs'}
          actual = set(Path('/tmp/merchops-f8-files.txt').read_text().splitlines())
          assert actual == allowed, (actual - allowed, allowed - actual)
          PY
      - name: Verify actual XLSX outputs and regression suites
        env:
          MERCHOPS_F8_EVIDENCE_DIR: /tmp/merchops-f8-evidence/xlsx
        run: |
          set -euo pipefail
          mkdir -p /tmp/merchops-f8-evidence
          node scripts/test-merchops-f8-xlsx-e2e.mjs 2>&1 | tee /tmp/merchops-f8-evidence/f8.log
          node scripts/test-merchops-all.mjs 2>&1 | tee /tmp/merchops-f8-evidence/merchops-suite.log
          node scripts/test-oneapp-parser-wh-20260802-01.mjs 2>&1 | tee /tmp/merchops-f8-evidence/parser-regression.log
          node scripts/test-client-safety.mjs 2>&1 | tee /tmp/merchops-f8-evidence/client-safety.log
          node scripts/validate-repository.mjs 2>&1 | tee /tmp/merchops-f8-evidence/repository.log
          git diff --binary > /tmp/merchops-f8-evidence/verified.patch
      - name: Commit only verified changes and remove temporary execution files
        run: |
          set -euo pipefail
          git config user.name 'orderzoneapp-coder'
          git config user.email 'orderzoneapp@gmail.com'
          git add MerchOps.html coreEngine.js scripts/test-merchops-common-excel-routing.mjs scripts/test-merchops-f8-xlsx-e2e.mjs scripts/test-merchops-master-reference-isolation.mjs scripts/test-merchops-master-theme-filter-layout.mjs scripts/test-merchops-promo-catalog-compare.mjs scripts/test-merchops-shared-storage.mjs scripts/test-oneapp-parser-wh-20260802-01.mjs
          git rm .github/merchops-f8-apply-once.py .github/merchops-f8-test-patch.py .github/merchops-f8-cases.txt .github/workflows/merchops-f8-work.yml
          git commit -m 'fix(merchops): preserve calculated market price and use confirmed ERP11 output'
          git push origin HEAD:refs/heads/fix/merchops-f8-market-erp11-20260913
          git rev-parse HEAD > /tmp/merchops-f8-evidence/verified-head.txt
          git -c core.quotepath=false ls-tree -r HEAD > /tmp/merchops-f8-evidence/verified-blobs.txt
          git diff --name-only 7c11b0b53770c3daa3d872edcd9d578553e71c34 HEAD > /tmp/merchops-f8-evidence/final-changed-files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchops-f8-verified-evidence
          path: /tmp/merchops-f8-evidence/*
          retention-days: 7
