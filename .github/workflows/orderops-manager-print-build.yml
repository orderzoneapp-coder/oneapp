name: OrderOps manager print verification
on:
  push:
    branches: [fix/orderops-manager-print-work-20260919]
    paths: [.github/workflows/orderops-manager-print-build.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_COMMIT: d0065f611cc192cf38be733c185af2357b8062db
      PRINT_BASE_URL: https://oneapp.orderz.co.kr
      PRINT_EVIDENCE_DIR: /tmp/manager-print-evidence
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare isolated print verification
        run: |
          mkdir -p /tmp/manager-print-evidence
          python3 -m pip install playwright==1.57.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/orderops-print-smoke.py').read_text()
          old="color='rgb(185, 28, 28)' if 'unit-alert-row' in row['classes'] else 'rgb(15, 23, 42)'"
          new="color='rgb(23, 32, 51)' if path=='orderops_list.html' else ('rgb(185, 28, 28)' if 'unit-alert-row' in row['classes'] else 'rgb(15, 23, 42)')"
          assert s.count(old)==1
          Path('/tmp/orderops-print-smoke.py').write_text(s.replace(old,new))
          PY
      - name: Wait for exact reviewed HTML at both operating URLs
        run: |
          python3 - <<'PY'
          import urllib.request,time,os,pathlib,json,hashlib
          sha=os.environ['EXPECTED_COMMIT'];base=os.environ['PRINT_BASE_URL']
          paths=['orderops/list.html','orderops_list.html']
          expected={p:urllib.request.urlopen(f'https://raw.githubusercontent.com/orderzoneapp-coder/oneapp/{sha}/{p}',timeout=30).read() for p in paths}
          for attempt in range(80):
            try:
              actual={p:urllib.request.urlopen(urllib.request.Request(base+'/'+p,headers={'Cache-Control':'no-cache'}),timeout=20).read() for p in paths}
              if all(actual[p]==expected[p] for p in paths): break
            except Exception as error: print(type(error).__name__,str(error),flush=True)
            time.sleep(5)
          else: raise RuntimeError('Reviewed source was not deployed within the verification window')
          report={'expected_commit':sha,'source_hashes':{p:hashlib.sha256(actual[p]).hexdigest() for p in paths},'urls':{p:base+'/'+p for p in paths}}
          pathlib.Path('/tmp/manager-print-evidence/deployed-source.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Verify actual operating print output without server writes
        run: |
          set -euo pipefail
          python3 /tmp/orderops-print-smoke.py 2>&1 | tee /tmp/manager-print-evidence/live-print.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: orderops-manager-print-live-evidence
          path: /tmp/manager-print-evidence
          retention-days: 7
