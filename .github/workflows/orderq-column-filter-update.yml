name: Branch-only ORDER Q filter update
on:
  push:
    branches: ['codex/orderq-filter-exclusions-20260923']
    paths:
      - scripts/apply-orderq-column-filter-update.py
      - .github/workflows/orderq-column-filter-update.yml
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.ref == 'refs/heads/codex/orderq-filter-exclusions-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply only exact reviewed source replacements
        run: |
          python scripts/apply-orderq-column-filter-update.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-orderops-original-recovery-browser.py')
          s = p.read_text()
          before = "    page.get_by_role('button', name=label + ' 정렬 및 조건 필터', exact=True).click()"
          after = "    trigger = page.locator('#previewTable .column-sort-trigger[aria-label=' + json.dumps(label + ' 정렬 및 조건 필터', ensure_ascii=False) + ']')\n    trigger.locator('xpath=ancestor::th').hover()\n    trigger.click()"
          assert s.count(before) == 1
          s = s.replace(before, after)
          before = "                p.get_by_role('button', name=label, exact=True).click()"
          after = "                trigger = p.locator('#previewTable .column-sort-trigger[aria-label=' + json.dumps(label, ensure_ascii=False) + ']')\n                trigger.locator('xpath=ancestor::th').hover()\n                trigger.click()"
          assert s.count(before) == 1
          p.write_text(s.replace(before, after))
          PY
          git diff --check
          python -m py_compile scripts/test-orderops-original-recovery-browser.py
          node --check scripts/test-orderops-original-recovery.mjs
      - name: Validate pinned source and existing recovery contracts
        run: node scripts/test-orderops-original-recovery.mjs
      - name: Install pinned browser driver
        run: python -m pip install playwright==1.57.0
      - name: Test actual original UI and independent filter exclusions
        run: python scripts/test-orderops-original-recovery-browser.py
      - name: Preserve the tested patch on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orderops_list.html scripts/test-orderops-original-recovery.mjs scripts/test-orderops-original-recovery-browser.py
          git commit -m 'fix(orderq): keep universal blank and quantity zero exclusions independent of value selection'
          git push origin HEAD:refs/heads/codex/orderq-filter-exclusions-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orderq-column-filter-verification
          path: /tmp/orderops-original-browser
          if-no-files-found: ignore
          retention-days: 7
