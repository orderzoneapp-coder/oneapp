name: Customer source-link one-shot patch

on:
  push:
    branches:
      - codex/customer-source-link-erp-shop
    paths:
      - .github/workflows/customer-source-link-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/customer-source-link-erp-shop
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply source-link patch
        run: node scripts/apply-customer-source-link-patch.mjs
      - name: Remove one-shot helper and commit
        run: |
          rm -f scripts/apply-customer-source-link-patch.mjs .github/workflows/customer-source-link-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(customer): complete ERP and SHOP source-link backend"
          git push origin HEAD:codex/customer-source-link-erp-shop
