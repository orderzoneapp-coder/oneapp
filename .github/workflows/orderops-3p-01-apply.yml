name: ORDEROPS-3P-01 guarded main apply
on:
  push:
    branches: [main]
    paths: [.github/workflows/orderops-3p-01-apply.yml]
permissions:
  contents: write
concurrency:
  group: orderops-3p-01-main-apply
  cancel-in-progress: false
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build hash-guarded candidate without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orderops-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/orderops-evidence/base-commit.txt"
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/orderzoneapp-coder/oneapp/git/blobs/f422b3c0b1206ce867053a7a770eb9126cea36a9 > "$RUNNER_TEMP/orderops-bundle-blob.json"
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          raw=lzma.decompress(base64.b64decode(json.loads((temp/'orderops-bundle-blob.json').read_text())['content']))
          assert hashlib.sha256(raw).hexdigest()=='53feba8f7c98cc88146df127ed1ce95ae621e04541dd594c552f3236d3df09bd','Payload integrity mismatch'
          bundle=json.loads(raw)
          for name in bundle['new']:
              assert not Path(name).exists(), 'Concurrent new file: '+name
          for name,sha in bundle['expected'].items():
              data=Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha, 'Concurrent file change: '+name
          namespace={'__name__':'orderops_installer','__file__':str(temp/'installer.py')}
          exec(compile(bundle['installer'],'guarded-orderops-installer','exec'),namespace)
          namespace['install'](Path.cwd())
          for name,content in bundle['files'].items():
              path=Path(name)
              assert name in bundle['allowed'] and not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content,encoding='utf-8')
          (temp/'orderops-allowed.json').write_text(json.dumps(bundle['allowed']))
          hashes={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in bundle['allowed']}
          (temp/'orderops-evidence/source-hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
          git diff --check
      - name: Existing and new unit contracts
        run: |
          set -euo pipefail
          for test in test-orderops-workbench-contract test-orderops-orderq-source test-orderops-shipment-result test-orderops-three-section-preview test-orderops-operations-improvements test-orderq-shipment-read-model test-orderq-substitute-shipment test-orderq-system-message-review test-orderops-pr544-operator-flow test-common-inventory-snapshot test-orderops-three-pane; do
            node "scripts/$test.mjs" | tee "$RUNNER_TEMP/orderops-evidence/$test.log"
          done
          for source in orderops/three-pane-layout.js orderops/voucher-workbench.js orderops/source-coordinator.js orderops/workbench-ui.js orderFulfillmentEngine.js; do node --check "$source"; done
      - name: Three-pane browser operations
        env:
          ORDEROPS_EVIDENCE_DIR: ${{ runner.temp }}/orderops-evidence/three-pane
        run: node scripts/test-orderops-three-pane-browser.mjs
      - name: Inventory calculation and purchase information browser regression
        env:
          ORDEROPS_EVIDENCE_DIR: ${{ runner.temp }}/orderops-evidence/inventory
        run: node scripts/test-orderops-inventory-purchase-info-columns.mjs
      - name: Commit only verified workbench files to main
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          paths=json.loads((Path(os.environ['RUNNER_TEMP'])/'orderops-allowed.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(changed)==set(paths),f'Unexpected staged changes: {changed}'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(orderops): ORDEROPS-3P-01 three-pane workbench' -m 'Direct main application requested by operator. Preserve original page, SmartInput, shared header and existing calculation algorithms. Roll back this application commit only; never reset unrelated main changes. Unit and browser checks ran before this commit.'
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/orderops-evidence/application-commit.txt"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderops-3p-01-evidence
          path: ${{ runner.temp }}/orderops-evidence
          retention-days: 14
