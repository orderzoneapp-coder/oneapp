name: SmartInput Stage 3 continuation source
on:
  push:
    branches: [codex/smartinput-stage3-independent-estimates-20260913]
    paths: [.github/workflows/smartinput-stage3-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 732e2922b36d5cfaf057b14446bca1bea87971dc
          persist-credentials: false
      - name: Archive current source and exact blob manifest
        run: |
          git archive --format=tar HEAD > /tmp/stage3-main-732e2922.tar
          git ls-tree -r HEAD > /tmp/stage3-main-732e2922-blobs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-main-732e2922
          path: /tmp/stage3-main-732e2922*
          retention-days: 3
