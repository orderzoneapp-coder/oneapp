name: NEXUS cache-bust update

on:
  push:
    branches:
      - fix/nexus-header-cache-bust

permissions:
  contents: write

jobs:
  update-shared-header-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nexus-header-cache-bust
          fetch-depth: 0
      - name: Update shared header asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'apps-config.js?v=1.3.0': 'apps-config.js?v=1.4.0',
              'nexus-top.js?v=1.3.0': 'nexus-top.js?v=1.4.0',
              'apps-config\\.js\\?v=1\\.3\\.0': 'apps-config\\.js\\?v=1\\.4\\.0',
              'nexus-top\\.js\\?v=1\\.3\\.0': 'nexus-top\\.js\\?v=1\\.4\\.0',
          }
          extensions = {'.html', '.js', '.mjs', '.md', '.json'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          Path('.github/workflows/nexus-cache-bust.yml').unlink()
          print('\n'.join(changed))
          PY
      - name: Commit version update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(nexus): refresh shared header asset version'
          git push origin HEAD:fix/nexus-header-cache-bust
