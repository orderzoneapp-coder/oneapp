name: NEXUS one-shot policy document application
on:
  push:
    branches: [codex/nexus-policy-guidelines-20260908]
    paths: [.github/workflows/nexus-policy-doc-apply.yml]
permissions:
  contents: write
concurrency:
  group: nexus-policy-document-application
  cancel-in-progress: false
jobs:
  apply-documents:
    if: github.ref == 'refs/heads/codex/nexus-policy-guidelines-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Apply approved architecture sections and verify preserved contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('APP_ARCHITECTURE.md')
          raw = p.read_bytes()
          digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert digest == '77d6831e34c21af34f37da1f122c5c0ad50a6450', 'Architecture baseline changed; stop without writing'
          old = raw.decode('utf-8')
          text = old
          def replace_once(source, before, after):
              assert source.count(before) == 1, 'Expected one replacement anchor: ' + before[:100]
              return source.replace(before, after, 1)
          def span(source, start, end=None):
              assert source.count(start) == 1, 'Missing or ambiguous section: ' + start
              begin = source.index(start)
              finish = source.index(end, begin) if end else len(source)
              return source[begin:finish]
          def replace_section(source, start, end, body):
              previous = span(source, start, end)
              return replace_once(source, previous, body.strip() + '\n\n')
          purpose = '''## 1. 문서 목적

          NEXUS는 각 앱이 기본 업무를 독립적으로 수행하고 필요한 정보와 결과만 계약으로 주고받는 앱 집합이다. 이 문서는 앱의 역할, 데이터 소유권, 실행·연동 경계, 공통 UI, 성능·장애 격리, 영향 범위와 복구 계약을 정의한다.

          ### 1.1 문서별 책임

          | 구분 | 관리하는 내용 |
          |---|---|
          | 사용자 확정 작업 지시·명세 | 해당 작업의 목적·범위·처리규칙·승인·완료조건 |
          | AGENTS.md | 승인 범위 준수, 데이터·작업 보호, 실행·검증·완료 보고의 공통 규범 |
          | APP_ARCHITECTURE.md | 앱 구조·데이터 계약·공통 UI·성능·실패 격리·영향·복구 기준 |
          | app-manifest.json | 등록된 앱·경로·상태·owner·공유계약 정보 |
          | 적용 역할 지침 | 지정된 담당자의 책임·권한·인계 경계 |
          | 채팅방 지침 | 공수·난이도·위험과 실행 환경을 고려한 작업방·도구·경로 권고 |

          역할 배치와 작업방 순서는 앱 아키텍처가 정하지 않는다. 단, 어떤 작업 경로를 선택하더라도 적용되는 구조·데이터·복구 계약은 지킨다.

          계획은 구현 완료가 아니고, 문서 개정은 소유권 이전이나 운영 변경 승인이 아니다. 문서·manifest·소스·배포 증거가 불일치하면 차이를 기록하고 근거 없이 한쪽을 완료 사실로 간주하지 않는다.

          ### 1.2 작업에 따른 읽기 범위

          기본적으로 이 문서의 1~2절과 대상 앱의 manifest 항목을 확인한다. 이후 변경에 해당하는 계약과 그 계약이 참조하는 의존 범위만 확인한다.

          | 변경 대상 | 추가로 확인할 범위 |
          |---|---|
          | 앱 책임·경로·상태 | 3~4절, 8절 및 해당 앱 manifest |
          | 화면·테마·공통헤더 | 5.1절과 3.5절 |
          | 저장·데이터 처리·앱 간 연동 | 3.4절, 5~6절의 해당 계약 및 영향받는 소비자 |
          | 변경 영향·실패 격리·복구 | 7절, 9절의 해당 기준 |
          | 문서·계약 변경 | 10절 |
          | 로드맵 검토 | 11절의 해당 항목과 실제 구현 상태 |

          변경 없는 상세 계약은 원문 참조로 갈음하고 매번 전체를 재작성하지 않는다. 필요한 계약을 생략하거나 관계없는 모든 앱의 문서와 테스트를 자동으로 요구하지 않는다.

          ---'''
          independence = '''## 2. 앱 독립성 원칙

          1. 앱의 기본 화면·로컬 조회·검색·계산·작업본 편집은 가능한 로컬 범위에서 독립 실행한다. 검증된 로컬 데이터가 있으면 다른 앱·공통 Runtime·서버 응답을 선행조건으로 삼지 않는다.
          2. 각 데이터의 쓰기 소유자는 하나다. 다른 앱은 소유자가 제공하는 읽기 Snapshot·조회·명령·변경요청 계약을 사용한다. 신규 타 앱 원시 저장소 쓰기를 추가하지 않는다.
          3. 기존 공유 DB와 명시적으로 승인된 writer·명령 예외는 전환 전 호환 계약으로 보존한다. 독립성을 이유로 저장소를 즉시 분리·통합·이전하거나 기존 정상 기능을 일괄 차단하지 않는다. 같은 Origin의 경로 분리는 저장소 접근 통제가 아니다.
          4. Read Adapter는 읽기 전용 결과를 제공하고, Integration Adapter는 계약 변환·전달·실패 격리를 담당한다. 연동 장애는 해당 기능에 한정하며 앱 전체나 관계없는 업무로 확산하지 않는다.
          5. 서버는 인증·권한·공유·동기화·충돌·최종 확정처럼 서버 확인이 필요한 경계에만 개입한다. 공통 라이브러리 재사용 자체는 금지하지 않지만 앱 준비 상태·저장 권한·업무 흐름의 중앙 통제 계층으로 확대하지 않는다.
          6. 공통 UI는 앱 이동·홈 이동·테마·허용된 공통 상태를 제공한다. 업무 DB 접근·초기화·Revision 조회·앱 준비 판정·이동마다 인증 호출을 수행하지 않는다. 사용자 식별·로그아웃 등 현재 로그인 경계와 상세 UI 계약은 5.1절을 따른다.
          7. 조회 오류·정상 빈 데이터·확정 여부 불명을 구분한다. 마지막 정상 자료와 원본을 보존하고, 공란·숫자 0·음수·원문을 승인 없이 보정하지 않는다.
          8. 열린 전표와 활성 작업본은 시작 Snapshot을 보존한다. 새 서버 Revision은 분리해 알리고, 승인된 앱 정책 또는 명시적 적용 동작 없이 현재 값을 덮어쓰지 않는다. 충돌 시 양쪽 자료를 보존하고 적용 직전 최신 Head를 재확인해 새 이력으로 기록한다.
          9. 관리자 업무 판단을 지원하고 원본과 결과의 비교·검산을 제공한다. 오차·손익·단순 경고는 자동 차단 이유가 아니며, 인증·권한·실제 데이터 무결성 위험은 해당 경계에서 검증한다.
          10. 변경은 영향받는 앱·소비자와 계약을 확인하고 독립 복구 가능성을 유지한다. 공식 주소·저장키·payload·owner·운영 상태는 문서 정리만으로 바꾸지 않으며, 기능 통과로 사용성 회귀를 정당화하지 않는다.

          ---'''
          modes = '''### 3.4 의존성 실행 방식

          실행 방식과 데이터 접근 경계는 다른 개념이다. 아래 구분은 설계·검증의 의미 기준이며 이 문서 개정만으로 manifest 필드나 허용값을 바꾸지 않는다.

          | 실행 방식 | 의미 | 장애 시 동작 |
          |---|---|---|
          | LOCAL_OPERATION | 로컬에서 해당 작업을 완료 | 허용된 로컬 업무 유지 |
          | BACKGROUND_SYNC | 로컬 작업을 먼저 완료하고 서버 확인·전송·동기화를 후행 | 마지막 정상 상태와 대기 자료를 보존하고 계약에 따라 재시도 |
          | SERVER_FINALIZE | 해당 작업의 완료에 서버 확인이 필요 | 해당 확정만 보류하고 작업본과 원인을 보존 |

          로컬 완료·서버 최종 확정·전송 대기 상태를 구분하며, 동기화 예약을 서버 확정 완료로 표시하지 않는다. 실행 방식을 상향해 서버 대기를 추가하거나 확정 경계를 바꾸는 것은 사용자 업무정책 변경으로 검토한다.

          OWNER_COMMAND와 OWNER_REQUEST는 소유자에게 명령·변경요청을 전달한다는 접근 경계다. 해당 표기만으로 로컬 실행인지 서버 확정인지 결정할 수 없다. STATIC_UI는 정적 표시 성격이고, ADMIN_DECISION_REQUIRED는 사용자 판단이 필요한 상태이므로 세 실행 방식과 동일한 축으로 해석하지 않는다.

          현재 manifest의 dependencyMode에는 실행 방식과 접근 경계 표기가 혼재한다. 이번 개정에서는 기존 키·값·소비 동작을 보존하고, 개별 기능의 실제 계약으로 실행 위치와 대기 범위를 확인한다. 기계적으로 분리해야 할 필요가 확인되면 schema·validator·소비자를 함께 대조하는 별도 작업으로 진행한다.

          ### 3.5 사용성·장애 격리 기준

          공통 기능과 서버 연동은 다음 기본 기준을 유지한다.

          | 지표 | 기본 기준 |
          |---|---:|
          | 클릭·터치 시각 피드백 | p95 100ms 이하 |
          | 공통 계층의 Warm 차단 시간 | p95 150ms 이하 |
          | 검증된 로컬 데이터 표시 | Warm p95 500ms 이하 |
          | Warm 앱 이동·사용 가능 | p95 1초 이하 |
          | 실제 로컬 데이터 표시 전 업무 Gateway 요청 | 0회 |
          | 서버 장애 시 허용된 LOCAL_OPERATION 성공률 | 100% |
          | 서버 오류를 정상 0건으로 표시 | 0건 |
          | 서버 변경으로 활성 작업본 자동 덮어쓰기 | 0건 |

          업무 Gateway 요청 0회는 모든 정적 파일 요청을 금지한다는 뜻이 아니다. 검증된 로컬 데이터가 있는 Warm 진입에서 실제 로컬 업무 데이터 표시 전 업무 Gateway 요청이 없다는 뜻이다.

          Cold와 Warm을 구분하고 같은 PC·브라우저·자료·네트워크 조건으로 기준 버전과 비교한다. 더 엄격한 사용자 확정 명세가 있으면 그 기준을 적용한다.

          절대 KPI를 초과하거나, 기존 p95보다 10%를 넘게 악화되면서 절대 증가량도 100ms를 초과하면 원인을 확인하고 조정·격리·롤백을 검토한다. 기준을 충족하지 못한다고 담당자가 임의로 낮추지 않는다. 기능 테스트 통과는 사용성 회귀를 정당화하지 않는다.

          측정은 변경 영향에 맞게 수행하되 측정하지 않은 지표를 통과로 기록하지 않는다. 새로운 기본 수치나 예외를 이번 문서 정리에 추가하지 않는다.

          ---'''
          impact = '''이 표는 실제 변경에 해당하는 최소 영향 검토 범위다. 작업방·모델·공수 등급으로 결정하지 않으며, 필요한 역할을 생략해도 관련 계약의 최소 검증을 생략하지 않는다.

          실제 공유계약이 바뀌면 모든 영향받는 소비자와 복구 경계를 확인한다. 상세 계약이 특정 전체 검사나 실패 주입 검증을 최소 요건으로 지정하면 해당 변경에서 유지한다. 그 외 관계없는 앱의 전체 재검증은 구체적인 위험 근거가 있을 때만 추가한다.

          아래 독립성 질문은 기존 계약을 참조해 답할 수 있다. 단순 변경마다 동일한 설명을 새로 작성할 필요는 없지만, 관련 경계를 확인하지 않은 채 변경 없음이나 검증 통과로 표시하지 않는다.'''
          governance = '''## 10. 문서 거버넌스

          - 문서별 책임은 1.1절을 따른다. 공통 규범·역할·난이도별 절차를 여러 문서에 반복해서 적지 않는다.
          - 이 문서는 구조·데이터·UI·성능·실패 격리·영향·복구를 관리하고, 특정 모델·작업방·프로젝트 ID·PC 경로·필수 전달 순서를 규정하지 않는다.
          - 앱의 추가·경로 변경·상태 변경·폐기는 승인된 실제 변경과 검증에 맞춰 manifest와 해당 상세 설명을 함께 갱신한다. 미구축 앱을 운영 의존성으로 등록하지 않는다.
          - 공유계약 변경에는 검토한 모든 영향 소비자와 호환·이전·롤백 근거를 남긴다. 담당 역할이나 작업 경로를 이유로 데이터 보호와 최소 검증을 낮추지 않는다.
          - 원본 상세 계약과 승인된 예외는 해당 절을 단일 참조점으로 유지한다. 문서 이동 시에는 원문·적용 조건·참조를 보존하고, 이동을 정책 폐기나 재승인으로 해석하지 않는다.
          - 목표 구조·현재 구현·manifest 등록·검증·배포 상태는 구분한다. 서로 다르면 차이와 확인 근거를 기록하고, 검증하지 않은 상태를 운영 완료로 승격하지 않는다.
          - 무관한 기능 개발에 이 문서의 전면 개정을 끼워 넣지 않는다. 실제 변경으로 영향을 받는 계약·참조·현재 사실만 갱신하며 정책 변경은 사용자 판단을 받는다.
          - 역할 문서는 지정된 책임·권한·인계만 정의한다. 공통 지침 개정으로 충돌이 생기면 충돌 조항을 같은 문서 변경에서 정리한다.
          - 문서 개정은 운영 코드·데이터·권한·서버·배포 설정의 변경을 자동 승인하지 않는다. 저장소 문서 적용만으로 채팅방·워크·로컬 실행환경 지침까지 자동 반영됐다고 보고하지 않는다.

          ---'''
          text = replace_once(text, '- Architecture document version: 2.1.32', '- Architecture document version: 2.2.0')
          text = replace_once(text, '- Last reviewed: 2026-09-04', '- Previous detailed review: 2026-09-04\n- Documentation updated: 2026-09-08')
          text = replace_once(text, '- Current-source baseline: `d44bbda357268289269574aa8f7b36333e013be5`', '- Previous detailed source baseline: `d44bbda357268289269574aa8f7b36333e013be5`\n- Documentation revision baseline: `8ba1a0b5f52f27a6291ee9c01754c43b2d879a9e`\n- Review scope: 규범·아키텍처·작업배분의 경계 및 관련 문구 정합성\n- Runtime verification: 이번 문서 개정에서는 수행하지 않음')
          text = replace_section(text, '## 1. 문서 목적\n', '## 2. 앱 독립성 원칙\n', purpose)
          text = replace_section(text, '## 2. 앱 독립성 원칙\n', '## 3. 현재 구조와 목표 구조\n', independence)
          text = replace_section(text, '### 3.4 의존성 실행 방식\n', '## 4. 앱 책임과 상태\n', modes)
          text = replace_section(text, 'The table defines minimum impact review.\n', '1. 앱의 기본 기능은 무엇이며 외부 장애 중에도 남는가?', impact)
          text = replace_once(text, '개발 분류, 역할, Git, 검증 판정, 병합·배포와 보고 절차는 `AGENTS.md`만 단일 원본으로 사용한다. 이 절은 앱 독립성에 필요한 아키텍처 증거만 정의한다.', '실행·승인·검증·완료 보고의 공통 규범은 AGENTS.md를 따른다. 공수·난이도·작업방 배치는 채팅방 권고와 해당 작업의 지정 사항이며, 이 절은 앱 구조·데이터 경계와 완료 증거만 정의한다.')
          text = replace_once(text, '모든 앱 개발명세는 다음을 명시한다.', '신규 앱과 구조·저장·연동 경계를 변경하는 작업은 아래 항목 중 적용되는 내용과 근거를 명세에 기록한다. 기존 계약을 그대로 쓰는 항목은 해당 절·계약·버전을 참조하고 변경 없음을 명시하면 된다. 경계를 바꾸지 않는 단순 작업에 전체 구조 명세의 재작성을 요구하지 않는다.')
          text = replace_once(text, '`app-manifest.json` v1.3.1의 기존 운영 계약은 유지한다. SmartInput과 거래처관리 파일럿은 실제 엔트리와 독립 실행 경계를 구현해 아래 선택 필드와 각자의 로컬 계약을 등록하며, 다른 앱도 실제 구축·검증 시 같은 방식으로 단계적으로 등록할 수 있다.', 'app-manifest.json의 현재 등록 계약과 호환성을 유지한다. 선택 필드는 실제 구현·소비자 전환·검증이 완료된 해당 앱에 한해 등록한다. 설명 문서의 버전이나 목표 역할을 근거로 현재 상태·소유권을 일괄 갱신하지 않는다.')
          text = replace_once(text, '| `dependencyMode` | 기능별 `LOCAL_OPERATION`, `BACKGROUND_SYNC`, `SERVER_FINALIZE` 구분 | 외부 의존 경계 구현 시 |', '| `dependencyMode` | 기능 의존 경계의 현재 표기. 실행 방식과 OWNER_COMMAND·OWNER_REQUEST 등 접근 경계를 구분해 읽는다(3.4절 참조). | 실제 경계 구현·검증 시. 형식 변경은 schema·validator·소비자 검토와 별도 승인 후 수행 |')
          text = replace_section(text, '## 10. 문서 거버넌스\n', '## 11. 현재 계약과 앱 독립성 전환 로드맵\n', governance)
          text = replace_once(text, 'Roadmap work is delivered as separate pull requests and verified after each merge.', '이 절에는 유지 중인 계약과 전환 방향이 함께 있다. 현행 기능·데이터·출력·복구 계약은 계속 적용하며, 로드맵은 그 자체로 신규 개발 명령이 아니다. 실제 작업 시 최신 소스와 승인 이력으로 이미 구현된 내용과 남은 내용을 구분해 중복 개발을 피한다.\n\n승인된 전환 작업은 영향과 독립 복구 경계에 맞춰 PR·검증 범위를 정한다. 데이터·owner·호환성의 선행조건은 보존하되, 여기의 기술 전환 순서를 채팅·워크·검증PM·개발자의 필수 작업방 순서로 해석하지 않는다.')
          preserved = [
              ('### 3.1 현재 운영 구조\n', '### 3.4 의존성 실행 방식\n'),
              ('## 4. 앱 책임과 상태\n', '## 7. Change-impact rules\n'),
              ('## 7. Change-impact rules\n', '| Common Runtime or NEXUS UI dependency |'),
              ('1. 앱의 기본 기능은 무엇이며 외부 장애 중에도 남는가?', '## 9. 아키텍처 검증과 manifest 전환\n'),
              ('### 9.2 독립 실행 완료조건\n', '### 9.3 `app-manifest.json` 단계적 확장\n'),
              ('### 9.4 독립 롤백 원칙\n', '## 10. 문서 거버넌스\n'),
              ('### 11.1 Baseline and automated checks\n', None),
          ]
          for start, end in preserved:
              assert span(old, start, end) == span(text, start, end), 'Preserved contract changed: ' + start
              print('PRESERVED:', start.strip())
          for value in ['p95 100ms 이하', 'p95 150ms 이하', 'Warm p95 500ms 이하', 'p95 1초 이하', '10%', '100ms']:
              assert value in text, 'Missing performance contract: ' + value
          assert text.count('### 3.5 사용성·장애 격리 기준') == 1
          assert '앱의 각 기능은 `AGENTS.md`의 실행 방식 중 하나로 명시한다.' not in text
          assert len(text.encode('utf-8')) > 120000, 'Unexpected loss of technical detail'
          p.write_bytes(text.encode('utf-8'))
          print('APP_ARCHITECTURE.md:', len(raw), '->', len(text.encode('utf-8')), 'bytes')
          print('SHA256:', hashlib.sha256(text.encode('utf-8')).hexdigest())
          PY
          git diff --check
          test "$(git diff --name-only)" = "APP_ARCHITECTURE.md"
