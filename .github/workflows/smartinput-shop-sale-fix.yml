name: SmartInput shop-sale isolated fix
on:
  push:
    branches: ['fix/smartinput-shop-sale-20260922']
    paths: ['.github/workflows/smartinput-shop-sale-fix.yml']
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/smartinput-shop-sale-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify baseline and report import scope
        run: |
          git diff --exit-code 9786f465b2a6b9761c4490ecf3754729015194d3 -- smartinput/estimate-output.js smartinput/smartinput.js smartinput/index.html scripts/test-smartinput-estimate-f8.mjs
          git grep -n 'estimate-output.js' -- '*.js' '*.html' '*.mjs' || true
          node scripts/test-smartinput-estimate-f8.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { buildEstimateF8Data } from './smartinput/estimate-output.js';
          const r = buildEstimateF8Data([{itemCode:'TEST-PROMO', itemName:'Regression fixture', outPrice:'', promoPrice:15800}]);
          assert.equal(r.ok, true);
          assert.equal(r.shopData[1][3],15800);
          assert.equal(r.shopData[1][14],'0');
          console.log('REPRODUCED: final shop price 15800 but sale flag 0 on unchanged baseline');
          JS
      - name: Apply minimal price-flag fix and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smartinput/estimate-output.js'); s=p.read_text()
          old='      saleCodeFromOutPrice(outPrice),'
          assert s.count(old)==1, 'Unexpected sale flag call sites'
          p.write_text(s.replace(old,'      saleCodeFromOutPrice(shopSalePrice),'))
          p=Path('smartinput/smartinput.js'); s=p.read_text()
          old="assetVersion: '0.2.9', specifier: './estimate-output.js?v=0.2.9'"
          assert s.count(old)==1, 'Unexpected estimate report descriptor'
          p.write_text(s.replace(old,"assetVersion: '0.2.10', specifier: './estimate-output.js?v=0.2.10'"))
          p=Path('smartinput/index.html'); s=p.read_text()
          old='smartinput.js?v=0.15.1'
          assert s.count(old)>=1, 'Unexpected SmartInput entry version'
          print('Updated SmartInput entry references:',s.count(old))
          p.write_text(s.replace(old,'smartinput.js?v=0.15.2'))
          p=Path('scripts/test-smartinput-estimate-f8.mjs')
          with p.open('a') as f:
              f.write('''

// Shop sale status follows the actual exported price, including a promotion-only price.
const shopSaleRegressionCases = [
  ['promotion-only', 15800, '', 15800, '1'],
  ['promotion-zero-out', '15,800원', 0, 15800, '1'],
  ['out-only', '', 18000, 18000, '1'],
  ['both-prices', 15800, 18000, 15800, '1'],
  ['empty-prices', '', '', '', '0'],
  ['zero-prices', 0, 0, 0, '0'],
  ['negative-promotion', -100, 18000, 18000, '1'],
  ['invalid-promotion', '확인', 18000, 18000, '1'],
  ['invalid-out', '', '확인', 0, '0'],
  ['negative-out', '', -100, -100, '0'],
  ['missing-prices', undefined, undefined, '', '0']
];
for (const [label, promoPrice, outPrice, expectedPrice, expectedSale] of shopSaleRegressionCases) {
  const direct = [{ itemCode: `SALE-${label}`, itemName: label, promoPrice, outPrice }];
  const source = ERP_SOURCE_HEADERS.map(header => ({
    품목코드: `SALE-${label}`, 품목명: label, 행사가: promoPrice, 출고가: outPrice
  })[header] ?? '');
  const mapped = buildEstimateF8RowsFromDraft(buildMappedDraft([source]));
  for (const [mode, rows] of [['direct', direct], ['mapped', mapped]]) {
    const before = structuredClone(rows);
    const result = buildEstimateF8Data(rows);
    const message = `${mode}: ${label}`;
    assert.equal(result.ok, true, message);
    assert.equal(result.shopData[1][3], expectedPrice, `${message}: final shop price`);
    assert.equal(result.shopData[1][14], expectedSale, `${message}: sale status`);
    assert.equal(result.shopData[1][15], 999, `${message}: existing stock policy`);
    const parsedOut = Number(String(outPrice ?? '').replace(/[,원₩]/g, '').trim());
    const expectedErpOut = outPrice === '' || outPrice == null ? '' : (Number.isFinite(parsedOut) ? parsedOut : 0);
    assert.equal(result.erpData[1][3], expectedErpOut, `${message}: ERP price must not use promotion price`);
    assert.deepEqual(rows, before, `${message}: input rows must remain unchanged`);
  }
}
console.log('PASS shop-sale final-price regression: 22 direct/mapped cases; ERP, stock and input preservation');
''')
          PY
          git diff --check
          git diff --stat
      - name: Verify report, mapping, ERP and repository contracts
        run: |
          node scripts/test-smartinput-estimate-f8.mjs
          node scripts/test-smartinput-estimate-report-preset.mjs
          node scripts/test-smartinput-input-template-mapping.mjs
          node scripts/test-smartinput-estimate-workbook-selection.mjs
          node scripts/test-smartinput-purchase-sales-output.mjs
          node scripts/test-smartinput-input-boundary.mjs
          node scripts/validate-repository.mjs
      - name: Verify SmartInput report browser workflow
        run: node scripts/test-smartinput-estimate-report-preset-browser.mjs
      - name: Commit only approved app and regression changes
        run: |
          python3 - <<'PY'
          import subprocess
          expected={'smartinput/estimate-output.js','smartinput/smartinput.js','smartinput/index.html','scripts/test-smartinput-estimate-f8.mjs'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected, (actual,expected)
          PY
          git add smartinput/estimate-output.js smartinput/smartinput.js smartinput/index.html scripts/test-smartinput-estimate-f8.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(smartinput): determine shop sale status from final sale price'
          git push origin HEAD:fix/smartinput-shop-sale-20260922
          git rev-parse HEAD
