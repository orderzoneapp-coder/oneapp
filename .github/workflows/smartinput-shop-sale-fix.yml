name: SmartInput shop-sale isolated fix
on:
  push:
    branches: ['fix/smartinput-shop-sale-20260922']
    paths: ['.github/workflows/smartinput-shop-sale-fix.yml']
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/smartinput-shop-sale-20260922
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh only the affected report cache chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes=[
            ('smartinput/estimate-output.js','stage5-compute-runner.js?v=0.1.1','stage5-compute-runner.js?v=0.1.2'),
            ('smartinput/stage5-compute-runner.js','stage5-compute-worker.js?v=0.1.1','stage5-compute-worker.js?v=0.1.2'),
            ('smartinput/stage5-compute-worker.js','estimate-output.js?v=0.2.9','estimate-output.js?v=0.2.10'),
            ('smartinput/estimate-migration.js','estimate-output.js?v=0.2.9','estimate-output.js?v=0.2.10'),
            ('smartinput/smartinput.js',"assetVersion: '0.1.2', specifier: './estimate-migration.js?v=0.1.2'","assetVersion: '0.1.3', specifier: './estimate-migration.js?v=0.1.3'")
          ]
          for filename,old,new in changes:
              p=Path(filename); s=p.read_text()
              assert s.count(old)==1, (filename,'unexpected reference count')
              p.write_text(s.replace(old,new))
          PY
          cat >> scripts/test-smartinput-stage5-compute.mjs <<'JS'
          
          // A promotion-only price must also activate sale in the large-report Worker path.
          const promotionOnlyRows = rows.map(row => ({ ...row, outPrice: '', promoPrice: 15800 }));
          const promotionMetrics = [];
          const promotionOutput = await runStage5Compute({
            feature: 'estimate-report', phase: 'ESTIMATE_F8_BUILD',
            payload: { rows: promotionOnlyRows, options: {}, duplicateResolutionEntries: [] },
            rowCount: promotionOnlyRows.length,
            direct: () => buildEstimateF8Data(promotionOnlyRows),
            workerFactory: () => new InlineModuleWorker(),
            onMetric: metric => promotionMetrics.push(metric)
          });
          assert.equal(promotionMetrics.at(-1).path, 'worker');
          assert.equal(promotionOutput.ok, true);
          assert.deepEqual(promotionOutput, buildEstimateF8Data(promotionOnlyRows));
          assert.equal(promotionOutput.shopData.length, 601);
          assert.equal(promotionOutput.shopData.slice(1).every(row => row[3] === 15800 && row[14] === '1' && row[15] === 999), true);
          assert.equal(promotionOutput.erpData.slice(1).every(row => row[3] === ''), true);
          console.log('PASS: 600 promotion-only rows use Worker and retain ERP/stock policy');
          JS
          git diff --check
          git diff --stat
      - name: Verify all affected report and Worker consumers
        run: |
          node scripts/test-smartinput-estimate-f8.mjs
          node scripts/test-smartinput-stage5-compute.mjs
          node scripts/test-smartinput-stage5-feature-loading.mjs
          node scripts/test-smartinput-f8-upload-contract.mjs
          node scripts/test-smartinput-stage3-f8-baseline.mjs
          node scripts/test-smartinput-estimate-report-preset.mjs
          node scripts/test-smartinput-input-template-mapping.mjs
          node scripts/test-smartinput-estimate-workbook-selection.mjs
          node scripts/test-smartinput-purchase-sales-output.mjs
          node scripts/validate-repository.mjs
      - name: Verify report and migration browser contracts
        run: |
          node scripts/test-smartinput-estimate-report-preset-browser.mjs
          node scripts/test-smartinput-stage3-migration-browser.mjs
      - name: Commit cache references and Worker regression only
        run: |
          python3 - <<'PY'
          import subprocess
          expected={'smartinput/estimate-output.js','smartinput/smartinput.js','smartinput/stage5-compute-runner.js','smartinput/stage5-compute-worker.js','smartinput/estimate-migration.js','scripts/test-smartinput-stage5-compute.mjs'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected, (actual,expected)
          PY
          git add smartinput/estimate-output.js smartinput/smartinput.js smartinput/stage5-compute-runner.js smartinput/stage5-compute-worker.js smartinput/estimate-migration.js scripts/test-smartinput-stage5-compute.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(smartinput): refresh report worker cache and test promotion-only bulk output'
          git push origin HEAD:fix/smartinput-shop-sale-20260922
          git rev-parse HEAD
