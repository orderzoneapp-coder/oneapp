name: OrderOps filter intent isolated workspace
on:
  push:
    branches: [fix/orderops-filter-intent-20260919]
    paths: [.github/workflows/orderops-filter-intent-build.yml]
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm successful Pages deployment at merged SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/filter-live-evidence
          python3 - <<'PY'
          import urllib.request,json,os,time,pathlib
          url='https://api.github.com/repos/orderzoneapp-coder/oneapp/actions/runs/35385767901'
          for attempt in range(30):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as response: result=json.load(response)
              assert result['head_sha']=='79b4ce525b45156ee52bca0544c4ed20c5ad2134'
              if result['status']=='completed': break
              time.sleep(5)
          assert result['conclusion']=='success', (result['status'],result['conclusion'])
          summary={k:result[k] for k in ['id','head_sha','status','conclusion','html_url','updated_at']}
          pathlib.Path('/tmp/filter-live-evidence/deployment.json').write_text(json.dumps(summary,indent=2))
          print('Pages deployment PASS',summary)
          PY
      - name: Install browser driver
        run: python3 -m pip install playwright==1.57.0
      - name: Verify real operating URLs and actual checkbox input
        env:
          EXPECTED_COMMIT: 79b4ce525b45156ee52bca0544c4ed20c5ad2134
        run: |
          set -euo pipefail
          python3 tools/orderops-filter-live-check.py 2>&1 | tee /tmp/filter-live-evidence/live.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: orderops-filter-live-verification
          path: /tmp/filter-live-evidence
          retention-days: 3
