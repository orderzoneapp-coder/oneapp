name: OrderOps filter intent isolated workspace
on:
  push:
    branches: [fix/orderops-filter-intent-20260919]
    paths: [.github/workflows/orderops-filter-intent-build.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify and apply reviewed patch
        run: |
          mkdir -p /tmp/filter-evidence
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          parts=[pathlib.Path(f'tools/orderops-filter-intent.part-{i:02}.txt').read_text().strip() for i in range(1,5)]
          parts[1]=parts[1].replace('ZwO1jsOHo2gva','ZwO1jsHo2gva')
          raw=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='e2d654de2f4ad69af0c11d207707bd8a7f7506dd8b875869cc7a9e3ec862a549'
          payload=json.loads(raw)
          pathlib.Path('/tmp/filter.patch').write_text(payload['patch'])
          subprocess.run(['git','apply','--check','/tmp/filter.patch'],check=True)
          subprocess.run(['git','apply','/tmp/filter.patch'],check=True)
          pathlib.Path('/tmp/test_filter_browser.py').write_text(payload['browser'])
          PY
          FILTER_SOURCE_ROOT="$PWD" python3 tools/orderops-filter-intent-delta.py
          git add -N scripts/test-orderops-filter-intent.mjs
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          expected={'orderops/list.html':'18d28fda6278f73748c21392c7849474207826cf71c97f1c1be59eb583121a44','orderops_list.html':'f9caa2bd046242557824c6e3e50508d588d1e88c309fa10685660746489ecb80','scripts/test-orderops-filter-intent.mjs':'85c33ed08169c73da56910d23eaf3efd131d01a3436088d53c978931c99e6eb4','scripts/test-orderops-work-preservation.mjs':'3ccbcab9c3e48dc943f12ab22bfd6df1131fd5a87b05ab5d2b6f0160ab651bf5','scripts/test-shipping-management.mjs':'8293a4dd575a395de83ae70cbe8f3b9edab027af858ec78ec99cbf911932e286'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(expected)
          for p,h in expected.items(): assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,p
          pathlib.Path('/tmp/filter-evidence/source-hashes.json').write_text(json.dumps(expected,indent=2))
          p=pathlib.Path('/tmp/test_filter_browser.py');s=p.read_text()
          a='  def visible(): return [s.strip() for s in page.locator(\'#previewTable tbody td[data-column-role="customer"]\').all_text_contents()]'
          b='  def visible(): return page.locator(\'#previewTable tbody td[data-column-role="customer"]\').evaluate_all("cells=>cells.map(c=>(c.querySelector(\'input,textarea\')?.value ?? c.textContent).trim())")'
          assert s.count(a)==1;s=s.replace(a,b);p.write_text(s)
          PY
          git diff --check
      - name: Run shipment and filter regression suites
        run: |
          set -euo pipefail
          for script in test-orderops-filter-intent test-orderops-baseline-calculation test-orderops-work-preservation test-orderops-excel-preparation test-shipping-management test-shipping-purchase-plan-cloud test-orderq-substitute-shipment validate-repository; do
            node scripts/$script.mjs 2>&1 | tee /tmp/filter-evidence/$script.log
          done
      - name: Install browser test driver
        run: python3 -m pip install playwright==1.57.0
      - name: Verify real checkbox Excel replacement and IndexedDB recovery
        env:
          FILTER_SOURCE_ROOT: ${{ github.workspace }}
          FILTER_EVIDENCE_DIR: /tmp/filter-evidence
        run: |
          set -euo pipefail
          python3 /tmp/test_filter_browser.py 2>&1 | tee /tmp/filter-evidence/browser.log
      - name: Commit only verified files to isolated branch
        run: |
          git config user.name 'orderzoneapp-coder'
          git config user.email 'orderzoneapp@gmail.com'
          git add orderops/list.html orderops_list.html scripts/test-orderops-filter-intent.mjs scripts/test-orderops-work-preservation.mjs scripts/test-shipping-management.mjs
          git commit -m 'fix(orderops): retain include/exclude filter intent on new files and saved forms'
          git push origin HEAD:fix/orderops-filter-intent-20260919
          git rev-parse HEAD | tee /tmp/filter-evidence/verified-commit.txt
          git ls-tree HEAD orderops/list.html orderops_list.html scripts/test-orderops-filter-intent.mjs scripts/test-orderops-work-preservation.mjs scripts/test-shipping-management.mjs | tee /tmp/filter-evidence/verified-blobs.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: orderops-filter-verification
          path: /tmp/filter-evidence
          retention-days: 3
