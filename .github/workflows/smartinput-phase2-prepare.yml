name: SmartInput phase2 branch-only preparation
on:
  push:
    branches: [chat/smartinput-source-phase1-20260924]
    paths: [.github/workflows/smartinput-phase2-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/chat/smartinput-source-phase1-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chat/smartinput-source-phase1-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Recover the same verified preparation scripts with a corrected path count
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c0028f0cc248311e73c9c40f92f17a634d2911cb
          git diff --exit-code 422641134deac95b6f2f6f3114724bc7f6630c63 HEAD -- smartinput scripts app-manifest.json
          python3 - <<'PY'
          import os, subprocess, textwrap
          from pathlib import Path
          original = subprocess.check_output(['git','show','c0028f0cc248311e73c9c40f92f17a634d2911cb:.github/workflows/smartinput-phase2-prepare.yml'], text=True)
          blocks=[]; current=None
          for line in original.splitlines():
              if line == '        run: |':
                  current=[]; blocks.append(current)
              elif current is not None:
                  if line.startswith('          ') or not line.strip(): current.append(line)
                  else: current=None
          assert len(blocks)==3, len(blocks)
          replacements = [
              ('test "$(git rev-parse HEAD^)" = 422641134deac95b6f2f6f3114724bc7f6630c63', 'git diff --exit-code 422641134deac95b6f2f6f3114724bc7f6630c63 HEAD -- smartinput scripts app-manifest.json'),
              ('이전 파일 24개를 제거했으며', '이전 파일 25개를 제거하고 report.js 1개를 추가했으며'),
              ('c0bc771645026f05a8de23728f8157a8d29b3a9b5d5f9a8f449844aba74d2b4c','cc7252d3164887872cc6959e80fa47f1161fefc156d76af9ce9783481bfcfd6b'),
              ('git diff --cached --name-only | wc -l','git diff --cached --no-renames --name-only | wc -l')
          ]
          scripts=[textwrap.dedent('\n'.join(block))+'\n' for block in blocks]
          for before,after in replacements:
              assert sum(script.count(before) for script in scripts)==1, before
              scripts=[script.replace(before,after) for script in scripts]
          for index,script in enumerate(scripts):
              Path(os.environ['RUNNER_TEMP'],f'phase2-{index}.sh').write_text(script,encoding='utf-8')
          PY
      - name: Apply exact source relocation and validate the 86-path manifest
        shell: bash
        run: bash "$RUNNER_TEMP/phase2-0.sh"
      - name: Run all 58 SmartInput checks and the repository and ORDER Q checks
        shell: bash
        run: bash "$RUNNER_TEMP/phase2-1.sh"
      - name: Commit verified source to the existing work branch only
        shell: bash
        run: bash "$RUNNER_TEMP/phase2-2.sh"
