            const isInventoryRow = (row = {}) => {
                const source = getInventorySource(row);
                if (!source || typeof source !== 'object' || !normalizeCode(row?.코드 || source['품목코드'] || source['상품코드'])) return false;
                const activeRole = window.getCurrentMerchSourceRole
                    ? window.getCurrentMerchSourceRole(row.sources || {}, row._lastUploadRole || '')
                    : String(row?.sources?._activeRole || row?._lastUploadRole || '');
                return activeRole === 'inventory';
            };
            const readStock = (row = {}) => parseNumber(readFirst(getInventorySource(row), ['재고수량', '재고', '수량'], 0));
            const readPrice = (row = {}) => parseNumber(readFirst(getInventorySource(row), [
                '입고가', '구매가', '구매단가', '매입가', '매입단가', '단가', '원가',
                '최종(창고)', '최신단가', '_latestWarehousePrice', '재고단가'
            ], 0));
            const readDateKey = (row = {}) => {
                const source = getInventorySource(row);
                const storedKey = parseNumber(source['_inventoryFifoKey']);
                const calculatedKey = window.getInventoryPurchaseDateKey
                    ? window.getInventoryPurchaseDateKey(source['상품 구매일자'] || source['기록'], source['_dataOpsBasisDate'] || source['기준일자'] || '')
                    : 99999999;
                const key = storedKey > 0 ? storedKey : calculatedKey;
                return key > 0 && key !== 99999999 ? key : null;
            };
            const readInputOrder = (row = {}, fallback = 0) => {
                const source = getInventorySource(row);
                const value = Number(source['_inventoryInputOrder']);
                return Number.isFinite(value) ? value : fallback;
            };
            const selectLatestRepresentative = (rows = []) => {
                if (!Array.isArray(rows) || rows.length === 0) return null;
                return rows
                    .map((row, index) => ({ row, dateKey: readDateKey(row), inputOrder: readInputOrder(row, index) }))
                    .sort((a, b) => {
                        const aHasDate = a.dateKey !== null;
                        const bHasDate = b.dateKey !== null;
                        if (aHasDate !== bHasDate) return aHasDate ? -1 : 1;
                        if (aHasDate && bHasDate && a.dateKey !== b.dateKey) return b.dateKey - a.dateKey;
                        return a.inputOrder - b.inputOrder;
                    })[0]?.row || rows[0];
            };
            const captureSourceSnapshot = (rows = [], meta = {}) => {
                const entries = (Array.isArray(rows) ? rows : Object.values(rows || {}))
                    .filter(isInventoryRow)
                    .map((row, index) => {
                        const source = getInventorySource(row);
                        return Object.freeze({
                            code: normalizeCode(row.코드 || source['품목코드'] || source['상품코드']),
                            stock: readStock(row),
                            purchasePrice: readPrice(row),
                            purchaseDateKey: readDateKey(row),
                            inputOrder: readInputOrder(row, index),
                            managedKey: String(row._managedKey || '')
                        });
                    })
                    .filter(entry => entry.code);
                const codes = new Set(entries.map(entry => entry.code));
                return Object.freeze({
                    revision: String(meta.revision || ''),
                    basisDate: String(meta.basisDate || ''),
                    priceMode: 'latest',
                    rowCount: entries.length,
                    uniqueCodeCount: codes.size,
                    stockTotal: entries.reduce((sum, entry) => sum + entry.stock, 0),
                    entries: Object.freeze(entries)
                });
            };
            const aggregateRows = (rows = []) => {
                const groups = new Map();
                (Array.isArray(rows) ? rows : Object.values(rows || {})).filter(isInventoryRow).forEach(row => {
                    const source = getInventorySource(row);
                    const code = normalizeCode(row.코드 || source['품목코드'] || source['상품코드']);
                    if (!code) return;
                    if (!groups.has(code)) groups.set(code, []);
                    groups.get(code).push(row);
                });
                return Array.from(groups.entries()).map(([code, groupRows]) => {
                    const representative = selectLatestRepresentative(groupRows) || groupRows[0];
                    const stockTotal = groupRows.reduce((sum, row) => sum + readStock(row), 0);
                    const inventorySource = { ...getInventorySource(representative), 재고: stockTotal, 재고수량: stockTotal };
                    const sources = { ...(representative.sources || {}), inventory: inventorySource, _activeRole: 'inventory' };
                    return {
                        ...representative,
                        코드: code,
                        _managedKey: `${code}__INV_F8`,
                        _lastUploadRole: 'inventory',
                        _inventoryF8Aggregated: true,
                        _inventoryF8LotCount: groupRows.length,
                        _inventoryF8RepresentativeDateKey: readDateKey(representative),
                        _inventoryF8RepresentativePrice: readPrice(representative),
                        sources,
                        finalData: { ...(representative.finalData || {}), 재고: stockTotal, 재고수량: stockTotal }
                    };
                });
            };
            const countCodes = (codes = []) => {
                const counts = new Map();
                codes.filter(Boolean).forEach(code => counts.set(code, (counts.get(code) || 0) + 1));
                return counts;
            };
            const validateOutput = (snapshot, shopRows = [], erpRows = []) => {
                const safeSnapshot = snapshot && Array.isArray(snapshot.entries) ? snapshot : captureSourceSnapshot([]);
                const expectedByCode = new Map();
                safeSnapshot.entries.forEach(entry => expectedByCode.set(entry.code, (expectedByCode.get(entry.code) || 0) + parseNumber(entry.stock)));
                const shop = (shopRows || []).map(row => ({ code: normalizeCode(row?.[0]), stock: parseNumber(row?.[15]) })).filter(row => row.code);
                const erpCodes = (erpRows || []).map(row => normalizeCode(row?.[0])).filter(Boolean);
                const shopCodes = shop.map(row => row.code);
                const shopCounts = countCodes(shopCodes);
                const erpCounts = countCodes(erpCodes);
                const duplicateCodes = [...new Set([
                    ...Array.from(shopCounts.entries()).filter(([, count]) => count > 1).map(([code]) => code),
                    ...Array.from(erpCounts.entries()).filter(([, count]) => count > 1).map(([code]) => code)
                ])].sort();
                const expectedCodes = [...expectedByCode.keys()];
                const missingCodes = expectedCodes.filter(code => !shopCounts.has(code) || !erpCounts.has(code)).sort();
                const extraNonZeroRows = shop.filter(row => !expectedByCode.has(row.code) && row.stock !== 0);
                const extraNonZeroCodes = [...new Set(extraNonZeroRows.map(row => row.code))].sort();
                const expectedStockTotal = [...expectedByCode.values()].reduce((sum, stock) => sum + stock, 0);
                const actualStockTotal = shop.reduce((sum, row) => sum + row.stock, 0);
                const stockDifference = actualStockTotal - expectedStockTotal;
                const orderMatches = shopCodes.length === erpCodes.length && shopCodes.every((code, index) => code === erpCodes[index]);
                return {
                    ok: missingCodes.length === 0 && duplicateCodes.length === 0 && extraNonZeroCodes.length === 0 && stockDifference === 0 && orderMatches,
                    expectedRowCount: safeSnapshot.rowCount,
                    expectedCodeCount: expectedByCode.size,
                    expectedStockTotal,
                    outputRowCount: shop.length,
                    outputCodeCount: shopCounts.size,
                    actualStockTotal,
                    stockDifference,
                    missingCodes,
                    duplicateCodes,
                    extraNonZeroCodes,
                    extraNonZeroStock: extraNonZeroRows.reduce((sum, row) => sum + row.stock, 0),
                    orderMatches
                };
            };
            const formatCodeList = (codes = [], max = 20) => {
                const visible = codes.slice(0, max);
                return `${visible.join(', ')}${codes.length > max ? ` 외 ${codes.length - max}건` : ''}`;
            };
            const formatValidationMessage = (result = {}) => {
                const lines = [
                    '재고 F8 생성이 차단되었습니다.',
                    `출력대상 원본 ${result.expectedRowCount || 0}행 / ${result.expectedCodeCount || 0}코드 / 재고합계 ${parseNumber(result.expectedStockTotal).toLocaleString()}`,
                    `출력예정 ${result.outputRowCount || 0}행 / ${result.outputCodeCount || 0}코드 / 재고합계 ${parseNumber(result.actualStockTotal).toLocaleString()}`
                ];
                if (result.missingCodes?.length) lines.push(`누락 ${result.missingCodes.length}코드: ${formatCodeList(result.missingCodes)}`);
                if (result.duplicateCodes?.length) lines.push(`출력 중복 ${result.duplicateCodes.length}코드: ${formatCodeList(result.duplicateCodes)}`);
                if (result.extraNonZeroCodes?.length) lines.push(`원본 외 비영재고 ${result.extraNonZeroCodes.length}코드 / 수량 ${parseNumber(result.extraNonZeroStock).toLocaleString()}: ${formatCodeList(result.extraNonZeroCodes)}`);
                if (result.stockDifference !== 0) {
                    const sign = result.stockDifference > 0 ? '+' : '';
                    lines.push(`재고합계 차이 ${sign}${parseNumber(result.stockDifference).toLocaleString()} (출력-원본)`);
                }
                if (result.orderMatches === false) lines.push('쇼핑몰업로드/ERP업데이트 상품코드 집합 또는 순서가 일치하지 않습니다.');
                lines.push('현재 출력대상과 생성 결과를 확인한 뒤 다시 생성하세요.');
                return lines.join('\n');
            };
            return Object.freeze({
                isInventoryRow,
                readStock,
                readPrice,
                readDateKey,
                selectLatestRepresentative,
                captureSourceSnapshot,
                aggregateRows,
                validateOutput,
                formatValidationMessage
            });
        })();

        // 1재고현황 1행 메타 정책:
        // ERP 재고현황은 실제 헤더 위 1행에 "회사명 / 창고 / 기준일 / 재고현황" 정보가 들어온다.
        // 이 값은 행 데이터가 아니므로 파싱 단계에서 별도 메타로 읽고, 재고 source에 창고/기준일자로 주입한다.
        window.normalizeWarehouseCode = (v) => {
            const raw = String(v ?? '').trim();
            if (!raw) return '';
            const m = raw.match(/(\d{1,3})\s*(?:창고)?/);
            if (!m) return raw;
            return String(Number(m[1])).padStart(2, '0');
        };

        window.normalizeInventoryBaseDate = (v) => {
            if (v === undefined || v === null) return '';
            if (v instanceof Date && !isNaN(v.getTime())) {
                const yyyy = v.getFullYear();
                const mm = String(v.getMonth() + 1).padStart(2, '0');
                const dd = String(v.getDate()).padStart(2, '0');
                return `${yyyy}/${mm}/${dd}`;
            }
            const raw = String(v).trim();
            const m = raw.match(/(20\d{2})[.\/\-년\s]+(\d{1,2})[.\/\-월\s]+(\d{1,2})/);
            if (!m) return '';
            return `${m[1]}/${String(Number(m[2])).padStart(2, '0')}/${String(Number(m[3])).padStart(2, '0')}`;
        };

        window.cleanHeaderKey = (v) => String(v ?? '').toLowerCase().replace(/\s/g, '');

        // QuickF8 쇼핑몰업로드는 외부 업로드 양식을 위해 첫 헤더를 "상품코드\\n코드"로 출력한다.
        // 헤더 판정에서는 원문을 토큰으로 분리해 상품코드/코드를 인정하되, 1종코드·2종코드 같은 파생 열은 제외한다.
        window.isMerchProductCodeHeader = (value, specificOnly = false) => {
            const raw = String(value ?? '').toLowerCase().trim();
            if (!raw) return false;
            const tokens = raw.split(/[\s/|]+/).map(token => window.cleanHeaderKey(token)).filter(Boolean);
            const candidates = new Set([window.cleanHeaderKey(raw), ...tokens]);
            const accepted = specificOnly
                ? ['품목코드', '상품코드', '바코드', '상품번호']
                : ['품목코드', '상품코드', '바코드', '상품번호', '코드'];
            return accepted.some(header => candidates.has(header));
        };

        // ERP 재고현황의 "최종(창고)"는 창고명이 아니라 해당 창고의 최신/최종 단가다.
        // 컬럼명에 창고가 포함되어도 창고 매핑 후보에서 제외하고 입고가/최신단가로만 사용한다.
        window.isInventoryLatestPriceHeader = (h) => {
            const cleanH = window.cleanHeaderKey(h);
            return cleanH === '최종(창고)' || cleanH === '최종창고' || cleanH === '창고최종' || cleanH === '최신단가' || cleanH === '재고단가' || (cleanH.includes('최종') && cleanH.includes('창고'));
        };

        window.isDisallowedHeaderForField = (field, header) => {
            const cleanH = window.cleanHeaderKey(header);
            if (!cleanH) return true;

            if (field === '창고') {
                // 최종(창고)는 가격 컬럼이므로 창고로 잡으면 안 된다.
                if (window.isInventoryLatestPriceHeader(header)) return true;
                if (cleanH.includes('단가') || cleanH.includes('금액') || cleanH.includes('가격')) return true;
            }

            if (field === '기준일자') {
                // 기준일자는 1행 메타가 원칙이다. 구매일자/기록 컬럼과 혼동하지 않는다.
                if (cleanH.includes('구매일자') || cleanH.includes('상품구매일자') || cleanH === '기록') return true;
            }

            if (field === '규격') {
                // 품목명(규격), 상품명(규격) 같은 복합 헤더는 규격 컬럼이 아니다.
                // 실제 규격 컬럼이 없으면 공란 유지한다.
                if (cleanH.includes('품목명') || cleanH.includes('상품명') || cleanH.includes('품명')) return true;
            }

            return false;
        };

        window.extractInventorySheetMeta = (jsonAll = [], headerRowIdx = 0, sheetName = '') => {
            const metaRows = jsonAll.slice(0, Math.max(0, headerRowIdx));
            const metaText = metaRows
                .flatMap(row => Array.isArray(row) ? row : [])
                .map(v => String(v ?? '').trim())
                .filter(Boolean)
                .join(' / ');
            if (!metaText) return { sheetName, titleText: '', companyName: '', warehouseRaw: '', warehouseCode: '', baseDate: '', docType: '' };

            const parts = metaText.split('/').map(s => s.trim()).filter(Boolean);
            const companyMatch = metaText.match(/회사명\s*[:：]\s*([^/]+)/);
            const warehouseRaw = (parts.find(p => /\d+\s*창고/.test(p)) || '').trim();
            const baseDate = window.normalizeInventoryBaseDate(metaText);
            const docType = parts.find(p => p.includes('재고현황')) || (metaText.includes('재고현황') ? '재고현황' : '');

            return {
                sheetName,
                titleText: metaText,
                companyName: companyMatch ? companyMatch[1].trim() : '',
                warehouseRaw,
                warehouseCode: window.normalizeWarehouseCode(warehouseRaw),
                baseDate,
                docType
            };
        };

        window.getManagedRowKey = (row = {}) => row._managedKey || row.코드;


        // Smart Parser에서 마스터에 각인한 파서리스트명을 읽는다.
        // 운영 기준: 스마트파서가 저장한 파서리스트 필드를 우선하고,
        // 기존 데이터 호환을 위해 마스터 카탈로그 필드를 기본 파서리스트로 사용한다.
        window.getMerchParserListValue = (item = {}) => {
            return String(item?.['파서리스트'] || item?.['카탈로그'] || '').trim();
        };

        // 품목코드 정렬 정책:
        // 품목코드는 숫자가 아니라 ERP의 텍스트 코드다.
        // 숫자 정렬(numeric:true)을 쓰면 8자리 코드가 10자리 코드보다 먼저 올라와 목록 순서가 깨진다.
        window.normalizeProductCodeText = (v) => String(v ?? '').trim().replace(/\s/g, '');
        window.compareProductCodeText = (a, b) => {
            const av = window.normalizeProductCodeText(a);
            const bv = window.normalizeProductCodeText(b);
            if (av === bv) return 0;
            return av.localeCompare(bv, 'ko-KR', { numeric: false, sensitivity: 'base' });
        };

        // F9 출력검증센터에서 마스터 반영 후 복귀했을 때,
        // 현재 작업행의 코드 표기(공백/품목코드/상품코드/내부키)와 마스터 키가 다르면
        // 행사중/행사제외/테마 필터가 최신 마스터를 못 찾는다.
        // 필터/렌더링에서는 반드시 이 헬퍼로 최신 마스터를 조회한다.
        window.getMerchMasterItemForRow = (masterProducts = {}, row = {}) => {
            if (!masterProducts || !row) return {};
            const src = row.sources || {};
            const fd = row.finalData || {};
            const candidates = [
                row.코드,
                fd['품목코드'], fd['상품코드'], fd['코드'],
                src.estimate?.['품목코드'], src.estimate?.['상품코드'], src.estimate?.['코드'],
                src.purchase?.['품목코드'], src.purchase?.['상품코드'], src.purchase?.['코드'],
                src.sales?.['품목코드'], src.sales?.['상품코드'], src.sales?.['코드'],
                src.inventory?.['품목코드'], src.inventory?.['상품코드'], src.inventory?.['코드'],
                row._managedKey
            ].map(v => window.normalizeProductCodeText ? window.normalizeProductCodeText(v) : String(v ?? '').trim()).filter(Boolean);
            for (const code of candidates) {
                if (masterProducts[code]) return masterProducts[code];
            }
            const candidateSet = new Set(candidates);
            for (const item of Object.values(masterProducts || {})) {
                if (!item) continue;
                const mCode = window.normalizeProductCodeText ? window.normalizeProductCodeText(item.코드 || item['품목코드']) : String(item.코드 || item['품목코드'] || '').trim();
                if (mCode && candidateSet.has(mCode)) return item;
            }
            return {};
        };



        // ============================================================
        // [M-SALE-AVAILABILITY-01] 판매여부 공통 파이프라인
        // 역할: 엑셀의 판매/판매여부/판매상태를 작업대, 행사초기화, F8 출력과 마스터 반영에서 같은 0/1 값으로 사용한다.
        // 원칙: 숫자 0도 공란으로 취급하지 않으며, 명시값이 없을 때만 기존 업무별 기본정책을 사용한다.
        // ============================================================
        window.normalizeMerchSaleAvailability = window.normalizeMerchSaleAvailability || ((value) => {
            const raw = String(value ?? '').trim();
            const lower = raw.toLowerCase();
            if (raw === '') return '';
            if (['0', '정지', '정지중', '판매중단', '중단', '미판매', '판매안함', '판매불가'].includes(raw) || ['false', 'no', 'n'].includes(lower)) return '0';
            if (['1', '판매', '판매중', '정상', '판매가능'].includes(raw) || ['true', 'yes', 'y'].includes(lower)) return '1';
            const numeric = Number(raw.replace(/,/g, ''));
            if (Number.isFinite(numeric) && (numeric === 0 || numeric === 1)) return String(numeric);
            return '';
        });
        window.getMerchExplicitSaleAvailability = window.getMerchExplicitSaleAvailability || ((row = {}) => {
            const finalData = row.finalData || {};
            if (finalData._salesStopRequested === true) return { hasValue: true, code: '0', raw: 0, field: '_salesStopRequested', origin: 'action' };
            if (finalData._salesResumeRequested === true) return { hasValue: true, code: '1', raw: 1, field: '_salesResumeRequested', origin: 'action' };
            const state = window.resolveMerchWorkingField
                ? window.resolveMerchWorkingField(row, {}, '판매여부', { aliases: ['판매여부', '판매', '판매상태'] })
                : { isWorkingValue: false, value: '', origin: '', field: '' };
            if (state.isWorkingValue && state.isExplicitBlank) {
                return { hasValue: true, code: '', raw: state.value, field: state.field, origin: state.origin, isExplicitBlank: true };
            }
            if (state.isWorkingValue && !state.isExplicitBlank) {
                const code = window.normalizeMerchSaleAvailability(state.value);
                if (code !== '') return { hasValue: true, code, raw: state.value, field: state.field, origin: state.origin };
            }
            if (!window.resolveMerchWorkingField) {
                const saleFields = ['판매여부', '판매', '판매상태'];
                const editedFields = { ...(finalData._editedFields || {}), ...(finalData._bulkEditedFields || {}) };
                for (const field of saleFields) {
                    if (!editedFields[field] || !window.hasOwnField(finalData, field)) continue;
                    if (window.isBlankCell(finalData[field])) return { hasValue: true, code: '', raw: finalData[field], field, origin: 'direct', isExplicitBlank: true };
                    const code = window.normalizeMerchSaleAvailability(finalData[field]);
                    if (code !== '') return { hasValue: true, code, raw: finalData[field], field, origin: 'direct' };
                }
                const sources = row.sources || {};
                const activeRole = window.getCurrentMerchSourceRole
                    ? window.getCurrentMerchSourceRole(sources, row._lastUploadRole || '')
                    : String(sources._activeRole || row._lastUploadRole || '').trim();
                const activeSource = activeRole ? (sources[activeRole] || {}) : {};
                for (const field of saleFields) {
                    if (!window.hasOwnField(activeSource, field)) continue;
                    if (window.isBlankCell(activeSource[field])) return { hasValue: true, code: '', raw: activeSource[field], field, origin: `source:${activeRole}`, isExplicitBlank: true };
                    const code = window.normalizeMerchSaleAvailability(activeSource[field]);
                    if (code !== '') return { hasValue: true, code, raw: activeSource[field], field, origin: `source:${activeRole}` };
                }
            }
            return { hasValue: false, code: '', raw: '', field: '', origin: '' };
        });

        // 원칙: 엑셀에 항목이 있으면 공란/0/변동값까지 그대로 적용한다.
        //       계산값은 _calculatedOutPrice/_appliedMarginRule에만 보관하고, 룰적용(forceRecalc) 때만 출고가를 변경한다.
        //       단, 구매/재고 작업의 시중가는 source 원가로 갱신하지 않고 마스터 시중가를 참조한다.
        // ============================================================
        window.MERCH_DATAOPS_PROMO_MODULE = Object.freeze({
            normalizeCode: (value) => String(value ?? '').replace(/\s/g, '').replace(/\.0$/, ''),
            hasDataOpsRevision: (sources = {}) => !!String(sources?.inventory?._dataOpsRevision || '').trim(),
            resolve: (row = {}, mItem = {}) => {
                const sources = row.sources || {};
                const revision = String(sources?.inventory?._dataOpsRevision || '').trim();
                if (!revision)
                    return null;
                const dataOpsPromo = Math.max(0, window.parseNum(sources.inventory?.['행사가']));
                const ownState = sources._merchOwnPromoState || {};
                const estimatePromo = ownState.source === 'estimate' ? Math.max(0, window.parseNum(ownState.value)) : 0;
                const masterPromo = Math.max(0, window.parseNum(mItem?.['행사가']));
                const ownPromo = estimatePromo > 0 ? estimatePromo : masterPromo;
                const ownSource = estimatePromo > 0 ? 'estimate' : (masterPromo > 0 ? 'master' : 'none');
                const overrideState = sources._dataOpsPromoState || {};
                const hasOverride = String(overrideState.revision || '') === revision
                    && Object.prototype.hasOwnProperty.call(overrideState, 'value');
                const price = hasOverride ? Math.max(0, window.parseNum(overrideState.value)) : (dataOpsPromo > 0 ? dataOpsPromo : ownPromo);
                const conflict = !hasOverride && dataOpsPromo > 0 && ownPromo > 0 && dataOpsPromo !== ownPromo;
                const conflictMessage = conflict
                    ? `DataOps 행사가 적용 / MerchOps ${Math.round(ownPromo).toLocaleString('ko-KR')}원 → DataOps ${Math.round(dataOpsPromo).toLocaleString('ko-KR')}원`
                    : '';
                return {
                    revision,
                    price,
                    source: hasOverride ? 'override' : (dataOpsPromo > 0 ? 'dataops' : ownSource),
                    dataOpsPromo,
                    ownPromo,
                    ownSource,
                    hasOverride,
                    conflict,
                    conflictMessage
                };
            },
            applyToFinal: (working = {}, mItem = {}, sources = {}) => {
                const resolved = window.MERCH_DATAOPS_PROMO_MODULE.resolve({ finalData: working, sources }, mItem);
                if (!resolved)
                    return working;
                const next = { ...working, '행사가': resolved.price, _isPromo: resolved.price > 0 };
                next._dataOpsRevision = resolved.revision;
                next._dataOpsPromoValue = resolved.dataOpsPromo;
                next._merchOwnPromoValue = resolved.ownPromo;
                next._effectivePromoSource = resolved.source;
                next._dataOpsPromoOverrideApplied = resolved.hasOverride;
                next._dataOpsPromoConflict = resolved.conflict;
                next._dataOpsPromoConflictMessage = resolved.conflictMessage;
                return next;
            },
            resolveF7MasterPromoCommit: ({ sources = {}, activeRole = '', masterPromo = '' } = {}) => {
                if (!window.MERCH_DATAOPS_PROMO_MODULE.hasDataOpsRevision(sources))
                    return { handled: false, shouldWrite: false, value: masterPromo };
                if (String(activeRole || '') !== 'estimate')
                    return { handled: true, shouldWrite: false, value: masterPromo };
                const estimateSource = sources?.estimate;
                const hasExplicitEstimatePromo = !!estimateSource && Object.prototype.hasOwnProperty.call(estimateSource, '행사가');
                const estimatePromo = hasExplicitEstimatePromo ? Math.max(0, window.parseNum(estimateSource['행사가'])) : 0;
                if (estimatePromo <= 0)
                    return { handled: true, shouldWrite: false, value: masterPromo };
                return { handled: true, shouldWrite: true, value: estimatePromo };
            },
            refreshManagedItems: (items = {}, masterProducts = {}) => {
                const estimatePromoByCode = new Map();
                Object.values(items || {}).forEach(item => {
                    const estimate = item?.sources?.estimate;
                    const code = window.MERCH_DATAOPS_PROMO_MODULE.normalizeCode(item?.코드);
                    const promo = Math.max(0, window.parseNum(estimate?.['행사가']));
                    if (code && promo > 0 && !estimatePromoByCode.has(code))
                        estimatePromoByCode.set(code, promo);
                });
                const nextItems = { ...(items || {}) };
                Object.entries(nextItems).forEach(([key, item]) => {
                    if (!window.MERCH_DATAOPS_PROMO_MODULE.hasDataOpsRevision(item?.sources))
                        return;
                    const code = window.MERCH_DATAOPS_PROMO_MODULE.normalizeCode(item?.코드);
                    const nextSources = { ...(item.sources || {}) };
                    if (estimatePromoByCode.has(code))
                        nextSources._merchOwnPromoState = { source: 'estimate', value: estimatePromoByCode.get(code) };
                    else
                        delete nextSources._merchOwnPromoState;
                    nextItems[key] = {
                        ...item,
                        sources: nextSources,
                        finalData: window.MERCH_DATAOPS_PROMO_MODULE.applyToFinal(item.finalData || {}, masterProducts[code] || {}, nextSources)
                    };
                });
                return nextItems;
            },
            prepareFullInventoryReplace: (items = {}, masterProducts = {}, marginRules = [], revision = '') => {
                const nextItems = { ...(items || {}) };
                const retainedPromoStateByCode = new Map();
                Object.keys(nextItems).forEach(key => {
                    const current = nextItems[key];
                    if (!current?.sources?.inventory)
                        return;
                    const code = window.MERCH_DATAOPS_PROMO_MODULE.normalizeCode(current.코드);
                    const currentRevision = String(current.sources.inventory._dataOpsRevision || '');
                    const promoState = current.sources._dataOpsPromoState;
                    if (currentRevision === revision && String(promoState?.revision || '') === revision && Object.prototype.hasOwnProperty.call(promoState, 'value'))
                        retainedPromoStateByCode.set(code, { ...promoState });
                    const nextSources = { ...(current.sources || {}) };
                    delete nextSources.inventory;
                    delete nextSources._inventoryRefSummary;
                    delete nextSources._dataOpsPromoState;
                    if (String(nextSources._activeRole || '') === 'inventory') {
                        nextSources._activeRole = ['estimate', 'purchase', 'sales', 'info', 'catalog', 'parser']
                            .find(sourceRole => window.hasMerchSourceObjectData ? window.hasMerchSourceObjectData(nextSources[sourceRole]) : !!nextSources[sourceRole]) || '';
                    }
                    const nextTags = new Set(Array.from(current._tags || []).filter(tag => String(tag || '') !== 'excel:재고업로드'));
                    const hasOtherSource = ['estimate', 'purchase', 'sales', 'info', 'catalog', 'parser']
                        .some(sourceRole => window.hasMerchSourceObjectData ? window.hasMerchSourceObjectData(nextSources[sourceRole]) : !!nextSources[sourceRole]);
                    if (!hasOtherSource && nextTags.size === 0) {
                        delete nextItems[key];
                        return;
                    }
                    nextItems[key] = {
                        ...current,
                        sources: nextSources,
                        _tags: nextTags,
                        finalData: window.computeFinalData(masterProducts[code] || {}, nextSources, marginRules, false)
                    };
                });
                return { items: nextItems, retainedPromoStateByCode };
            }
        });

        window.computeFinalData = (mItem = {}, sources = {}, marginRules = [], forceRecalc = false) => {
            const hasUploadSource = window.hasAnyUploadSource(sources);
            const targetSource = hasUploadSource
                ? window.mergeExcelSourcesForTable(sources, window.getWorkingSourcePriority ? window.getWorkingSourcePriority(sources) : undefined)
                : { ...(mItem || {}) };

            let working = { ...targetSource };
            working = window.applyMarketPricePolicyToWorkingData ? window.applyMarketPricePolicyToWorkingData(working, mItem || {}, sources || {}) : working;
            working = window.applyMerchSpotPriceExcelPriority ? window.applyMerchSpotPriceExcelPriority(working, sources || {}) : working;
            working._sourcePolicy = hasUploadSource ? 'excel_original_first' : 'master_reference';
            working._isRuleApplied = !!forceRecalc;

            const baseInPrice = window.parseNum(working['입고가']);
            const calculatedOutPrice = window.calculatePricesEngine(
                baseInPrice,
                0,
                mItem || {},
                working,
                window.sanitizeMerchMarginRules ? window.sanitizeMerchMarginRules(marginRules) : (Array.isArray(marginRules) ? marginRules : []),
                true
            );

            working._calculatedOutPrice = calculatedOutPrice || 0;
            working._normalPrice = window.hasOwnField(working, '출고가') ? window.parseNum(working['출고가']) : 0;
            working._isPromo = window.parseNum(working['행사가']) > 0;
            if (window.MERCH_DATAOPS_PROMO_MODULE?.hasDataOpsRevision(sources))
                working = window.MERCH_DATAOPS_PROMO_MODULE.applyToFinal(working, mItem || {}, sources || {});

            // 행사테마는 행사가 여부로 자동 배정하지 않는다.
            // 일반 source 병합과 분리된 단일 resolver 결과를 canonical 필드에 한 번만 기록한다.
            // 공란도 명시값으로 남겨 후속 필터/F7/F8/F9에서 다른 source/마스터 테마가 재유입되지 않게 한다.
            const themeState = window.resolvePromotionThemeState
                ? window.resolvePromotionThemeState(working, sources, mItem || {})
                : { handled: false, value: '', origin: '' };
            const resolvedWorkingTheme = String(themeState?.value || '');
            const resolvedThemeSet = new Set(resolvedWorkingTheme.split(',').filter(Boolean));
            working['행사테마'] = resolvedWorkingTheme;
            [1, 2, 3, 4, 5].forEach(n => {
                working[`테마${n}`] = resolvedThemeSet.has(String(n)) ? '1' : '';
            });
            working._promoThemeResolvedOrigin = String(themeState?.origin || '');
            delete working._theme;

            const hasOutPriceField = window.hasOwnField(working, '출고가');
            const excelOutPrice = window.parseNum(working['출고가']);
            if (hasOutPriceField && excelOutPrice > 0 && calculatedOutPrice > 0 && excelOutPrice !== calculatedOutPrice) {
                working._sourceOutPrice = excelOutPrice;
                working._outPriceRuleDiff = true;
                working._outPriceRuleDiffAmount = calculatedOutPrice - excelOutPrice;
                working._outPriceRuleDiffRate = excelOutPrice > 0 ? ((calculatedOutPrice - excelOutPrice) / excelOutPrice) * 100 : 0;
            } else {
                working._sourceOutPrice = hasOutPriceField ? excelOutPrice : 0;
                working._outPriceRuleDiff = false;
                working._outPriceRuleDiffAmount = 0;
                working._outPriceRuleDiffRate = 0;
            }

            if (forceRecalc && baseInPrice > 0) {
                // 룰적용은 명시적 액션이다. 자동 불러오기에서는 절대 출고가를 덮어쓰지 않는다.
                working['출고가'] = calculatedOutPrice;
                working._ruleAppliedAt = new Date().toISOString();
                working._outPriceRuleDiff = false;
                working._outPriceRuleDiffAmount = 0;
                working._outPriceRuleDiffRate = 0;
            }

            return working;
        };

        // ============================================================
        // [M-ESTIMATE-COMPARE-01] 카탈로그 ↔ 견적서 비교 메타
        // 역할: 선택 카탈로그와 현재 견적서의 상품 존재여부 및 원본 단가 차이를
        //       마스터 저장값과 분리하여 화면·필터·리포트에서 공통 사용한다.
        // 원칙: 견적서 공란은 0으로 보정하지 않으며, 룰적용 전에는 계산 출고가를 작업값으로 사용하지 않는다.
        // ============================================================
        window.getMerchEstimateCompareStatus = (row = {}) => {
            const raw = String(row?._estimateCompareStatus || row?.finalData?._estimateCompareStatus || '').trim().toLowerCase();
            return ['maintain', 'add', 'missing'].includes(raw) ? raw : '';
        };
        window.getMerchEstimateCompareMeta = (row = {}, mItem = {}) => {
            const status = window.getMerchEstimateCompareStatus(row);
            const source = row?.sources?.estimate || {};
            const finalData = row?.finalData || {};
            const findOwnCell = (aliases = []) => {
                for (const key of aliases) {
                    if (window.hasOwnField(source, key)) return { has: true, key, raw: source[key] };
                }
                return { has: false, key: '', raw: '' };
            };
            const inCell = findOwnCell(['입고가', '최종입고', '매입단가', '매입가', '구매단가', '원가', '단가']);
            const outCell = findOwnCell(['출고가', '판매가', '판매가격']);
            const basicCell = findOwnCell(['기본', '기본구분', '기본여부', '구분(기본)', '관리구분']);
            const isBlank = (value) => window.isBlankCell ? window.isBlankCell(value) : (value === undefined || value === null || String(value).trim() === '');
            const masterIn = window.parseNum(mItem?.['입고가']);
            const masterOut = window.parseNum(mItem?.['출고가']);
            const estimateInBlank = !inCell.has || isBlank(inCell.raw);
            const estimateOutBlank = !outCell.has || isBlank(outCell.raw);
            const estimateIn = estimateInBlank ? null : window.parseNum(inCell.raw);
            const estimateOut = estimateOutBlank ? null : window.parseNum(outCell.raw);
            const ruleApplied = !!(finalData?._ruleAppliedAt || finalData?._isRuleApplied);
            const ruledOutBlank = !ruleApplied || !window.hasOwnField(finalData, '출고가') || isBlank(finalData['출고가']);
            const ruledOut = ruledOutBlank ? null : window.parseNum(finalData['출고가']);
            const priceCheck = status === 'maintain' && (
                (!estimateInBlank && estimateIn !== masterIn) ||
                estimateOutBlank ||
                (!estimateOutBlank && estimateOut !== masterOut) ||
                (ruleApplied && !ruledOutBlank && ruledOut !== masterOut)
            );
            const saleState = window.getMasterSalesState ? window.getMasterSalesState(mItem || {}) : { code: String(mItem?.['판매여부'] ?? '') };
            return {
                status,
                statusLabel: status === 'maintain' ? '유지' : (status === 'add' ? '추가' : (status === 'missing' ? '누락' : '')),
                catalogs: Array.isArray(row?._estimateCompareCatalogs) ? row._estimateCompareCatalogs : (Array.isArray(finalData?._estimateCompareCatalogs) ? finalData._estimateCompareCatalogs : []),
                masterIn,
                estimateIn,
                estimateInRaw: inCell.raw,
                estimateInBlank,
                inDiff: estimateInBlank ? null : estimateIn - masterIn,
                masterOut,
                estimateOut,
                estimateOutRaw: outCell.raw,
                estimateOutBlank,
                outDiff: estimateOutBlank ? null : estimateOut - masterOut,
                ruledOut,
                ruledOutBlank,
                ruleApplied,
                priceCheck,
                basicRef: basicCell.has ? basicCell.raw : '',
                stopCandidate: status === 'missing' && String(saleState?.code || '') === '1'
            };
        };

        // ============================================================
        // [M-PRICE-CHECK-01] 공통 가격변동 엔진
        // 역할: 구버전 '변동'과 견적 비교의 '가격변동'을 하나의 판정으로 통합한다.
        // 정책:
        // 1) 견적 비교 유지상품은 입고가·출고가·출고가 공란·룰적용 출고가 차이를 확인한다.
        // 2) 구매·재고·정보 및 카탈로그 미선택 견적은 기존 변동 기준(마스터 입고가 대비 작업 입고가)을 보존한다.
        // 3) 추가·누락은 각각 전용 필터가 있으므로 가격변동에서 중복 집계하지 않는다.
        // ============================================================
        window.getMerchPriceCheckMeta = (row = {}, mItem = {}, activeRole = '') => {
            const sources = row?.sources || {};
            const finalData = row?.finalData || {};
            const inferRole = () => {
                const requested = String(activeRole || row?._lastUploadRole || sources?._activeRole || '').trim();
                if (typeof normalizeMerchTableTarget === 'function' && requested) return normalizeMerchTableTarget(requested);
                if (requested) return requested;
                return ['estimate', 'purchase', 'sales', 'inventory', 'info'].find(role => !!sources?.[role]) || 'estimate';
            };
            const role = inferRole();
            const reasons = [];
            const addReason = (reason) => { if (reason && !reasons.includes(reason)) reasons.push(reason); };
            const estimateMeta = window.getMerchEstimateCompareMeta
                ? window.getMerchEstimateCompareMeta(row, mItem)
                : { status: '', priceCheck: false };

            if (role === 'estimate' && estimateMeta.status) {
                // 추가·누락은 전용 비교 필터에서 처리한다.
                if (estimateMeta.status !== 'maintain') {
                    return { hasIssue: false, reasons: [], role, source: 'estimateCompare', estimateMeta };
                }
                // 입고가 0/공란은 가격변동에서 제외하고 상세필터 '입고가없음'에서 분리한다.
                if (estimateMeta.estimateInBlank || window.parseNum(estimateMeta.estimateIn) <= 0) {
                    return {
                        hasIssue: false,
                        reasons: [],
                        role,
                        source: 'estimateCompare',
                        estimateMeta,
                        masterIn: estimateMeta.masterIn,
                        workingIn: estimateMeta.estimateIn,
                        masterOut: estimateMeta.masterOut,
                        workingOut: estimateMeta.estimateOut,
                        excludedReason: '입고가없음'
                    };
                }
                if (estimateMeta.inDiff !== 0) addReason('입고가변동');
                if (estimateMeta.estimateOutBlank) addReason('출고가공란');
                if (!estimateMeta.estimateOutBlank && estimateMeta.outDiff !== 0) addReason('출고가변동');
                if (estimateMeta.ruleApplied && !estimateMeta.ruledOutBlank && estimateMeta.ruledOut !== estimateMeta.masterOut) addReason('룰적용가변동');
                return {
                    hasIssue: reasons.length > 0,
                    reasons,
                    role,
                    source: 'estimateCompare',
                    estimateMeta,
                    masterIn: estimateMeta.masterIn,
                    workingIn: estimateMeta.estimateIn,
                    masterOut: estimateMeta.masterOut,
                    workingOut: estimateMeta.estimateOut
                };
            }

            // 구버전 변동 기준을 그대로 공통 가격변동에 편입한다.
            const masterIn = window.parseNum(mItem?.['입고가']);
            const sourcePriority = [sources?.[role], sources?.estimate, sources?.purchase, sources?.sales, sources?.inventory, sources?.info].filter(Boolean);
            let workingInRaw = Object.prototype.hasOwnProperty.call(finalData, '입고가') ? finalData['입고가'] : undefined;
            if (workingInRaw === undefined) {
                for (const source of sourcePriority) {
                    const aliases = ['입고가', '최종입고', '구매가', '구매단가', '매입가', '매입단가', '단가', '원가', '최종(창고)', '최종창고', '최신단가', '재고단가'];
                    const key = aliases.find(alias => Object.prototype.hasOwnProperty.call(source || {}, alias));
                    if (key) {
                        workingInRaw = source[key];
                        break;
                    }
                }
            }
            const workingIn = window.parseNum(workingInRaw);
            if (masterIn > 0 && workingIn > 0 && masterIn !== workingIn) addReason('입고가변동');
            return {
                hasIssue: reasons.length > 0,
                reasons,
                role,
                source: 'workingPrice',
                estimateMeta,
                masterIn,
                workingIn,
                masterOut: window.parseNum(mItem?.['출고가']),
                workingOut: null
            };
        };

        window.formatMerchComparePrice = (value, blankText = '공란') => {
            if (value === null || value === undefined || value === '') return blankText;
            return window.parseNum(value).toLocaleString();
        };
        window.formatMerchCompareDiff = (value) => {
            if (value === null || value === undefined || value === '') return '차 -';
            const num = Number(value) || 0;
            return `차 ${num > 0 ? '+' : ''}${num.toLocaleString()}`;
        };

        // ============================================================
        // [M-REGISTER-01] 미등록 상품 간편등록 전용 양식
        // 역할: 엑셀 불러오기 중 마스터에 없는 품목코드를 현재 작업테이블에서 바로 등록할 수 있게 한다.
        // 정책: 모달을 만들지 않고 현재 테이블을 신규등록용 양식으로 전환한다.
        // ============================================================
        window.MERCH_REGISTRATION_WORK_COLS = ['품목코드', '품목명', '규격', '단위', '입고가', '구매처', '수량', '기준일자', '창고', '기본', '부가세여부', '확인'];
        window.MERCH_REGISTRATION_REQUIRED = ['품목코드', '품목명', '규격', '단위'];
        window.MERCH_REGISTRATION_RECOMMENDED = ['입고가', '구매처', '수량', '기준일자', '창고', '기본', '부가세여부'];

        window.getFirstNonBlankValue = (obj = {}, keys = []) => {
            for (const key of keys) {
                const val = obj?.[key];
                if (val !== undefined && val !== null && String(val).trim() !== '') return val;
            }
            return '';
        };

        // 신규등록용 양식은 항목명이 있는 값만 매핑한다. 품명 문자열에서 단위/규격을 추론하지 않는다.
        window.getMerchUnitByHeaderOnly = (source = {}) => {
            return window.getFirstNonBlankValue(source, ['단위', '포장단위', '판매단위', '매입단위', 'UNIT', 'unit']);
        };

        // ERP 원본 정책: 엑셀 '과세' 값이 1이면 비과세, 0이면 과세로 표시한다.
        window.normalizeMerchTaxFlag = (val, headerName = '') => {
            if (val === undefined || val === null || String(val).trim() === '') return '';
            const raw = String(val).trim();
            const header = String(headerName || '').replace(/\s/g, '');
            if (header === '과세' || header === '부가세여부') {
                if (raw === '1') return '비과세';
                if (raw === '0') return '과세';
            }
            if (raw === '1') return '비과세';
            if (raw === '0') return '과세';
            if (raw.includes('비과세') || raw.includes('면세')) return '비과세';
            if (raw.includes('과세')) return '과세';
            return raw;
        };

        window.getRegistrationSource = (row = {}, preferredRole = '') => {
            const sources = row.sources || {};
            const rolePriority = [preferredRole, 'inventory', 'purchase', 'estimate', 'sales'].filter(Boolean);
            for (const role of rolePriority) {
                if (window.hasMerchSourceObjectData ? window.hasMerchSourceObjectData(sources[role]) : (sources[role] && Object.keys(sources[role]).some(key => !String(key || '').startsWith('_')))) return sources[role];
            }
            return row.finalData || {};
        };

        window.buildMerchRegistrationDraft = (row = {}, preferredRole = '') => {
            const source = window.getRegistrationSource(row, preferredRole);

const createHeaderMap = (actualHeaders, mappingConfig) => {
    const headerMap = {};
    if (!mappingConfig)
        return headerMap;
    const clean = (v) => window.cleanHeaderKey ? window.cleanHeaderKey(v) : String(v !== null && v !== void 0 ? v : '').toLowerCase().replace(/\s/g, '');
    const isDisallowed = (field, header) => window.isDisallowedHeaderForField ? window.isDisallowedHeaderForField(field, header) : false;
    const safeHeaders = Array.isArray(actualHeaders) ? actualHeaders : [];
    const findHeader = (field, keywords, exactOnly = false) => {
        let matchedKey = safeHeaders.find(h => {
            if (!h || isDisallowed(field, h))
                return false;
            const cleanH = clean(h);
            return keywords.includes(cleanH);
        });
        if (!matchedKey && !exactOnly) {
            matchedKey = safeHeaders.find(h => {
                if (!h || isDisallowed(field, h))
                    return false;
                const cleanH = clean(h);
                return keywords.some(kw => {
                    if (kw === '코드' && (cleanH.includes('1') || cleanH.includes('2') || cleanH.includes('3') || cleanH.includes('종')))
                        return false;
                    return cleanH.includes(kw);
                });
            });
        }
        return matchedKey;
    };
    Object.keys(mappingConfig).forEach(field => {
        const keywords = String(mappingConfig[field]).split(',').map(s => clean(s)).filter(Boolean);
        let matchedKey = '';
        if (field === '창고') {
            // 창고는 가격성 컬럼의 부분일치(예: 최종(창고))를 허용하지 않는다.
            // 1재고현황의 실제 창고는 1행 메타에서 별도 주입한다.
            const warehouseKeywords = Array.from(new Set([...keywords, '창고', '창고코드', '창고명']));
            matchedKey = findHeader(field, warehouseKeywords, false);
        }
        else if (field === '기준일자') {
            // 기준일자는 구매일자/기록과 구분한다. 실제 파일 헤더에 기준일자가 있을 때만 매핑한다.
            const baseDateKeywords = ['기준일자', '기준일', '기준일시', '재고기준일', '재고기준일자'];
            matchedKey = findHeader(field, baseDateKeywords, true);
        }
        else if (field === '규격') {
            // 규격은 정확한 헤더만 인정한다. 품목명(규격) 부분일치 금지.
            const specKeywords = Array.from(new Set([...keywords, '규격', '규격명', '사이즈', '단량']));
            matchedKey = findHeader(field, specKeywords, true);
        }
        else {
            matchedKey = findHeader(field, keywords, false);
        }
        if (matchedKey) {
            headerMap[field] = matchedKey;
        }
    });
    return headerMap;
};
window.findMerchExcelHeaderRow = (rows = [], maxRows = 25) => {
    const clean = (value) => window.cleanHeaderKey
        ? window.cleanHeaderKey(value)
        : String(value ?? '').toLowerCase().replace(/\s/g, '');
    const codeHeaders = new Set(['품목코드', '상품코드', '바코드', '상품번호', '코드']);
    const nameHeaders = new Set(['품목명', '상품명', '품명', '상품이름']);
    const supportHeaders = new Set([
        '규격', '규격명', '단위', '일자', '기준일자', '창고', '창고코드', '거래처명', '구매처',
        '수량', '재고', '재고수량', '입고가', '출고가', '단가', '판매가격', '시중가격', '최종(창고)'
    ]);
    const searchCount = Math.min(Math.max(0, Number(maxRows) || 25), Array.isArray(rows) ? rows.length : 0);
    for (let index = 0; index < searchCount; index++) {
        const rawHeaders = Array.isArray(rows[index]) ? rows[index] : [];
        const headers = rawHeaders.map(clean).filter(Boolean);
        const headerSet = new Set(headers);
        const hasCode = rawHeaders.some(header => window.isMerchProductCodeHeader
            ? window.isMerchProductCodeHeader(header)
            : codeHeaders.has(clean(header)));
        const hasSpecificCode = rawHeaders.some(header => window.isMerchProductCodeHeader
            ? window.isMerchProductCodeHeader(header, true)
            : ['품목코드', '상품코드', '바코드', '상품번호'].includes(clean(header)));
        const hasName = headers.some(header => nameHeaders.has(header));
        const supportCount = headers.filter(header => supportHeaders.has(header)).length;
        // 1종코드·2종코드 같은 파생상품 열은 품목코드 헤더로 인정하지 않는다.
        // 실제 코드 헤더와 품명/업무열이 함께 있는 행만 데이터 헤더로 선택한다.
        if ((hasSpecificCode && hasName) ||
            (headerSet.has('코드') && hasName && supportCount >= 1) ||
            (hasCode && (headerSet.has('규격') || headerSet.has('규격명')) && supportCount >= 2))
            return index;
    }
    return -1;
};
window.detectMerchExcelRoleFromHeaders = (headers = [], context = {}) => {

        ? window.cleanHeaderKey(value)
        : String(value ?? '').toLowerCase().replace(/\s/g, '');
    const rawHeaders = Array.isArray(headers) ? headers : [];
    const normalized = rawHeaders.map(clean).filter(Boolean);
    const headerSet = new Set(normalized);
    const sourceText = clean(`${context.fileName || ''} ${context.sheetName || ''} ${context.titleText || ''}`);
    const codeHeaders = ['품목코드', '상품코드', '바코드', '상품번호', '코드'];
    const hasCode = rawHeaders.some(header => window.isMerchProductCodeHeader
        ? window.isMerchProductCodeHeader(header)
        : codeHeaders.some(codeHeader => clean(header) === codeHeader));
    if (!hasCode) {
        return { role: '', confidence: 0, reason: '품목코드·상품코드·코드 헤더를 찾지 못했습니다.' };
    }

    const scores = { estimate: 0, purchase: 0, inventory: 0, info: 0 };
    const add = (role, points, condition) => { if (condition) scores[role] += points; };
    const sourceHas = (...keywords) => keywords.some(keyword => sourceText.includes(clean(keyword)));
    const has = (...keywords) => keywords.some(keyword => headerSet.has(clean(keyword)));

    add('estimate', 7, sourceHas('견적', '시세'));
    add('estimate', 5, has('입고가') && has('출고가'));
    add('estimate', 3, has('도매A', '도매B', '입고B'));
    add('estimate', 2, has('행사가', '외주비', '노무비'));

    add('purchase', 7, sourceHas('구매현황', '구매', '매입현황', '매입'));
    add('purchase', 5, has('수량', '구매수량', '입고수량') && has('단가', '구매단가', '매입단가'));
    add('purchase', 2, has('합계') && has('일자', '구매일자', '입고일자'));
    add('purchase', 2, has('구매처', '매입처'));

    add('inventory', 8, sourceHas('재고현황', '전체재고', '재고'));
    add('inventory', 7, has('최종(창고)', '최종창고', '기말실사(이월수량)'));
    add('inventory', 4, has('기록') && has('재고', '재고수량', '현재고', '잔량'));
    add('inventory', 2, has('구분(기본)', '적재위치'));

    add('info', 8, sourceHas('상품정보', '정보수정', '쇼핑몰'));
    add('info', 7, has('상품코드') && has('판매가격', '시중가격'));
    add('info', 4, has('상품태그', '단가연동', '찜적용안함'));
    add('info', 3, has('테마1', '테마2', '테마3', '테마4', '테마5'));

    const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const [bestRole, bestScore] = ranked[0];
    const secondScore = ranked[1]?.[1] || 0;
    if (bestScore < 5 || (bestScore - secondScore) < 2) {
        return { role: '', confidence: bestScore, scores, reason: '파일 유형을 안전하게 구분할 수 없습니다.' };
    }
    return { role: bestRole, confidence: bestScore - secondScore, scores, reason: '' };
};

const parseExcelRobust = (file) => {
    return new Promise((resolve, reject) => {
        if (!window.XLSX)
            return reject(new Error("엑셀 파서가 로드되지 않았습니다."));
        const processData = (data, type) => {
            try {
                const wb = window.XLSX.read(data, { type: type, cellDates: true });
                const selectedSheet = window.selectMerchExcelDataSheet(wb);
                if (!selectedSheet)
                    return null;
                const { jsonAll, jsonAllRaw, headerRowIdx, sheetName } = selectedSheet;
                // 화면 표시용 값은 기존처럼 raw:false를 사용하되,
                // 쇼핑몰 업로드 재출력용으로 원본 셀 자료형을 raw:true 배열에 별도 보존한다.
                const baseSheetMeta = window.extractInventorySheetMeta
                    ? window.extractInventorySheetMeta(jsonAll, headerRowIdx, sheetName)
                    : {};
                const headers = jsonAll[headerRowIdx] || [];
                const sheetMeta = { ...baseSheetMeta, sheetName, headerRowIdx, headers: [...headers] };
                let endIdx = jsonAll.length - 1;
                while (endIdx > headerRowIdx) {
                    const rowArr = jsonAll[endIdx];
                    if (!rowArr || rowArr.length === 0) {
                        endIdx--;
                        continue;
                    }
                    let filledCount = 0;
                    let rawStr = '';
                    for (let i = 0; i < rowArr.length; i++) {
                        const val = rowArr[i];
                        if (val !== undefined && val !== null && String(val).trim() !== '') {
                            filledCount++;
                            rawStr += String(val).replace(/\s/g, '');
                        }
                    }
                    if (rawStr === '') {
                        endIdx--;
                        continue;
                    }
                    if ((rawStr.includes('출력') || rawStr.includes('시간') || rawStr.includes('합계') || rawStr.includes('총계') || rawStr.includes('오전') || rawStr.includes('오후')) && filledCount <= 4) {
                        endIdx--;
                    }
                    else {
                        break;
                    }
                }
                const parsedData = [];
                for (let i = headerRowIdx + 1; i <= endIdx; i++) {
                    const row = jsonAll[i];
                    const rawRow = jsonAllRaw[i] || [];
                    if (!row)
                        continue;
                    let isEmpty = true;
                    const obj = {};
                    const rawObj = {};
                    headers.forEach((h, idx) => {
                        if (h) {
                            obj[h] = row[idx];
                            rawObj[h] = rawRow[idx] !== undefined ? rawRow[idx] : row[idx];
                            if (row[idx] !== undefined && String(row[idx]).trim() !== '') {
                                isEmpty = false;
                            }
                        }
                    });
                    if (!isEmpty) {
                        Object.defineProperty(obj, '_originalRawRow', {
                            value: rawObj,
                            enumerable: false,
                            configurable: true
                        });
                        parsedData.push(obj);
                    }
                }
                Object.defineProperty(parsedData, '_sheetMeta', {
                    value: sheetMeta,
                    enumerable: false,
                    configurable: true
                });
                return parsedData;
            }
            catch (err) {
                return null;
            }
        };
        const isCSV = file.name.toLowerCase().endsWith('.csv');
        if (isCSV) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                if (text.includes('')) {
                    const utf8Reader = new FileReader();
                    utf8Reader.onload = (e2) => {
                        resolve(processData(e2.target.result, 'string') || []);
                    };
                    utf8Reader.readAsText(file, 'utf-8');
                }
                else {
                    resolve(processData(text, 'string') || []);
                }
            };
            reader.readAsText(file, 'euc-kr');
        }
        else {
            const reader = new FileReader();
            reader.onload = (e) => {
                resolve(processData(new Uint8Array(e.target.result), 'array') || []);
            };
            reader.readAsArrayBuffer(file);
        }
    });
};

        history: ['품목코드', '필드', '변경 전 값', '변경 후 값', '작업값 출처', '처리상태', '관리자 완료 여부'],
        next: ['품목코드', '품목명', '규격', '단위', '불러온 재고', 'LOT 구성', '구매처', '구매단가', '작업 출고가', '작업 행사가', '행사테마', '판매여부', '작업상태', '확정 여부', '작업값 출처', '관리자 완료 여부', '저장 기준시세', '저장 출고가']
    });
    const owns = (object, key) => !!object && Object.prototype.hasOwnProperty.call(object, key);
    const blank = value => value === undefined || value === null || (typeof value === 'string' && value.trim() === '');
    const codeOf = value => window.normalizeProductCodeText
        ? window.normalizeProductCodeText(value)
        : String(value ?? '').trim().replace(/\s+/g, '');

        for (const alias of aliases) if (owns(row, alias)) return row[alias];

        if (blank(value)) return '';
        if (typeof value === 'number') return Number.isFinite(value) ? value : '';

        if (compact === '') return '';
        const parsed = Number(compact);
        return Number.isFinite(parsed) ? parsed : value;
    };
    const saleOrBlank = value => {
        if (blank(value)) return '';
        const normalized = window.normalizeMerchSaleAvailability
            ? window.normalizeMerchSaleAvailability(value)
            : String(value).trim();
        if (String(normalized) === '0') return 0;
        if (String(normalized) === '1') return 1;
        return value;

        if (blank(value)) return '';

    };

        if (Array.isArray(value)) return value.map(lot => ({ ...lot }));

    };
    const normalizeInputRow = (raw = {}, kind = '', index = 0) => {
        const rawCode = firstValue(raw, ['품목코드', '상품코드', '코드', '바코드']);
        const code = codeOf(rawCode);
        const unit = firstValue(raw, ['단위', '재고단위']);
        const purchasePrice = numberOrBlank(firstValue(raw, ['구매단가', '구매가', '입고가', '매입단가', '단가']));
        const vendor = firstValue(raw, ['구매처', '매입처', '거래처', '거래처명']);
        const warehouse = firstValue(raw, ['창고', '창고코드', '출하창고']);
        const lotId = firstValue(raw, ['LOT번호', 'LOT', 'Lot', 'lot', '입고번호', '구매번호']);
        const lots = parseLots(firstValue(raw, ['LOT 구성', 'LOT구성', 'Lots', 'lots']));
        if (lots.length === 0 && (!blank(lotId) || !blank(vendor) || !blank(purchasePrice))) {
            lots.push({
                lotId: blank(lotId) ? '' : String(lotId),
                vendor: vendor ?? '',
                price: purchasePrice,
                warehouse: warehouse ?? '',
                unit: unit ?? '',
                qty: numberOrBlank(firstValue(raw, ['LOT수량', '잔량', '재고수량', '수량']))
            });
        }
        return {
            _index: index,
            _kind: kind,
            _raw: { ...raw },
            rawCode,
            code,
            name: firstValue(raw, ['품목명', '상품명', '품명']) ?? '',
            spec: firstValue(raw, ['규격', '1종규격']) ?? '',
            unit: unit ?? '',
            stock: numberOrBlank(firstValue(raw, ['불러온 재고', '재고', '재고수량', '현재고', '잔량', '수량'])),
            purchasePrice,
            vendor: vendor ?? '',
            warehouse: warehouse ?? '',
            lots,
            savedMarketPrice: numberOrBlank(firstValue(raw, ['저장 기준시세', '저장기준시세', '기준시세', '시중가'])),
            savedOutPrice: numberOrBlank(firstValue(raw, ['저장 출고가', '저장출고가', '확정 출고가', '작업 출고가', '출고가'])),
            workOutPrice: numberOrBlank(firstValue(raw, ['작업 출고가', '확정 출고가', '출고가'])),
            workPromoPrice: numberOrBlank(firstValue(raw, ['작업 행사가', '확정 행사가', '행사가'])),
            workTheme: themeText(firstValue(raw, ['행사테마', '테마'])),
            workSale: saleOrBlank(firstValue(raw, ['판매여부'])),
            status: firstValue(raw, ['작업상태', '처리상태']) || STATUS.PENDING,
            confirmed: truthy(firstValue(raw, ['확정 여부', '확정여부'])),
            adminCompleted: truthy(firstValue(raw, ['관리자 완료 여부', '관리자완료여부']))

    };
    const buildArea = (rawRows = [], kind = '', lotsByCode = null) => {
        const rows = (Array.isArray(rawRows) ? rawRows : []).map((raw, index) => normalizeInputRow(raw, kind, index));
        const counts = new Map();
        rows.forEach(row => {
            if (row.code) counts.set(row.code, (counts.get(row.code) || 0) + 1);
        });
        const duplicateCodes = [...counts.entries()].filter(([, count]) => count > 1).map(([code]) => code);
        const duplicateSet = new Set(duplicateCodes);
        const byCode = {};
        const invalidRows = [];
        rows.forEach(row => {
            if (!row.code || duplicateSet.has(row.code)) {
                invalidRows.push({ ...row, unmatchedReason: !row.code ? '품목코드 공란' : '동일 영역 품목코드 중복' });
                return;
            }
            const evidence = lotsByCode?.[row.code];
            byCode[row.code] = evidence?.length ? { ...row, lots: evidence.map(lot => ({ ...lot })) } : row;
        });
        return { kind, rows, byCode, invalidRows, duplicateCodes, total: rows.length };
    };
    const rowsFromSheet = (workbook, sheetName) => {
        const sheet = workbook?.Sheets?.[sheetName];
        return sheet ? window.XLSX.utils.sheet_to_json(sheet, { defval: null, raw: true }) : [];
    };
    const parseWorkbook = (workbook, kind) => {
        if (!workbook || !Array.isArray(workbook.SheetNames) || workbook.SheetNames.length === 0) {
            throw new Error('엑셀 통합문서를 읽지 못했습니다.');
        }
        if (kind === 'loaded' && workbook.SheetNames.includes('전체재고')) {
            const totalRows = rowsFromSheet(workbook, '전체재고');
            const lotEvidence = {};
            ['구매잔량', '기타상품'].flatMap(name => rowsFromSheet(workbook, name))
                .map((raw, index) => normalizeInputRow(raw, 'lot', index))
                .forEach(row => {
                    if (!row.code) return;
                    if (!lotEvidence[row.code]) lotEvidence[row.code] = [];
                    if (row.lots.length > 0) lotEvidence[row.code].push(...row.lots);
                    else lotEvidence[row.code].push({ lotId: '', vendor: row.vendor, price: row.purchasePrice, warehouse: row.warehouse, unit: row.unit, qty: row.stock });
                });
            return buildArea(totalRows, kind, lotEvidence);
        }
        const selectedSheet = kind === 'catalog' && workbook.SheetNames.includes('다음카탈로그')
            ? '다음카탈로그'
            : workbook.SheetNames[0];
        return buildArea(rowsFromSheet(workbook, selectedSheet), kind);
    };
    const readWorkbookFile = (file, kind) => new Promise((resolve, reject) => {
        if (!file) return reject(new Error('파일이 없습니다.'));
        if (!/\.(xlsx|xls|xlsm)$/i.test(file.name || '')) return reject(new Error('지원하지 않는 파일형식입니다.'));
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
        reader.onload = event => {
            try {
                const workbook = window.XLSX.read(new Uint8Array(event.target.result), { type: 'array', cellDates: false });
                resolve(parseWorkbook(workbook, kind));
            }
            catch (error) {
                reject(new Error(`엑셀 파싱 실패: ${error?.message || error}`));
            }
        };
        reader.readAsArrayBuffer(file);
    });
    const captureMasterSnapshot = (masterProducts = {}) => {
        const snapshot = {};
        Object.values(masterProducts || {}).forEach(item => {
            const code = codeOf(item?.코드 ?? item?.['품목코드']);
            if (!code) return;
            snapshot[code] = {
                code,
                name: item?.품목명 ?? item?.상품명 ?? '',
                spec: item?.규격 ?? '',
                unit: item?.단위 ?? '',
                inPrice: numberOrBlank(item?.입고가),
                outPrice: numberOrBlank(item?.출고가),
                marketPrice: numberOrBlank(item?.시중가),
                promoPrice: numberOrBlank(item?.행사가),
                theme: themeText(item?.행사테마),
                sale: saleOrBlank(item?.판매여부),
                currentPrice: !blank(item?.행사가) && Number(item?.행사가) > 0 ? numberOrBlank(item?.행사가) : numberOrBlank(item?.출고가)
            };
        });
        return snapshot;
    };
    const lotKey = (lot = {}, code = '') => {
        const uniqueId = String(lot.lotId ?? lot['LOT번호'] ?? lot['입고번호'] ?? '').trim();
        if (uniqueId) return `ID:${uniqueId}`;
        return ['GROUP', code, lot.vendor ?? lot['구매처'] ?? '', valueToken(numberOrBlank(lot.price ?? lot['구매단가'])), lot.warehouse ?? lot['창고'] ?? '', lot.unit ?? lot['단위'] ?? ''].join('|');
    };
    const groupedLots = (lots = [], code = '') => {
        const groups = {};
        (Array.isArray(lots) ? lots : []).forEach(lot => {
            const key = lotKey(lot, code);
            if (!groups[key]) groups[key] = { key, qty: 0, lots: [] };
            const qty = numberOrBlank(lot.qty ?? lot['수량'] ?? lot['잔량']);
            if (typeof qty === 'number') groups[key].qty += qty;
            groups[key].lots.push({ ...lot });
        });
        return groups;
    };
    const compareLots = (catalogLots = [], loadedLots = [], code = '') => {
        const catalogGroups = groupedLots(catalogLots, code);
        const loadedGroups = groupedLots(loadedLots, code);
        const before = Object.keys(catalogGroups);
        const after = Object.keys(loadedGroups);
        return {
            retained: before.filter(key => owns(loadedGroups, key)),
            newKeys: after.filter(key => !owns(catalogGroups, key)),
            missing: before.filter(key => !owns(loadedGroups, key)),
            catalogGroups,
            loadedGroups
        };
    };
    const sourceFingerprint = item => item ? JSON.stringify([
        item.name, item.spec, item.unit, item.stock, item.purchasePrice, item.vendor, item.warehouse,
        item.savedMarketPrice, item.savedOutPrice, item.workOutPrice, item.workPromoPrice, item.workTheme, item.workSale,
        Object.keys(groupedLots(item.lots, item.code)).sort().map(key => [key, groupedLots(item.lots, item.code)[key].qty])
    ]) : '__MISSING__';
    const masterFingerprint = item => item ? JSON.stringify([item.name, item.spec, item.unit, item.inPrice, item.outPrice, item.marketPrice, item.promoPrice, item.theme, item.sale]) : '__MISSING__';
    const initialDraft = (master, catalog) => {
        const inherit = !!catalog && catalog.status === STATUS.DONE && catalog.confirmed && catalog.adminCompleted;
        const catalogValues = { outPrice: catalog?.workOutPrice, promoPrice: catalog?.workPromoPrice, theme: catalog?.workTheme, sale: catalog?.workSale };
        const values = {};
        const sources = {};
        WORK_FIELDS.forEach(field => {
            values[field.key] = (inherit ? catalogValues[field.key] : master?.[field.key]) ?? '';
            sources[field.key] = inherit ? '승계' : '마스터';
        });
        return { ...values, sources, actions: { promoPrice: 'KEEP' }, edited: {}, original: { ...values } };
    };
    const decorateRow = (row, extraIssues = []) => {
        const issues = [...extraIssues];
        const lots = compareLots(row.catalog?.lots || [], row.loaded?.lots || [], row.code);
        if (row.unmatched) issues.push('미매칭');
        if (!row.master) issues.push('마스터 미등록');
        if (!row.catalog) issues.push('카탈로그 없음');
        if (!row.loaded) issues.push('오늘 정보 없음');
        if (row.catalog && row.loaded && typeof row.catalog.stock === 'number' && typeof row.loaded.stock === 'number' && row.catalog.stock !== row.loaded.stock) {
            const difference = row.loaded.stock - row.catalog.stock;
            issues.push(`재고 ${difference > 0 ? '+' : ''}${difference}`);
        }
        if (lots.retained.length) issues.push('동일 LOT 현재 잔존');
        if (lots.newKeys.length) issues.push('새 LOT');
        if (lots.missing.length) issues.push('카탈로그 LOT 미잔존');
        if (!blank(row.catalog?.purchasePrice) && !blank(row.loaded?.purchasePrice) && !sameValue(row.catalog.purchasePrice, row.loaded.purchasePrice)) {
            const difference = Number(row.loaded.purchasePrice) - Number(row.catalog.purchasePrice);
            if (Number.isFinite(difference)) issues.push(`구매원가 ${difference > 0 ? '+' : ''}${difference}`);
        }
        if (row.master && row.catalog && !blank(row.catalog.savedMarketPrice) && !sameValue(row.master.marketPrice, row.catalog.savedMarketPrice)) issues.push('기준시세 변경');
        if (row.master && row.catalog && !blank(row.catalog.savedOutPrice) && !sameValue(row.master.outPrice, row.catalog.savedOutPrice)) issues.push('출고가 변경');
        if (row.master && row.catalog) {
            const catalogSalePrice = !blank(row.catalog.workPromoPrice) && Number(row.catalog.workPromoPrice) > 0 ? row.catalog.workPromoPrice : row.catalog.workOutPrice;
            if (!blank(catalogSalePrice) && !sameValue(row.master.currentPrice, catalogSalePrice)) issues.push('현재 적용 판매가 변경');
        }
        if (blank(row.draft.promoPrice) && !blank(row.draft.theme)) issues.push('행사가 없이 테마만 존재');
        const existingPromotion = !!row.catalog && row.catalog.status === STATUS.DONE && row.catalog.confirmed && row.catalog.adminCompleted
            && !blank(row.catalog.workPromoPrice) && Number(row.catalog.workPromoPrice) !== 0;
        const endReview = existingPromotion && (!row.loaded || row.loaded.stock === 0 || (lots.missing.length > 0 && lots.retained.length === 0));
        const purposes = [];
        if (existingPromotion) purposes.push('기존행사');
        if (endReview) {
            purposes.push('행사종료');
            issues.push('행사 종료 검토');
        }
        if (issues.some(issue => /기준시세 변경|출고가 변경|현재 적용 판매가 변경|구매원가/.test(issue))) purposes.push('가격변동');
        if ((!row.catalog && !!row.loaded) || lots.newKeys.length > 0) purposes.push('신규입고');
        if (purposes.length === 0) purposes.push('기타검토');
        const report = [];
        if (row.catalog && row.loaded && !sameValue(row.catalog.stock, row.loaded.stock)) report.push(`재고 ${display(row.catalog.stock)} / ${display(row.loaded.stock)}`);
        if (!blank(row.catalog?.purchasePrice) && !blank(row.loaded?.purchasePrice) && !sameValue(row.catalog.purchasePrice, row.loaded.purchasePrice)) report.push(`구매원가 ${display(row.catalog.purchasePrice)} / ${display(row.loaded.purchasePrice)}`);
        if (lots.retained.length || lots.newKeys.length || lots.missing.length) report.push(`LOT 잔존 ${lots.retained.length}, 신규 ${lots.newKeys.length}, 미잔존 ${lots.missing.length}`);
        return { ...row, lots, issues: [...new Set(issues)], purposes, report: report.slice(0, 2).join(' · ') || '추가 검토사실 없음' };
    };
    const createSession = ({ masterSnapshot = {}, previousCatalog = null, loadedRaw = null, previousRows = [], changeKind = '' } = {}) => {
        const catalog = previousCatalog || buildArea([], 'catalog');
        const loaded = loadedRaw || buildArea([], 'loaded');
        const priorByCode = {};
        (previousRows || []).filter(row => !row.unmatched && row.code).forEach(row => { priorByCode[row.code] = row; });
        const duplicateSet = new Set([...(catalog.duplicateCodes || []), ...(loaded.duplicateCodes || [])]);
        const codes = new Set([...Object.keys(masterSnapshot || {}), ...Object.keys(catalog.byCode || {}), ...Object.keys(loaded.byCode || {}), ...duplicateSet]);
        const rows = [];
        [...codes].sort((left, right) => String(left).localeCompare(String(right), 'ko-KR', { numeric: true })).forEach(code => {
            const master = masterSnapshot[code] || null;
            const catalogItem = catalog.byCode[code] || null;
            const loadedItem = loaded.byCode[code] || null;
            const conflict = duplicateSet.has(code);
            const prior = conflict ? null : priorByCode[code];
            const draft = prior ? {
                ...prior.draft,
                sources: { ...(prior.draft.sources || {}) },

                edited: { ...(prior.draft.edited || {}) },
                original: { ...(prior.draft.original || {}) }

            let status = prior?.status || STATUS.PENDING;
            let confirmed = !!prior?.confirmed;
            let adminCompleted = !!prior?.adminCompleted;
            const extraIssues = [];
            if (conflict) {
                status = STATUS.REVIEW;
                confirmed = false;
                adminCompleted = false;
                extraIssues.push('동일 영역 품목코드 중복');
            }
            if (prior && ['catalog', 'loaded'].includes(changeKind)) {
                const key = changeKind === 'catalog' ? 'catalog' : 'loaded';
                const before = prior[key];
                const after = key === 'catalog' ? catalogItem : loadedItem;
                const alreadyConfirmed = prior.status === STATUS.DONE || prior.confirmed || prior.adminCompleted;
                if ((before || alreadyConfirmed) && sourceFingerprint(before) !== sourceFingerprint(after)) {
                    status = after ? STATUS.REVIEW : STATUS.HOLD;
                    confirmed = false;
                    adminCompleted = false;
                    extraIssues.push('원본 변경 후 재확인');
                }
            }
            if (prior && changeKind === 'master' && masterFingerprint(prior.master) !== masterFingerprint(master)) {
                if (status === STATUS.DONE) status = STATUS.REVIEW;
                confirmed = false;
                adminCompleted = false;
                extraIssues.push('마스터 변경 후 재확인');
                WORK_FIELDS.forEach(field => {
                    if (!draft.edited[field.key] && draft.sources[field.key] === '마스터') {
                        draft[field.key] = master?.[field.key] ?? '';
                        draft.original[field.key] = draft[field.key];
                    }
                });
            }
            const blocked = conflict || !master;
            rows.push(decorateRow({
                key: code,
                code,
                name: master?.name || loadedItem?.name || catalogItem?.name || '',
                spec: master?.spec || loadedItem?.spec || catalogItem?.spec || '',
                unit: master?.unit || loadedItem?.unit || catalogItem?.unit || '',
                master,
                catalog: catalogItem,
                loaded: loadedItem,
                unmatched: false,
                blocked,
                blockingReasons: [...(conflict ? ['동일 영역 품목코드 중복'] : []), ...(!master ? ['마스터 미등록'] : [])],
                draft,
                status,
                confirmed,
                adminCompleted
            }, extraIssues));
        });
        const appendInvalid = (item, areaName) => {
            rows.push(decorateRow({
                key: `UNMATCHED:${areaName}:${item._index}:${item.code || 'NO_CODE'}`,
                code: item.code || '',
                name: item.name || '',
                spec: item.spec || '',
                unit: item.unit || '',
                master: null,
                catalog: areaName === 'catalog' ? item : null,
                loaded: areaName === 'loaded' ? item : null,
                unmatched: true,
                blocked: true,
                blockingReasons: [item.unmatchedReason || '미매칭'],
                draft: initialDraft(null, null),
                status: STATUS.REVIEW,
                confirmed: false,
                adminCompleted: false
            }, [item.unmatchedReason || '미매칭']));
        };
        catalog.invalidRows.forEach(item => appendInvalid(item, 'catalog'));
        loaded.invalidRows.forEach(item => appendInvalid(item, 'loaded'));
        return { masterSnapshot, previousCatalog: catalog, loadedRaw: loaded, rows };
    };
    const replaceSource = (session, kind, area) => {
        if (!area || area.total === 0) return { ok: false, reason: '정상 데이터가 0행이므로 기존 원본을 유지합니다.', session };
        return {
            ok: true,
            session: createSession({
                masterSnapshot: session.masterSnapshot,
                previousCatalog: kind === 'catalog' ? area : session.previousCatalog,
                loadedRaw: kind === 'loaded' ? area : session.loadedRaw,
                previousRows: session.rows,
                changeKind: kind
            })
        };
    };
    const previewReplacement = (session, kind, area) => {
        const before = new Set(Object.keys((kind === 'catalog' ? session.previousCatalog : session.loadedRaw)?.byCode || {}));
        const after = new Set(Object.keys(area?.byCode || {}));
        return {
            유지: [...after].filter(code => before.has(code)).length,
            신규: [...after].filter(code => !before.has(code)).length,
            사라짐: [...before].filter(code => !after.has(code)).length,
            중복: area?.duplicateCodes?.length || 0,
            미매칭: area?.invalidRows?.length || 0
        };
    };
    const refreshMaster = (session, masterProducts) => createSession({
        masterSnapshot: captureMasterSnapshot(masterProducts),
        previousCatalog: session.previousCatalog,
        loadedRaw: session.loadedRaw,
        previousRows: session.rows,

        if (!code) return;

// 4) 견적·구매·재고·정보는 동일 범위를 사용하되, 견적의 추가상품은 비교 예외로 유지한다.

window.getMerchMasterWorkCatalogNames = (masterItem = {}) => {
    const raw = masterItem?.['견적서'] ?? masterItem?.['카테고리'] ?? '';
    return [...new Set(String(raw || '').split(',').map(v => v.trim()).filter(Boolean))];
};
window.getMerchSelectedWorkCatalogNames = (activeTags = []) => {
    const names = (Array.isArray(activeTags) ? activeTags : [])
        .filter(tag => String(tag?.type || '') === 'category')
        .map(tag => String(tag?.name || '').trim())
        .filter(Boolean);
    // 카탈로그 작업범위는 단일선택이다. 과거 상태가 여러 개면 마지막 선택값만 사용한다.

};
window.buildMerchWorkScope = (masterProducts = {}, activeTags = []) => {
    const catalogNames = window.getMerchSelectedWorkCatalogNames(activeTags);
    const catalogSet = new Set(catalogNames);
    const codeSet = new Set();
    const allCodes = new Set();
    Object.values(masterProducts || {}).forEach(masterItem => {
        const code = window.normalizeProductCodeText
            ? window.normalizeProductCodeText(masterItem?.코드 || masterItem?.['품목코드'])
            : String(masterItem?.코드 || masterItem?.['품목코드'] || '').replace(/\s/g, '');
        if (!code) return;
        allCodes.add(code);
        if (catalogNames.length === 0) {
            codeSet.add(code);
