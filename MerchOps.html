        }
        const itemCatalogs = window.getMerchMasterWorkCatalogNames(masterItem);
        if (itemCatalogs.some(name => catalogSet.has(name))) codeSet.add(code);
    });

        mode: catalogNames.length > 0 ? 'catalog' : 'all',
        catalogNames,
        catalogName: catalogNames[0] || '',

        allCodes,
        masterCount: allCodes.size,
        scopeCount: codeSet.size

    return { items: next, summary: { catalogs: [...scope.catalogNames], maintain, add, missing, total: comparisonCodes.size }, scope };
};

    const handleCommonExcelUpload = useCallback(async (e) => {
        const files = Array.from(e?.target?.files || []);
        const targetInput = e?.target;
        if (files.length === 0)
            return false;
        if (!window.XLSX) {
            ui.setAlertMsg('엑셀 파서 로드 대기중입니다.');
            if (targetInput) targetInput.value = '';
            return false;
        }
        const roleLabels = { estimate: '견적', purchase: '구매', inventory: '재고', info: '정보' };
        ui.setIsProcessing(true);
        ui.setProcessMsg('[Excel] 파일 구조 확인 중...');
        try {
            const detectedFiles = [];
            for (const file of files) {
                const excelData = await parseExcelRobust(file);
                if (!excelData || excelData.length === 0) {
                    throw new Error(`[${file.name}] 품목코드와 품목명이 있는 헤더를 찾지 못했습니다.`);
                }
                const sheetMeta = excelData._sheetMeta || {};
                const detection = window.detectMerchExcelRoleFromHeaders(Object.keys(excelData[0]), {
                    fileName: file.name,
                    sheetName: sheetMeta.sheetName,
                    titleText: sheetMeta.titleText
                });
                if (!detection.role) {
                    throw new Error(`[${file.name}] ${detection.reason || '파일 유형을 판별하지 못했습니다.'}\n견적·구매·재고·정보 중 해당 개별 버튼으로 확인해 주세요.`);
                }
                detectedFiles.push({ file, role: detection.role });
            }
            const detectedRoles = [...new Set(detectedFiles.map(item => item.role))];
            if (detectedRoles.length !== 1) {
                const detail = detectedFiles.map(item => `${item.file.name}: ${roleLabels[item.role] || item.role}`).join('\n');
                throw new Error(`서로 다른 유형의 파일은 한 번에 처리하지 않습니다.\n${detail}\n유형별로 나누어 불러와 주세요.`);
            }
            const detectedRole = detectedRoles[0];
            ui.showToast(`🔎 Excel 불러오기: 유형 선택 없이 ${roleLabels[detectedRole]} 처리로 연결`);
            return await handleFileUpload({ target: { files, value: '' } }, detectedRole, { commonExcel: true });
        }
        catch (error) {
            console.error('MerchOps common Excel import failed', error);
            ui.setAlertMsg(`❌ Excel 불러오기 중단\n${error?.message || error}`);
            return false;
        }
        finally {
            if (targetInput) targetInput.value = '';
            ui.setIsProcessing(false);
            ui.setProcessMsg('');
        }
    }, [handleFileUpload, ui]);

                            _workScopeCatalogs: [nextCatalogName],

        const removeLoadedFilter = () => {

    const handleQueueNoInboundAction = useCallback((action = '') => {
        const normalizedAction = window.normalizeMerchNoInboundAction ? window.normalizeMerchNoInboundAction(action) : '';
        if (!normalizedAction) {
            ui.setNoInboundActionQueue?.({ action: '', codes: [], queuedAt: '' });

    const stageQuoteListForF7 = useCallback((rawName, ownerLabel) => {

            if (tags.includes(safeName)) return;

    const collectWholesaleBelowCostWarnings = useCallback((rows = []) => {
        // v2.1.91 정책 정정:
        // - 같은 코드라도 정품/비품 단가 체계가 다르므로 교차 비교하지 않는다.
        // - 입고가  ↔ 도매A 만 비교한다.
        // - 입고B   ↔ 도매B 만 비교한다.
        // - 입고가와 도매B, 입고B와 도매A는 비교 대상이 아니다.
        const warnings = [];
        const getValue = (row, key, defaultValue = '') => window.getTableValueFromRow(row, key, defaultValue);
        const getNum = (row, key) => {
            const value = getValue(row, key, '');
            return window.isBlankCell(value) ? '' : window.parseNum(value);
        };
        const getStr = (row, key, defaultValue = '') => {
            const value = getValue(row, key, defaultValue);
            return value !== undefined && value !== null ? String(value) : defaultValue;
        };
        rows.forEach(row => {
            const code = window.normalizeProductCodeText(row.코드);
            [
                { baseField: '입고가', wholesaleField: '도매A', label: '입고가↔도매A' },
                { baseField: '입고B', wholesaleField: '도매B', label: '입고B↔도매B' }
            ].forEach(({ baseField, wholesaleField, label }) => {
                const basePrice = getNum(row, baseField);
                const wholesalePrice = getNum(row, wholesaleField);
                if (basePrice > 0 && wholesalePrice > 0 && wholesalePrice < basePrice) {
                    warnings.push({
                        code,
                        name: getStr(row, '품목명'),
                        spec: getStr(row, '규격'),
                        baseField,
                        basePrice,
                        wholesaleField,
                        wholesalePrice,
                        diff: wholesalePrice - basePrice,
                        label,
                        message: `${wholesaleField}가 ${baseField}보다 낮음`
                    });
                }
            });
        });
        return warnings;
    }, []);

    // ============================================================
    // [M-OUTPUT-01] F8 엑셀 출력
    // 역할: 현재 작업테이블 결과를 외부 업로드용 엑셀로만 생성한다.
    // 정책: F8은 마스터·히스토리를 변경하지 않는다. 중요 결과 검증은 F9 출력검증센터에서 수행한다.
    // ============================================================
    const handleQuickExcelExport = useCallback(async () => {
        if (quickExcelInFlightRef.current || ui.isProcessing) {
            ui.showToast('⚠️ 다른 출력 또는 작업이 진행 중입니다. 완료 후 다시 실행하세요.');
            return;
        }
        quickExcelInFlightRef.current = true;
        try {
        if (!window.XLSX)
            return ui.showToast('⚠️ 엑셀 라이브러리 로드 대기 중입니다.');
        if (!fullDisplayRows || fullDisplayRows.length === 0)
            return ui.showToast('⚠️ 빠른 출력할 데이터가 없습니다.');
        const activeWorkflowSteps = (window.normalizeMerchFilterSteps ? window.normalizeMerchFilterSteps(ui.filterSteps || []) : [])
            .filter((step, idx) => {
                if (step.stepType !== 'action') return false;
                const runtimeId = window.getMerchFilterStepRuntimeId ? window.getMerchFilterStepRuntimeId(step, idx) : String(step.id || idx);
                return !(Array.isArray(ui.disabledFilterStepIds) ? ui.disabledFilterStepIds : []).map(v => String(v)).includes(runtimeId);
            });
        const hasWorkflowOutput = activeWorkflowSteps.length > 0;
        const hasPreparedRows = quickExcelReadyRef.current?.ready === true;
        const readyRows = hasPreparedRows && Array.isArray(quickExcelReadyRef.current.rows) ? quickExcelReadyRef.current.rows : [];
        const readyCodes = hasPreparedRows && Array.isArray(quickExcelReadyRef.current.codes) ? quickExcelReadyRef.current.codes : [];
        const readyCodeSet = new Set(readyCodes);
        let targetRows = readyRows.length > 0
            ? readyRows
            : (readyCodes.length > 0
                ? fullDisplayRows.filter(row => readyCodeSet.has(window.getManagedRowKey(row)))
                : (hasWorkflowOutput
                    ? fullDisplayRows
                    : (ui.selectedRows.size > 0 ? fullDisplayRows.filter(row => ui.selectedRows.has(window.getManagedRowKey(row))) : fullDisplayRows)));
        if (targetRows.length === 0)
            return ui.showToast('⚠️ 선택된 엑셀 출력 대상이 없습니다.');
        // [M-NO-INBOUND-QUICK-F8-01] 견적/시세 쇼핑몰업로드 전용 출력 정책
        // 선택 직후에는 예약 queue를, F7 성공 후에는 작업행의 committed 표시를 사용한다.
        // 다른 역할·ERP업데이트·F9·마스터 저장계약에는 적용하지 않는다.
        const normalizeNoInboundQuickAction = (value) => {
            const normalized = window.normalizeMerchNoInboundAction
                ? window.normalizeMerchNoInboundAction(value)
                : String(value || '').trim();
            return ['spot', 'stop'].includes(normalized) ? normalized : '';
        };
        const queuedNoInboundQuickAction = normalizeNoInboundQuickAction(ui.noInboundActionQueue?.action || '');
        const noInboundQuickActionsByCode = new Map();
        targetRows.forEach(row => {
            const code = window.normalizeProductCodeText ? window.normalizeProductCodeText(row?.코드 || '') : String(row?.코드 || '').trim();
            const committedAction = normalizeNoInboundQuickAction(row?.finalData?._noInboundActionCommitted || '');
            if (code && committedAction) noInboundQuickActionsByCode.set(code, committedAction);
        });
        if (queuedNoInboundQuickAction) {
            (Array.isArray(ui.noInboundActionQueue?.codes) ? ui.noInboundActionQueue.codes : []).forEach(rawCode => {
                const code = window.normalizeProductCodeText ? window.normalizeProductCodeText(rawCode) : String(rawCode || '').trim();
                if (code) noInboundQuickActionsByCode.set(code, queuedNoInboundQuickAction);
            });
        }
        const hasNoInboundQuickF8Policy = !!queuedNoInboundQuickAction || noInboundQuickActionsByCode.size > 0;
        const resolveNoInboundQuickF8Policy = (row, outputCode, isEstimateRow) => {
            if (!isEstimateRow || !hasNoInboundQuickF8Policy) return null;
            const outputKey = window.normalizeProductCodeText ? window.normalizeProductCodeText(outputCode) : String(outputCode || '').trim();
            const rowKey = window.normalizeProductCodeText ? window.normalizeProductCodeText(row?.코드 || '') : String(row?.코드 || '').trim();
            const action = noInboundQuickActionsByCode.get(outputKey) || noInboundQuickActionsByCode.get(rowKey) || '';
            return {
                saleCode: action === 'stop' ? '0' : '1',
                stockQty: action === 'spot' ? 0 : 999
            };
        };
        const inventoryF8Module = window.MERCH_INVENTORY_F8_MODULE;
        const inventoryTargetCount = inventoryF8Module
            ? targetRows.filter(row => inventoryF8Module.isInventoryRow(row)).length

        if (inventoryTargetCount > 0 && inventoryTargetCount !== targetRows.length) {

        }
        let inventoryF8SourceSnapshot = null;
        if (inventoryTargetCount === targetRows.length && inventoryF8Module) {
            // [M-INVENTORY-F8-SCOPE-01] F8은 '현재 출력대상'을 검증한다.
            // 재고 원본 전체 스냅샷과 비교하면 사용자가 행사상품 필터·제외·선택으로 의도적으로 줄인 출력도
            // 대량 누락/재고합계 차이로 오판정되어 차단된다.
            // 따라서 필터/제외/선택이 모두 반영된 targetRows를 검증 기준으로 고정한 뒤 코드단위로 집계한다.
            inventoryF8SourceSnapshot = inventoryF8Module.captureSourceSnapshot(targetRows);
            // Lot 원본행과 source는 그대로 두고 이번 F8 출력 배열에서만 코드단위 단일행으로 투영한다.
            targetRows = inventoryF8Module.aggregateRows(targetRows);
        }
        const workflowText = activeWorkflowSteps.map(step => step.label || window.MERCH_EXECUTION_ACTION_LABELS?.[step.operation] || step.operation).filter(Boolean).join(' + ');
        const targetText = inventoryF8SourceSnapshot
            ? '현재 재고 출력범위의 상품코드 집계'
            : (hasWorkflowOutput ? '양식 실행 결과 전체' : (ui.selectedRows.size > 0 ? '선택상품' : '현재 화면 전체'));
        // 쇼핑몰 정보출력은 실제 원본행을 가진 상품만 허용한다.
        // sources.info 빈 객체나 현재 역할만 info인 마스터 행은 출력대상에서 제외해 대량 빈 행 생성을 방지한다.
        const getInfoOriginalCode = (row = {}, src = {}) => {
            const headers = Array.isArray(src._originalHeaders) ? src._originalHeaders : [];
            const codeHeader = headers.find(h => ['상품코드', '품목코드', '코드'].includes(String(h || '').replace(/\s/g, '')));
            const originalRaw = src._originalRawRow || src._originalRow || {};
            const originalDisplay = src._originalRow || {};
            return (codeHeader ? (originalRaw[codeHeader] ?? originalDisplay[codeHeader]) : '') ?? row.코드 ?? '';
        };
        const isInfoQuickRow = (row = {}) => {
            const src = row?.sources?.info;
            if (!src || typeof src !== 'object') return false;
            if (!Array.isArray(src._originalHeaders) || src._originalHeaders.length === 0) return false;
            if (!src._originalRow || typeof src._originalRow !== 'object') return false;
            return String(getInfoOriginalCode(row, src) ?? '').trim() !== '';
        };
        const exportInfoRows = (rows = []) => {
            const infoRows = rows.filter(isInfoQuickRow);
            if (infoRows.length === 0) return false;

            // 첫 원본파일의 헤더순서를 기준으로 삼고, 다중파일에서만 뒤쪽에 추가헤더를 보강한다.
