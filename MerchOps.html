    return MERCH_SOURCE_ROLES.find(role => hasMerchSourceData(sources?.[role])) || '';
  };

  MERCH.resolveWorkingField = (row = {}, master = {}, field = '', options = {}) => {
    const fields = uniqueFields([field, ...(Array.isArray(options.aliases) ? options.aliases : [])]);
    const canonicalField = String(field || fields[0] || '');
    const finalData = row?.finalData || {};
    const sources = row?.sources || {};
    const sourceRole = MERCH.getWorkingSourceRole(sources, row?._lastUploadRole || '');
    const source = sourceRole ? (sources?.[sourceRole] || {}) : {};
    const directMarkers = { ...(finalData?._editedFields || {}), ...(finalData?._bulkEditedFields || {}) };
    const generatedMarkers = finalData?._generatedFields || {};
    const finalCell = findOwnedField(finalData, fields);
    const direct = fields.some(name => directMarkers[name] === true);
    const promoActionGenerated = finalData?._promoResetRequested === true
      && fields.some(name => ['행사가', '행사테마', '테마', 'promoTheme', '_theme', '테마1', '테마2', '테마3', '테마4', '테마5'].includes(name));
    const previousPromoGenerated = finalData?._previousPromoApplied === true && fields.includes('행사가');
    const explicitGenerated = fields.some(name => generatedMarkers[name] === true)
      || options.generated === true
      || promoActionGenerated
      || previousPromoGenerated
      || (canonicalField === '출고가' && !!(finalData?._ruleAppliedAt || finalData?._isRuleApplied));
    const result = (value, origin, isWorkingValue, isExplicitBlank, resolvedField = canonicalField, resolvedRole = '') => ({
      value,
      origin,
      isWorkingValue,
      isExplicitBlank,
      field: resolvedField || canonicalField,
      sourceRole: resolvedRole
    });

    if (direct) {
      const value = finalCell.found ? finalCell.value : '';
      return result(value ?? '', 'direct', true, isBlankValue(value), finalCell.field || canonicalField, sourceRole);
    }
    if (explicitGenerated && finalCell.found) {
      return result(finalCell.value ?? '', 'generated', true, isBlankValue(finalCell.value), finalCell.field, sourceRole);
    }

    const sourceCell = findOwnedField(source, fields);
    if (sourceCell.found) {
      return result(sourceCell.value ?? '', 'source', true, isBlankValue(sourceCell.value), sourceCell.field, sourceRole);
    }

    const masterLookupOnly = options.masterLookupOnly === true
      || row?._masterLookupOnly === true
      || String(row?._lastUploadRole || '') === 'masterLookup';
    const masterCell = findOwnedField(master, fields);
    if (masterLookupOnly) {
      const value = masterCell.found ? (masterCell.value ?? '') : '';
      return result(value, 'master-lookup', true, masterCell.found && isBlankValue(masterCell.value), masterCell.field || canonicalField, '');
    }

    return result(masterCell.found ? (masterCell.value ?? '') : '', 'master-reference', false, false, masterCell.field || canonicalField, '');
  };

  global.resolveMerchWorkingField = MERCH.resolveWorkingField;

  const safeJSONParseRaw = (raw, defaultVal) => {
    try {
      if (!raw || raw === 'undefined' || raw === 'null') return defaultVal;
      const parsed = JSON.parse(raw);
      return parsed === undefined || parsed === null ? defaultVal : parsed;
    } catch (e) {
      return defaultVal;
    }
  };

  const safeJSONParse = (key, defaultVal) => {
    try {
      return safeJSONParseRaw(global.localStorage.getItem(key), defaultVal);
    } catch (e) {
      return defaultVal;
    }
  };

  const getNowISO = () => {
    try { return new Date().toISOString(); } catch (e) { return ''; }
  };

  const ERRORS = ONEAPP.ERRORS = ONEAPP.ERRORS || {};

  ERRORS.toActionableMessage = (error, context = '작업') => {
    const name = String(error?.name || '');
    const detail = String(error?.message || error || '').trim();
    if (name === 'QuotaExceededError' || /quota|storage.*full|disk.*full/i.test(detail)) {
      return `${context} 실패: 브라우저 저장공간이 부족합니다. 불필요한 사이트 데이터를 정리한 뒤 다시 시도하세요.`;
    }
    if (name === 'SecurityError' || /access.*denied|not allowed|blocked/i.test(detail)) {
      return `${context} 실패: 브라우저가 저장소 접근을 차단했습니다. 시크릿 모드·사이트 권한을 확인한 뒤 다시 시도하세요.`;
    }
    if (name === 'AbortError' || name === 'TransactionInactiveError') {
      return `${context} 실패: 브라우저 데이터베이스 작업이 중단되었습니다. 페이지를 새로고침한 뒤 다시 시도하세요.`;
    }
    if (name === 'NotFoundError' || /ObjectStore not found/i.test(detail)) {
      return `${context} 실패: 필요한 브라우저 데이터 저장소를 찾지 못했습니다. 페이지를 새로고침해 저장소를 다시 초기화하세요.`;
    }
    return `${context} 실패${detail ? `: ${detail}` : '했습니다. 페이지를 새로고침한 뒤 다시 시도하세요.'}`;
  };

  ERRORS.create = (error, context) => {
    const wrapped = new Error(ERRORS.toActionableMessage(error, context));
    wrapped.name = 'OneAppClientError';
    try { wrapped.cause = error; } catch (e) {}
    return wrapped;
  };

  const calcDiffRate = (oldVal, newVal) => {
    const oldNum = parseNum(oldVal);
    const newNum = parseNum(newVal);
    if (!oldNum) return null;
    return Math.round(((newNum - oldNum) / oldNum) * 1000) / 10;
  };

  // ============================================================
  // MARGIN RULE ENGINE
  // MerchOps / ControlTower 공통 기본 마진룰.
  // 핵심 정책: 01창고 BOX는 10%가 우선이며, 과거 단일 기본룰(*/*/20%)만 남아 있으면 자동 복구한다.
  // ============================================================
  const getDefaultMerchMarginRules = () => ([
    { id: 'rule_1', whCode: '01', unit: 'box, 박스, BOX', rate: 10, type: 'divide' },
    { id: 'rule_2', whCode: '01', unit: 'ea, 개, 낱개, EA, kg, 단', rate: 15, type: 'divide' },
    { id: 'rule_03_box', whCode: '03', unit: 'box, 박스, BOX', rate: 10, type: 'divide' },
    { id: 'rule_03_ea', whCode: '03', unit: 'ea, 개, 낱개, EA, kg, 단', rate: 15, type: 'divide' },
    { id: 'rule_3', whCode: '03,05', unit: 'box, 박스, BOX', rate: 15, type: 'divide' },
    { id: 'rule_4', whCode: '03,05', unit: 'ea, 개, 낱개, EA, kg, 단', rate: 10, type: 'divide' },
    { id: 'rule_5', whCode: '77,99', unit: 'box, 박스, BOX', rate: 10, type: 'divide' },
    { id: 'rule_6', whCode: '77,99', unit: 'ea, 개, 낱개, EA, kg, 단', rate: 15, type: 'divide' },
    { id: 'default', whCode: '*', unit: '*', rate: 20, type: 'divide' }
  ]);

  const normalizeMerchWarehouseForRule = (v) => {
    const raw = String(v ?? '').trim();
    if (!raw || raw === '*') return raw || '';
    return /^\d+$/.test(raw) ? String(Number(raw)).padStart(2, '0') : raw;
  };

  const getMerchUnitRuleCandidates = (v) => {
    const raw = String(v ?? '').trim().toLowerCase();
    if (!raw || raw === '*') return raw === '*' ? ['*'] : [];
    // 확정 단위 필드 하나를 trim/case/공백만 정규화한다. 품명·규격 토큰화나 includes 추론은 하지 않는다.
    const normalized = raw.replace(/\s/g, '');
    return normalized ? [normalized] : [];
  };

  const isLegacyDefaultOnlyMarginRules = (rules = []) => {
    if (!Array.isArray(rules) || rules.length !== 1) return false;
    const r = rules[0] || {};
    return String(r.whCode ?? '*').trim() === '*'
      && String(r.unit ?? '*').trim() === '*'
      && parseNum(r.rate) === 20;
  };

  const isMerchDefaultMarginRule = (rule = {}) => String(rule.whCode ?? '').trim() === '*'
    && String(rule.unit ?? '').trim() === '*';

  const sanitizeMerchMarginRules = (rules = []) => {
    const defaults = getDefaultMerchMarginRules();
    if (!Array.isArray(rules) || rules.length === 0 || isLegacyDefaultOnlyMarginRules(rules)) {
      return defaults.map(r => ({ ...r }));
    }
    const cleaned = rules
      .filter(r => r && typeof r === 'object')
      .map((r, idx) => ({
        id: r.id || `rule_${idx + 1}`,
        whCode: String(r.whCode ?? '').trim(),
        unit: String(r.unit ?? '').trim(),
        rate: parseNum(r.rate),
        type: r.type === 'multiply' ? 'multiply' : 'divide'
      }));
    let defaultSeen = false;
    const exactlyOneDefault = cleaned.filter(rule => {
      if (!isMerchDefaultMarginRule(rule)) return true;
      if (defaultSeen) return false;
      defaultSeen = true;
      return true;
    });
    if (!defaultSeen) exactlyOneDefault.push({ ...defaults[defaults.length - 1] });
    return exactlyOneDefault;
  };

  const matchWh = (ruleWh, targetWh) => {
    if (!ruleWh || String(ruleWh).trim() === '*') return false;
    const target = normalizeMerchWarehouseForRule(targetWh);
    const targets = String(ruleWh).split(/[,./|\s]+/).map(s => normalizeMerchWarehouseForRule(s)).filter(Boolean);
    return targets.some(s => s !== '' && target !== '' && s === target);
  };

  const matchUnit = (ruleUnit, targetUnit) => {
    if (!ruleUnit || String(ruleUnit).trim() === '*') return false;
    const targetUnits = Array.isArray(targetUnit) ? targetUnit : getMerchUnitRuleCandidates(targetUnit);
    const targets = String(ruleUnit)
      .split(/[,./|\s]+/)
      .flatMap(s => getMerchUnitRuleCandidates(s))
      .filter(Boolean);
    return targets.some(ruleUnitNorm => targetUnits.some(targetUnitNorm => targetUnitNorm === ruleUnitNorm));
  };

  const selectMerchMarginRule = (marginRules = [], context = {}) => {
    const inputWarehouse = String(context['_calcWarehouse'] ?? context['창고'] ?? context.whCode ?? '').trim();
    const inputUnit = String(context['_calcUnit'] ?? context['단위'] ?? context.unit ?? '').trim();
    const whCode = normalizeMerchWarehouseForRule(inputWarehouse);
    const unitRaw = inputUnit;
    const unitCandidates = getMerchUnitRuleCandidates(unitRaw);
    const safeRules = sanitizeMerchMarginRules(marginRules);
    const defaultRule = safeRules.find(isMerchDefaultMarginRule)
      || { id: 'default', whCode: '*', unit: '*', rate: 20, type: 'divide' };
    const exactRule = whCode && unitCandidates.length > 0
      ? safeRules.find(rule => !isMerchDefaultMarginRule(rule)
        && String(rule.whCode || '').trim() !== '*'
        && String(rule.unit || '').trim() !== '*'
        && matchWh(rule.whCode, whCode)
        && matchUnit(rule.unit, unitCandidates))
      : null;
    const rule = exactRule || defaultRule;
    return {
      rule,
      ruleId: String(rule.id || ''),
      marginRate: parseNum(rule.rate),
      calculationType: rule.type === 'multiply' ? 'multiply' : 'divide',
      matchType: exactRule ? 'exact' : 'default',
      inputWarehouse,
      inputUnit
    };
  };

  const findBestMarginRule = (marginRules = [], context = {}) => selectMerchMarginRule(marginRules, context).rule;

  const normalizeMerchRuleConditionTokens = (value, normalizer) => {
    const raw = String(value ?? '').trim();
    if (!raw) return [];
    if (raw === '*') return ['*'];
    return [...new Set(raw.split(/[,./|\s]+/).map(token => normalizer(token)).filter(Boolean))].sort();
  };

  const findDuplicateMerchMarginRuleConditions = (rules = []) => {
    const seen = new Map();
    const duplicates = [];
    (Array.isArray(rules) ? rules : []).forEach((rule, index) => {
      if (!rule || typeof rule !== 'object') return;
      const whTokens = normalizeMerchRuleConditionTokens(rule.whCode, normalizeMerchWarehouseForRule);
      const unitTokens = normalizeMerchRuleConditionTokens(rule.unit, token => getMerchUnitRuleCandidates(token).sort().join('+'));
      const key = JSON.stringify([whTokens, unitTokens]);
      if (seen.has(key)) {
        duplicates.push({ firstIndex: seen.get(key), duplicateIndex: index, whCode: String(rule.whCode ?? '').trim(), unit: String(rule.unit ?? '').trim() });
      } else {
        seen.set(key, index);
      }
    });
    return duplicates;
  };

  // ============================================================
  // STORAGE ENGINE
  // ============================================================
  const STORAGE = ONEAPP.STORAGE = ONEAPP.STORAGE || {};
  const MASTER_SNAPSHOT_KEY = 'merchMaster_v870';
  const MASTER_REVISION_KEY = 'merchMaster_revision_v870';
  const MASTER_LOCK_NAME = 'oneapp-merch-master-save';
  const FALLBACK_LOCK_PREFIX = 'merch_fallback_lock_v1:';
  const FALLBACK_FENCE_PREFIX = 'merch_fallback_fence_v1:';

  STORAGE.writeLocalValue = (key, value, options = {}) => {
    const safeKey = String(key || '').trim();
    const label = options.label || `브라우저 저장(${safeKey || '키 없음'})`;
    if (!safeKey) throw new Error(`${label} 실패: 저장 키가 비어 있습니다.`);
    const serialized = String(value ?? '');
    try {
      global.localStorage.setItem(safeKey, serialized);
      if (options.verify !== false && global.localStorage.getItem(safeKey) !== serialized) {
        throw new Error('저장 후 검증값이 일치하지 않습니다.');
      }
      return serialized;
    } catch (error) {
      throw ERRORS.create(error, label);
    }
  };

  STORAGE.writeLocalJSON = (key, value, options = {}) => {
    const label = options.label || `브라우저 JSON 저장(${String(key || '').trim() || '키 없음'})`;
    let serialized;
    try {
      serialized = JSON.stringify(value);
    } catch (error) {
      throw ERRORS.create(error, `${label} 직렬화`);
    }
    return STORAGE.writeLocalValue(key, serialized, { ...options, label });
  };

  // ============================================================
  // SHARED PARSER CATALOG CONFIG
  // 카탈로그명과 창고코드는 trim만 수행한다. 창고코드는 숫자로 변환하지 않아 01을 보존한다.
  // ============================================================
  const CONFIG = ONEAPP.CONFIG = ONEAPP.CONFIG || {};
  const PARSER_CATALOG_WAREHOUSE_MAP_KEY = 'parserCatalogWarehouseMap_v1';

  CONFIG.PARSER_CATALOG_WAREHOUSE_MAP_KEY = PARSER_CATALOG_WAREHOUSE_MAP_KEY;
  CONFIG.normalizeParserCatalogWarehouseMap = (input = {}) => {
    const normalized = {};
    if (!input || typeof input !== 'object' || Array.isArray(input)) return normalized;
    Object.entries(input).forEach(([rawCatalogName, rawWarehouseCode]) => {
      const catalogName = String(rawCatalogName ?? '').trim();
      if (!catalogName) return;
      normalized[catalogName] = String(rawWarehouseCode ?? '').trim();
    });
    return normalized;
  };

  CONFIG.readParserCatalogWarehouseMap = () => CONFIG.normalizeParserCatalogWarehouseMap(
    safeJSONParse(PARSER_CATALOG_WAREHOUSE_MAP_KEY, {})
  );

  CONFIG.writeParserCatalogWarehouseMap = () => global.createMerchOpsOwnerRoute(
    'settings',
    'parser-catalog-warehouse-write',
    'settings.html'
  );

  CONFIG.setParserCatalogWarehouse = () => global.createMerchOpsOwnerRoute(
    'settings',
    'parser-catalog-warehouse-write',
    'settings.html'
  );

  STORAGE.restoreLocalValue = (key, previousValue, options = {}) => {
    const safeKey = String(key || '').trim();
    const label = options.label || `브라우저 저장 복구(${safeKey || '키 없음'})`;
    try {
      if (previousValue === null || previousValue === undefined) {
        global.localStorage.removeItem(safeKey);
        if (options.verify !== false && global.localStorage.getItem(safeKey) !== null) {
          throw new Error('삭제 후 검증값이 일치하지 않습니다.');
        }
        return null;
      }
      return STORAGE.writeLocalValue(safeKey, previousValue, { ...options, label });
    } catch (error) {
      if (error?.name === 'OneAppClientError') throw error;
      throw ERRORS.create(error, label);
    }
  };

  STORAGE.initIDB = () => new Promise((resolve, reject) => {
    const request = indexedDB.open(DEFAULT_DB_NAME, DEFAULT_DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_KV)) db.createObjectStore(STORE_KV);
      if (!db.objectStoreNames.contains(STORE_MASTER)) db.createObjectStore(STORE_MASTER, { keyPath: '코드' });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(ERRORS.create(request.error, '브라우저 데이터베이스 열기'));
    request.onblocked = () => reject(new Error('브라우저 데이터베이스 열기 실패: 다른 탭에서 데이터베이스를 사용 중입니다. ONEAPP 탭을 닫고 다시 시도하세요.'));
  });

  STORAGE.getIDB = async (key) => {
    const db = await STORAGE.initIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_KV, 'readonly');
      const req = tx.objectStore(STORE_KV).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || tx.error);
    });
  };

  STORAGE.setIDB = async (key, val) => {
    if ([MASTER_SNAPSHOT_KEY, MASTER_REVISION_KEY].includes(key)) {
      throw new Error(`${key}는 commitMasterState 원자 저장 경로만 사용할 수 있습니다.`);
    }
    const db = await STORAGE.initIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_KV, 'readwrite');
      try { tx.objectStore(STORE_KV).put(val, key); }
      catch (error) { reject(ERRORS.create(error, `브라우저 데이터 저장(${key})`)); return; }
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(ERRORS.create(tx.error, `브라우저 데이터 저장(${key})`));
      tx.onabort = () => reject(ERRORS.create(tx.error || new DOMException('Transaction aborted', 'AbortError'), `브라우저 데이터 저장(${key})`));
    });
  };

  STORAGE.getAllIDB = async (storeName) => {
    const db = await STORAGE.initIDB();
    return new Promise((resolve, reject) => {
      if (!db.objectStoreNames.contains(storeName)) return resolve([]);
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error || tx.error);
    });
  };

  STORAGE.bulkPutIDB = async (storeName, items = []) => {
    if (storeName === STORE_MASTER) {
      throw new Error('master_products는 commitMasterState 원자 저장 경로만 사용할 수 있습니다.');
    }
    if (!Array.isArray(items)) throw new Error(`브라우저 일괄 저장(${storeName}) 실패: 저장 데이터가 배열이 아닙니다.`);
    const db = await STORAGE.initIDB();
    return new Promise((resolve, reject) => {
      if (!db.objectStoreNames.contains(storeName)) return reject(new Error(`ObjectStore not found: ${storeName}`));
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      try {
        items.forEach(item => { if (item) store.put(item); });
      } catch (error) {
        try { tx.abort(); } catch (e) {}
        reject(ERRORS.create(error, `브라우저 일괄 저장(${storeName})`));
        return;
      }
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(ERRORS.create(tx.error, `브라우저 일괄 저장(${storeName})`));
      tx.onabort = () => reject(ERRORS.create(tx.error || new DOMException('Transaction aborted', 'AbortError'), `브라우저 일괄 저장(${storeName})`));
    });
  };

  STORAGE.replaceAllIDB = async (storeName, items = []) => {
    if (storeName === STORE_MASTER) {
      throw new Error('master_products는 commitMasterState 원자 저장 경로만 사용할 수 있습니다.');
    }
    if (!Array.isArray(items)) throw new Error(`브라우저 전체교체(${storeName}) 실패: 저장 데이터가 배열이 아닙니다.`);
    const db = await STORAGE.initIDB();
    return new Promise((resolve, reject) => {
      if (!db.objectStoreNames.contains(storeName)) return reject(new Error(`ObjectStore not found: ${storeName}`));
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      try {
        store.clear();
        items.forEach(item => { if (item) store.put(item); });
      } catch (error) {
        try { tx.abort(); } catch (e) {}
        reject(ERRORS.create(error, `브라우저 전체교체(${storeName})`));
        return;
      }
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(ERRORS.create(tx.error, `브라우저 전체교체(${storeName})`));
      tx.onabort = () => reject(ERRORS.create(tx.error || new DOMException('Transaction aborted', 'AbortError'), `브라우저 전체교체(${storeName})`));
    });
  };

  STORAGE.stableSerialize = (value) => {
    const normalize = (input) => {
      if (Array.isArray(input)) return input.map(normalize);
      if (input && typeof input === 'object') {
        const result = {};
        Object.keys(input).sort().forEach(key => {
          if (input[key] !== undefined) result[key] = normalize(input[key]);
        });
        return result;
      }
      return input;
    };
    return JSON.stringify(normalize(value));
  };

  STORAGE.getMasterItems = (data = {}, options = {}) => {
    const items = Object.values(data || {});
    if (items.length === 0 && options.allowEmpty !== true) {
      throw new Error('빈 마스터 전체교체는 허용되지 않습니다. 의도적 초기화에만 allowEmpty를 지정하세요.');
    }
    const seenCodes = new Set();
    return items.map((item, index) => {
      if (!item || item.코드 === undefined || item.코드 === null || String(item.코드).trim() === '') {
        throw new Error(`마스터 코드 검증 실패: ${index + 1}번째 레코드`);
      }
      const code = String(item.코드).trim();
      if (seenCodes.has(code)) {
        throw new Error(`마스터 중복 코드 검증 실패: ${code}`);
      }
      seenCodes.add(code);
      return item;
    });
  };

  STORAGE.createMasterRevision = () => `${Date.now()}-${generateUUID()}`;

  STORAGE.readMasterState = async (extraKeys = []) => {
    const db = await STORAGE.initIDB();
    const safeExtraKeys = [...new Set((Array.isArray(extraKeys) ? extraKeys : []).map(key => String(key || '')).filter(Boolean))];
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_MASTER, STORE_KV], 'readonly');
      const masterStore = tx.objectStore(STORE_MASTER);
      const sharedStore = tx.objectStore(STORE_KV);
      const itemsRequest = masterStore.getAll();
      const snapshotRequest = sharedStore.get(MASTER_SNAPSHOT_KEY);
      const revisionRequest = sharedStore.get(MASTER_REVISION_KEY);
      const extraRequests = new Map(safeExtraKeys.map(key => [key, sharedStore.get(key)]));
      tx.oncomplete = () => {
        const extraStoreEntries = {};
        extraRequests.forEach((request, key) => { extraStoreEntries[key] = request.result; });
        resolve({
          items: Array.isArray(itemsRequest.result) ? itemsRequest.result : [],
          snapshot: snapshotRequest.result,
          revision: revisionRequest.result,
          extraStoreEntries
        });
      };
      tx.onerror = () => reject(ERRORS.create(tx.error, '마스터 저장상태 조회'));
      tx.onabort = () => reject(ERRORS.create(tx.error || new DOMException('Transaction aborted', 'AbortError'), '마스터 저장상태 조회'));
    });
  };

  STORAGE.readMasterSnapshotState = async (extraKeys = []) => {
    const state = await STORAGE.readMasterState(extraKeys);
    let masterMap = {};
    if (state.items.length > 0) {
      state.items.forEach(item => {
        const code = String(item?.['코드'] || item?.productCode || '').trim();
        if (code) masterMap[code] = item;
      });
    } else if (state.snapshot && typeof state.snapshot === 'object' && !Array.isArray(state.snapshot)) {
      masterMap = state.snapshot;
    }
    return { ...state, masterMap };
  };

  STORAGE.createMasterRevisionConflictError = (message = '다른 저장이 먼저 완료되어 현재 저장 요청이 오래된 상태가 되었습니다.') => {
    const error = new Error(message);
    error.code = 'MERCH_MASTER_REVISION_CONFLICT';
    return error;
  };

  STORAGE.createLockFenceError = (lockName, message = '저장 잠금 fencing 검증 실패') => {
    const error = new Error(`${message}: ${lockName}`);
    error.code = 'MERCH_LOCK_FENCE_LOST';
    return error;
  };

  STORAGE.isCurrentLeaseRecord = (current, lease, options = {}) => {
    if (!lease || !current) return false;
    if (current.owner !== lease.owner || Number(current.token) !== Number(lease.token)) return false;
    return options.allowExpired === true || Number(current.expiresAt) > Date.now();
  };

  STORAGE.replaceMasterState = async (state = {}, extraStoreEntries = state.extraStoreEntries || {}, lease = null) => {
    const db = await STORAGE.initIDB();
    const items = Array.isArray(state.items) ? state.items : [];
    const safeExtraEntries = extraStoreEntries && typeof extraStoreEntries === 'object' ? extraStoreEntries : {};
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_MASTER, STORE_KV], 'readwrite');
      const masterStore = tx.objectStore(STORE_MASTER);
      const sharedStore = tx.objectStore(STORE_KV);
      let operationError = null;
      const abortWith = (error) => {
        operationError = error;
        try { tx.abort(); } catch (abortError) { reject(error); }
      };
      const writeState = () => {
        if (lease?.getOwnershipError?.()) {
          abortWith(lease.getOwnershipError());
          return;
        }
        try {
          masterStore.clear();
          items.forEach(item => masterStore.put(item));
          if (state.snapshot === undefined) sharedStore.delete(MASTER_SNAPSHOT_KEY);
          else sharedStore.put(state.snapshot, MASTER_SNAPSHOT_KEY);
          if (state.revision === undefined) sharedStore.delete(MASTER_REVISION_KEY);
          else sharedStore.put(state.revision, MASTER_REVISION_KEY);
          Object.entries(safeExtraEntries).forEach(([key, value]) => {
            if (value === undefined) sharedStore.delete(key);
            else sharedStore.put(value, key);
          });
        } catch (error) {
          abortWith(ERRORS.create(error, '마스터 원자 저장'));
        }
      };
      if (lease) {
        const leaseRequest = sharedStore.get(lease.lockKey);
        leaseRequest.onsuccess = () => {
          if (!STORAGE.isCurrentLeaseRecord(leaseRequest.result, lease)
            || lease?.getOwnershipError?.()) {
            abortWith(lease.getOwnershipError?.()
              || STORAGE.createLockFenceError(lease.lockName, 'stale writer 차단'));
            return;
          }
          writeState();
        };
        leaseRequest.onerror = () => abortWith(
          ERRORS.create(leaseRequest.error, `마스터 저장 fencing 조회(${lease.lockName})`)
        );
      } else {
        writeState();
      }
      tx.oncomplete = () => resolve({ count: items.length });
      tx.onerror = () => reject(ERRORS.create(tx.error, '마스터 원자 저장'));
      tx.onabort = () => reject(operationError || ERRORS.create(tx.error || new DOMException('Transaction aborted', 'AbortError'), '마스터 원자 저장'));
    });
  };

  STORAGE.verifyMasterState = async (expectedData = {}, expectedRevision, expectedExtraEntries = {}) => {
    const expectedItems = STORAGE.getMasterItems(expectedData, { allowEmpty: true });
    const extraKeys = Object.keys(expectedExtraEntries || {});
    const actual = await STORAGE.readMasterState(extraKeys);
    if (expectedRevision !== undefined && actual.revision !== expectedRevision) {
      throw new Error('마스터 저장 세대 검증 실패');
    }
    if (actual.items.length !== expectedItems.length) {
      throw new Error(`마스터 레코드 수 검증 실패 (${actual.items.length}/${expectedItems.length})`);
    }
    const actualByCode = new Map(actual.items.map(item => [String(item.코드), item]));
    for (const expectedItem of expectedItems) {
      const actualItem = actualByCode.get(String(expectedItem.코드));
      if (!actualItem || STORAGE.stableSerialize(actualItem) !== STORAGE.stableSerialize(expectedItem)) {
        throw new Error(`마스터 레코드 검증 실패: ${expectedItem.코드}`);
      }
    }
    if (STORAGE.stableSerialize(actual.snapshot || {}) !== STORAGE.stableSerialize(expectedData || {})) {
      throw new Error('마스터 전체 스냅샷 검증 실패');
    }
    for (const [key, value] of Object.entries(expectedExtraEntries || {})) {
      if (STORAGE.stableSerialize(actual.extraStoreEntries[key]) !== STORAGE.stableSerialize(value)) {
        throw new Error(`마스터 연동 저장 검증 실패: ${key}`);
      }
    }
    return { ok: true, count: expectedItems.length };
  };

  STORAGE.isSameMasterState = (left = {}, right = {}) => {
    const normalizeItems = (state) => (Array.isArray(state.items) ? state.items : [])
      .slice()
      .sort((a, b) => String(a?.코드 || '').localeCompare(String(b?.코드 || '')));
    return STORAGE.stableSerialize(normalizeItems(left)) === STORAGE.stableSerialize(normalizeItems(right))
      && STORAGE.stableSerialize(left.snapshot) === STORAGE.stableSerialize(right.snapshot)
      && left.revision === right.revision
      && STORAGE.stableSerialize(left.extraStoreEntries || {}) === STORAGE.stableSerialize(right.extraStoreEntries || {});
  };

  STORAGE.mutateFallbackLock = async (lockName, ownerOrLease, action, leaseMs = 120000) => {
    const db = await STORAGE.initIDB();
    const lockKey = `${FALLBACK_LOCK_PREFIX}${lockName}`;
    const fenceKey = `${FALLBACK_FENCE_PREFIX}${lockName}`;
    const hasLeaseIdentity = (typeof ownerOrLease === 'object' && ownerOrLease !== null)
      || typeof ownerOrLease === 'function';
    const owner = hasLeaseIdentity ? ownerOrLease.owner : ownerOrLease;
    const requestedToken = hasLeaseIdentity ? Number(ownerOrLease.token) : null;
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_KV, 'readwrite');
      const store = tx.objectStore(STORE_KV);
      const request = store.get(lockKey);
      const fenceRequest = store.get(fenceKey);
      let result = false;
      let pending = 2;
      const mutate = () => {
        pending--;
        if (pending > 0) return;
        const current = request.result;
        const now = Date.now();
        if (action === 'acquire') {
          if (!current || current.owner === owner || Number(current.expiresAt) <= now) {
            const token = Math.max(Number(fenceRequest.result) || 0, Number(current?.token) || 0) + 1;
            result = { owner, token, expiresAt: now + leaseMs };
            store.put(token, fenceKey);
            store.put(result, lockKey);
          }
        } else if (action === 'renew') {
          if (current
            && current.owner === owner
            && Number(current.token) === requestedToken
            && Number(current.expiresAt) > now) {
            result = { owner, token: requestedToken, expiresAt: now + leaseMs };
            store.put(result, lockKey);
          }
        } else if (action === 'release') {
          if (current && current.owner === owner && Number(current.token) === requestedToken) {
            store.delete(lockKey);
            result = true;
          }
        }
      };
      request.onsuccess = mutate;
      fenceRequest.onsuccess = mutate;
      request.onerror = () => reject(ERRORS.create(request.error, `탭 간 저장 잠금 조회(${lockName})`));
      fenceRequest.onerror = () => reject(ERRORS.create(fenceRequest.error, `탭 간 저장 fencing 조회(${lockName})`));
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(ERRORS.create(tx.error, `탭 간 저장 잠금 처리(${lockName})`));
      tx.onabort = () => reject(ERRORS.create(tx.error || new DOMException('Transaction aborted', 'AbortError'), `탭 간 저장 잠금 처리(${lockName})`));
    });
  };

  STORAGE.acquireFallbackLock = async (lockName, options = {}) => {
    const owner = `${global.__MERCHOPS_TAB_ID || (global.__MERCHOPS_TAB_ID = generateUUID())}:${generateUUID()}`;
    const leaseMs = Math.max(10000, Number(options.leaseMs) || 120000);
    const timeoutMs = Math.max(1000, Number(options.timeoutMs) || 20000);
    const pollMs = Math.max(4, Number(options.pollMs) || 20);
    const heartbeatMs = Math.max(4, Number(options.heartbeatMs) || Math.max(1000, Math.floor(leaseMs / 3)));
    const deadline = Date.now() + timeoutMs;
    const wait = () => new Promise(resolve => setTimeout(resolve, pollMs + Math.floor(Math.random() * pollMs)));
    while (Date.now() < deadline) {
      const acquired = await STORAGE.mutateFallbackLock(lockName, owner, 'acquire', leaseMs);
      if (acquired) {
        let heartbeatWork = Promise.resolve();
        let ownershipError = null;
        const lease = async () => lease.release();
        lease.lockName = lockName;
        lease.lockKey = `${FALLBACK_LOCK_PREFIX}${lockName}`;
        lease.owner = acquired.owner;
        lease.token = acquired.token;
        lease.expiresAt = acquired.expiresAt;
        lease.getOwnershipError = () => ownershipError;
        const heartbeat = setInterval(() => {
          heartbeatWork = heartbeatWork
            .then(() => STORAGE.mutateFallbackLock(lockName, lease, 'renew', leaseMs))
            .then(renewed => {
              if (!renewed) {
                ownershipError = STORAGE.createLockFenceError(lockName, '탭 간 저장 잠금 갱신 실패');
              } else {
                lease.expiresAt = renewed.expiresAt;
              }
            })
            .catch(error => {
              ownershipError = error?.code === 'MERCH_LOCK_FENCE_LOST'
                ? error
                : STORAGE.createLockFenceError(lockName, `탭 간 저장 잠금 갱신 오류: ${error?.message || error}`);
            });
        }, heartbeatMs);
        lease.release = async () => {
          clearInterval(heartbeat);
          await heartbeatWork.catch(error => { ownershipError = ownershipError || error; });
          const released = await STORAGE.mutateFallbackLock(lockName, lease, 'release', leaseMs);
          if (!released) ownershipError = ownershipError || new Error(`탭 간 저장 잠금 해제 검증 실패: ${lockName}`);
          if (ownershipError) throw ownershipError;
        };
        return lease;
      }
      await wait();
    }
    const timeoutError = new Error(`탭 간 저장 잠금 대기시간 초과: ${lockName}`);
    timeoutError.code = 'MERCH_FALLBACK_LOCK_TIMEOUT';
    throw timeoutError;
  };

  STORAGE._queues = STORAGE._queues || {};
  STORAGE.withStorageLock = (lockName, task, options = {}) => {
    const previous = STORAGE._queues[lockName] || Promise.resolve();
    const run = previous.catch(() => undefined).then(async () => {
      const runWithLease = async () => {
        const lease = await STORAGE.acquireFallbackLock(lockName, options);
        let taskResult;
        let taskError = null;
        try {
          taskResult = await task(lease);
        } catch (error) {
          taskError = error;
        }
        try {
          await lease.release();
        } catch (releaseError) {
          if (taskError) {
            taskError.lockReleaseError = releaseError;
            throw taskError;
          }
          const boundaryError = new Error(`IndexedDB lease lock release failed: ${lockName}`);
          boundaryError.code = 'MERCH_LOCK_RELEASE_FAILED';
          boundaryError.releaseError = releaseError;
          boundaryError.taskResult = taskResult;
          throw boundaryError;
        }
        if (taskError) throw taskError;
        return taskResult;
      };
      if (global.navigator?.locks && typeof global.navigator.locks.request === 'function') {
        let entered = false;
        try {
          return await global.navigator.locks.request(lockName, { mode: 'exclusive' }, async () => {
            entered = true;
            return runWithLease();
          });
        } catch (error) {
          if (entered) throw error;
          console.warn('ONEAPP Web Locks unavailable; using IndexedDB lease lock', error);
        }
      }
      return runWithLease();
    });
    const settled = run.catch(() => undefined);
    STORAGE._queues[lockName] = settled;
    settled.finally(() => {
      if (STORAGE._queues[lockName] === settled) delete STORAGE._queues[lockName];
    });
    return run;
  };

  STORAGE.rollbackMasterStateCAS = async (expectedState = {}, previousState = {}, lease = null) => {
    const db = await STORAGE.initIDB();
    const expectedExtra = expectedState.extraStoreEntries || {};
    const previousExtra = previousState.extraStoreEntries || {};
    const extraKeys = [...new Set([...Object.keys(expectedExtra), ...Object.keys(previousExtra)])];
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_MASTER, STORE_KV], 'readwrite');
      const masterStore = tx.objectStore(STORE_MASTER);
      const sharedStore = tx.objectStore(STORE_KV);
      const itemsRequest = masterStore.getAll();
      const snapshotRequest = sharedStore.get(MASTER_SNAPSHOT_KEY);
      const revisionRequest = sharedStore.get(MASTER_REVISION_KEY);
      const extraRequests = new Map(extraKeys.map(key => [key, sharedStore.get(key)]));
      const leaseRequest = lease ? sharedStore.get(lease.lockKey) : null;
      let pending = 3 + extraRequests.size + (leaseRequest ? 1 : 0);
      let result = { restored: false, stale: false };
      let operationError = null;
      const abortWith = (error) => {
        operationError = error;
        try { tx.abort(); } catch (abortError) { reject(error); }
      };
      const maybeRestore = () => {
        pending--;
        if (pending > 0) return;
        if (lease && (!STORAGE.isCurrentLeaseRecord(leaseRequest.result, lease)
          || lease?.getOwnershipError?.())) {
          abortWith(lease.getOwnershipError?.()
            || STORAGE.createLockFenceError(lease.lockName, 'CAS rollback stale writer 차단'));
          return;
        }
        const currentExtra = {};
        extraRequests.forEach((request, key) => { currentExtra[key] = request.result; });
        const currentState = {
          items: Array.isArray(itemsRequest.result) ? itemsRequest.result : [],
          snapshot: snapshotRequest.result,
          revision: revisionRequest.result,
          extraStoreEntries: currentExtra
        };
        if (!STORAGE.isSameMasterState(currentState, {
          ...expectedState,
          extraStoreEntries: Object.fromEntries(extraKeys.map(key => [key, expectedExtra[key]]))
        })) {
          result = { restored: false, stale: true };
          return;
        }
        try {
          masterStore.clear();
          (Array.isArray(previousState.items) ? previousState.items : []).forEach(item => masterStore.put(item));
          if (previousState.snapshot === undefined) sharedStore.delete(MASTER_SNAPSHOT_KEY);
          else sharedStore.put(previousState.snapshot, MASTER_SNAPSHOT_KEY);
          if (previousState.revision === undefined) sharedStore.delete(MASTER_REVISION_KEY);
          else sharedStore.put(previousState.revision, MASTER_REVISION_KEY);
          extraKeys.forEach(key => {
            if (previousExtra[key] === undefined) sharedStore.delete(key);
            else sharedStore.put(previousExtra[key], key);
          });
          result = { restored: true, stale: false };
        } catch (error) {
          abortWith(ERRORS.create(error, '마스터 CAS 자동복구'));
        }
      };
      itemsRequest.onsuccess = maybeRestore;
      snapshotRequest.onsuccess = maybeRestore;
      revisionRequest.onsuccess = maybeRestore;
      extraRequests.forEach(request => { request.onsuccess = maybeRestore; });
      if (leaseRequest) leaseRequest.onsuccess = maybeRestore;
      const failRequest = (request) => { request.onerror = () => reject(ERRORS.create(request.error, '마스터 CAS 자동복구 조회')); };
      failRequest(itemsRequest);
      failRequest(snapshotRequest);
      failRequest(revisionRequest);
      extraRequests.forEach(failRequest);
      if (leaseRequest) failRequest(leaseRequest);
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(ERRORS.create(tx.error, '마스터 CAS 자동복구'));
      tx.onabort = () => reject(operationError || ERRORS.create(tx.error || new DOMException('Transaction aborted', 'AbortError'), '마스터 CAS 자동복구'));
    });
  };

  STORAGE.commitMasterState = async (data = {}, options = {}) => {
    let previousState = null;
    let revision = '';
    let expectedWrittenState = null;
    try {
      return await STORAGE.withStorageLock(MASTER_LOCK_NAME, async (lease) => {
        let rollbackOk = false;
        let staleRollbackSkipped = false;
        const extraStoreEntries = options.extraStoreEntries && typeof options.extraStoreEntries === 'object'
          ? options.extraStoreEntries
          : {};
        const extraKeys = Object.keys(extraStoreEntries);
        try {
          previousState = await STORAGE.readMasterState(extraKeys);
          if (Object.prototype.hasOwnProperty.call(options, 'expectedRevision')
            && previousState.revision !== options.expectedRevision) {
            throw STORAGE.createMasterRevisionConflictError();
          }
          const items = STORAGE.getMasterItems(data, { allowEmpty: options.allowEmpty === true });
          revision = STORAGE.createMasterRevision();
          expectedWrittenState = { items, snapshot: data, revision, extraStoreEntries };
          await STORAGE.replaceMasterState(expectedWrittenState, extraStoreEntries, lease);
          const verified = await STORAGE.verifyMasterState(data, revision, extraStoreEntries);
          if (typeof options.afterVerified === 'function') {
            const afterVerifiedOk = await options.afterVerified();
            if (afterVerifiedOk === false) {
              throw new Error(options.afterVerifiedError || '마스터 후속 저장 검증 실패');
            }
          }
          return {
            ok: true,
            verified: true,
            count: verified.count,
            revision,
            rollbackOk: false,
            staleRollbackSkipped: false
          };
        } catch (error) {
          if (error?.code === 'MERCH_LOCK_FENCE_LOST') {
            staleRollbackSkipped = true;
          } else if (previousState && expectedWrittenState) {
            try {
              const rollback = await STORAGE.rollbackMasterStateCAS(expectedWrittenState, previousState, lease);
              rollbackOk = rollback.restored;
              staleRollbackSkipped = rollback.stale;
              if (!rollbackOk && !staleRollbackSkipped) {
                const currentState = await STORAGE.readMasterState(extraKeys);
                rollbackOk = STORAGE.isSameMasterState(currentState, previousState);
              }
            } catch (rollbackError) {
              console.error('ONEAPP master rollback failed', rollbackError);
            }
          } else if (previousState) {
            rollbackOk = true;
          }
          return {
            ok: false,
            verified: false,
            revision,
            rollbackOk,
            staleRollbackSkipped,
            conflict: error?.code === 'MERCH_MASTER_REVISION_CONFLICT',
            lockFailure: error?.code === 'MERCH_LOCK_FENCE_LOST',
            error: String(error?.message || error || '알 수 없는 저장 오류')
          };
        }
      }, options.lockOptions || {});
    } catch (error) {
      if (error?.code === 'MERCH_LOCK_RELEASE_FAILED' && error.taskResult) {
        const releaseMessage = String(error.releaseError?.message || error.message || 'storage lock release failed');
        if (error.taskResult.ok && expectedWrittenState) {
          try {
            await STORAGE.verifyMasterState(
              expectedWrittenState.snapshot,
              expectedWrittenState.revision,
              expectedWrittenState.extraStoreEntries
            );
            return {
              ...error.taskResult,
              lockReleaseWarning: true,
              warning: releaseMessage
            };
          } catch (verifyError) {
            let conflict = false;
            try {
              const currentState = await STORAGE.readMasterState(
                Object.keys(expectedWrittenState.extraStoreEntries || {})
              );
              conflict = currentState.revision !== expectedWrittenState.revision;
            } catch (readError) {
              console.error('ONEAPP master state read after lock release failure failed', readError);
            }
            return {
              ok: false,
              verified: false,
              revision,
              rollbackOk: false,
              staleRollbackSkipped: conflict,
              conflict,
              lockFailure: true,
              lockReleaseWarning: true,
              error: conflict
                ? `The committed master was superseded while releasing the storage lock: ${releaseMessage}`
                : `The committed master could not be verified after storage lock release failed: ${releaseMessage}`
            };
          }
        }
        return {
          ...error.taskResult,
          lockFailure: true,
          lockReleaseWarning: true,
          error: `${error.taskResult.error || 'Master commit failed'} / ${releaseMessage}`
        };
      }
      return {
        ok: false,
        verified: false,
        revision,
        rollbackOk: false,
        staleRollbackSkipped: false,
        conflict: false,
        lockFailure: true,
        error: String(error?.message || error || '저장 잠금 오류')
      };
    }
  };

  // MerchOps fallback runtime keeps the atomic primitive only for the
  // versioned F7 command adapter. The historical public throw-writer is
  // fail-closed so no legacy workflow can bypass the owner boundary.
  STORAGE.commitMasterStateOrThrow = async () => global.createMerchOpsOwnerRoute(
    'master-lookup',
    'product-master-write',
    'Master.html'
  );

  STORAGE.safeJSONParse = safeJSONParse;
  STORAGE.safeJSONParseRaw = safeJSONParseRaw;
  STORAGE.generateUUID = generateUUID;

  // ============================================================
  // PRICING ENGINE
  // ============================================================
  const PRICING = ONEAPP.PRICING = ONEAPP.PRICING || {};

  PRICING.parseNum = parseNum;
  PRICING.findBestMarginRule = findBestMarginRule;
  PRICING.selectMerchMarginRule = selectMerchMarginRule;
  PRICING.getDefaultMerchMarginRules = getDefaultMerchMarginRules;
  PRICING.sanitizeMerchMarginRules = sanitizeMerchMarginRules;
  PRICING.findDuplicateMerchMarginRuleConditions = findDuplicateMerchMarginRuleConditions;
  PRICING.normalizeMerchWarehouseForRule = normalizeMerchWarehouseForRule;
  PRICING.getMerchUnitRuleCandidates = getMerchUnitRuleCandidates;

  PRICING.calculatePriceResult = (baseInPrice, mItem = {}, currentFinalData = {}, marginRules = []) => {
    const ROUND_UNIT = 100;
    const inPrice = parseNum(baseInPrice);
    const outsrc = (!currentFinalData?.['외주비'] && currentFinalData?.['외주비'] !== 0)
      ? parseNum(mItem?.['외주비'])
      : parseNum(currentFinalData?.['외주비']);

    const labor = (!currentFinalData?.['노무비'] && currentFinalData?.['노무비'] !== 0)
      ? parseNum(mItem?.['노무비'])
      : parseNum(currentFinalData?.['노무비']);

    const totalCost = inPrice + outsrc + labor;
    const selection = selectMerchMarginRule(marginRules, {
      // 계산 컨텍스트는 원본 마스터의 창고를 덮어쓰지 않는다.
      _calcWarehouse: currentFinalData?.['_calcWarehouse'] ?? currentFinalData?.['창고'] ?? mItem?.['창고'] ?? '',
      // 단위는 적용 직전 확정된 단위 필드만 사용한다. 품명·규격 추론은 금지한다.
      _calcUnit: currentFinalData?.['_calcUnit'] ?? currentFinalData?.['단위'] ?? mItem?.['단위'] ?? ''
    });
    const appliedRule = selection.rule;

    let calcOutPrice = 0;
    if (inPrice > 0) {
      const rate = selection.marginRate;
      if (selection.calculationType === 'divide') {
        calcOutPrice = totalCost / (1 - (rate / 100));
      } else {
        calcOutPrice = totalCost * (1 + (rate / 100));
      }
      calcOutPrice = Math.round(calcOutPrice / ROUND_UNIT) * ROUND_UNIT;
    }

    return {
      inPrice,
      outPrice: calcOutPrice,
      marketPrice: calcOutPrice,
      totalCost,
      ...selection,
      rule: { ...appliedRule }
    };
  };

  PRICING.calculatePricesEngine = (baseInPrice, providedOutPrice = 0, mItem = {}, currentFinalData = {}, marginRules = [], forceRecalc = false) => {
    const result = PRICING.calculatePriceResult(baseInPrice, mItem, currentFinalData, marginRules);
    if (currentFinalData && typeof currentFinalData === 'object') {
      currentFinalData._appliedMarginRule = {
        id: result.ruleId,
        inputWarehouse: result.inputWarehouse,
        inputUnit: result.inputUnit,
        ruleWhCode: result.rule?.whCode || '*',
        ruleUnit: result.rule?.unit || '*',
        rate: result.marginRate,
        type: result.calculationType,
        matchType: result.matchType,
        totalCost: result.totalCost
      };
    }

    if (result.inPrice === 0) return 0;
    if (forceRecalc) return result.outPrice;
    if (parseNum(providedOutPrice) > 0) return parseNum(providedOutPrice);
    return result.outPrice;
  };

  PRICING.calculatePriceBundle = (baseInPrice, mItem = {}, currentFinalData = {}, marginRules = []) => {
    const input = { ...(currentFinalData || {}), 입고가: parseNum(baseInPrice) };
    const result = PRICING.calculatePriceResult(baseInPrice, mItem, input, marginRules);
    const bundle = {
      입고가: result.inPrice,
      출고가: result.outPrice,
      시중가: result.marketPrice,
      pricingEvidence: {
        marginRuleId: result.ruleId,
        marginRate: result.marginRate,
        calculationType: result.calculationType,
        matchType: result.matchType,
        inputWarehouse: result.inputWarehouse,
        inputUnit: result.inputUnit
      }
    };
    const sourceForSub = { ...(mItem || {}), ...input, ...bundle };
    const div1 = parseNum(sourceForSub['1종연산']);
    const outsrc = parseNum(sourceForSub['외주비']);
    const extraCost = parseNum(sourceForSub['경비']);
    if (result.inPrice === 0) {
      bundle['1입고'] = 0;
      bundle['1출고'] = 0;
    } else if (div1 > 0) {
      bundle['1입고'] = Math.round(((result.inPrice + outsrc) / div1) / 100) * 100;
      const rawSubOut = Math.round((result.outPrice / div1) + extraCost);
      bundle['1출고'] = rawSubOut > 0 ? Math.round(rawSubOut / 10) * 10 : 0;
    }
    return bundle;
  };

  PRICING.getWorkingSourceRole = (sources = {}) => {
    const explicit = String(sources?._activeRole || sources?.activeRole || sources?.sourceRole || '').trim();
    const known = ['estimate', 'purchase', 'inventory', 'info', 'catalog', 'sales'];
    if (known.includes(explicit)) return explicit;
    // 현재 작업파일이 하나인 구조를 우선한다. 복수 source가 있으면 구매/재고 병합을 자동 추정하지 않고, 명확한 작업군을 우선 판정한다.
    const priority = ['info', 'purchase', 'inventory', 'estimate', 'catalog', 'sales'];
    return priority.find(role => isNonEmptySource(sources?.[role])) || '';
  };

  PRICING.shouldUseMasterMarketPriceForRole = (role = '') => ['purchase', 'inventory'].includes(String(role || '').trim());
  PRICING.shouldAllowMarketPriceRecalcForRole = (role = '') => String(role || '').trim() === 'estimate';

  PRICING.computeFinalData = (mItem = {}, sources = {}, marginRules = [], forceRecalc = false) => {
    const activeRole = PRICING.getWorkingSourceRole(sources || {});
    const hasUploadSource = !!activeRole && isNonEmptySource((sources || {})[activeRole]);
    const source = hasUploadSource ? { ...((sources || {})[activeRole] || {}) } : { ...(mItem || {}) };
    const working = { ...source };

    // v1.0.8 정책:
    // - 업로드 source가 있으면 해당 파일에 있는 값만 작업값으로 사용한다.
    // - 입고가가 파일에 없으면 마스터 입고가로 자동 대체하지 않는다.
    // - 계산값은 메타 정보에만 보관하고, forceRecalc일 때만 출고가를 실제 작업값으로 반영한다.
    const sourceHasInPrice = hasOwnField(source, '입고가');
    const sourceHasOutPrice = hasOwnField(source, '출고가');
    const sourceHasMarketPrice = hasOwnField(source, '시중가');
    const masterMarketPrice = getExplicitValue(mItem, '시중가', '');

    const baseInRaw = hasUploadSource
      ? (sourceHasInPrice ? source['입고가'] : '')
      : getExplicitValue(mItem, '입고가', '');
    const baseInPrice = parseNum(baseInRaw);
    const providedOutPrice = sourceHasOutPrice ? parseNum(source['출고가']) : 0;
    const calculatedOutPrice = baseInPrice > 0
      ? PRICING.calculatePricesEngine(baseInPrice, 0, mItem, working, marginRules, true)
      : 0;

    if (hasUploadSource && !sourceHasInPrice) {
      delete working['입고가'];
      working._missingInPrice = true;
    }

    if (forceRecalc && baseInPrice > 0 && activeRole !== 'info') {
      working['출고가'] = calculatedOutPrice;
      working._ruleAppliedAt = getNowISO();
    } else if (hasUploadSource && !sourceHasOutPrice) {
      // 자동 불러오기 단계에서는 출고가를 임의 계산값으로 채우지 않는다.
      delete working['출고가'];
    }

    if (PRICING.shouldUseMasterMarketPriceForRole(activeRole)) {
      working['시중가'] = masterMarketPrice;
      working._marketPricePolicy = 'master_reference_for_purchase_inventory';
    } else if (PRICING.shouldAllowMarketPriceRecalcForRole(activeRole)) {
      if (forceRecalc && calculatedOutPrice > 0) {
        working['시중가'] = calculatedOutPrice;
        working._marketPricePolicy = 'estimate_rule_recalc_allowed';
      } else if (sourceHasMarketPrice) {
        working['시중가'] = source['시중가'];
        working._marketPricePolicy = 'estimate_source_market_price';
      } else if (hasUploadSource) {
        // 견적 파일에 시중가가 없으면 마스터 시중가로 자동 대체하지 않는다.
        delete working['시중가'];
        working._marketPricePolicy = 'estimate_market_price_missing';
      } else {
        working['시중가'] = masterMarketPrice;
        working._marketPricePolicy = 'master_reference';
      }
    } else if (activeRole === 'info') {
      // 정보파일은 쇼핑몰 원본값 보존이 원칙이며, 가격 룰 계산 대상이 아니다.
      if (sourceHasMarketPrice) working['시중가'] = source['시중가'];
      working._marketPricePolicy = 'info_original_preserved';
    } else if (!hasUploadSource) {
      working['시중가'] = masterMarketPrice;
      working._marketPricePolicy = 'master_reference';
    } else if (!sourceHasMarketPrice) {
      delete working['시중가'];
      working._marketPricePolicy = 'source_market_price_missing';
    }

    const themeValue = normalizePromotionThemeValue(working, hasUploadSource ? {} : (mItem || {}));
    if (themeValue) {
      working['행사테마'] = themeValue;
      [1, 2, 3, 4, 5].forEach(n => { working[`테마${n}`] = themeValue.split(',').includes(String(n)) ? '1' : ''; });
    }

    const actualOutPrice = hasOwnField(working, '출고가') ? parseNum(working['출고가']) : 0;
    working._activeSourceRole = activeRole || 'master';
    working._sourcePolicy = hasUploadSource ? 'source_value_only_no_master_fallback' : 'master_reference';
    working._isRuleApplied = !!forceRecalc;
    working._calculatedOutPrice = calculatedOutPrice || 0;
    working._sourceOutPrice = providedOutPrice || 0;
    working._normalPrice = actualOutPrice || calculatedOutPrice || 0;
    working._isPromo = parseNum(working['행사가']) > 0;
    working._pricingPolicyVersion = 'v1.0.8_PricingPolicySync';

    if (sourceHasOutPrice && calculatedOutPrice > 0 && providedOutPrice > 0 && providedOutPrice !== calculatedOutPrice) {
      working._outPriceRuleDiff = true;
      working._outPriceRuleDiffAmount = calculatedOutPrice - providedOutPrice;
      working._outPriceRuleDiffRate = providedOutPrice > 0 ? Math.round(((calculatedOutPrice - providedOutPrice) / providedOutPrice) * 1000) / 10 : 0;
    } else {
      working._outPriceRuleDiff = false;
      working._outPriceRuleDiffAmount = 0;
      working._outPriceRuleDiffRate = 0;
    }

    return working;
  };

  PRICING.calculateReviewOutPrice = (baseInPrice, context = {}, marginRules = []) => {
    return PRICING.calculatePricesEngine(
      parseNum(baseInPrice),
      0,
      context,
      context,
      marginRules,
      true
    );
  };

  PRICING.isValidSubItemCode = (code) => {
    if (!code) return false;
    const s = String(code).trim();
    return s !== '' && s !== '0' && s !== '00' && s !== '-' && s.toLowerCase() !== 'undefined' && s.toLowerCase() !== 'null';
  };

  // 1종연산은 원가/가격 산출용 계수다. 재고수량 환산은 1당수량을 사용한다.
  PRICING.calculateSubPriceInfo = (row = {}) => {
    const costFactor1 = parseNum(row['1종연산']);
    if (!PRICING.isValidSubItemCode(row['1종코드']) || costFactor1 <= 0) return null;

    const inPrice = parseNum(row.입고가);
    const outPrice = parseNum(row.출고가); // 확정 정책: 원물 기본 출고가 기준
    const outsrc = parseNum(row['외주비']);
    const extraCost = parseNum(row['경비']);
    const stockFactor1 = parseNum(row['1당수량']);

    const subIn = inPrice > 0 ? Math.round(((inPrice + outsrc) / costFactor1) / 100) * 100 : 0;
    const rawSubOut = outPrice > 0 ? Math.round((outPrice / costFactor1) + extraCost) : 0;
    const subOut = rawSubOut > 0 ? Math.round(rawSubOut / 10) * 10 : 0;

    return {
      code: String(row['1종코드']).trim(),
      spec: row['1종규격'] || '',
      div1: costFactor1,
      costFactor1,
      stockFactor1,
      oneQty: stockFactor1,
      subIn,
      subOut
    };
  };

  // 원물 재고수량을 1종품목 재고 가능수량으로 환산한다.
  // 정책: 재고수량 산출에는 1종연산을 쓰지 않고 1당수량만 사용한다.
  PRICING.calculateSubStockInfo = (row = {}, rawStockQty = undefined) => {
    if (!PRICING.isValidSubItemCode(row['1종코드'])) return null;
    const stockFactor1 = parseNum(row['1당수량']);
    if (stockFactor1 <= 0) return null;

    const rawStock = rawStockQty !== undefined ? parseNum(rawStockQty) : parseNum(row['재고수량']);
    const subStockQty = rawStock * stockFactor1;

    return {
      code: String(row['1종코드']).trim(),
      spec: row['1종규격'] || '',
      rawStockQty: rawStock,
      stockFactor1,
      oneQty: stockFactor1,
      subStockQty
    };
  };

  PRICING.getMasterSalesState = (item = {}) => {
    const rawStatus = item['판매여부'];
    const statusStr = rawStatus !== undefined && rawStatus !== null ? String(rawStatus).trim() : '';
    const hasStatusValue = statusStr !== '';
    const outPrice = parseNum(item['출고가']);
    const promoPrice = parseNum(item['행사가']);
    const stockQty = item['재고수량'] !== undefined && item['재고수량'] !== '' ? parseNum(item['재고수량']) : 999;
    const hasSalePrice = outPrice > 0 || promoPrice > 0;

    if (!hasStatusValue && !hasSalePrice) {
      return { code: '-', label: '-', text: '-', tone: 'muted', className: 'text-slate-400 font-bold' };
    }

    if (statusStr === '0' || statusStr === '정지' || statusStr === '정지중' || statusStr === '판매중단' || (!hasSalePrice && hasStatusValue)) {
      return { code: '0', label: '정지', text: '정지', tone: 'stopped', className: 'text-rose-600 font-black' };
    }

    if (hasSalePrice) {
      if (stockQty === 0) return { code: '1', label: '품절', text: '품절', tone: 'soldout', className: 'text-orange-600 font-black' };
      if (promoPrice > 0) return { code: '1', label: '행사', text: '행사', tone: 'promo', className: 'text-purple-700 font-black' };
      return { code: '1', label: '판매', text: '판매', tone: 'selling', className: 'text-emerald-700 font-black' };
    }

    return { code: '-', label: '-', text: '-', tone: 'muted', className: 'text-slate-400 font-bold' };
  };

  // ============================================================
  // HISTORY ENGINE
  // ============================================================
  const HISTORY = ONEAPP.HISTORY = ONEAPP.HISTORY || {};
  const HISTORY_KEY = 'merchHistory_v870';
  const HISTORY_DEFAULT_LIMIT = 5000;

  HISTORY.calcDiffRate = calcDiffRate;
  HISTORY.getNowISO = getNowISO;
  HISTORY.DEFAULT_LIMIT = HISTORY_DEFAULT_LIMIT;

  HISTORY.normalizeHistoryLog = (log = {}) => {
    const oldVal = log.oldVal ?? log.beforeVal ?? '';
    const newVal = log.newVal ?? log.afterVal ?? '';
    const oldNum = parseNum(oldVal);
    const newNum = parseNum(newVal);
    const hasNumeric = String(oldVal).match(/[0-9]/) || String(newVal).match(/[0-9]/);
    const diff = log.diff !== undefined ? Number(log.diff) : (hasNumeric ? newNum - oldNum : 0);
    const diffRate = log.diffRate !== undefined ? log.diffRate : calcDiffRate(oldVal, newVal);

    return {
      id: log.id || generateUUID(),
      timestamp: log.timestamp || new Date().toLocaleString('ko-KR'),
      timestampISO: log.timestampISO || log.createdAtISO || log.savedAtISO || getNowISO(),
      source: String(log.source || log.origin || log.sourceRole || 'unknown'),
      sourceRole: String(log.sourceRole || log.role || log.source || log.origin || 'unknown'),
      sourceLabel: String(log.sourceLabel || ''),
      actionType: String(log.actionType || log.action || 'change'),
      applyMode: String(log.applyMode || ''),
      path: String(log.path || log.route || ''),
      route: String(log.route || log.path || ''),
      catalog: String(log.catalog || log.catalogName || ''),
      catalogName: String(log.catalogName || log.catalog || ''),
      estimate: String(log.estimate || log.quoteName || log.quote || log.견적서 || ''),
      quoteName: String(log.quoteName || log.estimate || log.quote || log.견적서 || ''),
      code: String(log.code || ''),
      name: String(log.name || ''),
      spec: String(log.spec || ''),
      unit: String(log.unit || ''),
      parsedName: String(log.parsedName || ''),
      parsedSpec: String(log.parsedSpec || ''),
      parsedUnit: String(log.parsedUnit || ''),
      parsedInPrice: log.parsedInPrice !== undefined ? parseNum(log.parsedInPrice) : undefined,
      parsedSoldOut: !!log.parsedSoldOut,
      matchStatus: String(log.matchStatus || ''),
      field: String(log.field || ''),
      oldVal,
      newVal,
      diff,
      diffRate,
      oldOutPrice: log.oldOutPrice,
      newOutPrice: log.newOutPrice,
      oldSalePrice: log.oldSalePrice,
      newSalePrice: log.newSalePrice,
      oldInPrice: log.oldInPrice,
      stockQty: log.stockQty,
      safeStock: log.safeStock,
      catalogWarehouse: String(log.catalogWarehouse || ''),
      marginRuleId: String(log.marginRuleId || log.priceRule?.id || ''),
      marginRate: log.marginRate,
      calculationType: String(log.calculationType || log.priceRule?.calculationType || ''),
      matchType: String(log.matchType || ''),
      memo: String(log.memo || log.note || '')
    };
  };

  HISTORY.buildHistoryLog = (payload = {}) => {
    return HISTORY.normalizeHistoryLog({
      id: generateUUID(),
      timestamp: new Date().toLocaleString('ko-KR'),
      timestampISO: getNowISO(),
      ...payload
    });
  };

  HISTORY.addHistoryLogs = (newLogs = [], options = {}) => {
    const limit = options.limit || HISTORY.DEFAULT_LIMIT;
    const logs = Array.isArray(newLogs) ? newLogs : [newLogs];
    const normalized = logs.filter(Boolean).map(HISTORY.normalizeHistoryLog);

    let current = [];
    try { current = JSON.parse(global.localStorage.getItem(HISTORY_KEY) || '[]') || []; } catch (e) { current = []; }

    const merged = [...normalized, ...current].slice(0, limit);
    STORAGE.writeLocalJSON(HISTORY_KEY, merged, { label: '변경 이력 저장' });
    if (!HISTORY.verifyHistorySaved(normalized)) {
      throw new Error('변경 이력 저장 실패: 저장 후 검증에서 새 이력을 찾지 못했습니다.');
    }
    return merged;
  };

  HISTORY.verifyHistorySaved = (newLogs = []) => {
    const logs = Array.isArray(newLogs) ? newLogs : [newLogs];
    if (logs.length === 0) return true;

    let current = [];
    try { current = JSON.parse(global.localStorage.getItem(HISTORY_KEY) || '[]') || []; } catch (e) { return false; }

    const ids = new Set(current.map(log => log && log.id));
    return logs.every(log => log && log.id && ids.has(log.id));
  };

  HISTORY.assertHistoryForMutation = (mutationCount, logs = []) => {
    if (mutationCount > 0 && (!Array.isArray(logs) || logs.length === 0)) {
      throw new Error('마스터 변경 항목이 있으나 히스토리 로그가 생성되지 않았습니다.');
    }
    return true;
  };

  // ============================================================
  // EXPORT DRAFT ENGINE
  // ============================================================
  const EXPORT = ONEAPP.EXPORT = ONEAPP.EXPORT || {};

  const MERCH_EXPORT_FIELD_DEFINITIONS = [
    { field: '품목명', aliases: ['품목명', '상품명'], type: 'string' },
    { field: '규격', aliases: ['규격'], type: 'string' },
    { field: '브랜드', aliases: ['브랜드'], type: 'string' },
    { field: '간단설명', aliases: ['간단설명', '기본설명'], type: 'string' },
    { field: '창고', aliases: ['창고'], type: 'string' },
    { field: '단위', aliases: ['단위'], type: 'string' },
    { field: '_calcWarehouse', aliases: ['_calcWarehouse'], type: 'string' },
    { field: '_calcWarehouseReason', aliases: ['_calcWarehouseReason'], type: 'string' },
    { field: '입고가', aliases: ['입고가'], type: 'number' },
    { field: '출고가', aliases: ['출고가', '판매가', '판매가격'], type: 'number' },
    { field: '행사가', aliases: ['행사가'], type: 'number' },
    { field: '도매A', aliases: ['도매A', 'A판매', 'A판매가'], type: 'number' },
    { field: '도매B', aliases: ['도매B', 'B판매', 'B도매', 'B도매가'], type: 'number' },
    { field: 'B판매가', aliases: ['B판매가', 'B 판매가'], type: 'number' },
    { field: 'B도매가', aliases: ['B도매가', 'B 도매가'], type: 'number' },
    { field: '최종전송', aliases: ['최종전송', '최종(전송)', '최종입고'], type: 'number' },
    { field: '시중가', aliases: ['시중가', '시중가격'], type: 'number' },
    { field: '입고B', aliases: ['입고B'], type: 'number' },
    { field: '판매여부', aliases: ['판매여부', '판매'], type: 'raw' },
    { field: '1종코드', aliases: ['1종코드'], type: 'string' },
    { field: '1종규격', aliases: ['1종규격'], type: 'string' },
    { field: '1종연산', aliases: ['1종연산'], type: 'number' },
    { field: '1당수량', aliases: ['1당수량'], type: 'number' },
    { field: '경비', aliases: ['경비'], type: 'number' },
    { field: '외주비', aliases: ['외주비'], type: 'number' },
    { field: '노무비', aliases: ['노무비'], type: 'number' },
    { field: '재고수량', aliases: ['재고수량', '재고', '수량'], type: 'number' },
    { field: '기본', aliases: ['기본', '구분(기본)', '기본여부', '관리구분'], type: 'string' },
    { field: '카테고리', aliases: ['견적서', '카테고리'], type: 'string' },
    { field: '검색어등록', aliases: ['검색어등록', '상품태그'], type: 'string' }
  ];

  const normalizeWorkingPayloadValue = (state, type = 'raw') => {
    if (state.isExplicitBlank) return '';
    if (type === 'number') return parseNum(state.value);
    if (type === 'string') return state.value === undefined || state.value === null ? '' : String(state.value);
    return state.value;
  };

  EXPORT.buildWorkingPayload = (row = {}, master = {}) => {
    const finalData = row.finalData || {};
    const working = { _fieldStates: {} };
    MERCH_EXPORT_FIELD_DEFINITIONS.forEach(definition => {
      const state = MERCH.resolveWorkingField(row, master, definition.field, { aliases: definition.aliases });
      working._fieldStates[definition.field] = { ...state };
      if (!state.isWorkingValue) return;
      working[definition.field] = normalizeWorkingPayloadValue(state, definition.type);
    });

    const fixedAliases = new Set(MERCH_EXPORT_FIELD_DEFINITIONS.flatMap(definition => [definition.field, ...definition.aliases]));
    const activeRole = MERCH.getWorkingSourceRole(row?.sources || {}, row?._lastUploadRole || '');
    const activeSource = activeRole ? (row?.sources?.[activeRole] || {}) : {};
    const dynamicFields = new Set([
      ...Object.keys(activeSource),
      ...Object.keys(finalData),
      ...Object.keys(master || {})
    ]);
    dynamicFields.forEach(field => {
      if (!field || String(field).startsWith('_') || fixedAliases.has(field) || ['코드', '품목코드', '상품코드'].includes(field)) return;
      const state = MERCH.resolveWorkingField(row, master, field, { aliases: [field] });
      working._fieldStates[field] = { ...state };
      if (!state.isWorkingValue) return;
      working[field] = state.isExplicitBlank ? '' : (state.value ?? '');
    });

    const themeState = MERCH.resolveWorkingField(row, master, '행사테마', {
      aliases: ['행사테마', '테마', 'promoTheme', '_theme', '테마1', '테마2', '테마3', '테마4', '테마5']
    });
    if (themeState.isWorkingValue) {
      const themeSource = themeState.origin === 'source' && themeState.sourceRole
        ? (row.sources?.[themeState.sourceRole] || {})
        : finalData;
      const promoThemeCodes = parsePromotionThemeCodes(
        hasOwnField(finalData, '행사테마') ? { 행사테마: finalData.행사테마 } : themeSource
      );
      working.행사테마 = promoThemeCodes.join(',');
      working._fieldStates.행사테마 = {
        ...themeState,
        value: working.행사테마,
        isExplicitBlank: working.행사테마 === ''
      };
      [1, 2, 3, 4, 5].forEach(n => {
        working[`테마${n}`] = promoThemeCodes.includes(String(n)) ? '1' : '';
      });
    }
    else {
      working._fieldStates.행사테마 = { ...themeState };
    }
    if (finalData._salesStopRequested === true || finalData._salesResumeRequested === true) {
      const saleValue = finalData._salesStopRequested === true ? 0 : 1;
      working.판매여부 = saleValue;
      working._salesStopRequested = finalData._salesStopRequested === true;
      working._salesResumeRequested = finalData._salesResumeRequested === true;
      working._fieldStates.판매여부 = {
        value: saleValue,
        origin: 'direct',
        isWorkingValue: true,
        isExplicitBlank: false,
        field: '판매여부',
        sourceRole: ''
      };
    }
    return working;
  };

  CLOUD.buildRawSubdivisionFromMaster = (masterMap = {}) => {
    const items = Object.entries(masterMap || {}).map(([code, item]) => CLOUD.normalizeMasterItemForDataOps(item, code));
    const relations = [];
    const issues = [];

    const isValidSubCode = (code) => {
      const s = String(code || '').trim();
      return s !== '' && s !== '0' && s !== '00' && s !== '-' && s.toLowerCase() !== 'undefined' && s.toLowerCase() !== 'null';
    };

    items.forEach(item => {
      const rawCode = String(item.코드 || item['품목코드'] || '').trim();
      const subCode = String(item['1종코드'] || '').trim();
      const subSpec = String(item['1종규격'] || '').trim();
      const costRate = parseNum(item['1종연산']);
      const stockRate = parseNum(item['1당수량']);

      if (!rawCode) {
        issues.push({ type: 'NO_RAW_CODE', message: '원물 품목코드 없음', item });
        return;
      }

      if (!isValidSubCode(subCode)) return;

      if (costRate <= 0) {
        issues.push({ type: 'NO_SUB_COST_RATE', message: '1종코드는 있으나 원가계수(1종연산) 없음', rawCode, subCode, item });
      }

      if (stockRate <= 0) {
        issues.push({ type: 'NO_SUB_STOCK_RATE', message: '1종코드는 있으나 재고수량계수(1당수량) 없음', rawCode, subCode, item });
      }

      if (costRate <= 0 && stockRate <= 0) return;

      relations.push({
        source: 'MerchOpsMasterDB',
        rawCode,
        rawName: item['품목명'] || '',
        rawSpec: item['규격'] || '',
        rawUnit: item['단위'] || '',
        subCode,
        subNameSpec: subSpec,
        subSpec,
        subUnit: '',
        // 기존 DataOps 호환값: 원가 산출용 1종연산을 conversionRate로 유지한다.
        conversionRate: costRate,

        stockMethod: 'raw_stock_multiply_1당수량',
        rawDeductMethod: 'ceil',
        active: true,
        createdFrom: '1종코드',
        memo: ''
      });
    });

    const bySubCode = {};
    const byRawCode = {};

    relations.forEach(rel => {
      if (rel.subCode) bySubCode[rel.subCode] = rel;
      if (rel.rawCode) {
        if (!byRawCode[rel.rawCode]) byRawCode[rel.rawCode] = [];
        byRawCode[rel.rawCode].push(rel);
      }
    });

    return {
      relations,
      bySubCode,
      byRawCode,
      issues,
      summary: {
        relationCount: relations.length,
        issueCount: issues.length
      }
    };
  };

        window.normalizeMerchLinkageCode = window.normalizeMerchLinkageCode || ((value) => {

        // [M-NO-INBOUND-ACTION-01] 입고가없음 처리 예약
        // - 현재 필터 범위의 상품코드를 중복 없이 기억하고, F7 성공 시에만 예약을 비운다.
        // - 싯가판매는 싯가/싯가판매여부=1, 판매정지는 판매여부=0으로 마스터에 확정한다.

        // 1재고현황 정책: 엑셀의 '기록' 열은 재고상품의 구매일자다.

        window.normalizeInventoryPurchaseDate = (v) => {
            if (v === undefined || v === null) return '';
            if (v instanceof Date && !isNaN(v.getTime())) {
                const mm = String(v.getMonth() + 1).padStart(2, '0');
                const dd = String(v.getDate()).padStart(2, '0');
                return `${mm}/${dd}`;
            }
            const raw = String(v).trim();
            if (!raw) return '';
            const m = raw.match(/(\d{1,4})[.\/\-년\s]+(\d{1,2})(?:[.\/\-월\s]+(\d{1,2}))?/);
            if (!m) return raw;
            const hasYear = m[3] !== undefined;
            const mm = String(hasYear ? m[2] : m[1]).padStart(2, '0');
            const dd = String(hasYear ? m[3] : m[2]).padStart(2, '0');
            return `${mm}/${dd}`;
        };

            const mm = Number(m[1]);
            const dd = Number(m[2]);

        // ============================================================
        window.MERCH_INVENTORY_F8_MODULE = window.MERCH_INVENTORY_F8_MODULE || (() => {

            const hasOwn = (obj, key) => !!obj && Object.prototype.hasOwnProperty.call(obj, key);
            const readFirst = (obj = {}, keys = [], fallback = '') => {
                for (const key of keys) {
